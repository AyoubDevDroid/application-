<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Maths 3e Brevet</title>
<style>
:root{--bg:#10142a;--card:#1c2244;--card2:#252c58;--pri:#ffc83d;--pri2:#d99a00;--acc:#3db5ff;--ok:#2ed47a;--ko:#ff5470;--txt:#fff;--mut:#a9b0d6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px 16px 96px;min-height:100vh}
.screen{display:none;flex-direction:column;gap:14px;animation:fade .3s}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:26px}h2{font-size:21px}h3{font-size:17px}
.mut{color:var(--mut);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:rgba(255,255,255,.08);padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap}
.back{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:2px 8px 2px 0}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#1b1640;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center}
.hero .ic{font-size:54px;animation:zap 2.5s infinite}
@keyframes zap{0%,90%,100%{transform:none}93%{transform:rotate(-12deg) scale(1.1)}96%{transform:rotate(10deg)}}
.hero b{font-size:22px;display:block}
.bar{height:10px;background:rgba(0,0,0,.15);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#1b1640;border-radius:99px;transition:width .5s}
.card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.word{background:var(--card2);border-left:4px solid var(--acc)}
.row{display:flex;gap:12px;align-items:center;cursor:pointer;border:none;background:var(--card);color:#fff;border-radius:18px;padding:14px;text-align:left;width:100%;font-size:16px}
.row .ic{font-size:30px;width:48px;height:48px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .tx{flex:1}.row .tx b{display:block}.row .tx span{font-size:13px;color:var(--mut)}
.row .ok{color:var(--ok);font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{border:none;border-radius:20px;padding:18px 10px;color:#1b1640;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:6px}
.game .e{font-size:38px}.game small{font-weight:600;font-size:12px;opacity:.8}
.game:active,.btn:active,.ans:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn{border:none;border-radius:16px;padding:15px;font-size:17px;font-weight:800;color:#1b1640;background:var(--pri);box-shadow:0 5px 0 var(--pri2);cursor:pointer;width:100%}
.btn.ghost{background:var(--card2);color:#fff;box-shadow:none}
/* fiche */
.sec{background:var(--card);border-radius:18px;padding:16px}
.sec h3{margin-bottom:8px;color:var(--pri)}
.sec p,.sec li{line-height:1.55;font-size:15.5px}
.sec ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.key{background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.35);border-radius:16px;padding:14px}
.key h3{color:var(--pri);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:none;color:var(--acc);padding:8px 12px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer}
/* lexique */
.search{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--card2);background:var(--card);color:#fff;font-size:16px;outline:none}
.search:focus{border-color:var(--pri)}
.lex{background:var(--card);border-radius:16px;padding:14px;cursor:pointer}
.lex b{color:var(--pri)}.lex p{margin-top:6px;line-height:1.5;display:none;font-size:15px}
.lex.open p{display:block}
/* jeux */
.prog{flex:1;height:12px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qcard{background:#fff;color:#10142a;border-radius:22px;padding:24px 18px;text-align:center;font-size:21px;font-weight:800;line-height:1.35;min-height:130px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.shake{animation:shake .4s}
@keyframes shake{25%,75%{transform:translateX(-9px)}50%{transform:translateX(9px)}}
.ans{border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:700;color:#fff;background:var(--card);box-shadow:0 4px 0 #0a0d1d;cursor:pointer;text-align:left;width:100%}
.ans.ok{background:var(--ok);box-shadow:0 4px 0 #1a9a56}
.ans.ko{background:var(--ko);box-shadow:0 4px 0 #c23250}
.ans.dim{opacity:.4}
.ex{background:var(--card2);border-radius:16px;padding:14px;font-size:15px;line-height:1.5;display:none}
.ex.on{display:block;animation:fade .3s}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{border:none;border-radius:18px;padding:22px;font-size:22px;font-weight:900;color:#fff;cursor:pointer}
.timer{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--pri);width:100%}
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.tile{border:2px solid transparent;border-radius:14px;padding:12px 10px;background:var(--card);color:#fff;font-size:14px;font-weight:700;cursor:pointer;min-height:58px;text-align:left;transition:.2s}
.tile.sel{border-color:var(--pri);background:var(--card2)}
.tile.done{background:var(--ok);opacity:0;transform:scale(.9);pointer-events:none;transition:.5s .3s}
.tile.bad{animation:shake .4s;border-color:var(--ko)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{background:var(--ok);color:#10142a;border-radius:14px;padding:12px;font-weight:800;animation:fade .3s}
.step.empty{background:transparent;border:2px dashed var(--card2);color:var(--mut);font-weight:600}
.big{font-size:90px;text-align:center}
.stars{font-size:44px;text-align:center;color:var(--pri);letter-spacing:6px}
.float{position:fixed;font-weight:900;font-size:22px;color:var(--pri);pointer-events:none;animation:up 1s forwards;z-index:9}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0e20;border-top:1px solid var(--card2);display:flex;justify-content:center;z-index:5}
nav .in{display:flex;max-width:480px;width:100%}
nav button{flex:1;background:none;border:none;color:var(--mut);padding:10px 0 14px;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
.modal.on{display:flex}
.modal .in{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 16px 28px;display:flex;flex-direction:column;gap:10px;animation:fade .25s}
.pub{background:repeating-linear-gradient(45deg,var(--card),var(--card) 10px,var(--card2) 10px,var(--card2) 20px);border-radius:14px;min-height:60px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:1px}
.pub.full{position:fixed;inset:0;z-index:40;border-radius:0;flex-direction:column;gap:16px;font-size:14px}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div class="app">

<section class="screen on" id="home">
  <div class="top"><h1 id="appName"></h1><span class="pill" id="xpP"></span></div>
  <div class="hero"><div class="ic" id="appIc"></div><div style="flex:1"><b>Ta progression</b><span id="progTx"></span><div class="bar"><i id="progBar"></i></div></div></div>
  <div class="card word"><span class="mut">💡 Mot du jour</span><h3 id="wotdM"></h3><p id="wotdD" style="line-height:1.5"></p></div>
  <h2>Continuer</h2>
  <div id="nextMod"></div>
  <h2>Défi rapide</h2>
  <button class="btn" onclick="startQuiz()">⚡ Quiz express (10 questions)</button>
</section>

<section class="screen" id="cours">
  <h1>📚 Cours</h1><p class="mut" id="sousTitre"></p>
  <div id="modList" style="display:flex;flex-direction:column;gap:10px"></div>
</section>

<section class="screen" id="fiche"><div id="ficheBody" style="display:flex;flex-direction:column;gap:14px"></div></section>

<section class="screen" id="jeux">
  <h1>🎮 Jeux</h1><p class="mut">Apprends en jouant. Chaque partie rapporte de l'XP.</p>
  <div class="grid">
    <button class="game" style="background:#ffc83d" onclick="startQuiz()"><span class="e">❓</span>Quiz<small>QCM + explications</small></button>
    <button class="game" style="background:#3db5ff" onclick="startVF()"><span class="e">⏱️</span>Vrai / Faux<small>Contre la montre</small></button>
    <button class="game" style="background:#2ed47a" onclick="startMatch()"><span class="e">🔗</span>Associer<small>Mot ↔ définition</small></button>
    <button class="game" style="background:#ff8fab" onclick="startOrdre()"><span class="e">🪜</span>Dans l'ordre<small>Les bonnes étapes</small></button>
    <button class="game" id="calcBtn" style="background:#b18cff;display:none" onclick="startCalc()"><span class="e">🧮</span>Calcul mental<small>Réponds vite</small></button>
  </div>
  <button class="btn" id="examBtn" style="display:none" onclick="startExam()"></button>
  <div class="card"><span class="mut">🏆 Meilleurs scores</span><div id="best" style="line-height:1.8"></div></div>
</section>

<section class="screen" id="lexique">
  <h1>📖 Lexique</h1>
  <input class="search" id="q" placeholder="Rechercher un mot-clé…" oninput="renderLex()">
  <div id="lexList" style="display:flex;flex-direction:column;gap:8px"></div>
</section>

<section class="screen" id="play"><div id="playBody" style="display:flex;flex-direction:column;gap:14px"></div></section>
</div>

<nav><div class="in">
  <button data-t="home" class="on" onclick="tab('home')"><span>🏠</span>Accueil</button>
  <button data-t="cours" onclick="tab('cours')"><span>📚</span>Cours</button>
  <button data-t="jeux" onclick="tab('jeux')"><span>🎮</span>Jeux</button>
  <button data-t="lexique" onclick="tab('lexique')"><span>📖</span>Lexique</button>
</div></nav>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div class="in" id="modalIn"></div></div>

<script>
/* =====================================================================
   CONTENU — c'est la seule partie à changer pour un autre métier
   ===================================================================== */
/* Maths 3e – Brevet — contenu (programme de mathématiques du cycle 4, classe de 3e) */
const C={
 id:'maths3',app:'Maths 3e Brevet',icon:'🎯',
 sousTitre:'Tout le programme de 3e pour réussir le brevet, en fiches courtes.',
 theme:{pri:'#ff7eb6',pri2:'#c9407f',acc:'#5ad1ff'},
 pub:{actif:false,toutesLes:3},   // public mineur : voir docs/PUBLICITE.md avant d'activer
 examen:{titre:'Brevet blanc express',questions:20,seuil:12,minutes:25},
 calcul:[
  {op:'×',a:[6,15],b:[6,15]},
  {op:'÷',a:[6,15],b:[3,12]},
  {op:'+',a:[120,480],b:[45,390]},

 ],
 modules:[
  {id:'nombres',i:'🔢',t:'Nombres & arithmétique',d:'Puissances, nombres premiers, fractions',
   s:[{h:'Les puissances',l:['a<sup>n</sup> = a × a × … × a (n fois). 2<sup>5</sup> = <b>32</b>.','10<sup>3</sup> = 1 000 ; 10<sup>−2</sup> = 0,01.','<b>Notation scientifique</b> : a × 10<sup>n</sup> avec 1 ≤ a < 10. Ex. : 45 000 = <b>4,5 × 10<sup>4</sup></b>.','Règles : a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup>.']},
      {h:'Nombres premiers',l:['Un <b>nombre premier</b> a exactement <b>2 diviseurs</b> : 1 et lui-même. 2, 3, 5, 7, 11, 13…','1 n\'est <b>pas</b> premier.','<b>Décomposer</b> en produit de facteurs premiers : 60 = 2² × 3 × 5.','Ça sert à <b>simplifier</b> une fraction : 60/84 = (2²×3×5)/(2²×3×7) = <b>5/7</b>.']},
      {h:'Fractions',l:['Additionner : même <b>dénominateur</b> d\'abord. 1/3 + 1/6 = 2/6 + 1/6 = <b>1/2</b>.','Multiplier : numérateurs ensemble, dénominateurs ensemble.','Diviser par une fraction = multiplier par son <b>inverse</b>.']}],
   k:['Puissance','Notation scientifique','Nombre premier','Inverse']},
  {id:'litteral',i:'✏️',t:'Calcul littéral & équations',d:'Développer, factoriser, résoudre',
   s:[{h:'Développer et factoriser',l:['<b>Développer</b> : transformer un produit en somme. k(a + b) = ka + kb.','Double distributivité : (a + b)(c + d) = ac + ad + bc + bd.','<b>Factoriser</b> : l\'inverse, transformer une somme en produit. 3x + 6 = 3(x + 2).']},
      {h:'L\'identité remarquable du brevet',l:['<b>(a + b)(a − b) = a² − b²</b>.','Exemple : x² − 9 = (x + 3)(x − 3).']},
      {h:'Résoudre une équation',l:['On isole x en faisant <b>la même opération des deux côtés</b>.','3x + 5 = 20 → 3x = 15 → <b>x = 5</b>.','<b>Équation produit nul</b> : si A × B = 0, alors A = 0 <b>ou</b> B = 0.','(x − 2)(x + 4) = 0 → x = 2 ou x = −4.']}],
   k:['Développer','Factoriser','Équation','Produit nul']},
  {id:'geometrie',i:'📐',t:'Pythagore, Thalès, trigonométrie',d:'Les 3 outils des triangles',
   s:[{h:'Pythagore',l:['Dans un triangle <b>rectangle</b> : <b>hypoténuse² = somme des carrés des deux autres côtés</b>.','Côtés 3 et 4 → hypoténuse² = 9 + 16 = 25 → hypoténuse = <b>5</b>.','La <b>réciproque</b> permet de prouver qu\'un triangle est rectangle.']},
      {h:'Thalès',l:['Deux droites <b>parallèles</b> coupent deux sécantes : les longueurs sont <b>proportionnelles</b>.','AM/AB = AN/AC = MN/BC.','La <b>réciproque</b> prouve que deux droites sont parallèles.']},
      {h:'Trigonométrie',l:['Seulement dans un triangle <b>rectangle</b>.','<b>SOH CAH TOA</b> :','sin = <b>opposé ÷ hypoténuse</b>','cos = <b>adjacent ÷ hypoténuse</b>','tan = <b>opposé ÷ adjacent</b>']}],
   k:['Hypoténuse','Pythagore','Thalès','Cosinus','Réciproque']},
  {id:'fonctions',i:'📈',t:'Les fonctions',d:'Image, antécédent, linéaire, affine',
   s:[{h:'Vocabulaire',l:['f(x) = 2x + 1. Pour x = 3, f(3) = 7.','7 est l\'<b>image</b> de 3. 3 est un <b>antécédent</b> de 7.','On lit l\'image sur l\'axe <b>vertical</b> (ordonnées).']},
      {h:'Fonction linéaire',l:['<b>f(x) = ax</b>. Sa courbe est une <b>droite qui passe par l\'origine</b>.','Elle représente une situation de <b>proportionnalité</b>.']},
      {h:'Fonction affine',l:['<b>f(x) = ax + b</b>. Sa courbe est une <b>droite</b>.','<b>a</b> = coefficient directeur (la pente) · <b>b</b> = ordonnée à l\'origine.','Si a > 0, la droite monte ; si a < 0, elle descend.']}],

  {id:'stats',i:'🎲',t:'Statistiques & probabilités',d:'Moyenne, médiane, étendue, probabilité',
   s:[{h:'Statistiques',l:['<b>Moyenne</b> = somme des valeurs ÷ nombre de valeurs.','<b>Médiane</b> : valeur du milieu quand la série est <b>rangée</b> dans l\'ordre.','<b>Étendue</b> = plus grande valeur − plus petite valeur.','Série 4 ; 7 ; 9 ; 12 ; 18 → moyenne 10, médiane 9, étendue 14.']},
      {h:'Probabilités',l:['Probabilité = <b>nombre de cas favorables ÷ nombre de cas possibles</b>.','Elle est toujours entre <b>0</b> (impossible) et <b>1</b> (certain).','Dé à 6 faces : P(obtenir un 6) = <b>1/6</b>.','P(événement contraire) = 1 − P(événement).']}],
   k:['Moyenne','Médiane','Étendue','Probabilité']}
 ],
 lexique:[
  ['Puissance','a^n = a multiplié n fois par lui-même. 3² = 9.'],
  ['Notation scientifique','Écriture a × 10^n avec 1 ≤ a < 10. Ex. : 0,005 = 5 × 10^−3.'],
  ['Nombre premier','Nombre entier qui a exactement deux diviseurs : 1 et lui-même.'],
  ['Inverse','L\'inverse de a/b est b/a. Un nombre multiplié par son inverse donne 1.'],
  ['Développer','Transformer un produit en somme : 2(x + 3) = 2x + 6.'],
  ['Factoriser','Transformer une somme en produit : 2x + 6 = 2(x + 3).'],
  ['Équation','Égalité avec une inconnue. La résoudre, c\'est trouver la valeur de l\'inconnue.'],
  ['Produit nul','Un produit est nul si et seulement si un de ses facteurs est nul.'],
  ['Hypoténuse','Le plus grand côté d\'un triangle rectangle, face à l\'angle droit.'],
  ['Pythagore','Dans un triangle rectangle : hypoténuse² = somme des carrés des deux autres côtés.'],
  ['Thalès','Avec deux droites parallèles, les longueurs des deux triangles sont proportionnelles.'],
  ['Cosinus','Dans un triangle rectangle : côté adjacent ÷ hypoténuse.'],
  ['Réciproque','Théorème « à l\'envers » : sert à prouver qu\'un triangle est rectangle ou que des droites sont parallèles.'],
  ['Image','Le résultat f(x) d\'une fonction pour une valeur x.'],
  ['Antécédent','Valeur de x qui a une image donnée.'],
  ['Fonction affine','Fonction f(x) = ax + b, représentée par une droite.'],
  ['Fonction linéaire','Fonction f(x) = ax, droite qui passe par l\'origine. Traduit la proportionnalité.'],
  ['Moyenne','Somme des valeurs divisée par le nombre de valeurs.'],
  ['Médiane','Valeur qui partage la série rangée en deux moitiés de même effectif.'],
  ['Étendue','Écart entre la plus grande et la plus petite valeur.'],
  ['Probabilité','Nombre entre 0 et 1 qui mesure la chance qu\'un événement se produise.']
 ],
 quiz:[
  ['nombres','2⁵ = ?',['32','10','25','16'],0,'2 × 2 × 2 × 2 × 2 = 32.'],
  ['nombres','45 000 en notation scientifique s\'écrit…',['4,5 × 10⁴','45 × 10³','4,5 × 10³','0,45 × 10⁵'],0,'1 ≤ 4,5 < 10 et on décale la virgule de 4 rangs.'],
  ['nombres','10⁻² = ?',['0,01','−100','0,1','−20'],0,'Une puissance négative de 10 donne un nombre décimal.'],

  ['nombres','2/3 ÷ 4/5 = ?',['5/6','8/15','6/5','10/12'],0,'2/3 × 5/4 = 10/12 = 5/6.'],

/* ----- CALCUL MENTAL (si C.calcul est défini) ----- */
/* C.calcul = [{op:'+',a:[min,max],b:[min,max]}, …]  op : + − × ÷ */
function calcQ1(g){
  let a=rand(...g.a),b=rand(...g.b),r,txt;
  if(g.op==='+'){r=a+b;txt=`${a} + ${b}`}
  else if(g.op==='−'){if(b>a)[a,b]=[b,a];r=a-b;txt=`${a} − ${b}`}
  else if(g.op==='×'){r=a*b;txt=`${a} × ${b}`}
  else{r=a;a=a*b;txt=`${a} ÷ ${b}`}
  const opts=new Set([r]),d=[1,-1,2,-2,10,-10].concat(g.op==='×'||g.op==='÷'?[b,-b]:[]);
  const nums=txt.match(/\d+/g).map(Number),ok=v=>v>=0&&!nums.includes(v);
  for(const x of shuf(d)){if(opts.size>=4)break;if(ok(r+x))opts.add(r+x)}
  let k=3;while(opts.size<4){if(ok(r+k))opts.add(r+k);k++}
  const ch=[...opts].map(String);
  return ['calc',txt+' = ?',ch,0,`${txt} = ${r}`];
}
function startCalc(){G={type:'calc',list:Array.from({length:10},()=>calcQ1(C.calcul[rand(0,C.calcul.length-1)])),i:0,score:0};G.n=10;show('play');quizQ()}

/* ----- EXAMEN BLANC (si C.examen est défini) -----
   C.examen = {titre, questions:60, seuil:42, minutes:60}
   Questions tirées de tout le quiz, pas de correction pendant l'épreuve, verdict + corrections à la fin. */
function examN(){return Math.min(C.examen.questions,C.quiz.length)}
function examSeuil(){return Math.ceil(C.examen.seuil/C.examen.questions*examN())}
function startExam(){
  G={type:'exam',list:shuf(C.quiz).slice(0,examN()),i:0,score:0,err:[],t0:Date.now()};G.n=G.list.length;show('play');examQ();
  const D=C.examen.minutes*60000*G.n/C.examen.questions;
  G.tm=setInterval(()=>{const r=D-(Date.now()-G.t0);if($('chr'))$('chr').textContent=Math.max(0,Math.ceil(r/60000))+' min';if(r<=0){clearInterval(G.tm);examEnd(true)}},1000);
}
function examQ(){
  const q=G.list[G.i];const order=shuf(q[2].map((t,i)=>({t,i})));
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="if(confirm('Abandonner l\'examen ?'))tab('jeux')">✕</button><div class="prog"><i style="width:${G.i/G.n*100}%"></i></div><span class="pill">${G.i+1}/${G.n}</span><span class="pill" id="chr">⏱</span></div>

   <div style="display:flex;flex-direction:column;gap:10px">${order.map(o=>`<button class="ans" data-i="${o.i}" onclick="examA(this)">${o.t}</button>`).join('')}</div>`;
}
function examA(b){
  const q=G.list[G.i];if(+b.dataset.i===q[3])G.score++;else G.err.push(q);
  G.i++;if(G.i>=G.n){clearInterval(G.tm);examEnd(false)}else examQ();
}
function examEnd(temps){
  G.list.slice(G.i).forEach(q=>G.err.push(q));
  const ok=G.score>=examSeuil();if(G.score>(P.best.exam||0))P.best.exam=G.score;P.xp+=G.score*2;P.parties++;save();
  if(ok)confetti();
  pubInterstitiel(()=>{show('play');
  $('playBody').innerHTML=`<div class="big">${ok?'🎓':'📚'}</div>
   <h1 style="text-align:center">${ok?'Admis !':'Pas encore…'}</h1>
   <p class="mut" style="text-align:center;font-size:16px">${temps?'⏰ Temps écoulé. ':''}<b>${G.score} / ${G.n}</b> — il fallait ${examSeuil()} bonnes réponses</p>
   ${G.err.length?`<h2>Tes erreurs</h2>`+G.err.map(q=>`<div class="sec"><p><b>${q[1]}</b></p><p style="color:var(--ok);margin-top:6px">✓ ${q[2][q[3]]}</p><p class="mut" style="margin-top:4px">${q[4]}</p></div>`).join(''):''}
   <button class="btn" onclick="startExam()">Repasser l'examen</button><button class="btn ghost" onclick="tab('cours')">Revoir les cours</button>${pubBanniere()}`;
  if(window.PUB&&window.PUB.banniere&&$('pubB'))window.PUB.banniere($('pubB'));});
}

/* ----- PUB -----
   Dans le navigateur on affiche un emplacement réservé.
   Dans l'appli Android (Capacitor + AdMob), définir window.PUB = {banniere(el), interstitiel(fin)}
   et ces fonctions seront appelées à la place. */
function pubBanniere(){if(!C.pub||!C.pub.actif)return '';return '<div class="pub" id="pubB">PUBLICITÉ</div>'}
function pubInterstitiel(suite){
  if(!C.pub||!C.pub.actif||P.parties%(C.pub.toutesLes||3)!==0)return suite();
  if(window.PUB&&window.PUB.interstitiel)return window.PUB.interstitiel(suite);
  const d=document.createElement('div');d.className='pub full';d.innerHTML='PUBLICITÉ<button class="btn" style="width:auto;padding:12px 26px">Continuer</button>';
  d.querySelector('button').onclick=()=>{d.remove();suite()};document.body.appendChild(d);
}

/* ----- commun ----- */
function head(){return `<div class="top"><button class="back" onclick="tab('jeux')">✕</button><div class="prog"><i style="width:${G.i/G.n*100}%"></i></div><span class="pill">${G.score} ✓</span></div>`}
function nextQ(f){G.i++;if(G.i>=G.n){if(G.score>P.best[G.type])P.best[G.type]=G.score;end(G.score,G.n,G.score+' / '+G.n+' bonnes réponses')}else f()}
function end(sc,n,txt){P.parties++;save();pubInterstitiel(()=>endScreen(sc,n,txt))}
function endScreen(sc,n,txt){
  const r=sc/n,stars=r>=.9?3:r>=.6?2:r>0?1:0;if(stars>=2)confetti();
  show('play');
  $('playBody').innerHTML=`<div style="height:30px"></div><div class="big">${stars===3?'🏆':stars===2?'🎉':'💪'}</div>
  <h1 style="text-align:center">${stars===3?'Parfait !':stars===2?'Bien joué !':'Continue comme ça !'}</h1>
  <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p class="mut" style="text-align:center;font-size:16px">${txt}</p>
  <div style="height:20px"></div><button class="btn" onclick="tab('jeux')">Autre jeu</button><button class="btn ghost" onclick="tab('cours')">Revoir les cours</button>${pubBanniere()}`;
  if(window.PUB&&window.PUB.banniere&&$('pubB'))window.PUB.banniere($('pubB'));
}
function gain(x,el){P.xp+=x;save();const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='float';d.textContent='+'+x+' XP';d.style.left=(r.left+r.width/2-35)+'px';d.style.top=(r.top)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000);beep(1)}
function shake(id){const e=$(id);e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');beep(0)}
let AC;function beep(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.connect(g);g.connect(AC.destination);o.type='triangle';
 if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.08)}else{o.frequency.setValueAtTime(220,t);o.frequency.linearRampToValueAtTime(140,t+.25)}
 g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}catch(e){}}
function confetti(){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#ffc83d','#2ed47a','#3db5ff','#ff5470'];
 const ps=Array.from({length:120},()=>({x:c.width/2,y:c.height/3,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:rand(5,10),c:cols[rand(0,3)],r:0}));let f=0;
 (function l(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(l);else x.clearRect(0,0,c.width,c.height)})()}
