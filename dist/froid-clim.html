<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Froid & Clim Pro</title>
<style>
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));--bg:#10142a;--card:#1c2244;--card2:#252c58;--pri:#ffc83d;--pri2:#d99a00;--acc:#3db5ff;--ok:#2ed47a;--ko:#ff5470;--txt:#fff;--mut:#a9b0d6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:calc(16px + var(--sat)) 16px calc(96px + var(--sab));min-height:100vh}
.screen{display:none;flex-direction:column;gap:14px;animation:fade .3s}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:26px}h2{font-size:21px}h3{font-size:17px}
.mut{color:var(--mut);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:rgba(255,255,255,.08);padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap}
button.pill{border:none;color:#fff;cursor:pointer}
.back{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:2px 8px 2px 0}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#1b1640;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center}
.hero .ic{font-size:54px;animation:zap 2.5s infinite}
@keyframes zap{0%,90%,100%{transform:none}93%{transform:rotate(-12deg) scale(1.1)}96%{transform:rotate(10deg)}}
.hero b{font-size:22px;display:block}
.bar{height:10px;background:rgba(0,0,0,.15);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#1b1640;border-radius:99px;transition:width .5s}
.card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.mini{padding:10px 14px;gap:2px}
.word{background:var(--card2);border-left:4px solid var(--acc)}
.row{display:flex;gap:12px;align-items:center;cursor:pointer;border:none;background:var(--card);color:#fff;border-radius:18px;padding:14px;text-align:left;width:100%;font-size:16px}
.row .ic{font-size:30px;width:48px;height:48px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .tx{flex:1;min-width:0}.row .tx b{display:block}.row .tx span{font-size:13px;color:var(--mut)}
.row .ok{color:var(--ok);font-weight:900}
.row .st{color:var(--pri);font-weight:900;letter-spacing:1px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{border:none;border-radius:20px;padding:18px 10px;color:#1b1640;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.game .e{font-size:38px}.game small{font-weight:600;font-size:12px;opacity:.8}
.game:active,.btn:active,.ans:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn{border:none;border-radius:16px;padding:15px;font-size:17px;font-weight:800;color:#1b1640;background:var(--pri);box-shadow:0 5px 0 var(--pri2);cursor:pointer;width:100%}
.btn.ghost{background:var(--card2);color:#fff;box-shadow:none}
.btn:disabled{opacity:.5}
/* fiche */
.sec{background:var(--card);border-radius:18px;padding:16px}
.sec h3{margin-bottom:8px;color:var(--pri)}
.sec p,.sec li{line-height:1.55;font-size:15.5px}
.sec ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.key{background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.35);border-radius:16px;padding:14px}
.key h3{color:var(--pri);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:none;color:var(--acc);padding:8px 12px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer}
/* lexique */
.search{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--card2);background:var(--card);color:#fff;font-size:16px;outline:none}
.search:focus{border-color:var(--pri)}
.lex{background:var(--card);border-radius:16px;padding:14px;cursor:pointer}
.lex b{color:var(--pri)}.lex p{margin-top:6px;line-height:1.5;display:none;font-size:15px}
.lex.open p{display:block}
.seg{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:14px}
.seg button{flex:1;border:none;background:none;color:var(--mut);font-weight:800;font-size:14px;padding:10px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--pri);color:#10142a}
/* jeux */
.prog{flex:1;height:12px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qcard{background:#fff;color:#10142a;border-radius:22px;padding:24px 18px;text-align:center;font-size:21px;font-weight:800;line-height:1.35;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.qcard.dq,.qcard.at{font-size:17.5px;min-height:90px;padding:18px 16px}
.qcard small{display:block;font-size:14px;color:#555c80;font-weight:700;margin-top:6px}
.shake{animation:shake .4s}
@keyframes shake{25%,75%{transform:translateX(-9px)}50%{transform:translateX(9px)}}
.ans{border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:700;color:#fff;background:var(--card);box-shadow:0 4px 0 #0a0d1d;cursor:pointer;text-align:left;width:100%;line-height:1.35}
.ans.ok{background:var(--ok);box-shadow:0 4px 0 #1a9a56;color:#10142a}
.ans.ko{background:var(--ko);box-shadow:0 4px 0 #c23250}
.ans.dim{opacity:.4}
.ex{background:var(--card2);border-radius:16px;padding:14px;font-size:15px;line-height:1.5;display:none}
.ex.on{display:block;animation:fade .3s}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{border:none;border-radius:18px;padding:22px;font-size:22px;font-weight:900;color:#fff;cursor:pointer}
.timer{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--pri);width:100%}
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.tile{border:2px solid transparent;border-radius:14px;padding:12px 10px;background:var(--card);color:#fff;font-size:14px;font-weight:700;cursor:pointer;min-height:58px;text-align:left;transition:.2s}
.tile.sel{border-color:var(--pri);background:var(--card2)}
.tile.done{background:var(--ok);opacity:0;transform:scale(.9);pointer-events:none;transition:.5s .3s}
.tile.bad{animation:shake .4s;border-color:var(--ko)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{background:var(--ok);color:#10142a;border-radius:14px;padding:12px;font-weight:800;animation:fade .3s}
.step.empty{background:transparent;border:2px dashed var(--card2);color:var(--mut);font-weight:600}
.big{font-size:90px;text-align:center}
.stars{font-size:44px;text-align:center;color:var(--pri);letter-spacing:6px}
.float{position:fixed;font-weight:900;font-size:22px;color:var(--pri);pointer-events:none;animation:up 1s forwards;z-index:9}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0e20;border-top:1px solid var(--card2);display:flex;justify-content:center;z-index:5;padding-bottom:var(--sab)}
nav .in{display:flex;max-width:480px;width:100%}
nav button{flex:1;background:none;border:none;color:var(--mut);padding:10px 0 14px;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
.modal.on{display:flex}
.modal .in{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 16px calc(28px + var(--sab));display:flex;flex-direction:column;gap:10px;animation:fade .25s;max-height:88vh;overflow:auto}
.pub{background:repeating-linear-gradient(45deg,var(--card),var(--card) 10px,var(--card2) 10px,var(--card2) 20px);border-radius:14px;min-height:60px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:1px}
.pub.full{position:fixed;inset:0;z-index:40;border-radius:0;flex-direction:column;gap:16px;font-size:14px}
/* parcours par niveaux */
.nvh{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:0 2px}
.nvh b{font-size:19px}
/* fiches wiki */
.rbar{position:fixed;top:var(--sat);left:0;right:0;height:4px;z-index:6;background:transparent}
.rbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .1s}
.fhero{display:flex;gap:14px;align-items:center}
.fhero .fic{font-size:52px;width:76px;height:76px;border-radius:22px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.chapo{font-size:17px;line-height:1.6;border-left:4px solid var(--pri);padding:4px 0 4px 14px}
.toc{display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:16px;padding:12px}
.toc b{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.toc button{background:none;border:none;color:var(--acc);text-align:left;font-size:15px;font-weight:700;cursor:pointer;padding:4px 0}
.sh{display:flex;gap:10px;align-items:center;margin-bottom:10px}.sh h3{margin:0!important}
.num{width:30px;height:30px;border-radius:10px;background:var(--pri);color:#10142a;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec>p{line-height:1.65;font-size:15.5px;margin-bottom:10px}
.box{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.55}
.box>b{display:block;margin-bottom:4px}
.box ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.box.ex2{background:rgba(61,181,255,.12);border:1px solid rgba(61,181,255,.35)}
.box.att{background:rgba(255,84,112,.12);border:1px solid rgba(255,84,112,.4)}
.box.info{background:rgba(177,140,255,.13);border:1px solid rgba(177,140,255,.4)}
.box.ret{background:rgba(46,212,122,.12);border:1px solid rgba(46,212,122,.4);margin-top:0}
.mq{margin-top:12px;background:var(--card2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mq>b{font-size:13px;color:var(--pri)}.mq p{font-weight:700;line-height:1.45}
.mq .ans{padding:11px 14px;font-size:15px;box-shadow:0 3px 0 #0a0d1d}
.mq .ex{display:none}.mq .ex.on{display:block}
.toast{position:fixed;left:50%;top:calc(18px + var(--sat));transform:translateX(-50%);background:var(--ok);color:#10142a;font-weight:900;padding:12px 18px;border-radius:99px;z-index:50;animation:toast 2.6s forwards;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.day{display:flex;gap:12px;align-items:center}
.day .fl{font-size:34px}.day .fl.off{filter:grayscale(1);opacity:.5}
/* figures animées */
.fig{margin-top:12px;background:var(--card2);border-radius:14px;padding:14px 12px 12px;position:relative}
.fig .rej{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;z-index:2}
.fig .leg{text-align:center;color:var(--mut);font-size:13px;margin-top:8px}
.fig svg{display:block;width:100%;max-width:340px;margin:0 auto;height:auto}
.cyc{position:relative;width:100%;max-width:310px;aspect-ratio:1;margin:0 auto}
.cyc svg{position:absolute;inset:0;max-width:none}
.cyc .n{position:absolute;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--c,var(--acc));border-radius:12px;padding:6px 8px;font-size:12px;font-weight:700;text-align:center;width:max-content;max-width:42%;transition:.35s;line-height:1.3}
.cyc .n.on{background:var(--c,var(--acc));color:#10142a;transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 18px var(--c,var(--acc))}
.cyc .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:800;font-size:13px;color:var(--mut);max-width:34%}
.flx{display:flex;flex-direction:column;gap:4px}
.flx .b{background:var(--card);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px;opacity:0}
.flx .b b{color:var(--pri);white-space:nowrap}
.flx .b.fin{background:var(--pri);color:#10142a}.flx .b.fin b{color:#10142a}
.flx .a{text-align:center;color:var(--pri);opacity:0;font-size:15px;line-height:1.1;font-weight:900}
.go .flx .b,.go .flx .a{animation:fade .45s forwards}
.brs{display:flex;flex-direction:column;gap:10px}
.brs .r{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.brs .t{height:14px;background:var(--card);border-radius:99px;overflow:hidden;margin-top:4px}
.brs .t i{display:block;height:100%;width:0;background:var(--c,var(--pri));border-radius:99px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.chf{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.chf div{background:var(--card);border-radius:12px;padding:12px 8px;text-align:center}
.chf b{display:block;font-size:24px;color:var(--pri)}.chf span{font-size:12px;color:var(--mut);line-height:1.3;display:block;margin-top:2px}
/* figures interactives (type inter) et pas à pas (type etapes) */
.itr .ibt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.itr .chip.act{background:var(--pri);color:#10142a}
.itr .imsg{text-align:center;font-weight:800;margin-top:8px;font-size:14.5px;min-height:20px}
.fig .lp{fill:var(--card);stroke:#fff;stroke-width:2;transition:.3s}
.fig .lp.on{fill:var(--pri);filter:drop-shadow(0 0 10px var(--pri))}
.fig .w{fill:none;stroke:#5a64a8;stroke-width:3;transition:stroke .3s}
.fig .w.on{stroke:var(--pri);stroke-dasharray:6 6;animation:flow 1s linear infinite}
.fig .w.ko{stroke:var(--ko);stroke-dasharray:6 6;animation:flow .6s linear infinite}
.fig .hide{display:none}
.etp .etx{margin-top:10px;text-align:center;line-height:1.5;font-size:14.5px}
.etn{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.etn span{display:flex;gap:5px}.etn i{width:8px;height:8px;border-radius:50%;background:var(--card)}.etn i.on{background:var(--pri)}
/* classes d'animation utilisables dans les SVG du contenu */
.flow{animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}
.glow{animation:glow 1.6s ease-in-out infinite}@keyframes glow{50%{opacity:.55}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.go .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}@keyframes pop{from{transform:scale(0);opacity:0}}
.go .draw{stroke-dasharray:600;animation:draw 1.4s ease-out backwards}@keyframes draw{from{stroke-dashoffset:600}}
.go .appear{animation:fade .5s backwards}
/* bon de travail (dépannage) */
.bt{background:var(--card);border:2px dashed var(--pri);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bth{display:flex;justify-content:space-between;align-items:center;gap:8px}.bth b{font-size:13px;letter-spacing:1px;color:var(--pri)}
.prio{font-size:12px;font-weight:900;padding:4px 10px;border-radius:99px;color:#10142a;white-space:nowrap}.prio.p1{background:var(--ko)}.prio.p2{background:var(--pri)}.prio.p3{background:var(--ok)}
.btl span{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.5px}.btl p{line-height:1.45;margin-top:2px;font-size:15px}
/* câblage */
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pal button{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.pal button.on{border-color:#fff;transform:scale(1.18)}
.board{background:var(--card);border-radius:18px;padding:4px;touch-action:manipulation}
.board svg{display:block;width:100%;height:auto;user-select:none}
.cap rect{fill:var(--card2);stroke:#46508f;stroke-width:2}
.cap .tt{fill:#fff;font:800 11.5px system-ui}.cap .ict{font-size:22px}
.cap.lit rect{stroke:var(--pri);stroke-width:3}.cap.lit .ict{filter:drop-shadow(0 0 8px #ffc83d)}
.cb{cursor:pointer}.cb .vis{fill:#d9dce8;stroke:#10142a;stroke-width:2}.cb.sel .vis{fill:var(--pri);stroke:#fff;stroke-width:3}
.cb .lb{fill:var(--mut);font:800 10.5px system-ui;text-anchor:middle;pointer-events:none}
.cw{fill:none;stroke-width:5;stroke-linecap:round;pointer-events:none}
.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.okb .cw{stroke-dasharray:9 5;animation:flow .8s linear infinite}
.msg{border-radius:14px;padding:12px 14px;line-height:1.5;font-size:15px}
.msg.ko{background:rgba(255,84,112,.15);border:1px solid rgba(255,84,112,.5)}
.msg.ok{background:rgba(46,212,122,.15);border:1px solid rgba(46,212,122,.5)}
.msg.inf{background:var(--card2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .btn{padding:12px;font-size:15px}
/* symboles */
.sym{width:100%;height:auto;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:block}
.sym .t{fill:currentColor;stroke:none;font:800 15px system-ui;text-anchor:middle}
.sym .f{fill:currentColor}
.sym.big{max-width:210px;margin:0 auto}
.ans.symb{display:flex;align-items:center;justify-content:center;min-height:92px;padding:10px}
.ans.symb svg{max-width:120px}
.symg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.symc{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.symc svg{max-width:110px;color:#fff}.symc b{font-size:14px}.symc span{font-size:12px;color:var(--mut);line-height:1.35}
/* atelier de calcul */
.atin{display:flex;gap:10px;align-items:center}
.atin input{flex:1;padding:16px;border-radius:16px;border:2px solid var(--card2);background:var(--card);color:#fff;font-size:22px;font-weight:800;outline:none;text-align:center;min-width:0}
.atin input:focus{border-color:var(--pri)}.atin span{font-weight:900;font-size:20px;color:var(--pri);min-width:36px}
/* badges & fiches appareils */
.bdg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bdg div{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:3px;opacity:.45;filter:grayscale(1)}
.bdg div.on{opacity:1;filter:none;box-shadow:inset 0 0 0 2px var(--pri)}
.bdg span{font-size:28px}.bdg b{font-size:12px}.bdg small{font-size:10.5px;color:var(--mut);line-height:1.3}
.appf h3{color:var(--pri);font-size:15px;margin-top:6px}.appf p{line-height:1.55;font-size:15px}
.appf .symc{background:var(--card2)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div class="app">

<section class="screen on" id="home">
  <div class="top"><h1 id="appName"></h1><button class="pill" id="xpP" onclick="profil()"></button></div>
  <div class="hero"><div class="ic" id="appIc"></div><div style="flex:1"><b id="gradeTx">Ta progression</b><span id="progTx"></span><div class="bar"><i id="progBar"></i></div></div></div>

  {p:"Le fluide fait une boucle sans fin. Le <b>compresseur</b> aspire la vapeur froide basse pression et la comprime : elle sort très chaude, en haute pression. Dans le <b>condenseur</b>, l'air (ou l'eau) extérieur la refroidit : elle se condense en liquide en rejetant la chaleur. Le <b>détendeur</b> fait chuter brutalement la pression du liquide. Dans l'<b>évaporateur</b>, ce liquide à basse pression bout en prenant la chaleur de l'air de la pièce. La vapeur retourne au compresseur, et ça recommence.",

 intro:"Le fluide frigorigène est le sang du circuit. Chaque fluide a ses pressions, son huile, ses règles de charge, son niveau de danger et son impact sur le climat. La réglementation pousse vers des fluides à faible PRP, souvent inflammables : un technicien d'aujourd'hui doit connaître les anciens fluides pour dépanner et les nouveaux pour installer.",
 s:[
  {p:"Les premiers fluides de synthèse, les <b>CFC</b> puis les <b>HCFC</b> (dont le célèbre R22), détruisaient la couche d'ozone : ils sont interdits. Les <b>HFC</b> les ont remplacés : sans chlore, ils n'abîment pas l'ozone, mais ce sont de puissants gaz à effet de serre. Le règlement européen F-Gas organise leur <b>réduction progressive</b> jusqu'à zéro en 2050. Les <b>HFO</b> ont un PRP très faible, et les <b>fluides naturels</b> (propane, isobutane, CO₂, ammoniac) reviennent en force.",
   fig:{type:"flux",legende:"L'histoire des fluides",etapes:[["CFC (R12)","détruisent l'ozone → interdits"],["HCFC (R22)","détruisent l'ozone → interdits"],["HFC (R410A, R32…)","fort effet de serre → réduction"],["HFO et naturels","faible PRP → l'avenir"]]},
   info:"Les désignations suivent une logique : R + chiffres. La série 400 désigne les mélanges zéotropes (R404A, R407C, R410A), la série 500 les azéotropes, la série 600 les hydrocarbures (R600a isobutane), la série 700 les fluides minéraux (R717 = ammoniac, de masse molaire 17 ; R744 = CO₂, 44).",

 intro:"Une installation bien montée mais mal mise en service tombera en panne : humidité qui forme des acides, air qui fait monter la HP, charge approximative. La mise en service suit un ordre strict, toujours le même. C'est aussi le moment où l'on engage sa responsabilité : chaque étape se mesure et se note.",

C.fiches.pac={
 intro:"La pompe à chaleur remplace les chaudières au fioul et au gaz : c'est une machine frigorifique utilisée à l'envers. Pour 1 kWh d'électricité, elle en fournit 3 ou 4 en chaleur, en allant chercher l'énergie gratuite de l'air extérieur. Le frigoriste qui maîtrise les PAC a du travail pour des années.",
 s:[
  {p:"Une pompe à chaleur prend la chaleur d'une source froide (l'air extérieur, le sol, une nappe d'eau) dans son <b>évaporateur</b>, et la restitue dans le logement par son <b>condenseur</b>. Même à −5 °C, l'air extérieur contient de la chaleur : il suffit que le fluide s'évapore plus froid encore. La PAC <b>air/air</b> chauffe l'air (split réversible), la PAC <b>air/eau</b> chauffe l'eau des radiateurs ou du plancher chauffant, la PAC <b>eau/eau</b> ou géothermique prend sa chaleur dans le sol ou une nappe.",
   fig:{type:"flux",legende:"Une PAC air/eau en hiver",etapes:[["Air extérieur à 2 °C","l'évaporateur capte sa chaleur"],["Compresseur","fait monter pression et température"],["Condenseur","chauffe l'eau du chauffage à 35–45 °C"],["Radiateurs, plancher","chauffent le logement"]]},

  {p:"La <b>vanne 4 voies</b> est un tiroir commandé par une bobine : elle inverse le sens du fluide entre le refoulement et l'aspiration du compresseur. L'échangeur intérieur devient condenseur (chauffage) ou évaporateur (rafraîchissement). Le compresseur, lui, tourne toujours dans le même sens. Le détendeur, souvent électronique sur les PAC, fonctionne dans les deux sens.",
   fig:{type:"cycle",centre:"Vanne 4 voies",etapes:[["Hiver : unité intérieure = condenseur","#ff8a3d"],["Été : unité intérieure = évaporateur","#3db5ff"],["Dégivrage : inversion de quelques minutes","#7be0d0"]]},
   q:["Dans une pompe à chaleur, quel organe inverse le cycle ?",["La vanne 4 voies","Le détendeur","Le pressostat BP","Le voyant liquide"],0,"Chaud l'hiver, froid l'été."]},
  {p:"En hiver, l'échangeur extérieur est plus froid que l'air et souvent sous 0 °C : l'humidité de l'air y <b>givre</b>, la glace bouche les ailettes et la puissance chute. La machine lance un <b>dégivrage</b> : elle inverse le cycle quelques minutes pour envoyer du gaz chaud dans l'échangeur extérieur. On voit alors de la vapeur et de l'eau sortir de l'unité : c'est normal. L'eau doit pouvoir s'écouler (support surélevé, évacuation qui ne gèle pas).",

  {p:"Le <b>COP</b> mesure la performance à un point de fonctionnement précis (température extérieure et température d'eau). Le <b>SCOP</b> la mesure sur toute une saison de chauffage : c'est la valeur qui compte pour le client. Le COP baisse quand l'écart augmente entre la source froide et l'eau de chauffage : une PAC sur plancher chauffant (eau à 35 °C) est plus efficace que sur de vieux radiateurs (eau à 55 °C).",

   fig:{type:"flux",legende:"Chaîne de commande d'un compresseur",etapes:["Phase (disjoncteur de commande)","Thermostat ou régulateur","Pressostat HP","Pressostat BP","Bobine A1-A2 du contacteur","Neutre"]},

C.fiches.diagnostic={
 intro:"Diagnostiquer, c'est relier des mesures à une cause. Les quatre valeurs du circuit (BP, HP, surchauffe, sous-refroidissement) forment une « signature » propre à chaque panne. Avec la méthode et ces signatures, tu évites l'erreur la plus coûteuse du métier : rajouter du fluide à une machine qui n'en manque pas. Entraîne-toi ensuite au jeu « Dépannage ».",
 s:[
  {p:"On commence toujours par le plus simple. Beaucoup de « pannes de froid » ne sont pas frigorifiques : filtre à air bouché, ventilateur arrêté, condenseur sale, consigne mal réglée, porte de chambre froide mal fermée, alimentation absente. On vérifie l'<b>électrique</b> et l'<b>aéraulique</b> avant de brancher le manifold. Ensuite seulement, on mesure les quatre valeurs, machine stabilisée, et on les compare aux valeurs normales de la machine.",
   fig:{type:"flux",legende:"Méthode de diagnostic",etapes:["Écouter et constater","Électrique : tension, intensité, sécurités","Aéraulique : filtres, ventilateurs, échangeurs","Mesures : BP, HP, surchauffe, sous-refroidissement","Conclure, réparer, contrôler"]},
   q:["Une clim refroidit mal. Avant de brancher le manifold, tu…",["Vérifies filtres, ventilateurs et échangeurs","Ajoutes du fluide","Changes le compresseur","Changes le détendeur"],0,"Les causes aérauliques sont fréquentes et ne demandent pas d'ouvrir le circuit."]},
  {p:"<b>Manque de fluide</b> : l'évaporateur est sous-alimenté. La BP est basse, la surchauffe est <b>élevée</b> (le peu de fluide s'évapore tôt et la vapeur se réchauffe), la HP est plutôt basse et le sous-refroidissement <b>faible</b> (pas assez de liquide stocké au condenseur), avec des bulles au voyant. Un manque de fluide est toujours le signe d'une <b>fuite</b> : on la cherche et on la répare avant de recharger. <b>Excès de fluide</b> : le condenseur se remplit de liquide, la HP monte et le sous-refroidissement devient <b>élevé</b>. Les <b>incondensables</b> (air) font aussi monter la HP ; à l'arrêt, la pression est supérieure à la pression de saturation correspondant à la température ambiante.",
   fig:{type:"cycle",centre:"Pannes de charge",etapes:[["Manque : surchauffe ↑ sous-refroid. ↓","#3db5ff"],["Excès : HP ↑ sous-refroid. ↑","#ff8a3d"],["Air : HP ↑ à l'arrêt aussi","#b18cff"]]},
   att:"Ne jamais « faire l'appoint » sans chercher la fuite : le fluide repartira, le client paiera deux fois et la loi impose de réparer les fuites.",
   q:["BP basse, surchauffe élevée, sous-refroidissement faible, bulles au voyant :",["Manque de fluide","Excès de fluide","Condenseur encrassé","Compresseur inefficace"],0,"C'est la signature typique du manque de charge."]},
  {p:"Les <b>pannes d'échange</b> se reconnaissent aux écarts avec l'air. <b>Condenseur</b> encrassé ou ventilateur de condenseur en panne : la HP monte et l'écart entre la température de condensation et l'air extérieur devient trop grand (plus de 20 K, par exemple). <b>Évaporateur</b> encrassé, givré, filtre à air bouché ou ventilateur intérieur lent : l'air ne passe plus, la BP chute, et comme le fluide ne s'évapore pas complètement, la surchauffe est <b>faible</b>, avec un risque de retour de liquide.",
   q:["BP basse et surchauffe faible : cause probable ?",["Évaporateur qui manque d'air (filtre bouché, givre, ventilateur)","Manque de fluide","Excès de fluide","Incondensables"],0,"Le fluide ne trouve pas assez de chaleur pour s'évaporer."]},
  {p:"Une <b>restriction</b> (filtre déshydrateur colmaté, détendeur bloqué ou bouché par de la glace ou de la calamine) donne une BP basse et une surchauffe haute, comme un manque de fluide… mais le sous-refroidissement est <b>élevé</b> : le fluide s'accumule en amont du bouchon. Un écart de température à travers le filtre trahit le colmatage. Un <b>compresseur inefficace</b> (clapets ou spirales usés) ne crée plus l'écart de pression : BP trop haute, HP trop basse, intensité faible, peu de froid.",

   q:["BP basse, surchauffe haute, sous-refroidissement élevé, filtre froid en sortie :",["Restriction (filtre colmaté)","Manque de fluide","Excès de fluide","Condenseur sale"],0,"Le sous-refroidissement élevé distingue la restriction du manque de fluide."]}
 ],
 retenir:["D'abord l'électrique et l'aéraulique, ensuite le manifold.","Manque : surchauffe ↑, sous-refroidissement ↓. Excès : HP ↑, sous-refroidissement ↑.","Condenseur : HP ↑. Évaporateur : BP ↓, surchauffe ↓.","Restriction : BP ↓, surchauffe ↑, sous-refroidissement ↑. Compresseur faible : BP ↑, HP ↓.","Un manque de fluide = une fuite à trouver et réparer."]

/* NIVEAU 3 — La réglementation des fluides (vérifiée en octobre 2026)

C.modules.push({id:"reglementation",n:3,i:"📜",t:"La réglementation des fluides",d:"F-Gas III, attestations, contrôles d'étanchéité, traçabilité",
 s:[{h:"Les attestations",l:["<b>Attestation de capacité</b> : pour l'<b>entreprise</b> (valable 5 ans).","<b>Attestation d'aptitude</b> : pour la <b>personne</b> (valable 7 ans, remise à niveau périodique).","Nouvelles catégories : <b>A1</b> (tout), <b>A2</b> (< 3 kg), <b>B</b> (CO₂), <b>C</b> (ammoniac), <b>D</b> (récupération < 3 kg), <b>E</b> (contrôle d'étanchéité) ; <b>V</b> pour la clim des véhicules."]},
    {h:"Les contrôles d'étanchéité (HFC)",l:["≥ <b>5 t éq. CO₂</b> : tous les <b>12 mois</b> (24 avec détection permanente).","≥ <b>50 t</b> : tous les <b>6 mois</b> (12 avec détection).","≥ <b>500 t</b> : tous les <b>3 mois</b> (6 avec détection), et détection permanente <b>obligatoire</b>.","HFO : mêmes fréquences à partir de <b>1 kg</b>, <b>10 kg</b> et <b>100 kg</b>."]},

    {h:"Les interdictions",l:["<b>Dégazage</b> : toujours interdit ; on récupère tout, HFO compris.","HCFC (R22) : plus de recharge.","Entretien avec du fluide <b>neuf</b> à PRP ≥ 2 500 : interdit (clim et PAC depuis 2026). Fluide <b>régénéré</b> PRP ≥ 2 500 : interdit en 2030 (froid) et 2032 (clim, PAC).","Mise sur le marché d'équipements neufs à HFC : interdictions progressives jusqu'en 2035."]}],

C.fiches.reglementation={
 intro:"Les fluides fluorés sont de puissants gaz à effet de serre : leur manipulation est très encadrée. Depuis le 11 mars 2024, c'est le règlement européen 2024/573, dit « F-Gas III », qui s'applique, complété en France par le Code de l'environnement et de nouveaux arrêtés sur les attestations (fin 2025). C'est aussi le cœur de l'examen de l'attestation d'aptitude.",
 s:[
  {p:"Deux attestations différentes. L'<b>attestation de capacité</b> est délivrée à l'<b>entreprise</b> par un organisme agréé : sans elle, l'entreprise ne peut pas manipuler de fluides ni en acheter. L'<b>attestation d'aptitude</b> est délivrée à la <b>personne</b> après un examen théorique et pratique. Le nouveau cadre crée six catégories : <b>A1</b> (toutes les opérations sur les fluides fluorés et les hydrocarbures, sans limite de charge), <b>A2</b> (pareil, pour les équipements de moins de 3 kg, ou de moins de 6 kg s'ils sont hermétiquement scellés), <b>B</b> (CO₂), <b>C</b> (ammoniac), <b>D</b> (récupération sur les petites charges), <b>E</b> (contrôle d'étanchéité sans ouvrir le circuit). La catégorie <b>V</b> (climatisation des véhicules) est maintenue.",
   fig:{type:"flux",legende:"Correspondance entre anciennes et nouvelles catégories",etapes:[["Catégorie I","→ A1"],["Catégorie II","→ A2"],["Catégorie III","→ D"],["Catégorie IV","→ E"],["Catégorie V (véhicules)","maintenue"]]},
   info:"La nouvelle attestation d'aptitude est valable 7 ans. Les titulaires des anciennes attestations doivent suivre une remise à niveau au plus tard le 12 mars 2029. Le calendrier de transition précis est fixé par les arrêtés de novembre 2025 : renseigne-toi auprès de ton centre d'examen.",
   q:["L'attestation d'aptitude est délivrée…",["À la personne","À l'entreprise","Au client","À l'équipement"],0,"L'attestation de capacité, elle, concerne l'entreprise."]},
  {p:"Les équipements contenant des HFC à partir de <b>5 tonnes équivalent CO₂</b> doivent être contrôlés régulièrement. La fréquence dépend de la charge, et elle est <b>divisée par deux</b> (intervalle doublé) si un système de <b>détection permanente</b> des fuites est installé. À partir de 500 t, ce système est obligatoire. Nouveauté de F-Gas III : les <b>HFO</b> sont aussi concernés, avec des seuils en kilogrammes (1, 10 et 100 kg). Les équipements <b>hermétiquement scellés</b> des logements contenant moins de 3 kg n'ont pas de contrôle obligatoire.",
   fig:{type:"barres",legende:"Intervalle entre deux contrôles d'étanchéité, sans détection permanente",items:[["5 à 50 t éq. CO₂ (HFO : 1 à 10 kg)",12,"mois","#2ed47a"],["50 à 500 t éq. CO₂ (HFO : 10 à 100 kg)",6,"mois","#ffc83d"],["500 t éq. CO₂ et plus (HFO : 100 kg et plus)",3,"mois","#ff5470"]]},
   ex:"Une chambre froide contient 15 kg de R404A : 15 × 3 922 ÷ 1 000 = 58,8 t éq. CO₂. Contrôle tous les 6 mois, ou tous les 12 mois avec un détecteur permanent.",
   q:["Une installation de 60 t éq. CO₂ sans détection permanente est contrôlée tous les…",["6 mois","12 mois","3 mois","24 mois"],0,"Entre 50 et 500 t éq. CO₂ : tous les 6 mois."]},
  {p:"Une fuite détectée doit être <b>réparée sans délai</b>. L'étanchéité est ensuite recontrôlée au plus tôt après <b>24 heures de fonctionnement</b> et au plus tard <b>un mois</b> après la réparation. L'exploitant tient un <b>registre</b> des interventions et des mouvements de fluide. Chaque opération (charge, récupération, contrôle d'étanchéité) donne lieu à une <b>fiche d'intervention</b> : le Cerfa <b>15497*04</b>. Le fluide récupéré est un déchet dangereux : il est suivi par un <b>bordereau de suivi des fluides frigorigènes (BSFF)</b>, dématérialisé sur la plateforme nationale <b>Trackdéchets</b> depuis le 1er janvier 2023.",

 {id:"restriction",t:"La vitrine refroidit mal malgré une charge correcte",ic:"🥗",niv:3,

/* ---- 84-atelier.js ---- */
/* JEU — Atelier de calcul (tables PT calculées avec CoolProp, voir 00-app.js). */
const PRP={R404A:3922,R410A:2088,R407C:1774,R134a:1430,R32:675};
const FL=["R32","R410A","R134a","R404A","R290"];
C.atelier=[
 {t:"Pression → température",ic:"📟",d:"Lire la table du fluide",gen:R=>{const f=R.pick(FL),t=R.pick(["-20","-10","-5","0","5","10","30","40","45","50"]),p=PT[f][t];
   return {q:`Le manomètre indique <b>${R.f(p,1)} bar</b> sur un circuit au <b>${f}</b>. Quelle est la température de saturation ?<br><small>Table ${f} : ${Object.entries(PT[f]).sort((a,b)=>a[0]-b[0]).map(([k,v])=>k+' °C → '+R.f(v,1)).join(' · ')}</small>`,r:+t,u:"°C",tol:0.6,ex:`Dans la table du ${f}, ${R.f(p,1)} bar correspond à <b>${t} °C</b>.`}}},
 {t:"Surchauffe",ic:"🌡️",d:"T aspiration − T évaporation",gen:R=>{const f=R.pick(FL),t=R.pick(["-20","-10","-5","0","5"]),p=PT[f][t],sh=R.r(3,16),ta=+t+sh;
   return {q:`<b>${f}</b> : BP = <b>${R.f(p,1)} bar</b> (évaporation à ${t} °C). Le tube d'aspiration est à <b>${ta} °C</b>. Quelle est la surchauffe ?`,r:sh,u:"K",tol:0.1,ex:`Surchauffe = ${ta} − (${t}) = <b>${sh} K</b> ${sh>10?'(élevée : évaporateur sous-alimenté ?)':sh<5?'(faible : risque de retour de liquide)':'(correcte)'}.`}}},
 {t:"Sous-refroidissement",ic:"💧",d:"T condensation − T liquide",gen:R=>{const f=R.pick(FL),t=R.pick(["30","35","40","45","50"]),p=PT[f][t],sr=R.r(1,14),tl=+t-sr;
   return {q:`<b>${f}</b> : HP = <b>${R.f(p,1)} bar</b> (condensation à ${t} °C). La ligne liquide est à <b>${tl} °C</b>. Quel est le sous-refroidissement ?`,r:sr,u:"K",tol:0.1,ex:`Sous-refroidissement = ${t} − ${tl} = <b>${sr} K</b> ${sr>9?'(élevé : excès de charge ou restriction ?)':sr<3?'(faible : manque de fluide ?)':'(correct)'}.`}}},
 {t:"Tonnes équivalent CO₂",ic:"🌍",d:"kg × PRP ÷ 1 000",gen:R=>{const f=R.pick(Object.keys(PRP)),kg=R.pick([0.8,1.2,2.5,3,5,8,12,15,25,40,60,150]),r=kg*PRP[f]/1000;
   return {q:`Une installation contient <b>${R.f(kg,1)} kg</b> de <b>${f}</b> (PRP ${PRP[f]}). Combien de tonnes équivalent CO₂ ?`,r,u:"t éq. CO₂",ex:`${R.f(kg,1)} × ${PRP[f]} ÷ 1 000 = <b>${R.f(r,2)} t éq. CO₂</b>.`}}},
 {t:"Fréquence du contrôle d'étanchéité",ic:"📅",d:"En mois (0 = pas obligatoire)",gen:R=>{const f=R.pick(Object.keys(PRP)),kg=R.pick([1,2,3,5,8,12,20,30,60,150,200]),det=R.r(0,1)===1,t=kg*PRP[f]/1000;
   let m=t>=500?3:t>=50?6:t>=5?12:0;if(m&&det)m*=2;
   return {q:`<b>${kg} kg</b> de <b>${f}</b> (PRP ${PRP[f]}), ${det?'<b>avec</b>':'<b>sans</b>'} détection permanente des fuites. Tous les combien de mois faut-il un contrôle d'étanchéité ? (0 si pas obligatoire)`,r:m,u:"mois",tol:0.01,
     ex:`${kg} × ${PRP[f]} ÷ 1 000 = ${R.f(t,1)} t éq. CO₂ → ${m?(`<b>${m} mois</b>`+(det?' (intervalle doublé par la détection)':'')):'<b>0</b> : sous le seuil de 5 t, pas de contrôle obligatoire'}${t>=500?' — la détection permanente est obligatoire à ce niveau.':'.'}`}}},
 {t:"COP et EER",ic:"♨️",d:"Puissance utile ÷ puissance électrique",gen:R=>{const pe=R.pick([0.8,1,1.5,2,2.5,3]),c=R.pick([2.5,3,3.2,3.5,4,4.5]),pu=+(pe*c).toFixed(2),chaud=R.r(0,1);
   return {q:`Une machine absorbe <b>${R.f(pe,1)} kW</b> électriques et fournit <b>${R.f(pu,2)} kW</b> ${chaud?'de chaleur':'de froid'}. Quel est son ${chaud?'COP':'EER'} ?`,r:c,u:"",ex:`${chaud?'COP':'EER'} = ${R.f(pu,2)} ÷ ${R.f(pe,1)} = <b>${R.f(c,2)}</b>.`}}},
 {t:"Pression absolue",ic:"🔢",d:"Absolue = relative + 1,013 bar",gen:R=>{const p=R.pick([0.5,1.9,3.3,4.8,7.1,8.5,10.6,17.3,23.8,26.9]),r=p+1.013;
   return {q:`Le manifold indique <b>${R.f(p,1)} bar</b>. Quelle est la pression absolue ?`,r,u:"bar abs",tol:0.06,ex:`${R.f(p,1)} + 1,013 = <b>${R.f(r,2)} bar absolus</b> (on arrondit souvent à + 1 bar).`}}},
 {t:"Charge complémentaire d'un split",ic:"📏",d:"(longueur − longueur préchargée) × g/m",gen:R=>{const lp=R.pick([5,7.5,10]),l=lp+R.r(2,20),g=R.pick([15,20,25,30]),r=(l-lp)*g;
   return {q:`Unité préchargée pour <b>${R.f(lp,1)} m</b>. Liaison réelle : <b>${R.f(l,1)} m</b>. Complément : <b>${g} g/m</b>. Combien de fluide ajouter ?`,r,u:"g",tol:0.5,ex:`(${R.f(l,1)} − ${R.f(lp,1)}) × ${g} = <b>${R.f(r,1)} g</b>, à charger au poids.`}}},
 {t:"Bouteille de récupération (80 %)",ic:"♻️",d:"Capacité × 0,8 − contenu",gen:R=>{const cap=R.pick([10,12.5,26,50]),deja=+(cap*R.r(0,6)/10).toFixed(1),r=Math.max(0,cap*0.8-deja);
   return {q:`Bouteille de récupération de <b>${R.f(cap,1)} kg</b> de capacité, qui contient déjà <b>${R.f(deja,1)} kg</b> du même fluide. Combien peut-on encore y récupérer au maximum ?`,r,u:"kg",tol:0.05,ex:`80 % de ${R.f(cap,1)} = ${R.f(cap*0.8,1)} kg ; ${R.f(cap*0.8,1)} − ${R.f(deja,1)} = <b>${R.f(r,1)} kg</b>.`}}},
 {t:"Puissance frigorifique sur l'air",ic:"🌬️",d:"P (W) ≈ 0,34 × débit (m³/h) × ΔT",gen:R=>{const q=R.pick([300,400,500,600,800,1000]),dt=R.r(6,14),r=0.34*q*dt;
   return {q:`Une unité intérieure brasse <b>${q} m³/h</b> d'air et le refroidit de <b>${dt} K</b>. Quelle puissance frigorifique sensible (en W) ?`,r,u:"W",tol:r*0.03,ex:`P ≈ 0,34 × ${q} × ${dt} = <b>${R.f(r,0)} W</b> (0,34 = masse volumique × chaleur massique de l'air, en Wh/m³·K).`}}},
 {t:"Degrés Celsius et kelvins",ic:"🌡️",d:"K = °C + 273",gen:R=>{const c=R.pick([-40,-30,-20,-18,-10,0,4,20,35,45]);
   return {q:`Combien de kelvins font <b>${c} °C</b> ?`,r:c+273,u:"K",tol:0.6,ex:`${c} + 273 = <b>${c+273} K</b>.`}}}
];

/* =====================================================================
   MOTEUR (commun à toutes les apps métier)
   ===================================================================== */
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const P={xp:0,read:new Set(),best:{quiz:0,vf:0,match:0,ordre:null,calc:0,exam:0},parties:0,fin:new Set(),mq:new Set(),serie:0,jour:'',xpJour:0,err:[],diag:{},cab:{},tri:{},ord:{},atel:0,fix:0,badges:[]};
let FX=[];const OBJ=50;
/* sauvegarde de la progression (une clé par app) */
const KEY='appmetier_'+(C.id||C.app);
const LISTES=['err','badges'],OBJETS=['diag','cab','tri','ord'];
function save(){try{const d={xp:P.xp,read:[...P.read],best:P.best,parties:P.parties,fin:[...P.fin],mq:[...P.mq],serie:P.serie,jour:P.jour,xpJour:P.xpJour,atel:P.atel,fix:P.fix};LISTES.concat(OBJETS).forEach(k=>d[k]=P[k]);localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){P.xp=d.xp||0;P.read=new Set(d.read||[]);Object.assign(P.best,d.best||{});P.parties=d.parties||0;P.fin=new Set(d.fin||[]);P.mq=new Set(d.mq||[]);P.serie=d.serie||0;P.jour=d.jour||'';P.xpJour=d.xpJour||0;P.atel=d.atel||0;P.fix=d.fix||0;
  LISTES.forEach(k=>P[k]=Array.isArray(d[k])?d[k]:[]);OBJETS.forEach(k=>P[k]=d[k]&&typeof d[k]==='object'?d[k]:{})}}catch(e){}}
/* thème : couleurs propres à chaque app (facultatif) */
function theme(){const th=C.theme||{};Object.keys(th).forEach(k=>document.documentElement.style.setProperty('--'+k,th[k]))}
let G={};

function tab(t){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  show(t);
  if(t==='home')renderHome();if(t==='cours')renderMods();if(t==='lexique')renderLex();if(t==='jeux')renderJeux();
}
function show(id){clearInterval(G.tm);FX.forEach(clearInterval);FX=[];if($('rb'))$('rb').style.width=0;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}

/* ----- niveaux (XP) et grades -----
   C.grades (facultatif) = ['Apprenti','Compagnon',…] : nom affiché selon le niveau */
const SEUILS=[0,100,250,450,700,1000,1400,1900,2500,3200,4000,5000,6200,7600,9200,11000];
function grade(){let i=0;while(i<SEUILS.length-1&&P.xp>=SEUILS[i+1])i++;const g=C.grades||[];
  return {i,nom:'Niveau '+(i+1)+(g.length?' · '+g[Math.min(i,g.length-1)]:''),bas:SEUILS[i],haut:SEUILS[i+1]||null}}

/* accueil */
function renderHome(){
  const g=grade();
  $('appName').textContent=C.app;$('appIc').textContent=C.icon;$('xpP').textContent='⚡ '+P.xp+' XP · 🏅 '+P.badges.length;
  const n=P.fin.size,t=C.modules.length;$('gradeTx').textContent=g.nom;$('progTx').textContent=`${n} / ${t} fiches terminées`;$('progBar').style.width=(n/t*100)+'%';
  const w=C.lexique[new Date().getDate()%C.lexique.length];$('wotdM').textContent=w[0];$('wotdD').textContent=w[1];
  const m=C.modules.find(m=>!P.fin.has(m.id))||C.modules.find(m=>!P.read.has(m.id))||C.modules[0];
  $('nextMod').innerHTML=modRow(m);
  if(C.diag&&C.diag.length){const k=Math.floor(Date.now()/864e5)%C.diag.length,d=C.diag[k];
    $('homeDiag').innerHTML=`<h2 style="margin:4px 0 14px">${DT().jour}</h2><button class="row" onclick="startDiag(${k})"><span class="ic">${d.ic||'🔎'}</span><span class="tx"><b>${d.t}</b><span>${d.bon.lieu}</span></span>${P.diag[d.id]?`<span class="st">${stars(P.diag[d.id])}</span>`:'<span class="mut">›</span>'}</button>`}
  const auj=P.jour===today(),xj=auj?P.xpJour:0,s=auj||P.jour===today(-1)?P.serie:0;
  $('dayCard').innerHTML=`<div class="day"><span class="fl ${auj?'':'off'}">🔥</span><div style="flex:1"><b>${s} jour${s>1?'s':''} de suite</b><div class="mut">${auj?'Bravo, tu as appris aujourd\'hui !':'Apprends aujourd\'hui pour garder ta série.'}</div></div></div>
   <div class="mut" style="display:flex;justify-content:space-between;margin-top:6px"><span>🎯 Objectif du jour</span><b style="color:#fff">${Math.min(xj,OBJ)} / ${OBJ} XP</b></div><div class="prog" style="flex:none"><i style="width:${Math.min(100,xj/OBJ*100)}%"></i></div>`;
}
function modRow(m){return `<button class="row" onclick="openFiche('${m.id}')"><span class="ic">${m.i}</span><span class="tx"><b>${m.t}</b><span>${m.d}</span></span>${P.fin.has(m.id)?'<span class="ok">✓</span>':P.read.has(m.id)?'<span class="mut">…</span>':'<span class="mut">›</span>'}</button>`}
/* C.niveaux (facultatif) = [{t,d,ic}] et chaque module a n:1,2,3… → cours regroupés par niveau */
function renderMods(){
  if(!C.niveaux){$('modList').innerHTML=C.modules.map(modRow).join('');return}
  $('modList').innerHTML=C.niveaux.map((nv,k)=>{const ms=C.modules.filter(m=>(m.n||1)===k+1),lu=ms.filter(m=>P.fin.has(m.id)).length;
    return `<div class="nvh"><b>${nv.ic||''} ${nv.t}</b><span class="mut">${nv.d||''}</span><div class="prog" style="flex:none;height:8px"><i style="width:${ms.length?lu/ms.length*100:0}%"></i></div><span class="mut">${lu} / ${ms.length} fiches terminées</span></div>`+ms.map(modRow).join('')}).join('');
}

/* fiche */
function openFiche(id){
  const m=C.modules.find(x=>x.id===id),F=(C.fiches||{})[id]||{},k=C.modules.indexOf(m),nx=C.modules[k+1];
  P.read.add(id);save();
  const S=m.s.map((s,i)=>Object.assign({},s,(F.s||[])[i]||{}));
  const mots=(JSON.stringify(S)+(F.intro||'')).replace(/<[^>]+>/g,' ').split(/\s+/).length,min=Math.max(1,Math.round(mots/170));
  const nq=C.quiz.filter(q=>q[0]===id).length;
  $('ficheBody').innerHTML=`<div class="rbar"><i id="rb"></i></div>
   <div class="top"><button class="back" onclick="tab('cours')">←</button><span class="pill">Module ${k+1} / ${C.modules.length}</span></div>
   <div class="fhero"><span class="fic">${m.i}</span><div><h1>${m.t}</h1><p class="mut">${m.d}</p><span class="mut">⏱ ${min} min de lecture · ${S.length} parties${P.fin.has(id)?' · ✅ lue':''}</span></div></div>
   ${F.intro?`<p class="chapo">${F.intro}</p>`:''}
   ${S.length>1?`<div class="toc"><b>Sommaire</b>${S.map((s,i)=>`<button onclick="$('s${i}').scrollIntoView({behavior:'smooth',block:'start'})">${i+1}. ${s.h}</button>`).join('')}</div>`:''}
   ${S.map((s,i)=>`<div class="sec" id="s${i}"><div class="sh"><span class="num">${i+1}</span><h3>${s.h}</h3></div>
     ${s.p?`<p>${s.p}</p>`:''}${s.l?`<ul>${s.l.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
     ${s.fig?figHTML(s.fig):''}
     ${s.ex?`<div class="box ex2"><b>💡 Exemple concret</b>${s.ex}</div>`:''}
     ${s.att?`<div class="box att"><b>⚠️ Attention</b>${s.att}</div>`:''}
     ${s.info?`<div class="box info"><b>🤓 Le savais-tu ?</b>${s.info}</div>`:''}
     ${s.q?mqHTML(s.q,id+':'+i):''}</div>`).join('')}
   ${F.retenir?`<div class="box ret"><b>📌 À retenir</b><ul>${F.retenir.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
   <div class="key"><h3>🔑 Mots-clés</h3><div class="chips">${m.k.map(k=>`<button class="chip" onclick="def('${k.replace(/'/g,"\\'")}')">${k}</button>`).join('')}</div></div>
   <div id="finF"></div>
   ${nq?`<button class="btn" onclick="startQuiz('${m.id}')">🎯 S'entraîner sur ce module (${Math.min(nq,10)} questions)</button>`:''}
   ${nx?`<button class="btn ghost" onclick="openFiche('${nx.id}')">Module suivant : ${nx.i} ${nx.t} →</button>`:`<button class="btn ghost" onclick="tab('cours')">🎉 Tous les modules vus — retour aux cours</button>`}`;
  show('fiche');initFigs($('ficheBody'));
  document.querySelectorAll('#ficheBody .fig').forEach(f=>watch(f,()=>playFig(f)));
  watch($('finF'),()=>{if(!P.fin.has(id)){P.fin.add(id);gain(20,$('finF'));toast('📖 Fiche terminée ! +20 XP')}});
}
/* barre de lecture */
addEventListener('scroll',()=>{const r=$('rb');if(!r||!$('fiche').classList.contains('on'))return;const h=document.documentElement.scrollHeight-innerHeight;r.style.width=(h>0?Math.min(100,scrollY/h*100):100)+'%'},{passive:true});
function watch(el,f){if(!('IntersectionObserver' in window))return f();const o=new IntersectionObserver(e=>{if(e[0].isIntersecting){o.disconnect();f()}},{threshold:.35});o.observe(el)}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}

/* mini-question dans la fiche : [question,[bonne,faux,…],0,explication] */
function mqHTML(q,key){const o=shuf(q[1].map((t,i)=>({t,i})));
  return `<div class="mq" data-q="${key}"><b>✋ Vérifie que tu as compris</b><p>${q[0]}</p>${o.map(x=>`<button class="ans" data-i="${x.i}" onclick="mqA(this)">${x.t}</button>`).join('')}<div class="ex"></div></div>`}
function mqA(b){const box=b.closest('.mq'),k=box.dataset.q,[mid,si]=k.split(':'),m=C.modules.find(x=>x.id===mid);
  const s=Object.assign({},m.s[si],((C.fiches||{})[mid]||{s:[]}).s[si]||{}),q=s.q,bs=[...box.querySelectorAll('.ans')];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);
  const ok=+b.dataset.i===q[2];bs.forEach(x=>{if(+x.dataset.i===q[2])x.classList.add('ok');else if(x!==b)x.classList.add('dim')});
  if(ok){if(!P.mq.has(k)){P.mq.add(k);gain(5,b)}else beep(1)}else{b.classList.add('ko');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');beep(0)}
  const e=box.querySelector('.ex');e.innerHTML=(ok?'✅ ':'❌ ')+q[3];e.classList.add('on');}

/* ----- FIGURES ANIMÉES -----
   fig:{type:'cycle',etapes:['A','B',['C','#ff5470']],centre:'…'}   étapes en boucle
   fig:{type:'flux',etapes:['A',['B','valeur'],…],ops:['− 5','÷ 3']}  étapes qui apparaissent une à une
   fig:{type:'barres',items:[['Libellé',valeur,'unité','#couleur'],…]}  barres comparées
   fig:{type:'chiffres',items:[[valeur,'unité','légende'],…]}          chiffres clés qui défilent
   fig:{type:'svg',svg:'<svg…>'}  dessin libre (classes : flow, glow, spin, pop, draw, appear)
   fig:{type:'inter',svg:'<svg…>',inters:[['a','Interrupteur 1',2],…],f:s=>['clé',…],msg:s=>'texte'}
       schéma interactif : chaque bouton fait tourner l'état s.a (0,1… nb positions).
       Dans le SVG : data-v="a:1" = visible seulement si s.a vaut 1 ; data-k="clé" = reçoit la classe "on"
       si f(s) renvoie cette clé (classes prêtes : lp = lampe, w = fil, w ko = fil en défaut).
   fig:{type:'etapes',vues:[{svg:'<svg…>',t:'texte'},…]}  pas à pas avec ◀ ▶
   + legende:'…' (facultatif) */
const FIGR=[];
function figHTML(f){let h='';
  if(f.type==='cycle'){const n=f.etapes.length,T=n*1.6;
    h=`<div class="cyc" data-n="${n}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--card)" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="none" stroke="var(--pri)" stroke-width="1.2" stroke-dasharray="3 5" class="flow" opacity=".7"/><circle r="3" fill="var(--pri)"><animateMotion dur="${T}s" repeatCount="indefinite" path="M50,12 A38,38 0 1,1 49.99,12"/></circle></svg>
     ${f.etapes.map((e,i)=>{const [t,c]=Array.isArray(e)?e:[e],a=(-90+i*360/n)*Math.PI/180;return `<div class="n" style="left:${50+38*Math.cos(a)}%;top:${50+38*Math.sin(a)}%;${c?'--c:'+c:''}">${t}</div>`}).join('')}
     ${f.centre?`<div class="ctr">${f.centre}</div>`:''}</div>`}
  else if(f.type==='flux'){h=`<div class="flx">${f.etapes.map((e,i)=>{const [t,v]=Array.isArray(e)?e:[e];return (i?`<div class="a" style="animation-delay:${i*.7-.35}s">↓ ${(f.ops||[])[i-1]||''}</div>`:'')+`<div class="b ${i===f.etapes.length-1?'fin':''}" style="animation-delay:${i*.7}s"><span>${t}</span>${v?`<b>${v}</b>`:''}</div>`}).join('')}</div>`}
  else if(f.type==='barres'){const mx=Math.max(...f.items.map(x=>x[1]));h=`<div class="brs">${f.items.map(x=>`<div><div class="r"><span>${x[0]}</span><span style="white-space:nowrap"><span class="cnt" data-v="${x[1]}">0</span>${x[2]?' '+x[2]:''}</span></div><div class="t"><i data-w="${Math.max(1.5,x[1]/mx*100)}" style="${x[3]?'--c:'+x[3]:''}"></i></div></div>`).join('')}</div>`}
  else if(f.type==='chiffres'){h=`<div class="chf">${f.items.map(x=>`<div><b><span class="cnt" data-v="${x[0]}">0</span>${x[1]?' '+x[1]:''}</b><span>${x[2]||''}</span></div>`).join('')}</div>`}
  else if(f.type==='svg')h=f.svg;
  else if(f.type==='inter'){const r=FIGR.push(f)-1;h=`<div class="itr" data-r="${r}">${f.svg}<div class="ibt">${f.inters.map(([k,t])=>`<button class="chip" data-s="${k}" onclick="figSw(this)">${t}</button>`).join('')}</div><div class="imsg"></div></div>`}
  else if(f.type==='etapes'){const r=FIGR.push(f)-1;h=`<div class="etp" data-r="${r}" data-i="0"><div class="etv"></div><div class="etn"><button class="chip" onclick="figEt(this,-1)">◀</button><span></span><button class="chip" onclick="figEt(this,1)">▶</button></div></div>`}
  const inter=f.type==='inter'||f.type==='etapes';
  return `<div class="fig" data-t="${f.type}">${inter?'':'<button class="rej" onclick="playFig(this.parentNode)">↻ Rejouer</button>'}${h}${f.legende?`<div class="leg">${f.legende}</div>`:''}</div>`}
function initFigs(root){root.querySelectorAll('.itr').forEach(el=>{const f=FIGR[+el.dataset.r];el._s={};f.inters.forEach(([k])=>el._s[k]=0);figUpd(el)});root.querySelectorAll('.etp').forEach(el=>figEt(el.querySelector('.chip'),0))}
function figSw(b){const el=b.closest('.itr'),f=FIGR[+el.dataset.r],k=b.dataset.s,n=(f.inters.find(x=>x[0]===k)||[])[2]||2;el._s[k]=(el._s[k]+1)%n;figUpd(el);beep(1)}
function figUpd(el){const f=FIGR[+el.dataset.r],s=el._s,on=f.f(s)||[];
  el.querySelectorAll('[data-v]').forEach(x=>{const [k,v]=x.getAttribute('data-v').split(':');x.classList.toggle('hide',String(s[k])!==v)});
  el.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',on.includes(x.getAttribute('data-k'))));
  el.querySelectorAll('.ibt .chip').forEach(b=>b.classList.toggle('act',!!s[b.dataset.s]));
  el.querySelector('.imsg').innerHTML=f.msg?f.msg(s):''}
function figEt(b,d){const el=b.closest('.etp'),f=FIGR[+el.dataset.r];let i=Math.max(0,Math.min(f.vues.length-1,+el.dataset.i+d));el.dataset.i=i;const v=f.vues[i];
  el.querySelector('.etv').innerHTML=`<div class="go">${v.svg||''}</div><p class="etx"><b>${i+1}/${f.vues.length}</b> — ${v.t}</p>`;
  el.querySelector('.etn span').innerHTML=f.vues.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}
function playFig(f){
  f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  const t=f.dataset.t;
  if(t==='cycle'){const ns=[...f.querySelectorAll('.n')],n=ns.length;let i=0;const st=()=>{ns.forEach((x,j)=>x.classList.toggle('on',j===i%n));i++};
    FX.forEach(x=>{if(x.f===f)clearInterval(x)});st();const iv=setInterval(st,1600);iv.f=f;FX.push(iv);
    const an=f.querySelector('animateMotion');if(an&&an.beginElement)an.beginElement()}
  if(t==='barres')f.querySelectorAll('.t i').forEach(i=>{i.style.width=0;void i.offsetWidth;i.style.width=i.dataset.w+'%'});
  f.querySelectorAll('.cnt').forEach(countUp);
}
function countUp(el){const v=+el.dataset.v,d=(el.dataset.v.split('.')[1]||'').length,t0=performance.now(),D=1100;
  (function s(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=(v*e).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});if(p<1)requestAnimationFrame(s)})(t0)}
function def(k){const w=C.lexique.find(x=>x[0]===k);$('modalIn').innerHTML=`<span class="mut">📖 Lexique</span><h2>${k}</h2><p style="line-height:1.55">${w?w[1]:''}</p><button class="btn ghost" onclick="$('modal').classList.remove('on')">Fermer</button>`;$('modal').classList.add('on')}

/* ----- WIKI : lexique, fiches appareils (C.appareils), symboles (C.symboles) ----- */
let LX='mots';
function renderLex(){
  const segs=[['mots','📖 Mots']].concat(C.appareils?[['app',C.appareilsNom||'🧰 Appareils']]:[]).concat(C.symboles?[['sym',(((C.jeux||{}).sym||{}).e||'🔣')+' '+(((C.jeux||{}).sym||{}).t||'Symboles')]]:[]);
  if(!segs.some(s=>s[0]===LX))LX='mots';
  $('lexSeg').style.display=segs.length>1?'':'none';
  $('lexSeg').innerHTML=segs.map(([k,t])=>`<button class="${LX===k?'on':''}" onclick="LX='${k}';renderLex()">${t}</button>`).join('');
  const q=norm($('q').value||'');
  if(LX==='app'){const l=C.appareils.map((a,i)=>[a,i]).filter(([a])=>norm(a.n+' '+a.f+' '+(a.t||'')).includes(q)).sort((x,y)=>x[0].n.localeCompare(y[0].n));
    $('lexList').innerHTML=l.map(([a,i])=>`<button class="row" onclick="appFiche(${i})"><span class="ic">${a.ic||'🧰'}</span><span class="tx"><b>${a.n}</b><span>${a.f}</span></span><span class="mut">›</span></button>`).join('')||'<p class="mut">Aucun résultat.</p>';return}
  if(LX==='sym'){const l=C.symboles.filter(s=>norm(s[0]+' '+(s[2]||'')).includes(q));
    $('lexList').innerHTML=`<div class="symg">${l.map(s=>`<div class="symc">${symSVG(s)}<b>${s[0]}</b><span>${s[2]||''}</span></div>`).join('')}</div>`||'<p class="mut">Aucun résultat.</p>';return}
  $('lexList').innerHTML=C.lexique.filter(w=>norm(w[0]+w[1]).includes(q)).sort((a,b)=>a[0].localeCompare(b[0])).map(w=>`<div class="lex" onclick="this.classList.toggle('open')"><b>${w[0]}</b><p>${w[1]}</p></div>`).join('')||'<p class="mut">Aucun résultat.</p>';
}
/* C.appareils = [{n:'Nom',ic:'🔌',f:'fonction (sans citer le nom)',t:'types',c:'caractéristiques',p:'pose / raccordement',m:'contrôle & maintenance',s:'sécurité',mq:'marques',sym:'nom d\'un symbole'}] */

function renderBest(){const b=P.best,L=[`❓ Quiz : ${b.quiz}/10`,`⏱️ Vrai/Faux : ${b.vf}/10`,`⚡ Chrono : ${b.chrono||0} bonnes réponses`,`🔗 Associer : ${b.match?b.match+' s':'—'}`];

function stars(n){n=n||0;return '★'.repeat(n)+'☆'.repeat(3-n)}
/* liste de choix : rows = [[icône,titre,sous-titre,action,étoiles]] */
