<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Électricien Pro</title>
<style>
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));--bg:#10142a;--card:#1c2244;--card2:#252c58;--pri:#ffc83d;--pri2:#d99a00;--acc:#3db5ff;--ok:#2ed47a;--ko:#ff5470;--txt:#fff;--mut:#a9b0d6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:calc(16px + var(--sat)) 16px calc(96px + var(--sab));min-height:100vh}
.screen{display:none;flex-direction:column;gap:14px;animation:fade .3s}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:26px}h2{font-size:21px}h3{font-size:17px}
.mut{color:var(--mut);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:rgba(255,255,255,.08);padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap}
button.pill{border:none;color:#fff;cursor:pointer}
.back{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:2px 8px 2px 0}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#1b1640;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center}
.hero .ic{font-size:54px;animation:zap 2.5s infinite}
@keyframes zap{0%,90%,100%{transform:none}93%{transform:rotate(-12deg) scale(1.1)}96%{transform:rotate(10deg)}}
.hero b{font-size:22px;display:block}
.bar{height:10px;background:rgba(0,0,0,.15);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#1b1640;border-radius:99px;transition:width .5s}
.card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.mini{padding:10px 14px;gap:2px}
.word{background:var(--card2);border-left:4px solid var(--acc)}
.row{display:flex;gap:12px;align-items:center;cursor:pointer;border:none;background:var(--card);color:#fff;border-radius:18px;padding:14px;text-align:left;width:100%;font-size:16px}
.row .ic{font-size:30px;width:48px;height:48px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .tx{flex:1;min-width:0}.row .tx b{display:block}.row .tx span{font-size:13px;color:var(--mut)}
.row .ok{color:var(--ok);font-weight:900}
.row .st{color:var(--pri);font-weight:900;letter-spacing:1px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{border:none;border-radius:20px;padding:18px 10px;color:#1b1640;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.game .e{font-size:38px}.game small{font-weight:600;font-size:12px;opacity:.8}
.game:active,.btn:active,.ans:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn{border:none;border-radius:16px;padding:15px;font-size:17px;font-weight:800;color:#1b1640;background:var(--pri);box-shadow:0 5px 0 var(--pri2);cursor:pointer;width:100%}
.btn.ghost{background:var(--card2);color:#fff;box-shadow:none}
.btn:disabled{opacity:.5}
/* fiche */
.sec{background:var(--card);border-radius:18px;padding:16px}
.sec h3{margin-bottom:8px;color:var(--pri)}
.sec p,.sec li{line-height:1.55;font-size:15.5px}
.sec ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.key{background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.35);border-radius:16px;padding:14px}
.key h3{color:var(--pri);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:none;color:var(--acc);padding:8px 12px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer}
/* lexique */
.search{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--card2);background:var(--card);color:#fff;font-size:16px;outline:none}
.search:focus{border-color:var(--pri)}
.lex{background:var(--card);border-radius:16px;padding:14px;cursor:pointer}
.lex b{color:var(--pri)}.lex p{margin-top:6px;line-height:1.5;display:none;font-size:15px}
.lex.open p{display:block}
.seg{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:14px}
.seg button{flex:1;border:none;background:none;color:var(--mut);font-weight:800;font-size:14px;padding:10px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--pri);color:#10142a}
/* jeux */
.prog{flex:1;height:12px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qcard{background:#fff;color:#10142a;border-radius:22px;padding:24px 18px;text-align:center;font-size:21px;font-weight:800;line-height:1.35;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.qcard.dq,.qcard.at{font-size:17.5px;min-height:90px;padding:18px 16px}
.qcard small{display:block;font-size:14px;color:#555c80;font-weight:700;margin-top:6px}
.shake{animation:shake .4s}
@keyframes shake{25%,75%{transform:translateX(-9px)}50%{transform:translateX(9px)}}
.ans{border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:700;color:#fff;background:var(--card);box-shadow:0 4px 0 #0a0d1d;cursor:pointer;text-align:left;width:100%;line-height:1.35}
.ans.ok{background:var(--ok);box-shadow:0 4px 0 #1a9a56;color:#10142a}
.ans.ko{background:var(--ko);box-shadow:0 4px 0 #c23250}
.ans.dim{opacity:.4}
.ex{background:var(--card2);border-radius:16px;padding:14px;font-size:15px;line-height:1.5;display:none}
.ex.on{display:block;animation:fade .3s}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{border:none;border-radius:18px;padding:22px;font-size:22px;font-weight:900;color:#fff;cursor:pointer}
.timer{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--pri);width:100%}
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.tile{border:2px solid transparent;border-radius:14px;padding:12px 10px;background:var(--card);color:#fff;font-size:14px;font-weight:700;cursor:pointer;min-height:58px;text-align:left;transition:.2s}
.tile.sel{border-color:var(--pri);background:var(--card2)}
.tile.done{background:var(--ok);opacity:0;transform:scale(.9);pointer-events:none;transition:.5s .3s}
.tile.bad{animation:shake .4s;border-color:var(--ko)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{background:var(--ok);color:#10142a;border-radius:14px;padding:12px;font-weight:800;animation:fade .3s}
.step.empty{background:transparent;border:2px dashed var(--card2);color:var(--mut);font-weight:600}
.big{font-size:90px;text-align:center}
.stars{font-size:44px;text-align:center;color:var(--pri);letter-spacing:6px}
.float{position:fixed;font-weight:900;font-size:22px;color:var(--pri);pointer-events:none;animation:up 1s forwards;z-index:9}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0e20;border-top:1px solid var(--card2);display:flex;justify-content:center;z-index:5;padding-bottom:var(--sab)}
nav .in{display:flex;max-width:480px;width:100%}
nav button{flex:1;background:none;border:none;color:var(--mut);padding:10px 0 14px;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
.modal.on{display:flex}
.modal .in{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 16px calc(28px + var(--sab));display:flex;flex-direction:column;gap:10px;animation:fade .25s;max-height:88vh;overflow:auto}
.pub{background:repeating-linear-gradient(45deg,var(--card),var(--card) 10px,var(--card2) 10px,var(--card2) 20px);border-radius:14px;min-height:60px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:1px}
.pub.full{position:fixed;inset:0;z-index:40;border-radius:0;flex-direction:column;gap:16px;font-size:14px}
/* parcours par niveaux */
.nvh{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:0 2px}
.nvh b{font-size:19px}
/* fiches wiki */
.rbar{position:fixed;top:var(--sat);left:0;right:0;height:4px;z-index:6;background:transparent}
.rbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .1s}
.fhero{display:flex;gap:14px;align-items:center}
.fhero .fic{font-size:52px;width:76px;height:76px;border-radius:22px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.chapo{font-size:17px;line-height:1.6;border-left:4px solid var(--pri);padding:4px 0 4px 14px}
.toc{display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:16px;padding:12px}
.toc b{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.toc button{background:none;border:none;color:var(--acc);text-align:left;font-size:15px;font-weight:700;cursor:pointer;padding:4px 0}
.sh{display:flex;gap:10px;align-items:center;margin-bottom:10px}.sh h3{margin:0!important}
.num{width:30px;height:30px;border-radius:10px;background:var(--pri);color:#10142a;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec>p{line-height:1.65;font-size:15.5px;margin-bottom:10px}
.box{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.55}
.box>b{display:block;margin-bottom:4px}
.box ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.box.ex2{background:rgba(61,181,255,.12);border:1px solid rgba(61,181,255,.35)}
.box.att{background:rgba(255,84,112,.12);border:1px solid rgba(255,84,112,.4)}
.box.info{background:rgba(177,140,255,.13);border:1px solid rgba(177,140,255,.4)}
.box.ret{background:rgba(46,212,122,.12);border:1px solid rgba(46,212,122,.4);margin-top:0}
.mq{margin-top:12px;background:var(--card2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mq>b{font-size:13px;color:var(--pri)}.mq p{font-weight:700;line-height:1.45}
.mq .ans{padding:11px 14px;font-size:15px;box-shadow:0 3px 0 #0a0d1d}
.mq .ex{display:none}.mq .ex.on{display:block}
.toast{position:fixed;left:50%;top:calc(18px + var(--sat));transform:translateX(-50%);background:var(--ok);color:#10142a;font-weight:900;padding:12px 18px;border-radius:99px;z-index:50;animation:toast 2.6s forwards;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.day{display:flex;gap:12px;align-items:center}
.day .fl{font-size:34px}.day .fl.off{filter:grayscale(1);opacity:.5}
/* figures animées */
.fig{margin-top:12px;background:var(--card2);border-radius:14px;padding:14px 12px 12px;position:relative}
.fig .rej{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;z-index:2}
.fig .leg{text-align:center;color:var(--mut);font-size:13px;margin-top:8px}
.fig svg{display:block;width:100%;max-width:340px;margin:0 auto;height:auto}
.cyc{position:relative;width:100%;max-width:310px;aspect-ratio:1;margin:0 auto}
.cyc svg{position:absolute;inset:0;max-width:none}
.cyc .n{position:absolute;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--c,var(--acc));border-radius:12px;padding:6px 8px;font-size:12px;font-weight:700;text-align:center;width:max-content;max-width:42%;transition:.35s;line-height:1.3}
.cyc .n.on{background:var(--c,var(--acc));color:#10142a;transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 18px var(--c,var(--acc))}
.cyc .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:800;font-size:13px;color:var(--mut);max-width:34%}
.flx{display:flex;flex-direction:column;gap:4px}
.flx .b{background:var(--card);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px;opacity:0}
.flx .b b{color:var(--pri);white-space:nowrap}
.flx .b.fin{background:var(--pri);color:#10142a}.flx .b.fin b{color:#10142a}
.flx .a{text-align:center;color:var(--pri);opacity:0;font-size:15px;line-height:1.1;font-weight:900}
.go .flx .b,.go .flx .a{animation:fade .45s forwards}
.brs{display:flex;flex-direction:column;gap:10px}
.brs .r{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.brs .t{height:14px;background:var(--card);border-radius:99px;overflow:hidden;margin-top:4px}
.brs .t i{display:block;height:100%;width:0;background:var(--c,var(--pri));border-radius:99px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.chf{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.chf div{background:var(--card);border-radius:12px;padding:12px 8px;text-align:center}
.chf b{display:block;font-size:24px;color:var(--pri)}.chf span{font-size:12px;color:var(--mut);line-height:1.3;display:block;margin-top:2px}
/* figures interactives (type inter) et pas à pas (type etapes) */
.itr .ibt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.itr .chip.act{background:var(--pri);color:#10142a}
.itr .imsg{text-align:center;font-weight:800;margin-top:8px;font-size:14.5px;min-height:20px}
.fig .lp{fill:var(--card);stroke:#fff;stroke-width:2;transition:.3s}
.fig .lp.on{fill:var(--pri);filter:drop-shadow(0 0 10px var(--pri))}
.fig .w{fill:none;stroke:#5a64a8;stroke-width:3;transition:stroke .3s}
.fig .w.on{stroke:var(--pri);stroke-dasharray:6 6;animation:flow 1s linear infinite}
.fig .w.ko{stroke:var(--ko);stroke-dasharray:6 6;animation:flow .6s linear infinite}
.fig .hide{display:none}
.etp .etx{margin-top:10px;text-align:center;line-height:1.5;font-size:14.5px}
.etn{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.etn span{display:flex;gap:5px}.etn i{width:8px;height:8px;border-radius:50%;background:var(--card)}.etn i.on{background:var(--pri)}
/* classes d'animation utilisables dans les SVG du contenu */
.flow{animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}
.glow{animation:glow 1.6s ease-in-out infinite}@keyframes glow{50%{opacity:.55}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.go .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}@keyframes pop{from{transform:scale(0);opacity:0}}
.go .draw{stroke-dasharray:600;animation:draw 1.4s ease-out backwards}@keyframes draw{from{stroke-dashoffset:600}}
.go .appear{animation:fade .5s backwards}
/* bon de travail (dépannage) */
.bt{background:var(--card);border:2px dashed var(--pri);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bth{display:flex;justify-content:space-between;align-items:center;gap:8px}.bth b{font-size:13px;letter-spacing:1px;color:var(--pri)}
.prio{font-size:12px;font-weight:900;padding:4px 10px;border-radius:99px;color:#10142a;white-space:nowrap}.prio.p1{background:var(--ko)}.prio.p2{background:var(--pri)}.prio.p3{background:var(--ok)}
.btl span{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.5px}.btl p{line-height:1.45;margin-top:2px;font-size:15px}
/* câblage */
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pal button{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.pal button.on{border-color:#fff;transform:scale(1.18)}
.board{background:var(--card);border-radius:18px;padding:4px;touch-action:manipulation}
.board svg{display:block;width:100%;height:auto;user-select:none}
.cap rect{fill:var(--card2);stroke:#46508f;stroke-width:2}
.cap .tt{fill:#fff;font:800 11.5px system-ui}.cap .ict{font-size:22px}
.cap.lit rect{stroke:var(--pri);stroke-width:3}.cap.lit .ict{filter:drop-shadow(0 0 8px #ffc83d)}
.cb{cursor:pointer}.cb .vis{fill:#d9dce8;stroke:#10142a;stroke-width:2}.cb.sel .vis{fill:var(--pri);stroke:#fff;stroke-width:3}
.cb .lb{fill:var(--mut);font:800 10.5px system-ui;text-anchor:middle;pointer-events:none}
.cw{fill:none;stroke-width:5;stroke-linecap:round;pointer-events:none}
.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.okb .cw{stroke-dasharray:9 5;animation:flow .8s linear infinite}
.msg{border-radius:14px;padding:12px 14px;line-height:1.5;font-size:15px}
.msg.ko{background:rgba(255,84,112,.15);border:1px solid rgba(255,84,112,.5)}
.msg.ok{background:rgba(46,212,122,.15);border:1px solid rgba(46,212,122,.5)}
.msg.inf{background:var(--card2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .btn{padding:12px;font-size:15px}
/* symboles */
.sym{width:100%;height:auto;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:block}
.sym .t{fill:currentColor;stroke:none;font:800 15px system-ui;text-anchor:middle}
.sym .f{fill:currentColor}
.sym.big{max-width:210px;margin:0 auto}
.ans.symb{display:flex;align-items:center;justify-content:center;min-height:92px;padding:10px}
.ans.symb svg{max-width:120px}
.symg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.symc{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.symc svg{max-width:110px;color:#fff}.symc b{font-size:14px}.symc span{font-size:12px;color:var(--mut);line-height:1.35}
/* atelier de calcul */
.atin{display:flex;gap:10px;align-items:center}
.atin input{flex:1;padding:16px;border-radius:16px;border:2px solid var(--card2);background:var(--card);color:#fff;font-size:22px;font-weight:800;outline:none;text-align:center;min-width:0}
.atin input:focus{border-color:var(--pri)}.atin span{font-weight:900;font-size:20px;color:var(--pri);min-width:36px}
/* badges & fiches appareils */
.bdg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bdg div{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:3px;opacity:.45;filter:grayscale(1)}
.bdg div.on{opacity:1;filter:none;box-shadow:inset 0 0 0 2px var(--pri)}
.bdg span{font-size:28px}.bdg b{font-size:12px}.bdg small{font-size:10.5px;color:var(--mut);line-height:1.3}
.appf h3{color:var(--pri);font-size:15px;margin-top:6px}.appf p{line-height:1.55;font-size:15px}
.appf .symc{background:var(--card2)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div class="app">

<section class="screen on" id="home">
  <div class="top"><h1 id="appName"></h1><button class="pill" id="xpP" onclick="profil()"></button></div>
  <div class="hero"><div class="ic" id="appIc"></div><div style="flex:1"><b id="gradeTx">Ta progression</b><span id="progTx"></span><div class="bar"><i id="progBar"></i></div></div></div>

C.modules.push({id:"bases",n:1,i:"🔌",t:"Les bases de l'électricité",d:"Tension, courant, résistance, puissance, énergie",
 s:[{h:"Les 4 grandeurs",l:["<b>Tension (U)</b> en volts (V) : la « pression » qui pousse le courant.","<b>Intensité (I)</b> en ampères (A) : la quantité de courant qui circule.","<b>Résistance (R)</b> en ohms (Ω) : ce qui freine le courant.","<b>Puissance (P)</b> en watts (W) : l'énergie consommée par seconde."]},
    {h:"Les formules à connaître",l:["<b>Loi d'Ohm : U = R × I</b>","<b>Puissance : P = U × I</b>","Exemple : un radiateur de 2 300 W en 230 V consomme I = 2 300 ÷ 230 = <b>10 A</b>."]},
    {h:"Série et parallèle",l:["<b>En série</b> : les récepteurs sont à la suite, le même courant les traverse. Si l'un est coupé, tout s'arrête.","<b>En parallèle</b> : chaque récepteur reçoit la même tension. C'est le montage de toutes les prises et lampes d'un logement."]},
    {h:"Le réseau en France",l:["Courant <b>alternatif</b>, fréquence <b>50 Hz</b>.","Monophasé : <b>230 V</b> entre phase et neutre (logements).","Triphasé : <b>400 V</b> entre deux phases (gros équipements, ateliers)."]},
    {h:"L'énergie et la facture",l:["<b>Énergie = Puissance × temps</b> : E (kWh) = P (kW) × t (h).","Le compteur compte des <b>kilowattheures (kWh)</b> : c'est ce que le client paie."]}],
 k:["Tension","Intensité","Résistance","Puissance","Loi d'Ohm","Kilowattheure"]});

C.fiches.bases={
 intro:"Avant de toucher un fil, un électricien doit comprendre ce qui se passe dans un câble. Quatre grandeurs suffisent à tout expliquer : la tension, l'intensité, la résistance et la puissance. Avec elles, tu sauras dimensionner un circuit, choisir une protection et comprendre pourquoi un disjoncteur saute.",
 s:[
  {p:"Le plus simple est d'imaginer l'électricité comme de l'<b>eau dans un tuyau</b>. La <b>tension</b> est la pression de l'eau, l'<b>intensité</b> est le débit, la <b>résistance</b> est un rétrécissement du tuyau qui freine l'eau. La <b>puissance</b>, c'est le travail que l'eau fournit en tournant une roue.",
   fig:{type:"svg",legende:"Le courant (I) circule en boucle : il sort de la source (U), traverse le récepteur (R) et revient.",svg:"<svg viewBox='0 0 240 130'><rect x='30' y='20' width='180' height='90' rx='12' fill='none' stroke='#3a4380' stroke-width='7'/><rect x='30' y='20' width='180' height='90' rx='12' fill='none' stroke='var(--pri)' stroke-width='3' stroke-dasharray='6 10' class='flow'/><rect x='10' y='45' width='40' height='40' rx='8' fill='var(--card)' stroke='var(--pri)' stroke-width='2'/><text x='30' y='70' font-size='14' text-anchor='middle' fill='#fff' font-weight='900'>U</text><circle cx='210' cy='65' r='20' fill='var(--pri)' class='glow'/><text x='210' y='70' font-size='14' text-anchor='middle' fill='#10142a' font-weight='900'>R</text><text x='120' y='13' font-size='11' text-anchor='middle' fill='var(--mut)' font-weight='700'>I → le courant circule</text><text x='120' y='126' font-size='10' text-anchor='middle' fill='var(--mut)'>la lampe consomme une puissance P</text></svg>"},
   ex:"Une prise de ta maison délivre <b>230 V</b>. Si tu branches une bouilloire, il circule environ <b>9 A</b> dans le câble. Si tu branches un chargeur de téléphone, il en circule moins de 0,1 A : même tension, intensité très différente.",
   q:["Le débit d'eau dans un tuyau correspond à…",["L'intensité","La tension","La résistance","La puissance"],0,"L'intensité, c'est la quantité de courant qui passe, comme un débit."]},
  {p:"Deux formules suffisent pour 90 % des calculs du métier. La <b>loi d'Ohm</b> relie tension, résistance et intensité. La <b>formule de la puissance</b> permet de savoir combien d'ampères un appareil va tirer, donc quel câble et quel disjoncteur choisir. En les combinant, on obtient aussi <b>P = R × I²</b> : c'est pour ça qu'une mauvaise connexion (une petite résistance en trop) chauffe autant quand le courant est fort.",
   fig:{type:"flux",legende:"Retrouver l'intensité d'un radiateur avant de choisir le câble",etapes:[["Puissance du radiateur","2 300 W"],["Tension du réseau","230 V"],["I = P ÷ U","2 300 ÷ 230"],["Intensité","10 A"]]},
   att:"Ne confonds pas <b>P = U × I</b> (puissance) et <b>U = R × I</b> (loi d'Ohm). Astuce : on « Pui-se » pour P = U × I, et « URI » se lit d'un trait pour U = R × I.",
   q:["Un four de 3 450 W en 230 V consomme…",["15 A","10 A","20 A","34,5 A"],0,"I = 3 450 ÷ 230 = 15 A."]},
  {p:"Dans une maison, toutes les prises et toutes les lampes sont branchées <b>en parallèle</b> : chacune reçoit les 230 V, et chacune fonctionne même si on débranche les autres. Les courants s'additionnent dans le câble qui les alimente : c'est pour ça qu'un circuit chargé de trop d'appareils finit par faire déclencher son disjoncteur. Le montage <b>en série</b> existe aussi : un interrupteur est toujours en série avec la lampe qu'il commande.",
   fig:{type:"svg",legende:"En parallèle, chaque lampe reçoit 230 V et les courants s'additionnent.",svg:"<svg viewBox='0 0 260 130'><path d='M20 25H240M20 105H240' stroke='#3a4380' stroke-width='6' fill='none'/><path d='M20 25H240M20 105H240' stroke='var(--pri)' stroke-width='2.5' stroke-dasharray='6 8' class='flow' fill='none'/><text x='8' y='29' fill='#fff' font-size='11' font-weight='900'>L</text><text x='8' y='109' fill='#fff' font-size='11' font-weight='900'>N</text><g><path d='M80 25V50M80 80V105M150 25V50M150 80V105M220 25V50M220 80V105' stroke='var(--pri)' stroke-width='2.5'/><circle cx='80' cy='65' r='15' fill='var(--pri)' class='glow'/><circle cx='150' cy='65' r='15' fill='var(--pri)' class='glow'/><circle cx='220' cy='65' r='15' fill='var(--pri)' class='glow'/></g><text x='80' y='69' text-anchor='middle' font-size='10' font-weight='900' fill='#10142a'>230 V</text><text x='150' y='69' text-anchor='middle' font-size='10' font-weight='900' fill='#10142a'>230 V</text><text x='220' y='69' text-anchor='middle' font-size='10' font-weight='900' fill='#10142a'>230 V</text><text x='45' y='18' fill='var(--mut)' font-size='10' font-weight='700'>I total = I1 + I2 + I3</text></svg>"},
   ex:"3 radiateurs de 1 000 W branchés sur le même circuit : chacun tire 1 000 ÷ 230 ≈ 4,3 A, le câble en transporte 13 A au total.",
   q:["Deux lampes en parallèle sur le 230 V : si l'une grille…",["L'autre reste allumée","Les deux s'éteignent","L'autre brille deux fois plus","Le disjoncteur saute"],0,"En parallèle, chaque récepteur est indépendant : il garde ses 230 V."]},
  {p:"En France, le réseau des logements est en <b>monophasé 230 V</b> : une phase et un neutre. Les ateliers et les gros équipements sont souvent en <b>triphasé</b> : trois phases, avec 400 V entre deux phases. Le courant est <b>alternatif</b> : il change de sens 100 fois par seconde, c'est-à-dire 50 aller-retour (<b>50 Hz</b>). Les piles, les batteries et les panneaux solaires, eux, donnent du courant <b>continu</b>.",
   fig:{type:"chiffres",items:[[230,"V","monophasé (logement)"],[400,"V","triphasé, entre 2 phases"],[50,"Hz","fréquence du réseau"]]},
   info:"Aux États-Unis, le réseau domestique est en 120 V et 60 Hz. C'est pour ça qu'un appareil américain a besoin d'un transformateur en France.",
   q:["Le courant d'une pile est…",["Continu","Alternatif","Triphasé","À 50 Hz"],0,"Une pile ou une batterie fournit du courant continu : il circule toujours dans le même sens."]},
  {p:"Le client ne paie pas des watts, il paie de l'<b>énergie</b> : la puissance multipliée par le temps d'utilisation. L'unité de la facture est le <b>kilowattheure (kWh)</b> : 1 000 W pendant 1 heure. Savoir faire ce calcul te permet d'expliquer une facture, de comparer deux appareils ou de conseiller le client (LED, programmation du chauffage…).",
   fig:{type:"flux",legende:"Ce que coûte un radiateur de 1 500 W allumé 8 h (prix d'exemple : 0,25 € le kWh)",etapes:[["Puissance","1 500 W = 1,5 kW"],["Durée","8 h"],["Énergie = 1,5 × 8","12 kWh"],["Coût = 12 × 0,25","3 €"]]},
   info:"Une ampoule LED de 8 W éclaire comme une ancienne ampoule à incandescence de 60 W : pour la même lumière, elle consomme environ 7 fois moins d'énergie.",
   q:["Un appareil de 2 000 W qui fonctionne 3 heures consomme…",["6 kWh","600 kWh","2 kWh","0,6 kWh"],0,"E = 2 kW × 3 h = 6 kWh."]}
 ],
 retenir:["U en volts, I en ampères, R en ohms, P en watts.","<b>U = R × I</b> et <b>P = U × I</b>.","Dans un logement, tout est en parallèle : les courants s'additionnent dans le câble.","Logement : 230 V monophasé, 50 Hz. Triphasé : 400 V entre phases.","Énergie (kWh) = puissance (kW) × temps (h)."]
};

C.lexique.push(

 ["Kilowattheure","Unité d'énergie facturée (kWh) : 1 000 W pendant 1 heure."],

C.quiz.push(
 ["bases","Quelle est l'unité de la tension ?",["Le volt (V)","L'ampère (A)","Le watt (W)","L'ohm (Ω)"],0,"La tension se mesure en volts."],
 ["bases","Un radiateur de 2 300 W en 230 V consomme…",["10 A","23 A","5 A","100 A"],0,"I = P ÷ U = 2 300 ÷ 230 = 10 A."],
 ["bases","La loi d'Ohm s'écrit…",["U = R × I","P = R × I","I = U × R","R = U × I"],0,"U = R × I."],

 ["bases","Quelle est la fréquence du réseau électrique en France ?",["50 Hz","60 Hz","230 Hz","100 Hz"],0,"50 Hz : le courant fait 50 aller-retour par seconde."],
 ["bases","Une résistance de 46 Ω est alimentée en 230 V. Le courant vaut…",["5 A","10 A","0,2 A","276 A"],0,"I = U ÷ R = 230 ÷ 46 = 5 A."],
 ["bases","Ce que le client paie sur sa facture d'électricité, ce sont…",["Des kilowattheures (kWh)","Des kilowatts (kW)","Des ampères","Des volts"],0,"La facture compte l'énergie consommée, en kWh."],
 ["bases","Pourquoi une connexion mal serrée chauffe-t-elle ?",["Elle ajoute une résistance traversée par le courant : P = R × I²","Elle augmente la tension","Elle crée du courant continu","Elle diminue l'intensité"],0,"Une petite résistance parcourue par un fort courant dissipe de la chaleur (P = R × I²)."]
);

C.vf.push(
 ["P = U × I.",true,"Puissance = tension × intensité."],
 ["En France, la fréquence du réseau est de 50 Hz.",true,"230 V – 50 Hz."],
 ["Un interrupteur est branché en parallèle avec la lampe qu'il commande.",false,"Il est en série : il ouvre ou ferme le chemin du courant."],

);

/* NIVEAU 1 — Le danger électrique */
C.modules.push({id:"danger",n:1,i:"☠️",t:"Le danger électrique",d:"Électrisation, effets sur le corps, premiers secours",
 s:[{h:"Électrisation et électrocution",l:["<b>Électrisation</b> : le courant traverse le corps (brûlure, choc, blessure).","<b>Électrocution</b> : électrisation qui entraîne la <b>mort</b>.","Le danger vient du <b>courant</b> qui traverse le corps, poussé par la tension."]},
    {h:"Les effets selon le courant",l:["<b>0,5 mA</b> : seuil de perception (picotement).","<b>10 mA</b> : contraction, on ne peut plus lâcher.","<b>30 mA</b> : paralysie respiratoire.","<b>75 mA</b> : fibrillation du cœur.","<b>1 A</b> : arrêt du cœur."]},
    {h:"Contact direct, contact indirect",l:["<b>Contact direct</b> : on touche une partie normalement sous tension (fil dénudé, borne).","<b>Contact indirect</b> : on touche une masse mise accidentellement sous tension (carcasse d'appareil en défaut).","Autre danger : l'<b>arc électrique</b> (court-circuit) qui brûle et éblouit."]},
    {h:"La tension limite de sécurité",l:["<b>50 V</b> en local sec, <b>25 V</b> en local mouillé, <b>12 V</b> corps immergé (en alternatif).","Au-delà, il faut une protection contre les contacts."]},
    {h:"Porter secours",l:["<b>Ne jamais toucher</b> la victime tant qu'elle est en contact.","<b>Couper le courant</b> (protéger).","<b>Alerter</b> : 15 (SAMU), 18 (pompiers) ou 112.","<b>Secourir</b> : PLS si elle respire, massage cardiaque + défibrillateur sinon."]}],
 k:["Électrisation","Électrocution","Contact direct","Contact indirect","Tension limite de sécurité"]});

C.fiches.danger={
 intro:"Ce n'est pas la tension qui tue directement, c'est le courant qui traverse le corps. Et il en faut très peu : quelques dizaines de milliampères, soit 1 000 fois moins que ce que consomme un radiateur. Comprendre comment on se fait électriser, c'est comprendre pourquoi chaque règle de sécurité existe.",
 s:[
  {p:"Le corps humain conduit le courant, comme un fil… mais mal. Sa résistance varie selon l'état de la peau : environ <b>1 000 à 2 000 Ω</b> peau sèche, beaucoup moins peau mouillée. Avec la loi d'Ohm, on comprend vite le danger : 230 V ÷ 1 000 Ω = <b>230 mA</b>. C'est mortel.",
   fig:{type:"flux",legende:"Une main sur une phase, les pieds au sol : le courant traverse le cœur.",etapes:[["Tension touchée","230 V"],["Résistance du corps (peau sèche)","≈ 1 000 Ω"],["I = U ÷ R","230 ÷ 1 000"],["Courant dans le corps","230 mA → mortel"]]},
   att:"Peau mouillée, pieds nus, sol humide : la résistance du corps s'effondre et le courant augmente. C'est pourquoi la salle de bain a des règles spéciales.",
   q:["Qu'est-ce qui rend le contact électrique dangereux ?",["Le courant qui traverse le corps","La couleur du fil","La longueur du câble","Le bruit du tableau"],0,"C'est le courant (en mA) qui traverse le corps qui provoque les lésions. La tension est ce qui le pousse."]},
  {p:"Les seuils ci-dessous sont des ordres de grandeur (norme CEI 60479) : les effets dépendent de l'<b>intensité</b>, de la <b>durée</b> et du <b>trajet</b> du courant dans le corps. Un trajet main-main ou main-pieds passe par le cœur : c'est le plus dangereux. Plus le contact dure, plus le risque de fibrillation augmente. C'est pour ça que le différentiel 30 mA coupe en quelques dizaines de millisecondes.",
   fig:{type:"barres",legende:"Seuils d'effet du courant alternatif sur le corps (ordres de grandeur)",items:[["Perception (picotement)",0.5,"mA","#2ed47a"],["Non-lâcher (contraction)",10,"mA","#ffc83d"],["Paralysie respiratoire",30,"mA","#ff8a3d"],["Fibrillation du cœur",75,"mA","#ff5470"]]},
   info:"Le seuil de 30 mA n'est pas choisi au hasard : c'est la sensibilité des différentiels qui protègent les personnes. Ils coupent avant que la respiration ne soit bloquée.",
   q:["À partir de quel courant ne peut-on plus lâcher un conducteur ?",["Environ 10 mA","Environ 0,5 mA","Environ 1 A","Environ 10 A"],0,"Vers 10 mA, les muscles se contractent : la main se referme sur le conducteur."]},
  {p:"On distingue deux façons d'être électrisé. Le <b>contact direct</b>, c'est toucher une pièce faite pour être sous tension : un fil dénudé, une borne de tableau. On s'en protège par l'isolation, les capots, l'éloignement. Le <b>contact indirect</b>, c'est toucher une <b>masse</b> (la carcasse métallique d'un appareil) qui est passée sous tension à cause d'un défaut. On s'en protège par la <b>terre</b> associée au <b>différentiel</b>.",
   fig:{type:"cycle",centre:"Deux types de contact",etapes:[["Contact direct<br>borne, fil dénudé","#ff5470"],["Protection : isolation, capots, consignation","#ffc83d"],["Contact indirect<br>carcasse en défaut","#ff8a3d"],["Protection : terre + différentiel 30 mA","#2ed47a"]]},
   ex:"Un fil de phase abîmé touche l'intérieur métallique d'un lave-linge. Grâce au fil de terre, le courant de défaut part à la terre et le différentiel coupe. Sans terre, la carcasse reste sous tension… jusqu'à ce que quelqu'un la touche.",
   q:["Toucher la carcasse d'un frigo en défaut, c'est un…",["Contact indirect","Contact direct","Court-circuit","Arc électrique"],0,"La carcasse n'est pas faite pour être sous tension : c'est un contact indirect."]},
  {p:"La <b>tension limite conventionnelle de sécurité (UL)</b> est la tension qu'on peut toucher sans danger dans des conditions données : <b>50 V</b> en alternatif dans un local sec, <b>25 V</b> dans un local mouillé, et <b>12 V</b> si le corps est immergé. Au-delà, il faut une protection.",

  {p:"La désignation est un code. Pour les fils harmonisés européens : <b>H07V-U</b>. H = norme harmonisée ; 07 = tension 450/750 V ; V = isolant en PVC ; la lettre après le tiret donne l'âme : <b>U</b> rigide un brin, <b>R</b> rigide câblée, <b>K</b> souple pour pose fixe, <b>F</b> souple pour usage mobile. Pour les câbles français : <b>U1000R2V</b> = câble pour 1 000 V, isolant en polyéthylène réticulé, gaine épaisse en PVC. On l'utilise en apparent, sur chemin de câbles ou enterré sous fourreau.",

  {p:"Le conduit protège les fils et permet de les remplacer plus tard. L'<b>ICTA</b> (annelé, souvent gris) se pose dans les cloisons et peut être <b>noyé dans le béton</b>. L'<b>IRL</b> (rigide lisse) se pose en <b>apparent</b>, avec des colliers. En rénovation, on utilise des <b>moulures</b> et des <b>goulottes</b>. Règle de remplissage : la somme des sections des fils (isolant compris) ne doit pas dépasser environ <b>1/3</b> de la section intérieure du conduit, sinon on ne peut plus tirer ni remplacer les fils.",

C.fiches.protec={
 intro:"Un tableau électrique, c'est le poste de garde de la maison. Chaque appareil qu'il contient a un rôle précis : protéger les câbles contre l'incendie, ou protéger les personnes contre l'électrocution. Savoir qui protège quoi, c'est la base du métier et la clé du dépannage.",
 s:[
  {p:"Retiens la différence en une phrase : le <b>disjoncteur protège les câbles</b>, le <b>différentiel protège les personnes</b>. Le disjoncteur coupe quand le courant est trop fort. Le différentiel compare le courant qui part par la phase et celui qui revient par le neutre : s'il manque <b>30 mA</b>, c'est qu'ils s'échappent ailleurs (peut-être à travers quelqu'un), et il coupe. Essaie ci-dessous.",
   fig:{type:"inter",legende:"Le différentiel compare l'aller et le retour.",inters:[["a","🧺 Mettre l'appareil en marche"],["p","🧍 Une personne touche la phase"]],
    svg:"<svg viewBox='0 0 300 178'><path class='w' data-k='amont' d='M18 40H58M18 130H58'/><text x='6' y='44' fill='#fff' font-size='11' font-weight='900'>L</text><text x='6' y='134' fill='#fff' font-size='11' font-weight='900'>N</text><rect x='58' y='22' width='62' height='126' rx='10' fill='var(--card)' stroke='var(--pri)' stroke-width='2'/><text x='89' y='44' text-anchor='middle' fill='#fff' font-size='11' font-weight='900'>DIFF.</text><text x='89' y='58' text-anchor='middle' fill='#fff' font-size='11' font-weight='900'>30 mA</text><circle cx='89' cy='90' r='15' fill='none' stroke='var(--mut)' stroke-width='5'/><text data-v='p:0' x='89' y='136' fill='var(--ok)' font-size='10' font-weight='900' text-anchor='middle'>FERMÉ</text><text data-v='p:1' x='89' y='136' fill='var(--ko)' font-size='9' font-weight='900' text-anchor='middle'>DÉCLENCHÉ</text><path class='w' data-k='l' d='M120 40H232'/><path class='w' data-k='n' d='M120 130H232'/><rect x='232' y='26' width='58' height='118' rx='10' fill='var(--card)' stroke='#fff' stroke-width='2'/><circle class='lp' data-k='lp' cx='261' cy='68' r='13'/><text x='261' y='120' font-size='22' text-anchor='middle'>🧺</text><g data-v='p:1'><path class='w ko' d='M176 40V64M176 112V158'/><text x='176' y='104' font-size='34' text-anchor='middle'>🧍</text><path d='M162 160H190M167 166H185M172 172H180' stroke='#fff' stroke-width='2'/></g></svg>",
    f:s=>s.p?["amont"]:s.a?["amont","l","n","lp"]:["amont"],
    msg:s=>s.p?"⚡ Une partie du courant s'échappe par la personne vers la terre : aller ≠ retour. Le différentiel le détecte et coupe tout en quelques dizaines de millisecondes.":s.a?"✅ 10 A partent par la phase, 10 A reviennent par le neutre : aller = retour, le différentiel ne bouge pas.":"Appareil à l'arrêt : aucun courant ne circule."},
   ex:"Tu branches un radiateur, un four et un lave-linge sur la même ligne : le <b>disjoncteur</b> saute (surcharge). Un sèche-cheveux tombe dans le lavabo : le <b>différentiel</b> coupe.",
   q:["Une personne touche un fil sous tension. Qui coupe ?",["Le différentiel 30 mA","Le disjoncteur divisionnaire","Le télérupteur","Personne"],0,"Le courant passe dans la personne vers la terre : c'est une fuite, le différentiel la détecte."]},
  {p:"Un disjoncteur a deux mécanismes. La partie <b>thermique</b> (un bilame qui chauffe) laisse passer une petite surcharge quelque temps, puis coupe : c'est la protection contre la <b>surcharge</b>. La partie <b>magnétique</b> (une bobine) réagit en quelques millisecondes à un courant énorme : c'est la protection contre le <b>court-circuit</b>. La <b>courbe</b> indique à partir de combien de fois le calibre le magnétique déclenche.",
   fig:{type:"barres",legende:"Seuil de déclenchement magnétique selon la courbe (en multiples du calibre In)",items:[["Courbe B (câbles longs, générateurs)",5,"× In","#3db5ff"],["Courbe C (usage courant, logement)",10,"× In","#ffc83d"],["Courbe D (moteurs, transformateurs)",20,"× In","#ff8a3d"]]},
   info:"Le <b>pouvoir de coupure</b> (3 000 A, 4 500 A, 6 000 A…) est le plus fort courant de court-circuit que le disjoncteur sait couper sans exploser. En logement, 3 kA minimum, souvent 4,5 ou 6 kA.",
   q:["Un disjoncteur qui déclenche instantanément avec un claquement, c'est le plus souvent…",["Un court-circuit (magnétique)","Une surcharge (thermique)","Une fuite à la terre","Une coupure réseau"],0,"Le magnétique réagit en quelques millisecondes à un courant très fort."]},
  {p:"Le différentiel existe en plusieurs <b>types</b>. Le <b>type AC</b> détecte les fuites de courant alternatif. Le <b>type A</b> détecte en plus les fuites avec une composante continue, produites par l'électronique (plaques à induction, lave-linge à variateur, bornes de recharge). Le type A (ou F) est obligatoire pour la plaque de cuisson et le lave-linge, et la borne de recharge demande au moins un type A ; le type AC reste admis pour les usages généraux (éclairage, prises).",
   fig:{type:"cycle",centre:"Quel type de différentiel ?",etapes:[["Type AC<br>éclairage, prises","#3db5ff"],["Type A<br>plaque, lave-linge","#ffc83d"],["Type F / B<br>certaines bornes, variateurs","#ff8a3d"]]},
   att:"Remplacer un différentiel 30 mA par un 300 mA « parce qu'il saute tout le temps », c'est supprimer la protection des personnes. Un différentiel qui déclenche signale un défaut : on le cherche.",
   info:"Dans un logement : au moins <b>2 interrupteurs différentiels 30 mA</b>, dont au moins <b>1 de type A</b>, avec <b>8 circuits maximum</b> par différentiel.",
   q:["Quel type de différentiel pour le circuit de la plaque de cuisson ?",["Type A","Type AC","Aucun","300 mA"],0,"Les plaques (électronique) peuvent produire des fuites avec composante continue : type A."]},
  {p:"La NF C 15-100 fixe la section des fils et le calibre du disjoncteur pour chaque type de circuit. Le principe : le disjoncteur doit couper <b>avant</b> que le fil chauffe. Un fil de 1,5 mm² ne se protège jamais au-delà de 16 A, un 2,5 mm² jamais au-delà de 20 A (en logement, pose courante).",
   fig:{type:"barres",legende:"Calibre du disjoncteur selon le circuit",items:[["Éclairage — 1,5 mm²",16,"A"],["Prises — 2,5 mm²",20,"A"],["Lave-linge, four, chauffe-eau — 2,5 mm²",20,"A"],["Plaque de cuisson — 6 mm²",32,"A"]]},
   att:"Ne jamais mettre un disjoncteur plus gros que prévu « pour qu'il arrête de sauter » : le câble chaufferait sans être protégé. C'est une cause classique d'incendie.",
   info:"Nombre de prises par circuit : <b>8 maximum en 1,5 mm² / 16 A</b>, <b>12 maximum en 2,5 mm² / 20 A</b> (une prise double compte pour 2). Un circuit d'éclairage alimente au plus <b>8 points lumineux</b>, et un logement a au moins 2 circuits d'éclairage.",
   q:["Un circuit de prises en 2,5 mm² se protège en…",["20 A","32 A","10 A","40 A"],0,"2,5 mm² → 20 A."]},
  {p:"Le <b>fusible</b> est la protection la plus ancienne : un fil calibré qui fond quand le courant est trop fort. On en trouve encore dans les tableaux anciens et dans l'industrie. <b>gG</b> = usage général ; <b>aM</b> = accompagnement moteur (il supporte la pointe de démarrage, et laisse la surcharge au relais thermique). Le <b>parafoudre</b>, lui, protège contre les surtensions dues à la foudre : il écoule la surtension vers la terre.",
   att:"Remplacer un fusible fondu par un fusible plus gros, ou par un morceau de fil, supprime la protection du câble. Toujours le même calibre et le même type.",

 ],

 s:[{h:"De la rue au tableau",l:["Réseau public → <b>compteur</b> (Linky) → <b>disjoncteur de branchement</b> → <b>tableau de répartition</b>.","Le disjoncteur de branchement est <b>différentiel 500 mA</b> et réglé selon l'<b>abonnement</b>.","Il sert d'<b>appareil général de commande</b> : il coupe tout le logement."]},
    {h:"La GTL",l:["<b>Gaine Technique Logement</b> : emplacement qui regroupe tableau électrique, tableau de communication et arrivées.","Obligatoire en logement neuf, sur <b>toute la hauteur</b> du mur.","Le tableau doit rester <b>accessible</b> (pas derrière un meuble fixe)."]},
    {h:"Organiser le tableau",l:["Une rangée commence par un <b>interrupteur différentiel</b>, suivi des disjoncteurs qu'il protège.","Les circuits sont <b>répartis</b> sur plusieurs différentiels : une panne ne plonge pas tout le logement dans le noir.","Prévoir une <b>réserve</b> d'emplacements libres (environ 20 %)."]},
    {h:"Raccorder proprement",l:["<b>Peignes</b> d'alimentation entre différentiel et disjoncteurs.","Serrage au <b>couple</b> indiqué, fils sans cuivre apparent hors borne.","<b>Repérage</b> de chaque circuit, schéma remis au client."]}],
 k:["Disjoncteur de branchement","GTL","TGBT","Peigne","Tableau de répartition"]});

C.fiches.tableau={
 intro:"Le tableau est le cœur de l'installation : tout part de là. Un tableau bien pensé rend l'installation sûre, facile à dépanner et évolutive. Un tableau mal organisé, c'est un logement entier dans le noir pour un simple défaut sur une prise, ou un dépanneur qui cherche une heure le bon disjoncteur.",
 s:[
  {p:"Le courant arrive du réseau public, passe par le <b>compteur</b>, puis par le <b>disjoncteur de branchement</b> (qui appartient au réseau, posé et plombé par le distributeur). Ce disjoncteur a deux rôles : il limite la puissance à celle de l'<b>abonnement</b> et il assure une protection <b>différentielle 500 mA</b> de toute l'installation. Ensuite vient le <b>tableau de répartition</b>, qui est sous ta responsabilité.",
   fig:{type:"flux",legende:"Le chemin du courant jusqu'au circuit",etapes:["Réseau public (distributeur)","Compteur (Linky)",["Disjoncteur de branchement","500 mA, réglé selon l'abonnement"],["Interrupteur différentiel","30 mA"],["Disjoncteur divisionnaire","16 A, 20 A, 32 A…"],"Le circuit (prises, éclairage…)"]},
   ex:"Abonnement 6 kVA en monophasé : le disjoncteur de branchement est réglé à 30 A (6 000 VA ÷ 230 V ≈ 26 A). 9 kVA : 45 A. 12 kVA : 60 A.",
   att:"L'électricien ne modifie pas le réglage du disjoncteur de branchement : il est plombé par le distributeur. Pour plus de puissance, le client change d'abonnement.",
   q:["Pour un abonnement de 9 kVA en monophasé, le disjoncteur de branchement est réglé à…",["45 A","30 A","60 A","9 A"],0,"9 000 ÷ 230 ≈ 39 A : on règle sur le calibre standard de 45 A."]},
  {p:"En logement neuf, la <b>GTL</b> (gaine technique logement) est obligatoire. C'est un emplacement réservé, souvent près de l'entrée, qui va du sol au plafond et regroupe le tableau électrique, le tableau de communication (box, prises RJ45) et les arrivées des réseaux. Elle doit être accessible : jamais dans un placard fermé à clé, jamais derrière un meuble fixe.",
   fig:{type:"svg",legende:"La GTL regroupe toutes les arrivées sur toute la hauteur",svg:"<svg viewBox='0 0 200 170'><rect x='60' y='5' width='80' height='160' rx='6' fill='var(--card)' stroke='var(--pri)' stroke-width='2' stroke-dasharray='5 4'/><rect x='68' y='18' width='64' height='60' rx='5' fill='#2a3266' stroke='#fff' stroke-width='1.5' class='pop'/><text x='100' y='52' text-anchor='middle' font-size='10' font-weight='800' fill='#fff'>Tableau ⚡</text><rect x='68' y='88' width='64' height='36' rx='5' fill='#2a3266' stroke='#3db5ff' stroke-width='1.5' class='pop' style='animation-delay:.3s'/><text x='100' y='110' text-anchor='middle' font-size='9' font-weight='800' fill='#3db5ff'>Communication</text><path d='M100 165V140' stroke='var(--pri)' stroke-width='3' class='flow' stroke-dasharray='4 4'/><text x='150' y='160' font-size='9' fill='var(--mut)' font-weight='700'>arrivées</text><text x='150' y='20' font-size='9' fill='var(--mut)' font-weight='700'>plafond</text></svg>"},
   info:"La norme demande aussi que les organes de commande du tableau soient à une hauteur accessible (entre <b>0,90 m et 1,80 m</b> du sol, ou à partir de 0,50 m pour un coffret avec porte). Dans les logements accessibles aux personnes handicapées : entre <b>0,75 m et 1,30 m</b>.",
   q:["Que contient la GTL ?",["Le tableau électrique, le tableau de communication et les arrivées","Le chauffe-eau","Les compteurs d'eau et de gaz","Seulement la box internet"],0,"Elle regroupe les équipements électriques et de communication du logement."]},
  {p:"Dans le tableau, on organise par <b>rangées</b> : un <b>interrupteur différentiel</b> en tête, puis les disjoncteurs des circuits qu'il protège. On <b>répartit</b> les circuits intelligemment : l'éclairage d'une pièce et ses prises sur deux différentiels différents, pour qu'un défaut ne laisse pas la pièce dans le noir. Les circuits qui demandent un <b>type A</b> (plaque, lave-linge) vont sur le différentiel de type A. On garde une <b>réserve</b> d'environ 20 % pour les ajouts futurs.",
   fig:{type:"svg",legende:"Une rangée : le différentiel alimente ses disjoncteurs par un peigne",svg:"<svg viewBox='0 0 300 120'><rect x='5' y='5' width='290' height='110' rx='8' fill='var(--card)'/><g class='pop'><rect x='15' y='25' width='50' height='70' rx='4' fill='#e8e8ef'/><text x='40' y='55' text-anchor='middle' font-size='9' font-weight='900' fill='#10142a'>ID 40 A</text><text x='40' y='68' text-anchor='middle' font-size='9' font-weight='900' fill='#10142a'>30 mA</text></g><g fill='#e8e8ef'><rect x='75' y='25' width='24' height='70' rx='3'/><rect x='103' y='25' width='24' height='70' rx='3'/><rect x='131' y='25' width='24' height='70' rx='3'/><rect x='159' y='25' width='24' height='70' rx='3'/><rect x='187' y='25' width='24' height='70' rx='3'/></g><g font-size='9' font-weight='900' fill='#10142a' text-anchor='middle'><text x='87' y='63'>16</text><text x='115' y='63'>16</text><text x='143' y='63'>20</text><text x='171' y='63'>20</text><text x='199' y='63'>2</text></g><path d='M40 20H200' stroke='var(--pri)' stroke-width='4' class='draw'/><path d='M87 20V25M115 20V25M143 20V25M171 20V25M199 20V25' stroke='var(--pri)' stroke-width='3'/><rect x='219' y='25' width='66' height='70' rx='3' fill='none' stroke='var(--mut)' stroke-dasharray='4 3'/><text x='252' y='63' text-anchor='middle' font-size='9' font-weight='800' fill='var(--mut)'>réserve</text></svg>"},
   ex:"Rangée 1 (différentiel type AC) : éclairage séjour, prises chambres, volets. Rangée 2 (différentiel type A) : plaque de cuisson, lave-linge. Rangée 3 (type AC) : éclairage chambres, prises séjour, chauffe-eau.",
   q:["Pourquoi répartir les circuits sur plusieurs différentiels ?",["Pour qu'un défaut ne coupe pas tout le logement","Pour faire des économies","Pour augmenter la puissance","C'est interdit"],0,"Si un différentiel déclenche, seuls ses circuits sont coupés."]},
  {p:"Un tableau propre se reconnaît au premier coup d'œil : <b>peignes</b> d'alimentation (plus sûrs et plus rapides que des fils de pontage), fils coupés à la bonne longueur et rangés, <b>aucun cuivre visible</b> hors des bornes, serrage au <b>couple</b> indiqué par le fabricant, et un <b>repérage</b> clair de chaque circuit. Le schéma unifilaire est rangé dans la porte du tableau ou remis au client.",
   att:"Un fil mal serré dans un tableau chauffe à chaque utilisation, jusqu'à brûler la borne. Après le raccordement, on tire sur chaque fil pour vérifier qu'il est bien tenu.",
   info:"Le TGBT (tableau général basse tension) est l'équivalent du tableau principal dans un immeuble, un commerce ou une usine.",
   q:["Que doit-on faire après avoir serré un fil dans un disjoncteur ?",["Tirer dessus pour vérifier qu'il est bien tenu","Le plier","Mettre du ruban adhésif","Rien"],0,"Le test de traction détecte un fil mal serré avant qu'il ne chauffe."]}
 ],
 retenir:["Compteur → disjoncteur de branchement (500 mA, abonnement) → tableau.","GTL obligatoire en neuf : tableau + communication, accessible.","Rangées : différentiel en tête + ses disjoncteurs ; circuits répartis ; 20 % de réserve.","Peignes, serrage au couple, test de traction, repérage, schéma remis."]
};

/* NIVEAU 2 — La NF C 15-100 pièce par pièce */
C.modules.push({id:"nfc",n:2,i:"🏠",t:"La NF C 15-100 pièce par pièce",d:"Prises, éclairage et circuits obligatoires dans un logement",
 s:[{h:"Les grands principes",l:["La <b>NF C 15-100</b> fixe les règles des installations électriques basse tension, notamment dans les logements.","Objectifs : <b>sécurité</b>, <b>confort</b> (assez de prises) et <b>évolutivité</b> (réserve, GTL).","Les gros appareils ont chacun leur <b>circuit spécialisé</b>."]},
    {h:"Séjour et chambres",l:["Séjour : au moins <b>1 prise par tranche de 4 m²</b>, avec un <b>minimum de 5</b> ; au-delà de 28 m², <b>7 prises</b> minimum.","Chambre : au moins <b>3 prises</b>.","Chaque pièce : au moins <b>1 point d'éclairage</b> commandé, raccordé sur un <b>DCL</b>."]},
    {h:"La cuisine",l:["Au moins <b>6 prises</b>, dont <b>4 au-dessus du plan de travail</b>.","Circuits spécialisés : <b>plaque de cuisson</b> (32 A), <b>four</b>, <b>lave-vaisselle</b> (20 A).","Pas de prise juste au-dessus de l'évier ni de la plaque."]},
    {h:"Les autres pièces",l:["Entrée, couloir : au moins 1 prise et 1 point lumineux.","Salle de bain : règles des <b>volumes</b> (module dédié).","Extérieur : matériel à l'<b>indice IP</b> adapté.","<b>Détecteur de fumée (DAAF)</b> obligatoire dans tout logement."]},
    {h:"Hauteurs et emplacements",l:["Prise 16 A ou 20 A : axe à <b>5 cm minimum</b> du sol fini ; prise 32 A : <b>12 cm</b>.","Interrupteur à l'<b>entrée</b> de chaque pièce, côté ouverture de la porte.","Interrupteurs et commandes entre <b>0,90 m et 1,30 m</b> du sol."]}],
 k:["NF C 15-100","DCL","Circuit spécialisé","DAAF"]});

C.fiches.nfc={
 intro:"La NF C 15-100 est la norme que tout électricien du bâtiment doit connaître. Elle ne se limite pas à la sécurité : elle impose aussi un minimum de confort, pour qu'on n'ait pas besoin de multiprises partout. Ce module donne les règles les plus utiles, pièce par pièce. ⚠️ La norme a connu plusieurs éditions (la plus récente a été publiée en août 2024 et s'applique aux projets neufs depuis le 1er septembre 2025) : les valeurs ci-dessous sont les règles courantes, vérifie toujours l'édition qui s'applique à ton chantier.",
 s:[
  {p:"La norme répond à trois objectifs. <b>Sécurité</b> : protéger les personnes et les biens (différentiels, sections, terre). <b>Confort</b> : assez de prises et de points lumineux, bien placés. <b>Évolutivité</b> : une GTL, un tableau avec de la réserve, des conduits pour pouvoir modifier l'installation. Les appareils puissants ont chacun un <b>circuit spécialisé</b> : ils ne partagent pas leur câble avec d'autres appareils.",
   fig:{type:"cycle",centre:"NF C 15-100",etapes:[["Sécurité","#ff5470"],["Confort","#ffc83d"],["Évolutivité","#2ed47a"]]},
   ex:"Circuits spécialisés courants : plaque de cuisson, four, lave-linge, lave-vaisselle, sèche-linge, chauffe-eau, congélateur (conseillé), chauffage, borne de recharge.",
   q:["Pourquoi un lave-linge a-t-il son propre circuit ?",["Il consomme beaucoup : il ne doit pas partager son câble","Pour faire joli","Parce qu'il est bleu","Ce n'est pas obligatoire"],0,"Un appareil puissant seul sur son circuit évite les surcharges."]},
  {p:"Dans le <b>séjour</b>, on compte une prise par tranche de 4 m², avec un minimum de 5 ; au-delà de 28 m², la norme demande 7 prises minimum, réparties sur le pourtour : un séjour de 24 m² demande 6 prises, un séjour de 40 m² en demande 7. Dans chaque <b>chambre</b>, au moins 3 prises. Chaque pièce a au moins un <b>point d'éclairage</b> au plafond ou en applique, commandé par un interrupteur, et raccordé sur un <b>DCL</b> (dispositif de connexion pour luminaire) : le client branche son luminaire sans toucher aux fils.",
   fig:{type:"flux",legende:"Nombre de prises d'un séjour de 22 m²",etapes:[["Surface","22 m² (moins de 28 m²)"],["÷ 4 m² par prise","5,5"],["Arrondi au-dessus","6"],["Au moins 5 → OK","6 prises"]]},
   info:"Les pièces principales (séjour, chambres) ont aussi au moins une prise de communication RJ45, câblée vers le tableau de communication.",
   q:["Combien de prises au minimum dans un séjour de 20 m² ?",["5","4","3","10"],0,"20 ÷ 4 = 5 prises, et le minimum est de 5."]},
  {p:"La <b>cuisine</b> est la pièce la plus équipée. Au moins <b>6 prises</b>, dont <b>4 au-dessus du plan de travail</b> (3 prises suffisent dans une cuisine de 4 m² ou moins), sur un circuit <b>2,5 mm² / 20 A</b>. Les gros appareils ont leur circuit spécialisé : plaque de cuisson en <b>6 mm² / 32 A</b> (monophasé) sur un différentiel de type A, four et lave-vaisselle en <b>2,5 mm² / 20 A</b>. On évite les prises juste au-dessus de l'évier et de la plaque (eau, chaleur).",
   fig:{type:"barres",legende:"Les circuits d'une cuisine",items:[["Plaque de cuisson",32,"A"],["Four",20,"A"],["Lave-vaisselle",20,"A"],["Prises du plan de travail",20,"A"],["Éclairage",16,"A"]]},
   ex:"Une cuisine équipée typique : 1 sortie de câble 32 A pour la plaque, 2 prises spécialisées (four, lave-vaisselle), 4 prises au-dessus du plan de travail, 2 autres prises, 1 point lumineux au plafond + 1 éclairage sous meubles.",
   q:["Combien de prises au-dessus du plan de travail de la cuisine, au minimum ?",["4","1","2","6"],0,"4 prises au-dessus du plan de travail, 6 au total dans la cuisine."]},
  {p:"Dans l'<b>entrée</b> et les <b>couloirs</b>, au moins une prise (pour l'aspirateur) et un point lumineux, souvent commandé en va-et-vient ou par télérupteur. La <b>salle de bain</b> a ses propres règles (les volumes) : on les voit dans le module suivant. À l'<b>extérieur</b>, le matériel doit avoir un indice de protection adapté à la pluie. Enfin, tout logement doit avoir au moins un <b>détecteur de fumée (DAAF)</b>, de préférence dans le dégagement qui dessert les chambres.",
   att:"Le DAAF se fixe au plafond, loin de la cuisine et de la salle de bain (vapeur = fausses alarmes). Il ne se place pas dans un angle, où la fumée arrive mal.",
   q:["Où placer le détecteur de fumée ?",["Au plafond du dégagement qui dessert les chambres","Dans la cuisine, au-dessus de la plaque","Dans la salle de bain","Au sol"],0,"Au plafond, près des chambres, loin des vapeurs."]},
  {p:"Les hauteurs comptent. Une prise 16 A ou 20 A a son <b>axe à 5 cm minimum</b> du sol fini (12 cm pour une prise 32 A), pour éviter l'eau du ménage et les chocs. L'interrupteur se place à l'<b>entrée</b> de la pièce, du côté de la poignée de la porte, pour qu'on allume en entrant. Les interrupteurs et les commandes se placent entre <b>0,90 m et 1,30 m</b> du sol.",
   fig:{type:"barres",legende:"Hauteurs à retenir (depuis le sol fini)",items:[["Axe d'une prise 16 A (minimum)",5,"cm","#3db5ff"],["Axe d'une prise 32 A (minimum)",12,"cm","#3db5ff"],["Interrupteurs, commandes (bas)",90,"cm","#ffc83d"],["Interrupteurs, commandes (haut)",130,"cm","#ffc83d"]]},
   q:["L'axe d'une prise 16 A doit être au minimum à…",["5 cm du sol fini","30 cm du sol","1 m du sol","0 cm"],0,"5 cm minimum pour une prise jusqu'à 20 A, 12 cm pour une 32 A."]}
 ],
 retenir:["Circuits spécialisés pour les gros appareils.","Séjour : 1 prise par 4 m², minimum 5 (7 au-delà de 28 m²). Chambre : 3. Cuisine : 6 dont 4 au-dessus du plan de travail.","Chaque pièce : 1 point lumineux sur DCL. DAAF obligatoire.","Prise : axe à 5 cm mini (12 cm en 32 A). Commandes entre 0,90 et 1,30 m.","Vérifier l'édition de la norme applicable au chantier."]
};

C.fiches.sdb={
 intro:"La salle de bain est la pièce la plus dangereuse de la maison sur le plan électrique : on y est mouillé, pieds nus, en contact avec des canalisations métalliques. La NF C 15-100 la découpe en « volumes » autour de la baignoire et de la douche, avec des règles de plus en plus strictes à mesure qu'on s'approche de l'eau.",
 s:[
  {p:"Dans l'eau, la résistance du corps est très faible : une tension qu'on supporterait les mains sèches devient dangereuse. La tension limite de sécurité tombe à <b>12 V</b> quand le corps est immergé. C'est pour ça que seuls des appareils en <b>très basse tension de sécurité (TBTS)</b> sont admis tout près de l'eau, et que <b>tous</b> les circuits de la pièce sont protégés par un différentiel <b>30 mA</b>.",
   q:["Quelle protection pour tous les circuits de la salle de bain ?",["Un différentiel 30 mA","Un fusible 10 A","Un parafoudre","Rien de spécial"],0,"Tous les circuits de la salle d'eau sont protégés par un 30 mA."]},
  {p:"Les volumes se mesurent à partir de la baignoire ou de la douche. <b>Volume 0</b> : l'intérieur de la baignoire ou du receveur (sans receveur : les 10 premiers centimètres au-dessus du sol). <b>Volume 1</b> : au-dessus du volume 0, jusqu'à 2,25 m du sol. <b>Volume 2</b> : une bande de 0,60 m autour du volume 1. Au-delà, on est <b>hors volume</b>. Une douche à l'italienne (sans receveur) a un volume 1 plus large : un cylindre de 1,20 m de rayon autour de l'arrivée d'eau, réduit si une paroi fixe protège.",
   fig:{type:"svg",legende:"Vue de côté : les volumes autour d'une baignoire",svg:"<svg viewBox='0 0 300 175'><path d='M10 160H290' stroke='#fff' stroke-width='2'/><rect x='30' y='42' width='110' height='78' fill='#3db5ff' opacity='.25' class='appear'/><rect x='140' y='42' width='40' height='118' fill='#ffc83d' opacity='.25' class='appear' style='animation-delay:.3s'/><rect x='30' y='120' width='110' height='40' rx='6' fill='#2e7dd1' opacity='.6' class='pop'/><rect x='30' y='120' width='110' height='40' rx='6' fill='none' stroke='#fff' stroke-width='2'/><text x='85' y='145' text-anchor='middle' font-size='11' font-weight='900' fill='#fff'>Volume 0</text><text x='85' y='85' text-anchor='middle' font-size='11' font-weight='900' fill='#fff'>Volume 1</text><text x='160' y='100' text-anchor='middle' font-size='10' font-weight='900' fill='#fff' transform='rotate(-90 160 100)'>Volume 2</text><text x='235' y='100' text-anchor='middle' font-size='11' font-weight='900' fill='var(--ok)'>Hors volume</text><path d='M20 42V160' stroke='var(--mut)' stroke-width='1.5'/><text x='16' y='100' text-anchor='middle' font-size='9' font-weight='700' fill='var(--mut)' transform='rotate(-90 16 100)'>2,25 m</text><path d='M140 34H180' stroke='var(--mut)' stroke-width='1.5'/><text x='160' y='28' text-anchor='middle' font-size='9' font-weight='700' fill='var(--mut)'>0,60 m</text></svg>"},
   q:["Le volume 2 s'étend sur quelle largeur autour du volume 1 ?",["0,60 m","1 m","2,25 m","0,10 m"],0,"Une bande de 0,60 m autour du volume 1."]},
  {p:"Plus on s'approche de l'eau, moins on a le droit d'installer de choses. Dans le volume 0, seulement du matériel prévu pour être immergé et alimenté en 12 V maximum. Dans les volumes 1 et 2, on peut ajouter, sous conditions, le chauffe-eau, des luminaires et un sèche-serviettes de <b>classe II</b> (double isolation). Les <b>prises de courant 2P+T</b> et les interrupteurs ordinaires sont <b>hors volume</b> ; seule la <b>prise rasoir</b> (avec transformateur de séparation intégré, de 20 à 50 VA) est admise dans le volume 2.",
   fig:{type:"cycle",centre:"Où va quoi ?",etapes:[["Volume 0<br>TBTS 12 V seulement","#3db5ff"],["Volume 1<br>TBTS, chauffe-eau sous conditions","#7be0d0"],["Volume 2<br>classe II, prise rasoir","#ffc83d"],["Hors volume<br>prises, interrupteurs","#2ed47a"]]},
   att:"Un sèche-cheveux branché sur une prise trop proche de la baignoire est un accident classique. On respecte les volumes même si le client insiste.",
   q:["Une prise 2P+T 16 A dans une salle de bain se place…",["Hors volume","Dans le volume 1","Dans le volume 0","Dans le volume 2"],0,"Les prises 2P+T sont interdites dans les volumes 0, 1 et 2."]},
  {p:"La <b>liaison équipotentielle supplémentaire (LES)</b> relie à la terre toutes les parties métalliques accessibles de la salle de bain : canalisations d'eau métalliques, vidange, bâti métallique de la baignoire, corps de chauffage. Ainsi, si une canalisation est mise accidentellement sous tension, tout ce qui est métallique est au même potentiel : on ne peut pas recevoir de courant entre le robinet et la baignoire. La norme précise les cas où elle est exigée et ceux où elle peut être omise.",
   ex:"Rénovation d'une salle de bain avec tuyaux en cuivre : tu poses un conducteur vert/jaune de 2,5 mm² sous conduit (ou 4 mm² sans protection) depuis la borne de terre, avec des colliers de raccordement sur chaque canalisation métallique.",
   q:["À quoi sert la liaison équipotentielle de la salle de bain ?",["À éviter une différence de tension entre deux parties métalliques","À chauffer l'eau","À remplacer le différentiel","À éclairer la pièce"],0,"Tout ce qui est métallique est au même potentiel : pas de courant entre eux."]},
  {p:"L'<b>indice IP</b> (« International Protection ») dit à quoi résiste un matériel. Le 1er chiffre concerne les corps solides et la poussière (0 à 6), le 2e l'eau (0 à 8). Un X remplace un chiffre non précisé. Pour la salle de bain : <b>IPX7</b> (immersion temporaire) dans le volume 0, <b>IPX5</b> (jets d'eau) dans le volume 1, <b>IPX4</b> (projections d'eau) dans le volume 2. On trouve aussi l'indice <b>IK</b>, pour la résistance aux chocs.",
   fig:{type:"barres",legende:"Deuxième chiffre de l'indice IP (protection contre l'eau)",items:[["IPX1 : gouttes verticales",1,""],["IPX4 : projections de toutes directions",4,""],["IPX5 : jets d'eau",5,""],["IPX7 : immersion temporaire",7,""]]},
   q:["Que signifie IPX4 ?",["Protégé contre les projections d'eau","Étanche en immersion","Protégé contre la poussière seulement","4 heures d'autonomie"],0,"Le 2e chiffre 4 = projections d'eau de toutes directions."]}
 ],
 retenir:["Tous les circuits de la salle de bain : différentiel 30 mA.","V0 = dans la baignoire ; V1 = au-dessus jusqu'à 2,25 m ; V2 = 0,60 m autour ; puis hors volume.","Prises 2P+T et interrupteurs : hors volume. Prise rasoir admise en V2.","LES : relier les parties métalliques à la terre (2,5 mm² protégé ou 4 mm²).","IPX7 en V0, IPX5 en V1, IPX4 en V2."]
};

C.modules.push({id:"schemas",n:2,i:"💡",t:"Les montages d'éclairage",d:"Simple allumage, va-et-vient, télérupteur, minuterie",

    {h:"La règle d'or",l:["L'interrupteur coupe toujours la <b>phase</b>, jamais le neutre.","Le neutre va <b>directement</b> au point lumineux.","Le fil entre l'interrupteur et la lampe s'appelle le <b>retour lampe</b>."]},

    {h:"Le télérupteur",l:["Un relais qui change d'état à chaque <b>impulsion</b> sur un bouton poussoir.","Les boutons poussoirs sont câblés <b>en parallèle</b> et alimentent la <b>bobine</b>.","Le contact du télérupteur alimente la lampe."]},

C.fiches.schemas={
 intro:"Allumer une lampe paraît simple, mais selon le nombre d'endroits d'où l'on veut la commander, on n'utilise pas le même montage. Ce module t'apprend à choisir le bon schéma et à le comprendre. Manipule les schémas interactifs, puis entraîne-toi dans le jeu « Câblage ».",
 s:[
  {p:"Le choix dépend du <b>nombre d'endroits</b> d'où l'on veut commander la lumière. Un seul endroit : simple allumage. Deux lampes depuis le même endroit : double allumage. Deux endroits (en haut et en bas d'un escalier) : va-et-vient. Trois endroits ou plus (long couloir, cage d'escalier) : télérupteur avec boutons poussoirs, ou minuterie.",
   fig:{type:"barres",legende:"Nombre de points de commande",items:[["Simple allumage",1,"point"],["Va-et-vient",2,"points"],["Télérupteur ou minuterie",3,"points et +"]]},
   ex:"Une chambre : simple allumage. Un séjour avec un lustre et des appliques : double allumage. Un escalier : va-et-vient. Un couloir d'immeuble avec 6 portes : minuterie.",
   q:["Une lampe commandée de 3 endroits : quel montage ?",["Télérupteur","Va-et-vient","Simple allumage","Double allumage"],0,"Au-delà de 2 points : télérupteur (ou minuterie)."]},
  {p:"L'interrupteur doit couper la <b>phase</b>. La phase arrive sur l'interrupteur, ressort par le <b>retour lampe</b> vers le point lumineux, et le <b>neutre</b> va directement à la lampe. Si on coupait le neutre, la lampe s'éteindrait bien… mais la douille resterait <b>sous tension</b> : quelqu'un qui change l'ampoule pourrait s'électriser.",
   fig:{type:"flux",legende:"Simple allumage : le chemin du courant",etapes:["Phase (disjoncteur 16 A)","Interrupteur",["Retour lampe","couleur ≠ bleu et ≠ vert/jaune"],"Lampe (DCL)",["Neutre","bleu, direct au tableau"]]},
   att:"Une lampe éteinte n'est pas forcément hors tension. Avant de toucher une douille, on coupe au tableau et on vérifie au VAT.",
   q:["Pourquoi couper la phase et pas le neutre ?",["Pour que la douille soit hors tension quand c'est éteint","Pour économiser du fil","Pour que la lampe éclaire mieux","C'est pareil"],0,"Coupure du neutre = douille toujours sous tension."]},
  {p:"Un va-et-vient a 3 bornes : un <b>commun</b> et deux <b>navettes</b>. Le commun est relié à l'une ou l'autre navette selon la position. La phase arrive sur le commun du premier, le retour lampe part du commun du second, et les deux navettes relient les interrupteurs. La lampe s'allume quand les deux communs sont sur la <b>même</b> navette. Essaie :",
   fig:{type:"inter",legende:"Va-et-vient : touche les interrupteurs",inters:[["a","Interrupteur 1"],["b","Interrupteur 2"]],
    svg:"<svg viewBox='0 0 300 160'><text x='6' y='79' fill='#fff' font-size='11' font-weight='900'>L</text><text x='6' y='144' fill='#fff' font-size='11' font-weight='900'>N</text><path class='w' data-k='w0' d='M18 75H70'/><path class='w' data-k='w0' data-v='a:0' d='M70 75L108 47'/><path class='w' data-k='w0' data-v='a:1' d='M70 75L108 103'/><path class='w' data-k='nh' d='M110 45H190'/><path class='w' data-k='nb' d='M110 105H190'/><path class='w' data-k='w2' data-v='b:0' d='M230 75L192 47'/><path class='w' data-k='w2' data-v='b:1' d='M230 75L192 103'/><path class='w' data-k='w2' d='M230 75H262'/><circle class='lp' data-k='lp' cx='275' cy='75' r='13'/><path d='M266 66L284 84M284 66L266 84' stroke='#fff' stroke-width='2'/><path class='w' data-k='wn' d='M275 88V140H18'/><g fill='#fff'><circle cx='70' cy='75' r='4'/><circle cx='110' cy='45' r='4'/><circle cx='110' cy='105' r='4'/><circle cx='190' cy='45' r='4'/><circle cx='190' cy='105' r='4'/><circle cx='230' cy='75' r='4'/></g><g fill='var(--mut)' font-size='10' font-weight='800' text-anchor='middle'><text x='90' y='22'>Interrupteur 1</text><text x='210' y='22'>Interrupteur 2</text><text x='150' y='38'>navette</text><text x='150' y='121'>navette</text><text x='66' y='92'>commun</text><text x='236' y='92'>commun</text></g></svg>",
    f:s=>{const on=["w0",s.a?"nb":"nh"];if(s.a===s.b)on.push("w2","lp","wn");return on},
    msg:s=>s.a===s.b?"💡 Allumée : les deux communs sont sur la même navette, le courant passe.":"⚫ Éteinte : chaque interrupteur est sur une navette différente."},
   att:"Erreur classique : inverser une navette et le commun sur un des interrupteurs. Le montage ne marche alors que dans certaines positions. Le commun est repéré (L, ou une couleur de vis) : on le vérifie avant de câbler.",
   q:["Dans un va-et-vient, où arrive le retour lampe ?",["Sur le commun du 2e interrupteur","Sur une navette","Sur le neutre","Sur la terre"],0,"Phase sur le commun du 1er, retour lampe sur le commun du 2e."]},
  {p:"Le <b>télérupteur</b> est un relais placé au tableau (ou dans une boîte). Sa <b>bobine</b> est alimentée par des <b>boutons poussoirs</b> câblés en parallèle : chaque appui envoie une impulsion, et le contact du télérupteur <b>change d'état</b> (fermé → ouvert → fermé…). On peut ajouter autant de boutons poussoirs qu'on veut, avec seulement deux fils entre eux.",
   fig:{type:"inter",legende:"Télérupteur : chaque impulsion fait basculer le contact",inters:[["t","👆 Appuyer sur un bouton poussoir"]],

    f:s=>s.t?["lo","lp"]:[],
    msg:s=>s.t?"💡 Allumé : le contact reste fermé jusqu'à la prochaine impulsion.":"⚫ Éteint : appuie sur n'importe quel bouton poussoir."},
   ex:"Un long couloir avec 5 portes : 5 boutons poussoirs en parallèle, un télérupteur au tableau, la lampe sur le contact du télérupteur.",

  {p:"La <b>minuterie</b> fonctionne comme un télérupteur, mais la lumière s'éteint seule après un temps réglé : idéal pour les parties communes. Le <b>variateur</b> règle l'intensité lumineuse : il doit être compatible avec les ampoules (LED « dimmables ») et respecter une charge minimale. Le <b>détecteur de présence</b> allume quand il détecte un mouvement, et éteint après une temporisation.",

 ],

    {h:"Pourquoi le triphasé ?",l:["Plus de puissance avec des câbles plus fins.","Les moteurs démarrent et tournent seuls grâce au <b>champ tournant</b>.","En logement : on <b>équilibre</b> les circuits monophasés sur les 3 phases."]},
    {h:"Le neutre en triphasé",l:["Si les 3 phases sont équilibrées, le courant dans le neutre est faible.","Une <b>coupure du neutre</b> déséquilibre les tensions : certains appareils reçoivent bien plus de 230 V.","Le neutre ne se coupe jamais seul et ses connexions sont soignées."]},
    {h:"Le moteur asynchrone triphasé",l:["Plaque à bornes : <b>U1 V1 W1</b> en bas, <b>W2 U2 V2</b> en haut.","Plaque 230/400 V sur réseau 400 V → <b>étoile (Y)</b>. Plaque 400/690 V sur réseau 400 V → <b>triangle (Δ)</b>.","Inverser le sens : <b>permuter deux phases</b>."]},
    {h:"Protéger et commander un moteur",l:["<b>Contacteur</b> : met en marche et arrête.","<b>Relais thermique</b> : protège contre la surcharge, réglé sur l'<b>intensité nominale</b> de la plaque.","Ou <b>disjoncteur-moteur</b> (magnétothermique réglable)."]}],

C.fiches.tri={

 s:[
  {p:"Le réseau triphasé a <b>trois phases</b> (L1, L2, L3) dont les tensions sont décalées d'un tiers de tour, et un <b>neutre</b>. Entre une phase et le neutre, on mesure la <b>tension simple V = 230 V</b>. Entre deux phases, la <b>tension composée U = 400 V</b>. Les deux sont liées par <b>U = V × √3</b>.",

  {p:"Le triphasé transporte plus de puissance avec moins de cuivre, et il crée naturellement un <b>champ magnétique tournant</b> : c'est ce qui fait tourner les moteurs asynchrones sans démarreur compliqué. La puissance se calcule avec <b>P = U × I × √3 × cos φ</b>. Dans un logement en triphasé, on <b>répartit</b> les circuits monophasés sur les trois phases pour qu'elles soient chargées de façon équilibrée.",
   fig:{type:"flux",legende:"Courant d'un moteur de 7,5 kW (cos φ = 0,85) en 400 V",etapes:[["Puissance","7 500 W"],["U × √3 × cos φ","400 × 1,73 × 0,85 ≈ 588"],["I = 7 500 ÷ 588","≈ 12,8 A"]]},
   q:["Pourquoi répartir les circuits d'un logement sur les 3 phases ?",["Pour équilibrer la charge","Pour faire des économies de câble","Parce que c'est plus joli","Ce n'est pas utile"],0,"Une phase surchargée ferait déclencher le disjoncteur de branchement."]},
  {p:"Dans un réseau équilibré, les courants des trois phases s'annulent presque dans le neutre. Mais si le <b>neutre se coupe</b> (borne desserrée, câble arraché), les appareils monophasés se retrouvent <b>en série entre deux phases</b> : la tension se répartit selon leurs charges. Certains reçoivent 300 V ou plus et grillent, d'autres sont sous-alimentés. C'est la <b>rupture de neutre</b>, une panne grave.",

  {p:"Le moteur asynchrone triphasé a trois enroulements, dont les 6 extrémités arrivent sur la <b>plaque à bornes</b> : U1 V1 W1 en bas, W2 U2 V2 en haut. Avec des <b>barrettes</b>, on choisit le <b>couplage</b>. La plaque signalétique indique deux tensions (ex. <b>230/400 V</b>) : la plus petite est la tension que supporte un enroulement. Sur un réseau 400 V, un moteur 230/400 V se couple en <b>étoile</b> ; un moteur 400/690 V se couple en <b>triangle</b>. Pour <b>inverser le sens</b> de rotation, on <b>permute deux phases</b>.",

  {p:"Un départ moteur a trois fonctions. <b>Sectionner</b> (sectionneur ou disjoncteur, pour consigner), <b>commander</b> (le <b>contacteur</b>, piloté par des boutons marche/arrêt ou un automate) et <b>protéger</b> : contre le court-circuit (fusibles aM ou magnétique) et contre la <b>surcharge</b> (le <b>relais thermique</b>, réglé sur l'<b>intensité nominale</b> lue sur la plaque, pour la tension du réseau). Le <b>disjoncteur-moteur</b> regroupe sectionnement et protections dans un seul appareil.",
