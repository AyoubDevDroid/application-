C.modules.push({id:"slt",n:3,i:"🌍",t:"Les schémas de liaison à la terre",d:"TT, TN-S, TN-C, IT : comment le défaut est éliminé",
 s:[{h:"Deux lettres",l:["1re lettre : le <b>neutre</b> du transformateur. <b>T</b> = relié à la terre ; <b>I</b> = isolé (ou impédant).","2e lettre : les <b>masses</b> de l'installation. <b>T</b> = reliées à une terre locale ; <b>N</b> = reliées au neutre.","On parle de <b>SLT</b> (schéma de liaison à la terre) ou de « régime de neutre »."]},
    {h:"Le schéma TT",l:["Neutre à la terre chez le distributeur, masses à la <b>terre locale</b> du bâtiment.","Un défaut fait circuler un courant <b>faible</b> (limité par les terres) : c'est le <b>différentiel</b> qui coupe.","C'est le schéma des <b>logements</b> raccordés au réseau public en France."]},
    {h:"Le schéma TN",l:["Les masses sont reliées au <b>neutre</b> : un défaut devient un <b>court-circuit</b>, coupé par le disjoncteur ou le fusible.","<b>TN-C</b> : un seul conducteur <b>PEN</b> fait neutre et protection.","<b>TN-S</b> : neutre (N) et protection (PE) séparés."]},
    {h:"Le schéma IT",l:["Neutre <b>isolé</b> de la terre : le 1er défaut ne crée presque aucun courant, <b>on ne coupe pas</b>.","Un <b>contrôleur permanent d'isolement</b> (CPI) signale ce 1er défaut, qu'on doit rechercher rapidement.","Utilisé quand la <b>continuité de service</b> est vitale : blocs opératoires, certaines industries."]}],
 k:["Schéma TT","Schéma TN","Schéma IT","PEN","CPI"]});

C.fiches.slt={
 intro:"Que se passe-t-il quand un défaut met une carcasse sous tension ? La réponse dépend de la façon dont le neutre et les masses sont reliés à la terre : c'est le schéma de liaison à la terre. En logement, tu seras toujours en TT, mais dans un immeuble, une usine ou un hôpital, tu rencontreras TN et IT. Les confondre peut être dangereux.",
 s:[
  {p:"Le nom du schéma tient en deux lettres. La <b>première</b> dit comment est relié le <b>neutre du transformateur</b> : T (terre) ou I (isolé). La <b>deuxième</b> dit comment sont reliées les <b>masses</b> de l'installation : T (à une terre locale) ou N (au neutre). Pour TN, on précise C (neutre et protection combinés) ou S (séparés).",
   fig:{type:"flux",legende:"Lire « TT »",etapes:[["1re lettre T","neutre du transformateur à la terre"],["2e lettre T","masses à la terre du bâtiment"],["Résultat","schéma TT (logement)"]]},
   q:["Dans « TN », que signifie le N ?",["Les masses sont reliées au neutre","Le neutre est isolé","Il n'y a pas de neutre","Neutre bleu"],0,"2e lettre N = masses reliées au neutre."]},
  {p:"En <b>TT</b>, le neutre est à la terre au poste du distributeur, et les masses de la maison à sa propre prise de terre. Entre les deux, le courant de défaut passe par le sol : il est <b>faible</b> (quelques ampères au plus), pas assez pour faire déclencher un disjoncteur. C'est donc le <b>différentiel</b> qui assure la protection. Sans différentiel, un TT ne protège pas les personnes. C'est le schéma imposé aux logements raccordés au réseau public.",
   fig:{type:"cycle",centre:"Défaut en TT",etapes:[["Phase sur la carcasse","#ff5470"],["Courant par la terre locale","#ffc83d"],["Retour par la terre du transfo","#3db5ff"],["Courant faible → le différentiel coupe","#2ed47a"]]},
   att:"En TT, on ne relie jamais le neutre à la terre dans l'installation : le différentiel déclencherait sans cesse, et une coupure du neutre mettrait toutes les masses sous tension.",
   q:["En schéma TT, qui coupe en cas de défaut d'isolement ?",["Le différentiel","Le disjoncteur seul","Le fusible seul","Personne"],0,"Le courant de défaut est trop faible pour un disjoncteur : le différentiel coupe."]},
  {p:"En <b>TN</b>, les masses sont reliées au neutre du transformateur par un conducteur. Un défaut entre une phase et une masse devient alors un vrai <b>court-circuit</b> : le courant est très fort, le disjoncteur ou le fusible coupe. En <b>TN-C</b>, un seul conducteur, le <b>PEN</b>, sert de neutre et de protection : il ne doit jamais être coupé. En <b>TN-S</b>, le neutre (N) et le conducteur de protection (PE) sont séparés. On le trouve dans les bâtiments qui ont leur propre transformateur (industrie, grands bâtiments).",
   att:"Le PEN ne se coupe jamais et ne passe jamais dans un différentiel : couper le PEN, c'est couper la protection de toutes les masses.",
   q:["En TN-C, le conducteur PEN…",["Fait à la fois neutre et protection","Est un deuxième neutre","Est une phase","Est facultatif"],0,"PEN = PE + N combinés."]},
  {p:"En <b>IT</b>, le neutre du transformateur est <b>isolé</b> de la terre (ou relié par une grande impédance). Au premier défaut, le courant ne trouve presque pas de chemin de retour : il est minuscule, aucun danger, et <b>rien ne coupe</b>. Un <b>contrôleur permanent d'isolement (CPI)</b> déclenche une alarme : il faut trouver et réparer ce défaut avant qu'un deuxième apparaisse (le second défaut, lui, provoque une coupure). Ce schéma est choisi quand une coupure serait plus dangereuse que le défaut : bloc opératoire, process industriel continu.",
   fig:{type:"cycle",centre:"Quel schéma, où ?",etapes:[["TT<br>logements, petits commerces","#2ed47a"],["TN-S / TN-C<br>industrie, grands bâtiments","#ffc83d"],["IT<br>hôpitaux, process continus","#3db5ff"]]},
   q:["Quel schéma laisse fonctionner l'installation au premier défaut ?",["IT","TT","TN-C","TN-S"],0,"En IT, le 1er défaut est signalé par le CPI, sans coupure."]}
 ],
 retenir:["1re lettre = neutre (T ou I) ; 2e lettre = masses (T ou N).","TT (logement) : défaut faible → le différentiel coupe.","TN : défaut = court-circuit → disjoncteur ou fusible. PEN jamais coupé.","IT : 1er défaut signalé par le CPI, pas de coupure (continuité de service)."]
};

C.modules.push({id:"dimension",n:3,i:"📏",t:"Dimensionner un circuit",d:"Ib, In, Iz, chute de tension, pose et sélectivité",
 s:[{h:"La règle des trois courants",l:["<b>Ib</b> : courant d'emploi (ce que consomme le circuit).","<b>In</b> : calibre de la protection.","<b>Iz</b> : courant que le câble supporte sans chauffer.","Toujours : <b>Ib ≤ In ≤ Iz</b>."]},
    {h:"Ce qui change Iz",l:["Le <b>mode de pose</b> : un câble encastré dans un isolant refroidit mal.","La <b>température</b> ambiante (comble l'été, chaufferie).","Le <b>groupement</b> : plusieurs câbles serrés se réchauffent entre eux.","On applique des <b>facteurs de correction</b> (tableaux de la norme)."]},
    {h:"La chute de tension",l:["Un câble long fait perdre de la tension.","Limites usuelles (depuis l'origine de l'installation) : <b>3 %</b> pour l'éclairage, <b>5 %</b> pour les autres usages.","Monophasé : <b>ΔU = 2 × ρ × L × I ÷ S</b> (ρ cuivre ≈ 0,0225 Ω·mm²/m)."]},
    {h:"La sélectivité",l:["En cas de défaut, seule la protection <b>la plus proche</b> doit couper.","Ex. : un différentiel <b>sélectif (S)</b> en tête, des 30 mA en aval.","Une bonne sélectivité évite de couper tout le bâtiment pour un seul défaut."]}],
 k:["Courant d'emploi","Chute de tension","Sélectivité","Calibre"]});

C.fiches.dimension={
 intro:"Choisir un câble « au jugé » marche dans un petit logement, avec les valeurs toutes faites de la norme. Mais pour alimenter un garage au fond du jardin, un atelier, une pompe à chaleur ou une borne de recharge, il faut calculer. Le dimensionnement répond à deux questions : le câble va-t-il chauffer ? et la tension arrivera-t-elle assez forte au bout ?",
 s:[
  {p:"Trois courants à comparer. <b>Ib</b>, le courant d'emploi : ce que les appareils vont réellement consommer. <b>In</b>, le calibre de la protection. <b>Iz</b>, le courant admissible du câble dans ses conditions de pose. La règle est toujours <b>Ib ≤ In ≤ Iz</b> : la protection laisse passer ce dont le circuit a besoin, mais coupe avant que le câble ne chauffe.",
   fig:{type:"barres",legende:"Exemple : circuit de chauffage de 3 000 W en 1,5 mm²",items:[["Ib = 3 000 ÷ 230",13,"A","#3db5ff"],["In (disjoncteur)",16,"A","#ffc83d"],["Iz du 1,5 mm² (pose courante, ordre de grandeur)",17.5,"A","#2ed47a"]]},
   att:"Si Ib > In, le disjoncteur déclenche en permanence. Si In > Iz, le câble chauffe sans être protégé : c'est le plus dangereux.",
   q:["Quelle relation doit toujours être respectée ?",["Ib ≤ In ≤ Iz","Iz ≤ In ≤ Ib","In ≤ Ib ≤ Iz","Ib = In = Iz"],0,"Le besoin, puis la protection, puis la capacité du câble."]},
  {p:"Le courant admissible d'un câble n'est pas fixe : il dépend de sa capacité à évacuer sa chaleur. Un câble à l'air libre sur un chemin de câbles refroidit bien ; le même câble noyé dans un isolant thermique, dans un comble à 40 °C, serré contre 6 autres câbles, refroidit mal. La norme donne des <b>facteurs de correction</b> (pose, température, groupement) qui diminuent Iz. Dans ces cas, on prend la section au-dessus.",
   fig:{type:"barres",legende:"Le même câble, des conditions différentes (Iz relatif, ordre de grandeur)",items:[["À l'air libre",100,"%","#2ed47a"],["Encastré dans un conduit",85,"%","#ffc83d"],["Dans un isolant, comble chaud, groupé",60,"%","#ff5470"]]},
   q:["Un câble posé dans un isolant thermique de comble…",["Supporte moins de courant (il refroidit mal)","Supporte plus de courant","Ne change rien","N'a plus besoin de protection"],0,"Il faut appliquer un facteur de correction et souvent augmenter la section."]},
  {p:"Le câble a une résistance : plus il est long et fin, plus il fait perdre de tension. Au bout d'un câble trop long, un moteur démarre mal, une lampe éclaire moins, une borne de recharge se met en défaut. En monophasé, la chute de tension vaut <b>ΔU = 2 × ρ × L × I ÷ S</b> (le 2 parce que le courant fait l'aller et le retour), avec ρ ≈ 0,0225 Ω·mm²/m pour le cuivre en fonctionnement. Les limites usuelles, depuis l'origine de l'installation alimentée par le réseau public, sont <b>3 %</b> pour l'éclairage et <b>5 %</b> pour les autres usages.",
   fig:{type:"flux",legende:"Abri de jardin à 40 m, 16 A, câble 2,5 mm²",etapes:[["ΔU = 2 × 0,0225 × 40 × 16 ÷ 2,5","11,5 V"],["En % de 230 V","5 % → limite atteinte"],["Avec du 6 mm²","4,8 V soit 2,1 % ✔"]]},
   ex:"Pour alimenter un garage à 40 m avec une prise 16 A, le 2,5 mm² serait juste à la limite. On passe en 6 mm² (ou en 4 mm² selon le calcul exact), protégé selon la norme à l'origine du câble.",
   q:["Que fait-on si la chute de tension est trop forte ?",["On augmente la section","On augmente le calibre du disjoncteur","On rallonge le câble","On supprime la terre"],0,"Plus de section = moins de résistance = moins de chute de tension."]},
  {p:"La <b>sélectivité</b>, c'est faire en sorte qu'un défaut ne fasse couper que la protection juste au-dessus de lui. Un défaut sur une prise doit faire déclencher le disjoncteur de cette prise, pas le disjoncteur général. Pour les différentiels, on met un différentiel <b>sélectif (type S, retardé)</b> en amont, et des 30 mA en aval : le 30 mA coupe en premier.",
   fig:{type:"flux",legende:"Sélectivité : seul le plus proche du défaut coupe",etapes:[["Disjoncteur de branchement 500 mA type S","reste fermé"],["Différentiel 30 mA de la rangée","reste fermé"],["Disjoncteur 20 A de la prise en défaut","DÉCLENCHE"]]},
   q:["À quoi sert un différentiel de type S (sélectif) en tête d'installation ?",["À laisser couper d'abord les différentiels en aval","À protéger les personnes à 30 mA","À couper plus vite","À rien"],0,"Il est retardé : les 30 mA en aval ont le temps de couper."]}
 ],
 retenir:["Ib ≤ In ≤ Iz, toujours.","Iz diminue avec une mauvaise pose, la chaleur, le groupement.","ΔU = 2ρLI/S en monophasé ; 3 % éclairage, 5 % autres usages.","Sélectivité : seule la protection la plus proche du défaut coupe."]
};

C.fiches.controles={
 intro:"Une installation qui « marche » n'est pas forcément sûre. Une terre coupée, un isolant abîmé par un clou, un différentiel défectueux ne se voient pas à l'usage : ils se mesurent. Les contrôles de fin de chantier sont la signature d'un électricien sérieux, et ils sont exigés pour obtenir l'attestation de conformité.",
 s:[
  {p:"L'<b>autocontrôle</b> commence par les yeux et les mains : chaque borne serrée (on tire sur les fils), chaque circuit repéré, aucun cuivre apparent, tous les couvercles de boîtes posés, les sections et calibres conformes au schéma. Ensuite viennent les mesures, dans un ordre logique : d'abord <b>hors tension</b>, puis <b>sous tension</b>.",
   fig:{type:"flux",legende:"Ordre des contrôles",etapes:["Contrôle visuel","Continuité des conducteurs de protection (hors tension)","Isolement (hors tension)","Mise sous tension circuit par circuit","Terre, différentiels, polarité, essais de fonctionnement"]},
   q:["Pourquoi mesurer l'isolement avant de mettre sous tension ?",["Pour détecter un défaut avant qu'il ne fasse des dégâts","Parce que c'est plus rapide","Ce n'est pas nécessaire","Pour charger les câbles"],0,"Un clou dans un câble se trouve avant la mise sous tension, pas après."]},
  {p:"La <b>continuité de la terre</b> se mesure entre la borne principale de terre et la borne de terre de chaque prise, de chaque point lumineux et des masses : la résistance doit être très faible (quelques dixièmes d'ohm à 2 Ω selon la longueur). La <b>mesure d'isolement</b> se fait au <b>mégohmmètre</b>, circuit hors tension, appareils sensibles débranchés : on applique <b>500 V continu</b> entre les conducteurs actifs (reliés ensemble) et la terre. Plus la résistance est élevée, meilleur est l'isolant.",
   fig:{type:"barres",legende:"Lire une mesure d'isolement (500 V continu)",items:[["Installation saine (courant)",200,"MΩ","#2ed47a"],["Minimum NF C 15-100 (circuits ≤ 500 V)",0.5,"MΩ","#ffc83d"],["Défaut : câble abîmé, humidité",0.08,"MΩ","#ff5470"]]},
   att:"Le mégohmmètre envoie 500 V : on ne le branche jamais sur un circuit sous tension, on prévient les personnes autour, et on débranche les appareils électroniques qui pourraient être abîmés. Après la mesure, le câble peut rester chargé : on le décharge.",
   info:"La NF C 15-100 demande au moins 0,5 MΩ sous 500 V (1 MΩ sous 1 000 V pour les circuits au-delà de 500 V). En pratique, une installation neuve et saine affiche des centaines de MΩ : une valeur proche du minimum mérite déjà qu'on cherche pourquoi.",
   q:["Avec quelle tension mesure-t-on l'isolement d'une installation 230/400 V ?",["500 V continu","230 V alternatif","12 V","1 000 V alternatif"],0,"500 V continu pour les installations jusqu'à 500 V."]},
  {p:"Sous tension, on mesure la <b>résistance de la prise de terre</b> (avec un telluromètre ou la fonction boucle du contrôleur). On teste chaque <b>différentiel</b> avec le contrôleur : un 30 mA doit <b>déclencher entre 15 et 30 mA</b> (entre IΔn/2 et IΔn), et assez vite (300 ms maximum à IΔn pour un différentiel classique). On vérifie aussi la <b>polarité</b> des prises et le fonctionnement de chaque circuit.",
   fig:{type:"barres",legende:"Un différentiel 30 mA en bon état",items:[["Ne doit pas déclencher en dessous de",15,"mA","#3db5ff"],["Doit déclencher au plus tard à",30,"mA","#ffc83d"],["Temps maxi à 30 mA",300,"ms","#ff8a3d"]]},

  {p:"Pour une installation <b>neuve</b> (ou entièrement rénovée avec coupure du raccordement), le distributeur ne met en service qu'avec une <b>attestation de conformité</b> visée par le <b>Consuel</b>. Le contrôleur du Consuel peut venir vérifier sur place. En cas de non-conformité, il faut corriger avant d'obtenir le visa. À la fin, on remet au client le <b>dossier</b> : schéma unifilaire, plans, notices, et on lui explique son tableau.",

C.fiches.depannage={
 intro:"Le dépannage est ce qui distingue un bon électricien d'un excellent électricien. Face à une panne, l'amateur change des pièces au hasard ; le professionnel raisonne, mesure et trouve. La méthode est toujours la même : elle marche pour une prise morte comme pour une usine à l'arrêt. Entraîne-la dans le jeu « Dépannage ».",
 s:[
  {p:"La méthode tient en sept étapes. On <b>écoute</b> le client (depuis quand ? que s'est-il passé juste avant ? quel appareil était en route ?) et on <b>constate</b> soi-même. On <b>consulte</b> le schéma pour savoir ce qui alimente quoi. On formule des <b>hypothèses</b>, de la plus probable à la moins probable. On les vérifie par des <b>mesures</b>, en allant du général au particulier. Puis on <b>répare</b>, on <b>essaie</b>, et on <b>rend compte</b> (bon de travail rempli, conseils au client).",
   fig:{type:"cycle",centre:"Méthode de dépannage",etapes:[["Écouter, constater","#ffc83d"],["Consulter le schéma","#3db5ff"],["Hypothèses","#b18cff"],["Mesurer","#ff8a3d"],["Réparer","#2ed47a"],["Essayer","#7be0d0"],["Rendre compte","#ff8fab"]]},
   ex:"« Depuis hier, la prise de la chambre ne marche plus. Il y a eu une odeur de brûlé quand j'ai branché le radiateur. » En une phrase, le client t'a donné l'hypothèse principale : une connexion qui a chauffé.",
   q:["Quelle est la première étape d'un dépannage ?",["Écouter le client et constater","Changer le disjoncteur","Démonter la prise","Couper tout le logement"],0,"Les questions et l'observation donnent souvent la piste principale."]},
  {p:"Le premier indice est souvent au tableau : <b>qu'est-ce qui a déclenché ?</b> Un <b>différentiel</b> qui déclenche signale une <b>fuite à la terre</b> (isolant abîmé, humidité, appareil en défaut). Un <b>disjoncteur</b> qui déclenche <b>instantanément</b>, parfois avec un claquement, signale un <b>court-circuit</b>. Un disjoncteur qui tient quelques minutes puis déclenche signale une <b>surcharge</b>. Le <b>disjoncteur de branchement</b> qui déclenche quand beaucoup d'appareils tournent signale un dépassement de l'abonnement.",
   fig:{type:"cycle",centre:"Ce qui a déclenché…",etapes:[["Différentiel<br>→ fuite à la terre","#3db5ff"],["Disjoncteur, instantané<br>→ court-circuit","#ff5470"],["Disjoncteur, au bout d'un moment<br>→ surcharge","#ffc83d"],["Branchement<br>→ abonnement dépassé","#b18cff"]]},
   q:["Le différentiel déclenche dès qu'il pleut. Hypothèse principale ?",["Un défaut d'isolement dû à l'humidité","Une surcharge","Un abonnement trop faible","Un court-circuit franc"],0,"L'eau rend un isolant conducteur : fuite à la terre."]},
  {p:"Trois techniques de recherche. <b>Par élimination</b> : on coupe tous les disjoncteurs sous un différentiel, on réarme, puis on remonte les disjoncteurs un par un : celui qui fait redéclencher est le fautif. <b>De point en point</b> : on suit la tension depuis le tableau (230 V ✔), à la boîte de dérivation (230 V ✔), à l'appareil (0 V ✗) : la panne est entre les deux derniers points. <b>Par substitution</b> : on remplace un élément douteux par un élément qu'on sait bon (une ampoule, un appareil branché sur une autre prise).",
   fig:{type:"flux",legende:"Recherche de point en point",etapes:[["Départ du disjoncteur","230 V ✔"],["Boîte de dérivation","230 V ✔"],["Entrée de l'appareil","0 V ✗"],["La panne est entre la boîte et l'appareil","câble coupé ?"]]},
   att:"Les mesures sous tension (recherche de point en point) demandent l'habilitation BR, des EPI (gants, écran) et un appareil de catégorie adaptée. Les mesures de résistance et d'isolement se font hors tension.",
   q:["Pour trouver le circuit qui fait déclencher un différentiel, on…",["Coupe les disjoncteurs en aval, réarme, puis les remonte un par un","Remplace le différentiel","Débranche la terre","Attend que ça passe"],0,"C'est la recherche par élimination."]},
  {p:"Les erreurs classiques coûtent cher. <b>Changer des pièces au hasard</b> coûte au client et ne trouve pas la cause. <b>Supprimer une protection</b> (shunter un différentiel, surcalibrer un disjoncteur) met des vies en danger. <b>Réparer l'effet sans la cause</b> : une borne brûlée remplacée sans comprendre qu'elle était mal serrée, ou qu'un radiateur était branché sur une multiprise, et la panne revient. Enfin, un dépannage n'est fini qu'après l'<b>essai</b> et le <b>compte rendu</b>.",
   att:"Un différentiel qui saute ou un disjoncteur qui déclenche n'est presque jamais « trop sensible » : il fait son travail. On cherche le défaut.",
   q:["Un disjoncteur 16 A déclenche souvent. Quelle « solution » est interdite ?",["Le remplacer par un 25 A","Chercher la surcharge","Répartir les appareils","Créer un circuit supplémentaire"],0,"Surcalibrer, c'est laisser le câble chauffer sans protection."]}
 ],
 retenir:["Écouter, constater, schéma, hypothèses, mesures, réparer, essayer, rendre compte.","Différentiel = fuite ; disjoncteur instantané = court-circuit ; disjoncteur lent = surcharge.","Élimination, point en point, substitution.","On cherche la cause ; on ne supprime jamais une protection."]
};

 s:[
  {p:"Le réseau de communication est câblé <b>en étoile</b> : chaque prise <b>RJ45</b> a son propre câble jusqu'au <b>tableau de communication</b> placé dans la GTL. Là, un panneau de brassage et un <b>switch</b> (ou la box) distribuent internet, le téléphone et la TV. On utilise du câble à <b>4 paires torsadées</b>, de catégorie 6 ou plus. La norme demande au moins une prise RJ45 par pièce principale ; le niveau de performance (le « grade ») dépend de l'édition de la norme et de la taille du logement.",
   fig:{type:"svg",legende:"Câblage en étoile : chaque prise a son câble jusqu'au tableau",svg:"<svg viewBox='0 0 280 140'><rect x='115' y='55' width='50' height='34' rx='6' fill='var(--card)' stroke='#3db5ff' stroke-width='2'/><text x='140' y='76' text-anchor='middle' font-size='9' font-weight='900' fill='#3db5ff'>TABLEAU</text><g stroke='#3db5ff' stroke-width='2.5' stroke-dasharray='5 5' class='flow'><path d='M140 55L40 20M140 55L240 20M140 89L40 120M140 89L240 120M165 72H260'/></g><g font-size='18' text-anchor='middle'><text x='30' y='26'>🛋️</text><text x='250' y='26'>🛏️</text><text x='30' y='132'>🛏️</text><text x='250' y='132'>💻</text><text x='268' y='78'>📺</text></g></svg>"},
   q:["Où arrivent tous les câbles des prises RJ45 ?",["Au tableau de communication","Au disjoncteur de branchement","À la prise la plus proche","Au compteur"],0,"Câblage en étoile vers le tableau de communication, dans la GTL."]},
  {p:"Une prise RJ45 a 8 contacts pour 4 paires de fils de couleur. On les raccorde selon un code couleur, <b>T568A</b> ou <b>T568B</b>, imprimé sur le connecteur. Règle d'or : <b>le même code aux deux extrémités</b>. On garde les paires torsadées jusqu'au plus près du contact (la torsade protège des perturbations) et on raccorde le blindage s'il y en a un. Enfin, on <b>teste</b> chaque lien : un testeur montre si les 8 fils arrivent au bon endroit.",
   fig:{type:"flux",legende:"Ordre des couleurs en T568B (contacts 1 à 8)",etapes:[["1-2","blanc-orange, orange"],["3","blanc-vert"],["4-5","bleu, blanc-bleu"],["6","vert"],["7-8","blanc-marron, marron"]]},
   att:"Détorsader 5 cm de paires « pour être à l'aise » dégrade fortement le débit. On dénude juste ce qu'il faut.",
   q:["Un câble RJ45 est câblé en T568B côté tableau. Côté prise, il faut…",["T568B aussi","T568A","N'importe quel ordre","Seulement 4 fils"],0,"Le même code aux deux extrémités."]},
  {p:"La <b>fibre optique</b> arrive dans le logement sur un <b>DTIO</b> (dispositif de terminaison intérieur optique), placé dans la GTL ; l'opérateur y raccorde sa box. La <b>télévision</b> peut être distribuée par câble coaxial depuis l'antenne, ou par le réseau RJ45. L'<b>interphone</b> ou le <b>visiophone</b> relie une platine de rue à un poste intérieur, et commande souvent une <b>gâche électrique</b> (portillon) ou une ventouse.",
   q:["Sur quel dispositif arrive la fibre optique dans un logement ?",["Le DTIO","Le disjoncteur de branchement","Le DCL","Le télérupteur"],0,"Dispositif de Terminaison Intérieur Optique."]},
  {p:"Une <b>alarme</b> comprend une <b>centrale</b> (le cerveau, secourue par batterie), des <b>détecteurs</b> (de mouvement infrarouge, d'ouverture sur les portes et fenêtres), une <b>sirène</b> et un <b>clavier</b> ou badge. La <b>domotique</b> pilote éclairage, volets et chauffage, par un bus filaire (comme KNX) ou par radio. Dans tous les cas, on <b>sépare</b> les câbles de courants faibles des câbles 230 V (conduits différents, distance), et on les croise à angle droit, pour éviter les perturbations.",
   att:"Un câble réseau tiré dans le même conduit qu'un câble 230 V : coupures, débit réduit, et en cas de défaut, du 230 V qui pourrait arriver sur une prise informatique.",
   q:["Comment faire passer un câble RJ45 près d'un câble 230 V ?",["Dans un conduit séparé, en le croisant à angle droit","Dans le même conduit","Enroulé autour","Collé dessus"],0,"Séparation pour éviter les perturbations et pour la sécurité."]}
 ],
 retenir:["RJ45 en étoile vers le tableau de communication (GTL), câble 4 paires catégorie 6+.","Même code (T568A ou B) aux deux bouts, détorsader le moins possible, tester.","Fibre → DTIO. Interphone : platine, poste, gâche.","Courants faibles séparés des courants forts, croisement à angle droit."]
};

C.modules.push({id:"energies",n:3,i:"🔋",t:"Recharge et nouvelles énergies",d:"Borne de recharge (IRVE), photovoltaïque, pompe à chaleur, Linky",

C.fiches.energies={
 intro:"Voitures électriques, panneaux solaires, pompes à chaleur : l'électricité prend la place de l'essence, du fioul et du gaz. C'est un énorme marché pour les électriciens, mais avec des règles nouvelles et des dangers particuliers (courant continu, fortes puissances permanentes). Ce module te donne les bases pour comprendre ces chantiers.",
 s:[
  {p:"Une voiture électrique se recharge pendant des heures à forte puissance : c'est très différent d'un appareil ordinaire. On utilise soit une <b>prise renforcée</b> (environ 3,2 kW, 14 A), soit une <b>borne murale</b> (wallbox : 7,4 kW en monophasé 32 A, 11 ou 22 kW en triphasé). Dans tous les cas : <b>circuit dédié</b>, protection adaptée, <b>différentiel 30 mA type A</b> au minimum (certaines bornes demandent un type F ou B, sauf si elles intègrent une détection du courant continu). Au-delà de <b>3,7 kW</b>, la loi exige un installateur qualifié <b>IRVE</b>.",
   fig:{type:"barres",legende:"Puissance de recharge et temps pour 40 kWh (ordre de grandeur)",items:[["Prise ordinaire (déconseillée) — 2,3 kW",17,"h","#ff5470"],["Prise renforcée — 3,2 kW",12.5,"h","#ffc83d"],["Wallbox mono — 7,4 kW",5.5,"h","#3db5ff"],["Wallbox tri — 11 kW",3.6,"h","#2ed47a"]]},
   att:"Recharger une voiture sur une prise ordinaire via une rallonge, des heures durant à 10 A : c'est une cause fréquente d'échauffement et d'incendie. On conseille toujours un circuit dédié.",
   q:["Au-delà de quelle puissance une borne doit-elle être posée par un installateur qualifié IRVE ?",["3,7 kW","1 kW","22 kW","100 kW"],0,"Au-delà de 3,7 kW, la qualification IRVE est exigée."]},
  {p:"Les panneaux <b>photovoltaïques</b> produisent du courant <b>continu</b>. L'<b>onduleur</b> le transforme en alternatif 230 V, synchronisé avec le réseau, pour l'<b>autoconsommation</b> (on consomme sa production) ou la <b>revente</b>. Le danger particulier : la partie continue est sous tension <b>dès qu'il y a de la lumière</b>, et on ne peut pas éteindre le soleil. Le courant continu entretient aussi les arcs électriques bien plus que l'alternatif.",
   fig:{type:"flux",legende:"Une installation en autoconsommation",etapes:[["Panneaux","courant continu (plusieurs centaines de volts)"],["Interrupteur-sectionneur DC","isole côté continu"],["Onduleur","continu → alternatif 230 V"],["Tableau du logement","consommation sur place"],["Surplus","vers le réseau"]]},
   att:"Ne jamais débrancher un connecteur de panneau en charge : l'arc en courant continu ne s'éteint pas tout seul. On coupe d'abord l'onduleur côté alternatif, puis le sectionneur côté continu. Intervention réservée aux personnes habilitées BP.",
   q:["Quel appareil transforme le courant continu des panneaux en alternatif ?",["L'onduleur","Le disjoncteur","Le transformateur de sécurité","Le contacteur"],0,"L'onduleur fabrique un courant alternatif synchronisé avec le réseau."]},
  {p:"Une <b>pompe à chaleur</b> (PAC) ou une climatisation demande un circuit dédié, souvent en <b>triphasé</b> pour les grosses puissances, dimensionné selon la notice du fabricant (courant de démarrage, protection, section). Pour éviter que tous ces gros appareils ne fassent sauter le disjoncteur de branchement, on installe un <b>gestionnaire d'énergie</b> ou un <b>délesteur</b> : il surveille la puissance appelée et coupe temporairement le chauffage ou le chauffe-eau quand on approche de la limite de l'abonnement.",
   ex:"Abonnement 9 kVA. Le délesteur voit 8,5 kVA (plaque + four + chauffage) : il coupe le chauffage pendant quelques minutes, le temps que la cuisson se termine. Le client ne s'en rend pas compte, et le disjoncteur de branchement ne saute pas.",
   q:["Que fait un délesteur ?",["Il coupe temporairement certains appareils pour ne pas dépasser l'abonnement","Il augmente la puissance","Il protège les personnes","Il recharge la voiture"],0,"Le délestage évite le déclenchement du disjoncteur de branchement."]},
  {p:"Le compteur <b>Linky</b> est communicant : il transmet la consommation à distance et permet des changements d'abonnement sans déplacement. Pour l'électricien, deux choses comptent : il a un <b>contact</b> (relais) qui se ferme aux heures creuses, utilisé pour commander le contacteur du chauffe-eau ; et une sortie <b>TIC</b> (télé-information client) qui renseigne les gestionnaires d'énergie sur la consommation en temps réel. Le <b>disjoncteur de branchement</b> reste l'appareil de coupure et de protection en tête de l'installation.",
   q:["À quoi sert le contact heures creuses du compteur ?",["À commander le contacteur du chauffe-eau","À couper tout le logement","À mesurer la terre","À recharger la voiture"],0,"Il donne l'ordre « heures creuses » au contacteur jour/nuit."]}
 ],

C.fiches.metier={
 intro:"Savoir câbler ne suffit pas pour être un bon électricien : il faut aussi savoir organiser son chantier, travailler avec les autres métiers et parler au client. Un chantier bien préparé se fait plus vite, avec moins d'oublis, et le client recommande l'entreprise.",

  {p:"En construction neuve, l'ordre est toujours le même. On <b>implante</b> (on trace l'emplacement des boîtes et des passages, au niveau laser). On fait les <b>réservations</b> et on pose les <b>boîtes</b>. On pose les <b>conduits</b> (dans les dalles avant le coulage, dans les cloisons avant leur fermeture). On <b>tire les fils</b>, on <b>raccorde</b> l'appareillage et le tableau. Enfin, <b>autocontrôle</b>, mesures et mise en service.",
   fig:{type:"flux",legende:"Chantier neuf : l'ordre des travaux",etapes:["Préparer (plans, matériel)","Implanter","Réservations et boîtes","Conduits","Tirage des fils","Raccordements","Autocontrôle, mesures, mise en service"]},
   q:["Dans un chantier neuf, que fait-on avant de tirer les fils ?",["Poser les conduits","Raccorder les prises","Mettre sous tension","Faire les mesures d'isolement"],0,"Les fils se tirent dans des conduits déjà posés."]},
  {p:"Sur un chantier, tu n'es pas seul. Les conduits noyés dans la dalle doivent être posés <b>avant</b> le coulage du béton ; ceux des cloisons <b>avant</b> que le plaquiste ne les ferme ; l'appareillage se pose <b>après</b> la peinture. Il faut donc suivre le <b>planning</b> du chantier et communiquer avec les autres corps de métier. On <b>protège</b> son travail : boîtes bouchées pour que l'enduit n'y entre pas, extrémités de câbles repérées.",

 {id:"bouilloire",t:"Le disjoncteur saute dès qu'on allume la bouilloire",ic:"☕",niv:1,

 {id:"diff-pluie",t:"Le différentiel saute quand il pleut",ic:"🌧️",niv:2,

   {q:"Un différentiel qui déclenche quand il pleut, ça fait penser à…",o:[["Un défaut d'isolement lié à l'humidité (fuite vers la terre)",true,"L'eau rend un isolant conducteur : le courant fuit vers la terre, le différentiel le détecte et coupe."],["Une surcharge",false,"Une surcharge fait déclencher un disjoncteur, pas un différentiel. Et la pluie n'ajoute pas d'appareils."],["Un différentiel trop sensible à remplacer par un 300 mA",false,"Interdit : le 30 mA protège les personnes. On cherche le défaut."]]},
   {q:"Le différentiel alimente 6 circuits. Comment trouver le circuit fautif ?",o:[["Couper tous les disjoncteurs en aval, réarmer le différentiel, puis remonter les disjoncteurs un par un",true,"Quand tu remontes le circuit « prises extérieures et éclairage du jardin », le différentiel déclenche. Tu tiens le circuit."],["Débrancher tous les appareils de la maison",false,"Ça peut aider, mais le défaut peut venir du câblage, pas d'un appareil."],["Attendre qu'il pleuve",false,"On trouve le circuit par élimination, sans attendre la pluie."]]},
   {q:"Sur ce circuit : 2 prises extérieures et 3 bornes lumineuses. Comment confirmer le défaut ?",o:[["Consigner et mesurer l'isolement au mégohmmètre (500 V) entre conducteurs actifs et terre",true,"Résultat : 0,08 MΩ. Beaucoup trop bas : le minimum est de 0,5 MΩ."],["Mesurer la tension à la prise au multimètre",false,"La tension serait normale : le multimètre ne voit pas une fuite. Il faut un mégohmmètre."],["Appuyer sur le bouton test du différentiel",false,"Il vérifie le différentiel, pas le circuit. Le différentiel fonctionne : il fait son travail."]]},
   {info:"En déconnectant les bornes une par une, le défaut disparaît quand tu isoles la borne du fond. Dedans : de l'eau, un joint craquelé, des connexions vertes d'oxydation.",q:"Quelle est la cause ?",o:[["Un défaut d'étanchéité : l'eau entre et crée une fuite vers la terre",true,"Le luminaire n'a plus l'indice de protection IP d'origine : il doit être remplacé par un modèle adapté à l'extérieur."],["Un fil de terre trop gros",false,"La section de la terre n'a rien à voir avec une infiltration d'eau."],["Un problème de neutre",false,"Le défaut se mesure entre conducteurs actifs et terre, et la cause est visible : l'eau dans le boîtier."]]},

/* ---- 84-atelier.js ---- */
/* JEU — Atelier de calcul : exercices générés à l'infini avec leur correction.
   gen(R) renvoie {q:énoncé, r:résultat, u:unité, tol?:tolérance, ex:correction}. R.r(a,b) entier, R.pick(liste), R.f(x,déc) nombre à la française. */
C.atelier=[
 {t:"Intensité d'un appareil",ic:"🔌",d:"I = P ÷ U",gen:R=>{const p=R.pick([500,750,1000,1200,1500,2000,2200,2300,2500,3000,3450,4600]),r=p/230;
   return {q:`Un appareil de <b>${R.f(p,0)} W</b> est branché en 230 V. Quelle intensité consomme-t-il ?`,r,u:"A",ex:`I = P ÷ U = ${R.f(p,0)} ÷ 230 = <b>${R.f(r)} A</b>`}}},
 {t:"Loi d'Ohm",ic:"Ω",d:"U = R × I",gen:R=>{const k=R.r(0,2);
   if(k===0){const r=R.pick([10,22,47,100,220,470]),i=R.pick([0.1,0.2,0.5,1,2]);return {q:`Une résistance de <b>${r} Ω</b> est traversée par <b>${R.f(i)} A</b>. Quelle est la tension à ses bornes ?`,r:r*i,u:"V",ex:`U = R × I = ${r} × ${R.f(i)} = <b>${R.f(r*i)} V</b>`}}
   if(k===1){const u=R.pick([12,24,48,230]),r=R.pick([6,12,24,46,115]);return {q:`Une résistance de <b>${r} Ω</b> est alimentée en <b>${u} V</b>. Quel courant la traverse ?`,r:u/r,u:"A",ex:`I = U ÷ R = ${u} ÷ ${r} = <b>${R.f(u/r)} A</b>`}}
   const i=R.pick([0.5,2,5,10,23]);return {q:`Un récepteur alimenté en <b>230 V</b> consomme <b>${R.f(i)} A</b>. Quelle est sa résistance ?`,r:230/i,u:"Ω",ex:`R = U ÷ I = 230 ÷ ${R.f(i)} = <b>${R.f(230/i)} Ω</b>`}}},
 {t:"Résistance d'un appareil chauffant",ic:"♨️",d:"R = U² ÷ P",gen:R=>{const p=R.pick([500,1000,1500,2000,2300,2500,3000]),r=230*230/p;
   return {q:`Quelle est la résistance d'un radiateur de <b>${R.f(p,0)} W</b> prévu pour 230 V ?`,r,u:"Ω",ex:`R = U² ÷ P = 230² ÷ ${R.f(p,0)} = 52 900 ÷ ${R.f(p,0)} = <b>${R.f(r,1)} Ω</b>`}}},
 {t:"Plusieurs appareils sur un circuit",ic:"➕",d:"On additionne les puissances",gen:R=>{const L=[["un radiateur",1000],["un radiateur",1500],["une TV",150],["un ordinateur",200],["une bouilloire",2000],["un fer à repasser",1800],["un aspirateur",800],["un sèche-cheveux",1600],["une lampe",60]];
   const a=[R.pick(L),R.pick(L),R.pick(L)],p=a.reduce((s,x)=>s+x[1],0),r=p/230;
   return {q:`Sur le même circuit en 230 V fonctionnent ${a.map(x=>`${x[0]} (<b>${x[1]} W</b>)`).join(', ')}. Quelle est l'intensité totale ?`,r,u:"A",ex:`P totale = ${a.map(x=>x[1]).join(' + ')} = ${R.f(p,0)} W ; I = ${R.f(p,0)} ÷ 230 = <b>${R.f(r)} A</b>${r>16?' : un circuit protégé en 16 A déclencherait.':'.'}`}}},
 {t:"Énergie et coût",ic:"💶",d:"E (kWh) = P (kW) × t (h)",gen:R=>{const p=R.pick([60,500,1000,1500,2000,2400]),t=R.pick([2,3,5,8,10]),e=p/1000*t,prix=0.25;
   if(R.r(0,1))return {q:`Un appareil de <b>${R.f(p,0)} W</b> fonctionne <b>${t} h</b>. Quelle énergie consomme-t-il ?`,r:e,u:"kWh",ex:`E = ${R.f(p/1000,3)} kW × ${t} h = <b>${R.f(e,2)} kWh</b>`};
   return {q:`Un appareil de <b>${R.f(p,0)} W</b> fonctionne <b>${t} h</b>. Combien coûte cette énergie à <b>0,25 € le kWh</b> ?`,r:e*prix,u:"€",tol:0.02,ex:`E = ${R.f(p/1000,3)} × ${t} = ${R.f(e,2)} kWh ; coût = ${R.f(e,2)} × 0,25 = <b>${R.f(e*prix,2)} €</b>`}}},
 {t:"Chute de tension",ic:"📉",d:"ΔU = 2 × ρ × L × I ÷ S",gen:R=>{const l=R.pick([10,15,20,25,30,40,50]),i=R.pick([10,16,20,32]),s=R.pick([1.5,2.5,4,6,10]),r=2*0.0225*l*i/s;
   return {q:`Câble monophasé en cuivre de <b>${l} m</b>, section <b>${R.f(s,1)} mm²</b>, parcouru par <b>${i} A</b>. Quelle est la chute de tension ? (ρ = 0,0225 Ω·mm²/m)`,r,u:"V",tol:Math.max(r*0.03,0.05),
     ex:`ΔU = 2 × 0,0225 × ${l} × ${i} ÷ ${R.f(s,1)} = <b>${R.f(r)} V</b>, soit ${R.f(r/230*100,1)} % de 230 V ${r/230*100>5?'(au-delà de 5 % : section à augmenter)':r/230*100>3?'(plus de 3 % : trop pour de l\'éclairage)':'(acceptable)'}.`}}},
 {t:"Résistances en série et en parallèle",ic:"🔗",d:"Série : R1 + R2 · Parallèle : R1 × R2 ÷ (R1 + R2)",gen:R=>{const a=R.pick([10,20,30,40,60,100,120]),b=R.pick([10,20,30,40,60,100,120]);
   if(R.r(0,1))return {q:`Deux résistances de <b>${a} Ω</b> et <b>${b} Ω</b> sont branchées <b>en série</b>. Résistance équivalente ?`,r:a+b,u:"Ω",ex:`En série, on additionne : ${a} + ${b} = <b>${a+b} Ω</b>`};
   const r=a*b/(a+b);return {q:`Deux résistances de <b>${a} Ω</b> et <b>${b} Ω</b> sont branchées <b>en parallèle</b>. Résistance équivalente ?`,r,u:"Ω",ex:`R = (${a} × ${b}) ÷ (${a} + ${b}) = ${a*b} ÷ ${a+b} = <b>${R.f(r)} Ω</b> (toujours plus petite que la plus petite des deux).`}}},
 {t:"Courant d'un moteur triphasé",ic:"⚙️",d:"I = P ÷ (U × √3 × cos φ)",gen:R=>{const p=R.pick([3,4,5.5,7.5,11,15]),c=R.pick([0.8,0.85,0.9]),r=p*1000/(400*Math.sqrt(3)*c);
   return {q:`Un moteur triphasé absorbe <b>${R.f(p,1)} kW</b> sur un réseau <b>400 V</b>, avec cos φ = <b>${R.f(c,2)}</b>. Quel est son courant de ligne ?`,r,u:"A",tol:r*0.03,ex:`I = ${R.f(p*1000,0)} ÷ (400 × 1,732 × ${R.f(c,2)}) = <b>${R.f(r,1)} A</b>`}}},
 {t:"Résistance maximale de la prise de terre",ic:"⏚",d:"R ≤ UL ÷ IΔn",gen:R=>{const ul=R.pick([50,25]),id=R.pick([[0.03,"30 mA"],[0.3,"300 mA"],[0.5,"500 mA"],[1,"1 A"]]),r=ul/id[0];
   return {q:`Tension limite <b>UL = ${ul} V</b> (local ${ul===50?'sec':'mouillé'}), différentiel de <b>${id[1]}</b>. Quelle résistance de terre maximale ?`,r,u:"Ω",ex:`R ≤ UL ÷ IΔn = ${ul} ÷ ${R.f(id[0],2)} = <b>${R.f(r,1)} Ω</b>`}}},
 {t:"Abonnement et intensité",ic:"🏠",d:"I = puissance ÷ 230",gen:R=>{const k=R.pick([3,6,9,12]),r=k*1000/230;
   return {q:`Un abonnement monophasé de <b>${k} kVA</b> correspond à quelle intensité en 230 V (au dixième près) ?`,r,u:"A",tol:0.3,ex:`I = ${k*1000} ÷ 230 = <b>${R.f(r,1)} A</b> ; le disjoncteur de branchement est réglé sur ${({3:15,6:30,9:45,12:60})[k]} A.`}}},
 {t:"Nombre de prises d'un séjour",ic:"🛋️",d:"1 prise par 4 m², minimum 5 (7 au-delà de 28 m²)",gen:R=>{const s=R.r(14,48),r=s>28?7:Math.max(5,Math.ceil(s/4));
   return {q:`Combien de prises au minimum dans un séjour de <b>${s} m²</b> ?`,r,u:"prises",tol:0.01,ex:s>28?`Plus de 28 m² : la norme demande <b>7 prises</b> minimum, réparties sur le pourtour.`:`${s} ÷ 4 = ${R.f(s/4,2)} → arrondi au-dessus : ${Math.ceil(s/4)}${Math.ceil(s/4)<5?', mais le minimum est de 5':''} → <b>${r} prises</b>.`}}}
];

const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const P={xp:0,read:new Set(),best:{quiz:0,vf:0,match:0,ordre:null,calc:0,exam:0},parties:0,fin:new Set(),mq:new Set(),serie:0,jour:'',xpJour:0,err:[],diag:{},cab:{},tri:{},ord:{},atel:0,fix:0,badges:[]};

function save(){try{const d={xp:P.xp,read:[...P.read],best:P.best,parties:P.parties,fin:[...P.fin],mq:[...P.mq],serie:P.serie,jour:P.jour,xpJour:P.xpJour,atel:P.atel,fix:P.fix};LISTES.concat(OBJETS).forEach(k=>d[k]=P[k]);localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){P.xp=d.xp||0;P.read=new Set(d.read||[]);Object.assign(P.best,d.best||{});P.parties=d.parties||0;P.fin=new Set(d.fin||[]);P.mq=new Set(d.mq||[]);P.serie=d.serie||0;P.jour=d.jour||'';P.xpJour=d.xpJour||0;P.atel=d.atel||0;P.fix=d.fix||0;
  LISTES.forEach(k=>P[k]=Array.isArray(d[k])?d[k]:[]);OBJETS.forEach(k=>P[k]=d[k]&&typeof d[k]==='object'?d[k]:{})}}catch(e){}}

/* ----- niveaux (XP) et grades -----
   C.grades (facultatif) = ['Apprenti','Compagnon',…] : nom affiché selon le niveau */
const SEUILS=[0,100,250,450,700,1000,1400,1900,2500,3200,4000,5000,6200,7600,9200,11000];
function grade(){let i=0;while(i<SEUILS.length-1&&P.xp>=SEUILS[i+1])i++;const g=C.grades||[];
  return {i,nom:'Niveau '+(i+1)+(g.length?' · '+g[Math.min(i,g.length-1)]:''),bas:SEUILS[i],haut:SEUILS[i+1]||null}}

function modRow(m){return `<button class="row" onclick="openFiche('${m.id}')"><span class="ic">${m.i}</span><span class="tx"><b>${m.t}</b><span>${m.d}</span></span>${P.fin.has(m.id)?'<span class="ok">✓</span>':P.read.has(m.id)?'<span class="mut">…</span>':'<span class="mut">›</span>'}</button>`}
/* C.niveaux (facultatif) = [{t,d,ic}] et chaque module a n:1,2,3… → cours regroupés par niveau */
function renderMods(){
  if(!C.niveaux){$('modList').innerHTML=C.modules.map(modRow).join('');return}
  $('modList').innerHTML=C.niveaux.map((nv,k)=>{const ms=C.modules.filter(m=>(m.n||1)===k+1),lu=ms.filter(m=>P.fin.has(m.id)).length;
    return `<div class="nvh"><b>${nv.ic||''} ${nv.t}</b><span class="mut">${nv.d||''}</span><div class="prog" style="flex:none;height:8px"><i style="width:${ms.length?lu/ms.length*100:0}%"></i></div><span class="mut">${lu} / ${ms.length} fiches terminées</span></div>`+ms.map(modRow).join('')}).join('');
}

/* fiche */
function openFiche(id){
  const m=C.modules.find(x=>x.id===id),F=(C.fiches||{})[id]||{},k=C.modules.indexOf(m),nx=C.modules[k+1];
  P.read.add(id);save();
  const S=m.s.map((s,i)=>Object.assign({},s,(F.s||[])[i]||{}));
  const mots=(JSON.stringify(S)+(F.intro||'')).replace(/<[^>]+>/g,' ').split(/\s+/).length,min=Math.max(1,Math.round(mots/170));
  const nq=C.quiz.filter(q=>q[0]===id).length;
  $('ficheBody').innerHTML=`<div class="rbar"><i id="rb"></i></div>
   <div class="top"><button class="back" onclick="tab('cours')">←</button><span class="pill">Module ${k+1} / ${C.modules.length}</span></div>
   <div class="fhero"><span class="fic">${m.i}</span><div><h1>${m.t}</h1><p class="mut">${m.d}</p><span class="mut">⏱ ${min} min de lecture · ${S.length} parties${P.fin.has(id)?' · ✅ lue':''}</span></div></div>
   ${F.intro?`<p class="chapo">${F.intro}</p>`:''}
   ${S.length>1?`<div class="toc"><b>Sommaire</b>${S.map((s,i)=>`<button onclick="$('s${i}').scrollIntoView({behavior:'smooth',block:'start'})">${i+1}. ${s.h}</button>`).join('')}</div>`:''}
   ${S.map((s,i)=>`<div class="sec" id="s${i}"><div class="sh"><span class="num">${i+1}</span><h3>${s.h}</h3></div>
     ${s.p?`<p>${s.p}</p>`:''}${s.l?`<ul>${s.l.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
     ${s.fig?figHTML(s.fig):''}
     ${s.ex?`<div class="box ex2"><b>💡 Exemple concret</b>${s.ex}</div>`:''}
     ${s.att?`<div class="box att"><b>⚠️ Attention</b>${s.att}</div>`:''}
     ${s.info?`<div class="box info"><b>🤓 Le savais-tu ?</b>${s.info}</div>`:''}
     ${s.q?mqHTML(s.q,id+':'+i):''}</div>`).join('')}
   ${F.retenir?`<div class="box ret"><b>📌 À retenir</b><ul>${F.retenir.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
   <div class="key"><h3>🔑 Mots-clés</h3><div class="chips">${m.k.map(k=>`<button class="chip" onclick="def('${k.replace(/'/g,"\\'")}')">${k}</button>`).join('')}</div></div>
   <div id="finF"></div>
   ${nq?`<button class="btn" onclick="startQuiz('${m.id}')">🎯 S'entraîner sur ce module (${Math.min(nq,10)} questions)</button>`:''}
   ${nx?`<button class="btn ghost" onclick="openFiche('${nx.id}')">Module suivant : ${nx.i} ${nx.t} →</button>`:`<button class="btn ghost" onclick="tab('cours')">🎉 Tous les modules vus — retour aux cours</button>`}`;
  show('fiche');initFigs($('ficheBody'));
  document.querySelectorAll('#ficheBody .fig').forEach(f=>watch(f,()=>playFig(f)));
  watch($('finF'),()=>{if(!P.fin.has(id)){P.fin.add(id);gain(20,$('finF'));toast('📖 Fiche terminée ! +20 XP')}});
}
/* barre de lecture */
addEventListener('scroll',()=>{const r=$('rb');if(!r||!$('fiche').classList.contains('on'))return;const h=document.documentElement.scrollHeight-innerHeight;r.style.width=(h>0?Math.min(100,scrollY/h*100):100)+'%'},{passive:true});
function watch(el,f){if(!('IntersectionObserver' in window))return f();const o=new IntersectionObserver(e=>{if(e[0].isIntersecting){o.disconnect();f()}},{threshold:.35});o.observe(el)}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}

/* mini-question dans la fiche : [question,[bonne,faux,…],0,explication] */
function mqHTML(q,key){const o=shuf(q[1].map((t,i)=>({t,i})));
  return `<div class="mq" data-q="${key}"><b>✋ Vérifie que tu as compris</b><p>${q[0]}</p>${o.map(x=>`<button class="ans" data-i="${x.i}" onclick="mqA(this)">${x.t}</button>`).join('')}<div class="ex"></div></div>`}
function mqA(b){const box=b.closest('.mq'),k=box.dataset.q,[mid,si]=k.split(':'),m=C.modules.find(x=>x.id===mid);
  const s=Object.assign({},m.s[si],((C.fiches||{})[mid]||{s:[]}).s[si]||{}),q=s.q,bs=[...box.querySelectorAll('.ans')];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);
  const ok=+b.dataset.i===q[2];bs.forEach(x=>{if(+x.dataset.i===q[2])x.classList.add('ok');else if(x!==b)x.classList.add('dim')});
  if(ok){if(!P.mq.has(k)){P.mq.add(k);gain(5,b)}else beep(1)}else{b.classList.add('ko');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');beep(0)}
  const e=box.querySelector('.ex');e.innerHTML=(ok?'✅ ':'❌ ')+q[3];e.classList.add('on');}

/* ----- FIGURES ANIMÉES -----
   fig:{type:'cycle',etapes:['A','B',['C','#ff5470']],centre:'…'}   étapes en boucle
   fig:{type:'flux',etapes:['A',['B','valeur'],…],ops:['− 5','÷ 3']}  étapes qui apparaissent une à une
   fig:{type:'barres',items:[['Libellé',valeur,'unité','#couleur'],…]}  barres comparées
   fig:{type:'chiffres',items:[[valeur,'unité','légende'],…]}          chiffres clés qui défilent
   fig:{type:'svg',svg:'<svg…>'}  dessin libre (classes : flow, glow, spin, pop, draw, appear)
   fig:{type:'inter',svg:'<svg…>',inters:[['a','Interrupteur 1',2],…],f:s=>['clé',…],msg:s=>'texte'}
       schéma interactif : chaque bouton fait tourner l'état s.a (0,1… nb positions).
       Dans le SVG : data-v="a:1" = visible seulement si s.a vaut 1 ; data-k="clé" = reçoit la classe "on"
       si f(s) renvoie cette clé (classes prêtes : lp = lampe, w = fil, w ko = fil en défaut).
   fig:{type:'etapes',vues:[{svg:'<svg…>',t:'texte'},…]}  pas à pas avec ◀ ▶
   + legende:'…' (facultatif) */
const FIGR=[];
function figHTML(f){let h='';
  if(f.type==='cycle'){const n=f.etapes.length,T=n*1.6;
    h=`<div class="cyc" data-n="${n}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--card)" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="none" stroke="var(--pri)" stroke-width="1.2" stroke-dasharray="3 5" class="flow" opacity=".7"/><circle r="3" fill="var(--pri)"><animateMotion dur="${T}s" repeatCount="indefinite" path="M50,12 A38,38 0 1,1 49.99,12"/></circle></svg>
     ${f.etapes.map((e,i)=>{const [t,c]=Array.isArray(e)?e:[e],a=(-90+i*360/n)*Math.PI/180;return `<div class="n" style="left:${50+38*Math.cos(a)}%;top:${50+38*Math.sin(a)}%;${c?'--c:'+c:''}">${t}</div>`}).join('')}
     ${f.centre?`<div class="ctr">${f.centre}</div>`:''}</div>`}
  else if(f.type==='flux'){h=`<div class="flx">${f.etapes.map((e,i)=>{const [t,v]=Array.isArray(e)?e:[e];return (i?`<div class="a" style="animation-delay:${i*.7-.35}s">↓ ${(f.ops||[])[i-1]||''}</div>`:'')+`<div class="b ${i===f.etapes.length-1?'fin':''}" style="animation-delay:${i*.7}s"><span>${t}</span>${v?`<b>${v}</b>`:''}</div>`}).join('')}</div>`}
  else if(f.type==='barres'){const mx=Math.max(...f.items.map(x=>x[1]));h=`<div class="brs">${f.items.map(x=>`<div><div class="r"><span>${x[0]}</span><span style="white-space:nowrap"><span class="cnt" data-v="${x[1]}">0</span>${x[2]?' '+x[2]:''}</span></div><div class="t"><i data-w="${Math.max(1.5,x[1]/mx*100)}" style="${x[3]?'--c:'+x[3]:''}"></i></div></div>`).join('')}</div>`}
  else if(f.type==='chiffres'){h=`<div class="chf">${f.items.map(x=>`<div><b><span class="cnt" data-v="${x[0]}">0</span>${x[1]?' '+x[1]:''}</b><span>${x[2]||''}</span></div>`).join('')}</div>`}
  else if(f.type==='svg')h=f.svg;
  else if(f.type==='inter'){const r=FIGR.push(f)-1;h=`<div class="itr" data-r="${r}">${f.svg}<div class="ibt">${f.inters.map(([k,t])=>`<button class="chip" data-s="${k}" onclick="figSw(this)">${t}</button>`).join('')}</div><div class="imsg"></div></div>`}
  else if(f.type==='etapes'){const r=FIGR.push(f)-1;h=`<div class="etp" data-r="${r}" data-i="0"><div class="etv"></div><div class="etn"><button class="chip" onclick="figEt(this,-1)">◀</button><span></span><button class="chip" onclick="figEt(this,1)">▶</button></div></div>`}
  const inter=f.type==='inter'||f.type==='etapes';
  return `<div class="fig" data-t="${f.type}">${inter?'':'<button class="rej" onclick="playFig(this.parentNode)">↻ Rejouer</button>'}${h}${f.legende?`<div class="leg">${f.legende}</div>`:''}</div>`}
function initFigs(root){root.querySelectorAll('.itr').forEach(el=>{const f=FIGR[+el.dataset.r];el._s={};f.inters.forEach(([k])=>el._s[k]=0);figUpd(el)});root.querySelectorAll('.etp').forEach(el=>figEt(el.querySelector('.chip'),0))}
function figSw(b){const el=b.closest('.itr'),f=FIGR[+el.dataset.r],k=b.dataset.s,n=(f.inters.find(x=>x[0]===k)||[])[2]||2;el._s[k]=(el._s[k]+1)%n;figUpd(el);beep(1)}
function figUpd(el){const f=FIGR[+el.dataset.r],s=el._s,on=f.f(s)||[];
  el.querySelectorAll('[data-v]').forEach(x=>{const [k,v]=x.getAttribute('data-v').split(':');x.classList.toggle('hide',String(s[k])!==v)});
  el.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',on.includes(x.getAttribute('data-k'))));
  el.querySelectorAll('.ibt .chip').forEach(b=>b.classList.toggle('act',!!s[b.dataset.s]));
  el.querySelector('.imsg').innerHTML=f.msg?f.msg(s):''}
function figEt(b,d){const el=b.closest('.etp'),f=FIGR[+el.dataset.r];let i=Math.max(0,Math.min(f.vues.length-1,+el.dataset.i+d));el.dataset.i=i;const v=f.vues[i];
  el.querySelector('.etv').innerHTML=`<div class="go">${v.svg||''}</div><p class="etx"><b>${i+1}/${f.vues.length}</b> — ${v.t}</p>`;
  el.querySelector('.etn span').innerHTML=f.vues.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}
function playFig(f){
  f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  const t=f.dataset.t;
  if(t==='cycle'){const ns=[...f.querySelectorAll('.n')],n=ns.length;let i=0;const st=()=>{ns.forEach((x,j)=>x.classList.toggle('on',j===i%n));i++};
    FX.forEach(x=>{if(x.f===f)clearInterval(x)});st();const iv=setInterval(st,1600);iv.f=f;FX.push(iv);

function countUp(el){const v=+el.dataset.v,d=(el.dataset.v.split('.')[1]||'').length,t0=performance.now(),D=1100;

function def(k){const w=C.lexique.find(x=>x[0]===k);$('modalIn').innerHTML=`<span class="mut">📖 Lexique</span><h2>${k}</h2><p style="line-height:1.55">${w?w[1]:''}</p><button class="btn ghost" onclick="$('modal').classList.remove('on')">Fermer</button>`;$('modal').classList.add('on')}

    $('lexList').innerHTML=l.map(([a,i])=>`<button class="row" onclick="appFiche(${i})"><span class="ic">${a.ic||'🧰'}</span><span class="tx"><b>${a.n}</b><span>${a.f}</span></span><span class="mut">›</span></button>`).join('')||'<p class="mut">Aucun résultat.</p>';return}

/* C.appareils = [{n:'Nom',ic:'🔌',f:'fonction (sans citer le nom)',t:'types',c:'caractéristiques',p:'pose / raccordement',m:'contrôle & maintenance',s:'sécurité',mq:'marques',sym:'nom d\'un symbole'}] */

function renderBest(){const b=P.best,L=[`❓ Quiz : ${b.quiz}/10`,`⏱️ Vrai/Faux : ${b.vf}/10`,`⚡ Chrono : ${b.chrono||0} bonnes réponses`,`🔗 Associer : ${b.match?b.match+' s':'—'}`];

function stars(n){n=n||0;return '★'.repeat(n)+'☆'.repeat(3-n)}
/* liste de choix : rows = [[icône,titre,sous-titre,action,étoiles]] */
function liste(titre,sous,rows,extra){show('play');

/* ----- QUIZ ----- */
function startQuiz(mod){
  let pool=C.quiz.filter(q=>!mod||q[0]===mod);
  G={type:'quiz',track:true,list:shuf(pool).slice(0,10),i:0,score:0};G.n=G.list.length;show('play');quizQ();
}
function quizQ(){
  const q=G.list[G.i];const order=q.vf?q[2].map((t,i)=>({t,i})):shuf(q[2].map((t,i)=>({t,i})));
  $('playBody').innerHTML=head()+`<div class="qcard" id="qc"><div>${q[1]}</div></div>
   <div style="display:flex;flex-direction:column;gap:10px">${order.map(o=>`<button class="ans" data-i="${o.i}" onclick="quizA(this)">${o.t}</button>`).join('')}</div>
   <div class="ex" id="ex"></div>`;
}
function quizA(b){
  const q=G.list[G.i],bs=[...document.querySelectorAll('#playBody .ans')];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);
  const ok=+b.dataset.i===q[3];
  bs.forEach(x=>{if(+x.dataset.i===q[3])x.classList.add('ok');else if(x!==b)x.classList.add('dim')});
  if(G.track){const k=(q.vf?'v:':'q:')+q[1];if(ok){if(remErr(k))P.fix++}else addErr(k)}
  if(ok){G.score++;gain(10,b)}else{b.classList.add('ko');shake('qc')}
  $('ex').innerHTML=(ok?'✅ ':'❌ ')+q[4]+`<button class="btn" style="margin-top:12px" onclick="nextQ(quizQ)">Continuer</button>`;$('ex').classList.add('on');
}

/* ----- RÉVISION DES ERREURS ----- les questions ratées (quiz, vrai/faux, examen) reviennent jusqu'à être réussies */
function addErr(k){if(!P.err.includes(k)){P.err.push(k);if(P.err.length>300)P.err.shift();save()}}
function remErr(k){const i=P.err.indexOf(k);if(i<0)return false;P.err.splice(i,1);save();return true}
function vfQz(v){const q=['vf',v[0],['Vrai','Faux'],v[1]?0:1,(v[1]?'C\'est VRAI. ':'C\'est FAUX. ')+v[2]];q.vf=1;return q}
function errList(){return P.err.map(k=>{const t=k.slice(2);if(k[0]==='q')return C.quiz.find(q=>q[1]===t);const v=C.vf.find(x=>x[0]===t);return v&&vfQz(v)}).filter(Boolean)}
function startErr(){const l=errList();if(!l.length){toast('Aucune erreur à revoir 👏');return}G={type:'err',track:true,list:shuf(l).slice(0,10),i:0,score:0};G.n=G.list.length;show('play');quizQ()}

/* ----- VRAI / FAUX ----- */
function startVF(){G={type:'vf',list:shuf(C.vf).slice(0,10),i:0,score:0};G.n=G.list.length;show('play');vfQ()}
function vfQ(){
  const q=G.list[G.i];
  $('playBody').innerHTML=head()+`<div class="timer"><i id="tb"></i></div><div class="qcard" id="qc"><div>${q[0]}</div></div>
   <div class="vf"><button style="background:var(--ok)" onclick="vfA(true)">VRAI</button><button style="background:var(--ko)" onclick="vfA(false)">FAUX</button></div><div class="ex" id="ex"></div>`;
  const t0=Date.now(),D=Math.max(8000,q[0].length*90);clearInterval(G.tm);
  G.tm=setInterval(()=>{const p=1-(Date.now()-t0)/D;$('tb').style.width=Math.max(0,p*100)+'%';if(p<=0)vfA(null)},50);
}
function vfA(v){
  clearInterval(G.tm);const q=G.list[G.i];const bs=document.querySelectorAll('#playBody .vf button');if(bs[0].disabled)return;bs.forEach(b=>b.disabled=true);
  const ok=v===q[1];if(ok){G.score++;gain(10,bs[v?0:1]);if(remErr('v:'+q[0]))P.fix++}else{shake('qc');addErr('v:'+q[0])}
  $('ex').innerHTML=(ok?'✅ Bien vu ! ':v===null?'⏰ Trop lent ! ':'❌ ')+`C'est <b>${q[1]?'VRAI':'FAUX'}</b>. ${q[2]}<button class="btn" style="margin-top:12px" onclick="nextQ(vfQ)">Continuer</button>`;$('ex').classList.add('on');
}

/* ----- CHRONO 60 s ----- quiz + vrai/faux mélangés, sans explication, le plus vite possible */
function startChrono(){G={type:'chrono',list:shuf(C.quiz.concat(C.vf.map(vfQz))),i:0,score:0,err:0,t0:Date.now()};show('play');chronoQ();
  G.tm=setInterval(()=>{const r=60-(Date.now()-G.t0)/1000;if($('cb'))$('cb').style.width=Math.max(0,r/60*100)+'%';if($('cs'))$('cs').textContent=Math.max(0,Math.ceil(r))+' s';if(r<=0){clearInterval(G.tm);chronoEnd()}},100)}
function chronoQ(){const q=G.list[G.i%G.list.length],order=q.vf?q[2].map((t,i)=>({t,i})):shuf(q[2].map((t,i)=>({t,i})));
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="tab('jeux')">✕</button><div class="timer" style="flex:1"><i id="cb"></i></div><span class="pill" id="cs">60 s</span><span class="pill">${G.score} ✓</span></div>
   <div class="qcard" id="qc" style="font-size:18px"><div>${q[1]}</div></div><div style="display:flex;flex-direction:column;gap:10px">${order.map(o=>`<button class="ans" data-i="${o.i}" onclick="chronoA(this)">${o.t}</button>`).join('')}</div>`}
function chronoA(b){const q=G.list[G.i%G.list.length],bs=[...document.querySelectorAll('#playBody .ans')];if(bs[0].disabled||G.done)return;bs.forEach(x=>x.disabled=true);const ok=+b.dataset.i===q[3];
  if(ok){G.score++;b.classList.add('ok');beep(1)}else{G.err++;b.classList.add('ko');bs.forEach(x=>{if(+x.dataset.i===q[3])x.classList.add('ok')});shake('qc')}
  setTimeout(()=>{if(G.type!=='chrono'||G.done)return;G.i++;chronoQ()},ok?350:1100)}
function chronoEnd(){G.done=1;const s=G.score;if(s>(P.best.chrono||0))P.best.chrono=s;P.xp+=s*3;jour(s*3);save();end(Math.min(s,15),15,`${s} bonne${s>1?'s':''} réponse${s>1?'s':''} en 60 s · ${G.err} erreur${G.err>1?'s':''}`)}

/* ----- ASSOCIER ----- */
function startMatch(){
  const pairs=shuf(C.lexique).slice(0,5);G={type:'match',pairs,left:shuf(pairs.map((p,i)=>({t:p[0],i}))),right:shuf(pairs.map((p,i)=>({t:p[1],i}))),sel:null,done:0,err:0,t0:Date.now()};
  show('play');
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="tab('jeux')">✕</button><b>🔗 Associe chaque mot</b><span class="pill" id="mt">0/5</span></div>
  <div class="match"><div class="col">${G.left.map(x=>`<button class="tile" data-k="L" data-i="${x.i}" onclick="pickT(this)">${x.t}</button>`).join('')}</div>
  <div class="col">${G.right.map(x=>`<button class="tile" data-k="R" data-i="${x.i}" onclick="pickT(this)" style="font-weight:500;font-size:13px">${x.t}</button>`).join('')}</div></div>`;
}
function pickT(b){
  if(!G.sel||G.sel.dataset.k===b.dataset.k){document.querySelectorAll('.tile.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');G.sel=b;return}
  const a=G.sel;G.sel=null;a.classList.remove('sel');
  if(a.dataset.i===b.dataset.i){a.classList.add('done');b.classList.add('done');G.done++;gain(10,b);$('mt').textContent=G.done+'/5';
    if(G.done===5){const s=Math.round((Date.now()-G.t0)/1000);if(!P.best.match||s<P.best.match)P.best.match=s;setTimeout(()=>end(5-Math.min(G.err,5),5,`en ${s} s · ${G.err} erreur(s)`),800)}}
  else{G.err++;[a,b].forEach(x=>{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad')})}
}

/* ----- DANS L'ORDRE ----- */
function pickOrdre(){if(C.ordre.length<3)return startOrdre();

  else{G.err++;$('oe').textContent=G.err+' erreur'+(G.err>1?'s':'');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','ko');setTimeout(()=>b.classList.remove('ko'),400)}

/* ----- DÉPANNAGE (si C.diag est défini) -----
   C.diag = [{id,t,ic,niv:1|2|3,bon:{lieu,qui,heure,prio:1|2|3,pb,contrainte},
             etapes:[{info?,fig?,q,o:[['choix',true|false,'résultat ou pourquoi c\'est faux'],…]}],fin:'rapport',retenir?}]

/* C.diagTextes (facultatif) : adapte le jeu Dépannage à une autre matière (ex. « Problèmes pas à pas ») */
function DT(){return Object.assign({titre:'🔎 Dépannage',sous:'Tu reçois un bon de travail. Trouve la panne avec méthode : chaque fausse piste te coûte des étoiles.',entete:'📋 Nouveau bon de travail',carte:'BON DE TRAVAIL N°',prio:true,champs:[['lieu','📍 Lieu'],['qui','👤 Demandeur'],['heure','🕐 Appel'],['pb','⚠️ Symptôme'],['contrainte','⛓️ Contrainte']],go:'🧰 Commencer l\'intervention',fin:'Terminer l\'intervention',parfait:'Panne trouvée sans fausse piste !',ok:'Panne réparée !',rapport:'📝 Rapport d\'intervention',autre:'Autre intervention',piste:'fausse piste',jour:'Intervention du jour'},C.diagTextes||{})}
function listDiag(){liste(DT().titre,DT().sous,C.diag.map((d,i)=>[d.ic||'🔎',d.t,(NIV[d.niv]||'')+' · '+d.bon.lieu,`startDiag(${i})`,P.diag[d.id]]))}
function startDiag(i){const d=C.diag[i],b=d.bon;G={type:'diag',d,k:i,i:0,err:0};show('play');
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="listDiag()">✕</button><b>${DT().entete}</b><span style="width:24px"></span></div>
  <div class="bt"><div class="bth"><b>${DT().carte} ${2600+i*7}</b>${DT().prio?`<span class="prio p${b.prio||2}">${['','🚨 Urgent','Normal','Planifié'][b.prio||2]}</span>`:''}</div>
   ${DT().champs.map(([k,t])=>[t,b[k]]).filter(x=>x[1]).map(x=>`<div class="btl"><span>${x[0]}</span><p>${x[1]}</p></div>`).join('')}</div>
  <p class="mut" style="text-align:center">${d.etapes.length} étapes · ${NIV[d.niv]||''}</p>
  <button class="btn" onclick="diagQ()">${DT().go}</button>`}
function diagQ(){const d=G.d,e=d.etapes[G.i];
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="listDiag()">✕</button><div class="prog"><i style="width:${G.i/d.etapes.length*100}%"></i></div><span class="pill">${G.i+1}/${d.etapes.length}</span></div>
   <div class="card mini"><span class="mut">📋 ${d.t}</span><span style="font-size:14px;line-height:1.4">${d.bon.pb}</span></div>
   ${e.info?`<div class="msg inf">🔍 ${e.info}</div>`:''}${e.fig?figHTML(e.fig):''}
   <div class="qcard dq" id="qc"><div>${e.q}</div></div>
   <div style="display:flex;flex-direction:column;gap:10px">${shuf(e.o.map((o,i)=>({t:o[0],i}))).map(o=>`<button class="ans" data-i="${o.i}" onclick="diagA(this)">${o.t}</button>`).join('')}</div>
   <div class="ex" id="ex"></div>`;
  initFigs($('playBody'));$('playBody').querySelectorAll('.fig').forEach(playFig)}
function diagA(b){const e=G.d.etapes[G.i],o=e.o[+b.dataset.i];if(b.disabled)return;
  if(o[1]){document.querySelectorAll('#playBody .ans').forEach(x=>x.disabled=true);b.classList.add('ok');gain(G.ko?5:15,b);G.ko=0;
    $('ex').innerHTML='✅ '+o[2]+`<button class="btn" style="margin-top:12px" onclick="diagNext()">${G.i+1<G.d.etapes.length?'Étape suivante →':DT().fin}</button>`;$('ex').classList.add('on');$('ex').scrollIntoView({behavior:'smooth',block:'nearest'})}
  else{G.err++;G.ko=1;b.disabled=true;b.classList.add('ko');shake('qc');$('ex').innerHTML='❌ '+o[2]+'<div class="mut" style="margin-top:6px">Essaie une autre piste.</div>';$('ex').classList.add('on')}}
function diagNext(){G.i++;if(G.i<G.d.etapes.length)return diagQ();
  const d=G.d,st=G.err===0?3:G.err<=2?2:1;P.diag[d.id]=Math.max(P.diag[d.id]||0,st);P.parties++;save();badgeCheck();if(st>=2)confetti();
  pubInterstitiel(()=>{show('play');$('playBody').innerHTML=`<div class="big">${st===3?'🏆':st===2?'🔧':'💪'}</div><h1 style="text-align:center">${st===3?DT().parfait:DT().ok}</h1><div class="stars">${stars(st)}</div><p class="mut" style="text-align:center">${G.err} ${DT().piste}${G.err>1?'s':''}</p>
   <div class="sec"><h3>${DT().rapport}</h3><p>${d.fin}</p></div>${d.retenir?`<div class="box ret"><b>📌 À retenir</b>${d.retenir}</div>`:''}
   <button class="btn" onclick="listDiag()">${DT().autre}</button><button class="btn ghost" onclick="tab('jeux')">Retour aux jeux</button>${pubBanniere()}`;pubB()})}

/* ----- CÂBLAGE (si C.cablage est défini) -----
   C.cablage = [{id,t,ic,niv,d:'consigne',aide:'indice',fin:'explication',h:hauteur du plan (défaut 400),
     app:[{id,t:'Nom',ic:'💡',x,y,w,h,cote:'b'|'t',ty?,b:[['L','Phase'],['N','Neutre',x?,y?,dir?]]}],   bornes réparties sur le bord bas (b) ou haut (t), ou placées en x,y (dir 't','b' ou 'n') ; ty = hauteur du titre dans le cadre
     sol:[['P','app.borne','app.borne',…],…],   un « réseau » par ligne : toutes ses bornes doivent être reliées entre elles et à rien d'autre
         type : P phase · N neutre · T terre · X retour/navette/commande · B barrette (toute couleur)
     perm:[['app.b1','app.b2']],                  bornes interchangeables (toutes les permutations sont acceptées)
     lum:['app'],                                 appareils qui s'allument quand c'est juste (rot:true sur l'appareil = il tourne)
     coul:false}]                                 pour ne pas vérifier les couleurs */
const COUL={marron:['#8d5524','Marron'],noir:['#1a1a1a','Noir'],rouge:['#e53935','Rouge'],gris:['#9aa3b5','Gris'],orange:['#ff8f1f','Orange'],violet:['#9c4dcc','Violet'],bleu:['#1e88e5','Bleu'],vj:['url(#vj)','Vert/jaune']};
const REGLE={P:['marron','noir','rouge','gris'],N:['bleu'],T:['vj'],X:['marron','noir','rouge','gris','orange','violet'],B:null};
const TXTR={P:'Une phase se câble en marron, noir, rouge ou gris.',N:'Le neutre est toujours bleu.',T:'La terre est toujours vert/jaune.',X:'Un retour lampe, une navette ou un fil de commande : n\'importe quelle couleur sauf le bleu et le vert/jaune.'};
function listCab(){liste('🔧 Câblage','Choisis la couleur du fil, touche une borne puis une autre pour tirer le fil. Touche un fil pour l\'enlever.',C.cablage.map((c,i)=>[c.ic||'🔧',c.t,NIV[c.niv]||'',`startCab(${i})`,P.cab[c.id]]))}
function permsOf(a){if(a.length<2)return [a];return a.flatMap((x,i)=>permsOf(a.filter((_,j)=>j!==i)).map(p=>[x,...p]))}
function cabSols(ex){let maps=[{}];(ex.perm||[]).forEach(g=>{const ps=permsOf(g);maps=maps.flatMap(m=>ps.map(p=>{const n=Object.assign({},m);g.forEach((b,i)=>n[b]=p[i]);return n}))});
  return maps.map(m=>ex.sol.map(([ty,...bs])=>[ty,...bs.map(b=>m[b]||b)]))}
function cabPos(ex){const pos={};ex.app.forEach(a=>{const n=a.b.length;a.b.forEach((b,k)=>{const ex_=b[2]!=null;
  const d=ex_?(b[4]||'n'):(a.cote==='t'?'t':'b'),x=ex_?a.x+b[2]:a.x+(k+1)*a.w/(n+1),y=ex_?a.y+b[3]:(d==='t'?a.y:a.y+a.h);pos[a.id+'.'+b[0]]={x,y,l:b[1],a,d}})});return pos}
function startCab(i){const ex=C.cablage[i];G={type:'cab',ex,k:i,w:[],sel:null,col:'marron',err:0,aide:0,pos:cabPos(ex)};show('play');
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="listCab()">✕</button><b>${ex.ic||'🔧'} ${ex.t}</b><span class="pill" id="ce">0 essai</span></div>
   <div class="msg inf">${ex.d}</div>
   <div class="pal" id="pal"></div><div class="board" id="brd"></div><div id="cmsg"></div>
   <div class="btns" id="cbt"><button class="btn ghost" onclick="cabUndo()">↶ Annuler</button><button class="btn ghost" onclick="cabAide()">💡 Indice</button><button class="btn ghost" onclick="if(confirm('Tout effacer ?')){G.w=[];cabDraw()}">🗑️ Effacer</button><button class="btn" onclick="cabCheck()">✔ Vérifier</button></div>`;
  cabPal();cabDraw()}
function cabPal(){$('pal').innerHTML=Object.keys(COUL).map(c=>`<button class="${G.col===c?'on':''}" title="${COUL[c][1]}" style="background:${c==='vj'?'repeating-linear-gradient(45deg,#2e9d3a 0 6px,#f2d10f 6px 12px)':COUL[c][0]}" onclick="G.col='${c}';cabPal()"></button>`).join('')+`<div class="mut" style="width:100%;text-align:center;font-size:13px">Fil choisi : <b style="color:#fff">${COUL[G.col][1]}</b></div>`}
function cabDraw(){const ex=G.ex,H=ex.h||400,D={t:[0,-1],b:[0,1],n:[0,0]};
  const ws=G.w.map((w,j)=>{const a=G.pos[w.a],b=G.pos[w.b],da=D[a.d],db=D[b.d],L=Math.min(60,20+Math.hypot(a.x-b.x,a.y-b.y)/4);
    const p=`M${a.x},${a.y} C${a.x+da[0]*L},${a.y+da[1]*L} ${b.x+db[0]*L},${b.y+db[1]*L} ${b.x},${b.y}`;
    return `<path d="${p}" class="cw" stroke="${COUL[w.c][0]}"/><path d="${p}" class="hit" onclick="cabDel(${j})"/>`}).join('');
  const caps=ex.app.map(a=>{const lit=G.ok&&(ex.lum||[]).includes(a.id),ty=a.ty!=null?a.y+a.ty:a.cote==='t'?a.y+a.h-10:a.y+17,iy=a.ty!=null?a.y+a.ty+3:a.cote==='t'?a.y+a.h-8:a.y+24;
    return `<g class="cap ${lit?'lit':''}"><rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="10"/><text class="tt" x="${a.x+8}" y="${ty}">${a.t}</text>${a.ic?`<text class="ict ${lit&&a.rot?'spin':''}" x="${a.x+a.w-8}" y="${iy}" text-anchor="end">${a.ic}</text>`:''}</g>`}).join('');
  const bs=Object.entries(G.pos).map(([id,p])=>{const ly=p.d==='t'?p.y+22:p.d==='b'?p.y-13:p.y+24;
    return `<g class="cb ${G.sel===id?'sel':''}" onclick="cabTap('${id}')"><circle cx="${p.x}" cy="${p.y}" r="17" fill="transparent"/><circle class="vis" cx="${p.x}" cy="${p.y}" r="8.5"/><text class="lb" x="${p.x}" y="${ly}">${p.l}</text></g>`}).join('');
  $('brd').innerHTML=`<svg viewBox="0 0 360 ${H}" class="${G.ok?'okb':''}"><defs><pattern id="vj" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="10" fill="#2e9d3a"/><rect x="5" width="5" height="10" fill="#f2d10f"/></pattern></defs>${caps}${ws}${bs}</svg>`}
function cabTap(id){if(G.ok)return;if(!G.sel)G.sel=id;else if(G.sel===id)G.sel=null;else{const a=G.sel;G.sel=null;
  const j=G.w.findIndex(w=>(w.a===a&&w.b===id)||(w.a===id&&w.b===a));if(j>=0)G.w.splice(j,1);else G.w.push({a,b:id,c:G.col})}cabDraw()}
function cabDel(j){if(G.ok)return;G.w.splice(j,1);cabDraw()}
function cabUndo(){if(G.ok)return;G.w.pop();G.sel=null;cabDraw()}
function cabAide(){if(!G.aide){G.aide=1;G.err++;$('ce').textContent=G.err+' essai'+(G.err>1?'s':'')}$('cmsg').innerHTML=`<div class="msg inf">💡 ${G.ex.aide}</div>`}
function cabEval(sol,f){const er=[],netOf={},L=b=>`<b>${G.pos[b].a.t}</b> (${G.pos[b].l})`;
  sol.forEach((n,k)=>n.slice(1).forEach(b=>netOf[b]=k));
  const comp={};Object.keys(G.pos).forEach(b=>{const r=f(b);(comp[r]=comp[r]||[]).push(b)});
  Object.values(comp).forEach(bs=>{if(bs.length<2)return;const nets=[...new Set(bs.filter(b=>netOf[b]!==undefined).map(b=>netOf[b]))];
    if(nets.length>1){const ty=nets.map(k=>sol[k][0]),has=t=>ty.includes(t);
      er.push({g:0,m:has('P')&&has('N')?'💥 Court-circuit : une phase est reliée au neutre ! Le disjoncteur sauterait dès la mise sous tension.':has('T')&&(has('P')||has('X'))?'💥 Défaut à la terre : un conducteur actif touche la terre ! Le différentiel déclencherait.':'⚡ Ces bornes ne doivent pas être reliées entre elles : '+bs.filter(b=>netOf[b]!==undefined).slice(0,3).map(L).join(', ')+'.'})}
    const inut=bs.filter(b=>netOf[b]===undefined);if(inut.length)er.push({g:1,m:'🔌 Ce fil ne devrait pas arriver ici : '+inut.map(L).join(', ')+'.'})});
  sol.forEach(n=>{const bs=n.slice(1),r0=f(bs[0]),m=bs.find(b=>f(b)!==r0);if(m)er.push({g:2,m:'🔗 Liaison manquante : '+L(bs[0])+' doit être relié(e) à '+L(m)+'.'})});
  if(G.ex.coul!==false)G.w.forEach(w=>{const k=netOf[w.a]!==undefined?netOf[w.a]:netOf[w.b];if(k===undefined)return;const ty=sol[k][0],ok=REGLE[ty];
    if(ok&&!ok.includes(w.c))er.push({g:3,m:'🎨 Couleur : le fil entre '+L(w.a)+' et '+L(w.b)+' est '+COUL[w.c][1].toLowerCase()+'. '+TXTR[ty]})});
  return er.sort((a,b)=>a.g-b.g)}
function cabCheck(){if(G.ok)return;if(!G.w.length){$('cmsg').innerHTML='<div class="msg ko">Tire au moins un fil : touche une borne, puis une autre.</div>';return}
  const par={};Object.keys(G.pos).forEach(i=>par[i]=i);const f=i=>par[i]===i?i:(par[i]=f(par[i]));G.w.forEach(w=>{par[f(w.a)]=f(w.b)});
  let best=null;cabSols(G.ex).forEach(sol=>{const e=cabEval(sol,f);if(!best||e.length<best.length)best=e});
  if(best.length){G.err++;$('ce').textContent=G.err+' essai'+(G.err>1?'s':'');beep(0);$('brd').classList.remove('shake');void $('brd').offsetWidth;$('brd').classList.add('shake');
    $('cmsg').innerHTML=`<div class="msg ko"><b>${best.length} problème${best.length>1?'s':''} trouvé${best.length>1?'s':''}.</b><br>${best[0].m}</div>`;return}
  G.ok=1;const st=G.err===0?3:G.err<=2?2:1,id=G.ex.id;P.cab[id]=Math.max(P.cab[id]||0,st);P.parties++;cabDraw();confetti();gain(30,$('brd'));
  $('cmsg').innerHTML=`<div class="msg ok"><b>✅ Câblage correct ! ${stars(st)}</b><br>${G.ex.fin}</div>`;
  $('cbt').innerHTML=`<button class="btn ghost" onclick="startCab(${G.k})">🔁 Recommencer</button><button class="btn" onclick="listCab()">Autre câblage</button>`;
  $('cmsg').scrollIntoView({behavior:'smooth',block:'nearest'})}

function listTri(){liste('🗂️ Classement','Range chaque élément dans la bonne catégorie.',C.tri.map((t,i)=>[t.ic||'🗂️',t.t,t.items.length+' éléments',`startTri(${i})`,P.tri[t.t]]))}

function triA(b){const it=G.list[G.i],bs=[...document.querySelectorAll('#trc .ans')];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);const ok=G.t.cats[+b.dataset.c]===it[1];

function triNext(){G.i++;if(G.i<G.n)return triQ();const r=G.score/G.n,st=r>=.9?3:r>=.6?2:1;P.tri[G.t.t]=Math.max(P.tri[G.t.t]||0,st);end(G.score,G.n,G.score+' / '+G.n+' bien rangés')}

/* ----- SYMBOLES (si C.symboles est défini) -----

function startSym(){G={type:'sym',list:shuf(C.symboles).slice(0,10),i:0,score:0};G.n=G.list.length;show('play');symQ()}
function symQ(){const s=G.list[G.i];G.inv=Math.random()<.35;G.opts=shuf([s].concat(shuf(C.symboles.filter(x=>x!==s)).slice(0,3)));

   :`<div class="qcard" id="qc">${symSVG(s,'big')}<small>Que représente ce symbole ?</small></div><div style="display:flex;flex-direction:column;gap:10px">${G.opts.map((o,k)=>`<button class="ans" data-k="${k}" onclick="symA(this)">${o[0]}</button>`).join('')}</div>`)+`<div class="ex" id="ex"></div>`}
function symA(b){const s=G.list[G.i],bs=[...document.querySelectorAll('#playBody .ans')];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);const ok=G.opts[+b.dataset.k]===s;

  if(ok){G.score++;gain(10,b)}else{b.classList.add('ko');shake('qc')}
  $('ex').innerHTML=(ok?'✅ ':'❌ ')+'<b>'+s[0]+'</b>'+(s[2]?' — '+s[2]:'')+`<button class="btn" style="margin-top:12px" onclick="nextQ(symQ)">Continuer</button>`;$('ex').classList.add('on')}
