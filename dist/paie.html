<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Paie Pro</title>
<style>
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));--bg:#10142a;--card:#1c2244;--card2:#252c58;--pri:#ffc83d;--pri2:#d99a00;--acc:#3db5ff;--ok:#2ed47a;--ko:#ff5470;--txt:#fff;--mut:#a9b0d6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:calc(16px + var(--sat)) 16px calc(96px + var(--sab));min-height:100vh}
.screen{display:none;flex-direction:column;gap:14px;animation:fade .3s}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:26px}h2{font-size:21px}h3{font-size:17px}
.mut{color:var(--mut);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:rgba(255,255,255,.08);padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap}
button.pill{border:none;color:#fff;cursor:pointer}
.back{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:2px 8px 2px 0}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#1b1640;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center}
.hero .ic{font-size:54px;animation:zap 2.5s infinite}
@keyframes zap{0%,90%,100%{transform:none}93%{transform:rotate(-12deg) scale(1.1)}96%{transform:rotate(10deg)}}
.hero b{font-size:22px;display:block}
.bar{height:10px;background:rgba(0,0,0,.15);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#1b1640;border-radius:99px;transition:width .5s}
.card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.mini{padding:10px 14px;gap:2px}
.word{background:var(--card2);border-left:4px solid var(--acc)}
.row{display:flex;gap:12px;align-items:center;cursor:pointer;border:none;background:var(--card);color:#fff;border-radius:18px;padding:14px;text-align:left;width:100%;font-size:16px}
.row .ic{font-size:30px;width:48px;height:48px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .tx{flex:1;min-width:0}.row .tx b{display:block}.row .tx span{font-size:13px;color:var(--mut)}
.row .ok{color:var(--ok);font-weight:900}
.row .st{color:var(--pri);font-weight:900;letter-spacing:1px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{border:none;border-radius:20px;padding:18px 10px;color:#1b1640;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.game .e{font-size:38px}.game small{font-weight:600;font-size:12px;opacity:.8}
.game:active,.btn:active,.ans:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn{border:none;border-radius:16px;padding:15px;font-size:17px;font-weight:800;color:#1b1640;background:var(--pri);box-shadow:0 5px 0 var(--pri2);cursor:pointer;width:100%}
.btn.ghost{background:var(--card2);color:#fff;box-shadow:none}
.btn:disabled{opacity:.5}
/* fiche */
.sec{background:var(--card);border-radius:18px;padding:16px}
.sec h3{margin-bottom:8px;color:var(--pri)}
.sec p,.sec li{line-height:1.55;font-size:15.5px}
.sec ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.key{background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.35);border-radius:16px;padding:14px}
.key h3{color:var(--pri);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:none;color:var(--acc);padding:8px 12px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer}
/* lexique */
.search{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--card2);background:var(--card);color:#fff;font-size:16px;outline:none}
.search:focus{border-color:var(--pri)}
.lex{background:var(--card);border-radius:16px;padding:14px;cursor:pointer}
.lex b{color:var(--pri)}.lex p{margin-top:6px;line-height:1.5;display:none;font-size:15px}
.lex.open p{display:block}
.seg{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:14px}
.seg button{flex:1;border:none;background:none;color:var(--mut);font-weight:800;font-size:14px;padding:10px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--pri);color:#10142a}
/* jeux */
.prog{flex:1;height:12px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qcard{background:#fff;color:#10142a;border-radius:22px;padding:24px 18px;text-align:center;font-size:21px;font-weight:800;line-height:1.35;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.qcard.dq,.qcard.at{font-size:17.5px;min-height:90px;padding:18px 16px}
.qcard small{display:block;font-size:14px;color:#555c80;font-weight:700;margin-top:6px}
.shake{animation:shake .4s}
@keyframes shake{25%,75%{transform:translateX(-9px)}50%{transform:translateX(9px)}}
.ans{border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:700;color:#fff;background:var(--card);box-shadow:0 4px 0 #0a0d1d;cursor:pointer;text-align:left;width:100%;line-height:1.35}
.ans.ok{background:var(--ok);box-shadow:0 4px 0 #1a9a56;color:#10142a}
.ans.ko{background:var(--ko);box-shadow:0 4px 0 #c23250}
.ans.dim{opacity:.4}
.ex{background:var(--card2);border-radius:16px;padding:14px;font-size:15px;line-height:1.5;display:none}
.ex.on{display:block;animation:fade .3s}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{border:none;border-radius:18px;padding:22px;font-size:22px;font-weight:900;color:#fff;cursor:pointer}
.timer{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--pri);width:100%}
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.tile{border:2px solid transparent;border-radius:14px;padding:12px 10px;background:var(--card);color:#fff;font-size:14px;font-weight:700;cursor:pointer;min-height:58px;text-align:left;transition:.2s}
.tile.sel{border-color:var(--pri);background:var(--card2)}
.tile.done{background:var(--ok);opacity:0;transform:scale(.9);pointer-events:none;transition:.5s .3s}
.tile.bad{animation:shake .4s;border-color:var(--ko)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{background:var(--ok);color:#10142a;border-radius:14px;padding:12px;font-weight:800;animation:fade .3s}
.step.empty{background:transparent;border:2px dashed var(--card2);color:var(--mut);font-weight:600}
.big{font-size:90px;text-align:center}
.stars{font-size:44px;text-align:center;color:var(--pri);letter-spacing:6px}
.float{position:fixed;font-weight:900;font-size:22px;color:var(--pri);pointer-events:none;animation:up 1s forwards;z-index:9}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0e20;border-top:1px solid var(--card2);display:flex;justify-content:center;z-index:5;padding-bottom:var(--sab)}
nav .in{display:flex;max-width:480px;width:100%}
nav button{flex:1;background:none;border:none;color:var(--mut);padding:10px 0 14px;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
.modal.on{display:flex}
.modal .in{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 16px calc(28px + var(--sab));display:flex;flex-direction:column;gap:10px;animation:fade .25s;max-height:88vh;overflow:auto}
.pub{background:repeating-linear-gradient(45deg,var(--card),var(--card) 10px,var(--card2) 10px,var(--card2) 20px);border-radius:14px;min-height:60px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:1px}
.pub.full{position:fixed;inset:0;z-index:40;border-radius:0;flex-direction:column;gap:16px;font-size:14px}
/* parcours par niveaux */
.nvh{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:0 2px}
.nvh b{font-size:19px}
/* fiches wiki */
.rbar{position:fixed;top:var(--sat);left:0;right:0;height:4px;z-index:6;background:transparent}
.rbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .1s}
.fhero{display:flex;gap:14px;align-items:center}
.fhero .fic{font-size:52px;width:76px;height:76px;border-radius:22px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.chapo{font-size:17px;line-height:1.6;border-left:4px solid var(--pri);padding:4px 0 4px 14px}
.toc{display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:16px;padding:12px}
.toc b{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.toc button{background:none;border:none;color:var(--acc);text-align:left;font-size:15px;font-weight:700;cursor:pointer;padding:4px 0}
.sh{display:flex;gap:10px;align-items:center;margin-bottom:10px}.sh h3{margin:0!important}
.num{width:30px;height:30px;border-radius:10px;background:var(--pri);color:#10142a;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec>p{line-height:1.65;font-size:15.5px;margin-bottom:10px}
.box{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.55}
.box>b{display:block;margin-bottom:4px}
.box ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.box.ex2{background:rgba(61,181,255,.12);border:1px solid rgba(61,181,255,.35)}
.box.att{background:rgba(255,84,112,.12);border:1px solid rgba(255,84,112,.4)}
.box.info{background:rgba(177,140,255,.13);border:1px solid rgba(177,140,255,.4)}
.box.ret{background:rgba(46,212,122,.12);border:1px solid rgba(46,212,122,.4);margin-top:0}
.mq{margin-top:12px;background:var(--card2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mq>b{font-size:13px;color:var(--pri)}.mq p{font-weight:700;line-height:1.45}
.mq .ans{padding:11px 14px;font-size:15px;box-shadow:0 3px 0 #0a0d1d}
.mq .ex{display:none}.mq .ex.on{display:block}
.toast{position:fixed;left:50%;top:calc(18px + var(--sat));transform:translateX(-50%);background:var(--ok);color:#10142a;font-weight:900;padding:12px 18px;border-radius:99px;z-index:50;animation:toast 2.6s forwards;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.day{display:flex;gap:12px;align-items:center}
.day .fl{font-size:34px}.day .fl.off{filter:grayscale(1);opacity:.5}
/* figures animées */
.fig{margin-top:12px;background:var(--card2);border-radius:14px;padding:14px 12px 12px;position:relative}
.fig .rej{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;z-index:2}
.fig .leg{text-align:center;color:var(--mut);font-size:13px;margin-top:8px}
.fig svg{display:block;width:100%;max-width:340px;margin:0 auto;height:auto}
.cyc{position:relative;width:100%;max-width:310px;aspect-ratio:1;margin:0 auto}
.cyc svg{position:absolute;inset:0;max-width:none}
.cyc .n{position:absolute;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--c,var(--acc));border-radius:12px;padding:6px 8px;font-size:12px;font-weight:700;text-align:center;width:max-content;max-width:42%;transition:.35s;line-height:1.3}
.cyc .n.on{background:var(--c,var(--acc));color:#10142a;transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 18px var(--c,var(--acc))}
.cyc .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:800;font-size:13px;color:var(--mut);max-width:34%}
.flx{display:flex;flex-direction:column;gap:4px}
.flx .b{background:var(--card);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px;opacity:0}
.flx .b b{color:var(--pri);white-space:nowrap}
.flx .b.fin{background:var(--pri);color:#10142a}.flx .b.fin b{color:#10142a}
.flx .a{text-align:center;color:var(--pri);opacity:0;font-size:15px;line-height:1.1;font-weight:900}
.go .flx .b,.go .flx .a{animation:fade .45s forwards}
.brs{display:flex;flex-direction:column;gap:10px}
.brs .r{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.brs .t{height:14px;background:var(--card);border-radius:99px;overflow:hidden;margin-top:4px}
.brs .t i{display:block;height:100%;width:0;background:var(--c,var(--pri));border-radius:99px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.chf{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.chf div{background:var(--card);border-radius:12px;padding:12px 8px;text-align:center}
.chf b{display:block;font-size:24px;color:var(--pri)}.chf span{font-size:12px;color:var(--mut);line-height:1.3;display:block;margin-top:2px}
/* figures interactives (type inter) et pas à pas (type etapes) */
.itr .ibt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.itr .chip.act{background:var(--pri);color:#10142a}
.itr .imsg{text-align:center;font-weight:800;margin-top:8px;font-size:14.5px;min-height:20px}
.fig .lp{fill:var(--card);stroke:#fff;stroke-width:2;transition:.3s}
.fig .lp.on{fill:var(--pri);filter:drop-shadow(0 0 10px var(--pri))}
.fig .w{fill:none;stroke:#5a64a8;stroke-width:3;transition:stroke .3s}
.fig .w.on{stroke:var(--pri);stroke-dasharray:6 6;animation:flow 1s linear infinite}
.fig .w.ko{stroke:var(--ko);stroke-dasharray:6 6;animation:flow .6s linear infinite}
.fig .hide{display:none}
.etp .etx{margin-top:10px;text-align:center;line-height:1.5;font-size:14.5px}
.etn{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.etn span{display:flex;gap:5px}.etn i{width:8px;height:8px;border-radius:50%;background:var(--card)}.etn i.on{background:var(--pri)}
/* classes d'animation utilisables dans les SVG du contenu */
.flow{animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}
.glow{animation:glow 1.6s ease-in-out infinite}@keyframes glow{50%{opacity:.55}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.go .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}@keyframes pop{from{transform:scale(0);opacity:0}}
.go .draw{stroke-dasharray:600;animation:draw 1.4s ease-out backwards}@keyframes draw{from{stroke-dashoffset:600}}
.go .appear{animation:fade .5s backwards}
/* bon de travail (dépannage) */
.bt{background:var(--card);border:2px dashed var(--pri);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bth{display:flex;justify-content:space-between;align-items:center;gap:8px}.bth b{font-size:13px;letter-spacing:1px;color:var(--pri)}
.prio{font-size:12px;font-weight:900;padding:4px 10px;border-radius:99px;color:#10142a;white-space:nowrap}.prio.p1{background:var(--ko)}.prio.p2{background:var(--pri)}.prio.p3{background:var(--ok)}
.btl span{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.5px}.btl p{line-height:1.45;margin-top:2px;font-size:15px}
/* câblage */
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pal button{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.pal button.on{border-color:#fff;transform:scale(1.18)}
.board{background:var(--card);border-radius:18px;padding:4px;touch-action:manipulation}
.board svg{display:block;width:100%;height:auto;user-select:none}
.cap rect{fill:var(--card2);stroke:#46508f;stroke-width:2}
.cap .tt{fill:#fff;font:800 11.5px system-ui}.cap .ict{font-size:22px}
.cap.lit rect{stroke:var(--pri);stroke-width:3}.cap.lit .ict{filter:drop-shadow(0 0 8px #ffc83d)}
.cb{cursor:pointer}.cb .vis{fill:#d9dce8;stroke:#10142a;stroke-width:2}.cb.sel .vis{fill:var(--pri);stroke:#fff;stroke-width:3}
.cb .lb{fill:var(--mut);font:800 10.5px system-ui;text-anchor:middle;pointer-events:none}
.cw{fill:none;stroke-width:5;stroke-linecap:round;pointer-events:none}
.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.okb .cw{stroke-dasharray:9 5;animation:flow .8s linear infinite}
.msg{border-radius:14px;padding:12px 14px;line-height:1.5;font-size:15px}
.msg.ko{background:rgba(255,84,112,.15);border:1px solid rgba(255,84,112,.5)}
.msg.ok{background:rgba(46,212,122,.15);border:1px solid rgba(46,212,122,.5)}
.msg.inf{background:var(--card2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .btn{padding:12px;font-size:15px}
/* symboles */
.sym{width:100%;height:auto;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:block}
.sym .t{fill:currentColor;stroke:none;font:800 15px system-ui;text-anchor:middle}
.sym .f{fill:currentColor}
.sym.big{max-width:210px;margin:0 auto}
.ans.symb{display:flex;align-items:center;justify-content:center;min-height:92px;padding:10px}
.ans.symb svg{max-width:120px}
.symg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.symc{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.symc svg{max-width:110px;color:#fff}.symc b{font-size:14px}.symc span{font-size:12px;color:var(--mut);line-height:1.35}
/* atelier de calcul */
.atin{display:flex;gap:10px;align-items:center}
.atin input{flex:1;padding:16px;border-radius:16px;border:2px solid var(--card2);background:var(--card);color:#fff;font-size:22px;font-weight:800;outline:none;text-align:center;min-width:0}
.atin input:focus{border-color:var(--pri)}.atin span{font-weight:900;font-size:20px;color:var(--pri);min-width:36px}
/* badges & fiches appareils */
.bdg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bdg div{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:3px;opacity:.45;filter:grayscale(1)}
.bdg div.on{opacity:1;filter:none;box-shadow:inset 0 0 0 2px var(--pri)}
.bdg span{font-size:28px}.bdg b{font-size:12px}.bdg small{font-size:10.5px;color:var(--mut);line-height:1.3}
.appf h3{color:var(--pri);font-size:15px;margin-top:6px}.appf p{line-height:1.55;font-size:15px}
.appf .symc{background:var(--card2)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div class="app">

<section class="screen on" id="home">
  <div class="top"><h1 id="appName"></h1><button class="pill" id="xpP" onclick="profil()"></button></div>
  <div class="hero"><div class="ic" id="appIc"></div><div style="flex:1"><b id="gradeTx">Ta progression</b><span id="progTx"></span><div class="bar"><i id="progBar"></i></div></div></div>

   <div class="key"><h3>🔑 Mots-clés</h3><div class="chips">${m.k.map(k=>`<button class="chip" onclick="def('${k.replace(/'/g,"\\'")}')">${k}</button>`).join('')}</div></div>

  show('fiche');initFigs($('ficheBody'));

/* barre de lecture */
addEventListener('scroll',()=>{const r=$('rb');if(!r||!$('fiche').classList.contains('on'))return;const h=document.documentElement.scrollHeight-innerHeight;r.style.width=(h>0?Math.min(100,scrollY/h*100):100)+'%'},{passive:true});
function watch(el,f){if(!('IntersectionObserver' in window))return f();const o=new IntersectionObserver(e=>{if(e[0].isIntersecting){o.disconnect();f()}},{threshold:.35});o.observe(el)}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}

/* mini-question dans la fiche : [question,[bonne,faux,…],0,explication] */
function mqHTML(q,key){const o=shuf(q[1].map((t,i)=>({t,i})));
  return `<div class="mq" data-q="${key}"><b>✋ Vérifie que tu as compris</b><p>${q[0]}</p>${o.map(x=>`<button class="ans" data-i="${x.i}" onclick="mqA(this)">${x.t}</button>`).join('')}<div class="ex"></div></div>`}
function mqA(b){const box=b.closest('.mq'),k=box.dataset.q,[mid,si]=k.split(':'),m=C.modules.find(x=>x.id===mid);
  const s=Object.assign({},m.s[si],((C.fiches||{})[mid]||{s:[]}).s[si]||{}),q=s.q,bs=[...box.querySelectorAll('.ans')];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);
  const ok=+b.dataset.i===q[2];bs.forEach(x=>{if(+x.dataset.i===q[2])x.classList.add('ok');else if(x!==b)x.classList.add('dim')});

  const e=box.querySelector('.ex');e.innerHTML=(ok?'✅ ':'❌ ')+q[3];e.classList.add('on');}

/* ----- FIGURES ANIMÉES -----
   fig:{type:'cycle',etapes:['A','B',['C','#ff5470']],centre:'…'}   étapes en boucle
   fig:{type:'flux',etapes:['A',['B','valeur'],…],ops:['− 5','÷ 3']}  étapes qui apparaissent une à une
   fig:{type:'barres',items:[['Libellé',valeur,'unité','#couleur'],…]}  barres comparées
   fig:{type:'chiffres',items:[[valeur,'unité','légende'],…]}          chiffres clés qui défilent
   fig:{type:'svg',svg:'<svg…>'}  dessin libre (classes : flow, glow, spin, pop, draw, appear)
   fig:{type:'inter',svg:'<svg…>',inters:[['a','Interrupteur 1',2],…],f:s=>['clé',…],msg:s=>'texte'}
       schéma interactif : chaque bouton fait tourner l'état s.a (0,1… nb positions).
       Dans le SVG : data-v="a:1" = visible seulement si s.a vaut 1 ; data-k="clé" = reçoit la classe "on"
       si f(s) renvoie cette clé (classes prêtes : lp = lampe, w = fil, w ko = fil en défaut).
   fig:{type:'etapes',vues:[{svg:'<svg…>',t:'texte'},…]}  pas à pas avec ◀ ▶
   + legende:'…' (facultatif) */
const FIGR=[];
function figHTML(f){let h='';
  if(f.type==='cycle'){const n=f.etapes.length,T=n*1.6;
    h=`<div class="cyc" data-n="${n}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--card)" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="none" stroke="var(--pri)" stroke-width="1.2" stroke-dasharray="3 5" class="flow" opacity=".7"/><circle r="3" fill="var(--pri)"><animateMotion dur="${T}s" repeatCount="indefinite" path="M50,12 A38,38 0 1,1 49.99,12"/></circle></svg>
     ${f.etapes.map((e,i)=>{const [t,c]=Array.isArray(e)?e:[e],a=(-90+i*360/n)*Math.PI/180;return `<div class="n" style="left:${50+38*Math.cos(a)}%;top:${50+38*Math.sin(a)}%;${c?'--c:'+c:''}">${t}</div>`}).join('')}
     ${f.centre?`<div class="ctr">${f.centre}</div>`:''}</div>`}
  else if(f.type==='flux'){h=`<div class="flx">${f.etapes.map((e,i)=>{const [t,v]=Array.isArray(e)?e:[e];return (i?`<div class="a" style="animation-delay:${i*.7-.35}s">↓ ${(f.ops||[])[i-1]||''}</div>`:'')+`<div class="b ${i===f.etapes.length-1?'fin':''}" style="animation-delay:${i*.7}s"><span>${t}</span>${v?`<b>${v}</b>`:''}</div>`}).join('')}</div>`}
  else if(f.type==='barres'){const mx=Math.max(...f.items.map(x=>x[1]));h=`<div class="brs">${f.items.map(x=>`<div><div class="r"><span>${x[0]}</span><span style="white-space:nowrap"><span class="cnt" data-v="${x[1]}">0</span>${x[2]?' '+x[2]:''}</span></div><div class="t"><i data-w="${Math.max(1.5,x[1]/mx*100)}" style="${x[3]?'--c:'+x[3]:''}"></i></div></div>`).join('')}</div>`}
  else if(f.type==='chiffres'){h=`<div class="chf">${f.items.map(x=>`<div><b><span class="cnt" data-v="${x[0]}">0</span>${x[1]?' '+x[1]:''}</b><span>${x[2]||''}</span></div>`).join('')}</div>`}
  else if(f.type==='svg')h=f.svg;
  else if(f.type==='inter'){const r=FIGR.push(f)-1;h=`<div class="itr" data-r="${r}">${f.svg}<div class="ibt">${f.inters.map(([k,t])=>`<button class="chip" data-s="${k}" onclick="figSw(this)">${t}</button>`).join('')}</div><div class="imsg"></div></div>`}
  else if(f.type==='etapes'){const r=FIGR.push(f)-1;h=`<div class="etp" data-r="${r}" data-i="0"><div class="etv"></div><div class="etn"><button class="chip" onclick="figEt(this,-1)">◀</button><span></span><button class="chip" onclick="figEt(this,1)">▶</button></div></div>`}
  const inter=f.type==='inter'||f.type==='etapes';
  return `<div class="fig" data-t="${f.type}">${inter?'':'<button class="rej" onclick="playFig(this.parentNode)">↻ Rejouer</button>'}${h}${f.legende?`<div class="leg">${f.legende}</div>`:''}</div>`}
function initFigs(root){root.querySelectorAll('.itr').forEach(el=>{const f=FIGR[+el.dataset.r];el._s={};f.inters.forEach(([k])=>el._s[k]=0);figUpd(el)});root.querySelectorAll('.etp').forEach(el=>figEt(el.querySelector('.chip'),0))}
function figSw(b){const el=b.closest('.itr'),f=FIGR[+el.dataset.r],k=b.dataset.s,n=(f.inters.find(x=>x[0]===k)||[])[2]||2;el._s[k]=(el._s[k]+1)%n;figUpd(el);beep(1)}
function figUpd(el){const f=FIGR[+el.dataset.r],s=el._s,on=f.f(s)||[];
  el.querySelectorAll('[data-v]').forEach(x=>{const [k,v]=x.getAttribute('data-v').split(':');x.classList.toggle('hide',String(s[k])!==v)});
  el.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',on.includes(x.getAttribute('data-k'))));
  el.querySelectorAll('.ibt .chip').forEach(b=>b.classList.toggle('act',!!s[b.dataset.s]));
  el.querySelector('.imsg').innerHTML=f.msg?f.msg(s):''}
function figEt(b,d){const el=b.closest('.etp'),f=FIGR[+el.dataset.r];let i=Math.max(0,Math.min(f.vues.length-1,+el.dataset.i+d));el.dataset.i=i;const v=f.vues[i];
  el.querySelector('.etv').innerHTML=`<div class="go">${v.svg||''}</div><p class="etx"><b>${i+1}/${f.vues.length}</b> — ${v.t}</p>`;
  el.querySelector('.etn span').innerHTML=f.vues.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}
function playFig(f){
  f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  const t=f.dataset.t;
  if(t==='cycle'){const ns=[...f.querySelectorAll('.n')],n=ns.length;let i=0;const st=()=>{ns.forEach((x,j)=>x.classList.toggle('on',j===i%n));i++};
    FX.forEach(x=>{if(x.f===f)clearInterval(x)});st();const iv=setInterval(st,1600);iv.f=f;FX.push(iv);
    const an=f.querySelector('animateMotion');if(an&&an.beginElement)an.beginElement()}
  if(t==='barres')f.querySelectorAll('.t i').forEach(i=>{i.style.width=0;void i.offsetWidth;i.style.width=i.dataset.w+'%'});
  f.querySelectorAll('.cnt').forEach(countUp);
}
function countUp(el){const v=+el.dataset.v,d=(el.dataset.v.split('.')[1]||'').length,t0=performance.now(),D=1100;
  (function s(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=(v*e).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});if(p<1)requestAnimationFrame(s)})(t0)}
function def(k){const w=C.lexique.find(x=>x[0]===k);$('modalIn').innerHTML=`<span class="mut">📖 Lexique</span><h2>${k}</h2><p style="line-height:1.55">${w?w[1]:''}</p><button class="btn ghost" onclick="$('modal').classList.remove('on')">Fermer</button>`;$('modal').classList.add('on')}

    (ne?`<button class="row" onclick="startErr()"><span class="ic">🧠</span><span class="tx"><b>Revoir mes erreurs</b><span>${ne} question${ne>1?'s':''} à retravailler</span></span><span class="mut">›</span></button>`:'');
  renderBest();
}
function renderBest(){const b=P.best,L=[`❓ Quiz : ${b.quiz}/10`,`⏱️ Vrai/Faux : ${b.vf}/10`,`⚡ Chrono : ${b.chrono||0} bonnes réponses`,`🔗 Associer : ${b.match?b.match+' s':'—'}`];
  if(C.diag)L.push(`🔎 Dépannages réussis : ${Object.keys(P.diag).length} / ${C.diag.length}`);
  if(C.cablage)L.push(`🔧 Câblages réussis : ${Object.keys(P.cab).length} / ${C.cablage.length}`);
  if(C.symboles)L.push(`🔣 Symboles : ${b.sym||0}/10`);
  if(C.atelier)L.push(`📐 Exercices de calcul réussis : ${P.atel}`);
  if(C.calcul)L.push(`🧮 Calcul mental : ${b.calc}/10`);
  if(C.examen)L.push(`📝 Examen blanc : ${b.exam?b.exam+' / '+examN():'—'}`);
  $('best').innerHTML=L.join('<br>')}
function stars(n){n=n||0;return '★'.repeat(n)+'☆'.repeat(3-n)}
/* liste de choix : rows = [[icône,titre,sous-titre,action,étoiles]] */
function liste(titre,sous,rows,extra){show('play');
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="tab('jeux')">✕</button><b>${titre}</b><span style="width:24px"></span></div><p class="mut">${sous}</p>${extra||''}
  <div style="display:flex;flex-direction:column;gap:10px">${rows.map(r=>`<button class="row" onclick="${r[3]}"><span class="ic">${r[0]}</span><span class="tx"><b>${r[1]}</b><span>${r[2]}</span></span>${r[4]?`<span class="st">${stars(r[4])}</span>`:'<span class="mut">›</span>'}</button>`).join('')}</div>`}
const NIV=['','🟢 Facile','🟠 Moyen','🔴 Expert'];

/* ----- QUIZ ----- */
function startQuiz(mod){
  let pool=C.quiz.filter(q=>!mod||q[0]===mod);
  G={type:'quiz',track:true,list:shuf(pool).slice(0,10),i:0,score:0};G.n=G.list.length;show('play');quizQ();
}
function quizQ(){
  const q=G.list[G.i];const order=q.vf?q[2].map((t,i)=>({t,i})):shuf(q[2].map((t,i)=>({t,i})));
  $('playBody').innerHTML=head()+`<div class="qcard" id="qc"><div>${q[1]}</div></div>
   <div style="display:flex;flex-direction:column;gap:10px">${order.map(o=>`<button class="ans" data-i="${o.i}" onclick="quizA(this)">${o.t}</button>`).join('')}</div>
   <div class="ex" id="ex"></div>`;
}
function quizA(b){
  const q=G.list[G.i],bs=[...document.querySelectorAll('#playBody .ans')];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);
  const ok=+b.dataset.i===q[3];
  bs.forEach(x=>{if(+x.dataset.i===q[3])x.classList.add('ok');else if(x!==b)x.classList.add('dim')});
  if(G.track){const k=(q.vf?'v:':'q:')+q[1];if(ok){if(remErr(k))P.fix++}else addErr(k)}
  if(ok){G.score++;gain(10,b)}else{b.classList.add('ko');shake('qc')}
  $('ex').innerHTML=(ok?'✅ ':'❌ ')+q[4]+`<button class="btn" style="margin-top:12px" onclick="nextQ(quizQ)">Continuer</button>`;$('ex').classList.add('on');
}

/* ----- RÉVISION DES ERREURS ----- les questions ratées (quiz, vrai/faux, examen) reviennent jusqu'à être réussies */
function addErr(k){if(!P.err.includes(k)){P.err.push(k);if(P.err.length>300)P.err.shift();save()}}
function remErr(k){const i=P.err.indexOf(k);if(i<0)return false;P.err.splice(i,1);save();return true}
function vfQz(v){const q=['vf',v[0],['Vrai','Faux'],v[1]?0:1,(v[1]?'C\'est VRAI. ':'C\'est FAUX. ')+v[2]];q.vf=1;return q}
function errList(){return P.err.map(k=>{const t=k.slice(2);if(k[0]==='q')return C.quiz.find(q=>q[1]===t);const v=C.vf.find(x=>x[0]===t);return v&&vfQz(v)}).filter(Boolean)}
function startErr(){const l=errList();if(!l.length){toast('Aucune erreur à revoir 👏');return}G={type:'err',track:true,list:shuf(l).slice(0,10),i:0,score:0};G.n=G.list.length;show('play');quizQ()}

/* ----- VRAI / FAUX ----- */
function startVF(){G={type:'vf',list:shuf(C.vf).slice(0,10),i:0,score:0};G.n=G.list.length;show('play');vfQ()}
function vfQ(){
  const q=G.list[G.i];
  $('playBody').innerHTML=head()+`<div class="timer"><i id="tb"></i></div><div class="qcard" id="qc"><div>${q[0]}</div></div>
   <div class="vf"><button style="background:var(--ok)" onclick="vfA(true)">VRAI</button><button style="background:var(--ko)" onclick="vfA(false)">FAUX</button></div><div class="ex" id="ex"></div>`;
  const t0=Date.now(),D=Math.max(8000,q[0].length*90);clearInterval(G.tm);
  G.tm=setInterval(()=>{const p=1-(Date.now()-t0)/D;$('tb').style.width=Math.max(0,p*100)+'%';if(p<=0)vfA(null)},50);
}
function vfA(v){
  clearInterval(G.tm);const q=G.list[G.i];const bs=document.querySelectorAll('#playBody .vf button');if(bs[0].disabled)return;bs.forEach(b=>b.disabled=true);
  const ok=v===q[1];if(ok){G.score++;gain(10,bs[v?0:1]);if(remErr('v:'+q[0]))P.fix++}else{shake('qc');addErr('v:'+q[0])}
  $('ex').innerHTML=(ok?'✅ Bien vu ! ':v===null?'⏰ Trop lent ! ':'❌ ')+`C'est <b>${q[1]?'VRAI':'FAUX'}</b>. ${q[2]}<button class="btn" style="margin-top:12px" onclick="nextQ(vfQ)">Continuer</button>`;$('ex').classList.add('on');
}

/* ----- CHRONO 60 s ----- quiz + vrai/faux mélangés, sans explication, le plus vite possible */
function startChrono(){G={type:'chrono',list:shuf(C.quiz.concat(C.vf.map(vfQz))),i:0,score:0,err:0,t0:Date.now()};show('play');chronoQ();
  G.tm=setInterval(()=>{const r=60-(Date.now()-G.t0)/1000;if($('cb'))$('cb').style.width=Math.max(0,r/60*100)+'%';if($('cs'))$('cs').textContent=Math.max(0,Math.ceil(r))+' s';if(r<=0){clearInterval(G.tm);chronoEnd()}},100)}
function chronoQ(){const q=G.list[G.i%G.list.length],order=q.vf?q[2].map((t,i)=>({t,i})):shuf(q[2].map((t,i)=>({t,i})));
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="tab('jeux')">✕</button><div class="timer" style="flex:1"><i id="cb"></i></div><span class="pill" id="cs">60 s</span><span class="pill">${G.score} ✓</span></div>
   <div class="qcard" id="qc" style="font-size:18px"><div>${q[1]}</div></div><div style="display:flex;flex-direction:column;gap:10px">${order.map(o=>`<button class="ans" data-i="${o.i}" onclick="chronoA(this)">${o.t}</button>`).join('')}</div>`}
function chronoA(b){const q=G.list[G.i%G.list.length],bs=[...document.querySelectorAll('#playBody .ans')];if(bs[0].disabled||G.done)return;bs.forEach(x=>x.disabled=true);const ok=+b.dataset.i===q[3];
  if(ok){G.score++;b.classList.add('ok');beep(1)}else{G.err++;b.classList.add('ko');bs.forEach(x=>{if(+x.dataset.i===q[3])x.classList.add('ok')});shake('qc')}
  setTimeout(()=>{if(G.type!=='chrono'||G.done)return;G.i++;chronoQ()},ok?350:1100)}
function chronoEnd(){G.done=1;const s=G.score;if(s>(P.best.chrono||0))P.best.chrono=s;P.xp+=s*3;jour(s*3);save();end(Math.min(s,15),15,`${s} bonne${s>1?'s':''} réponse${s>1?'s':''} en 60 s · ${G.err} erreur${G.err>1?'s':''}`)}

/* ----- ASSOCIER ----- */
function startMatch(){
  const pairs=shuf(C.lexique).slice(0,5);G={type:'match',pairs,left:shuf(pairs.map((p,i)=>({t:p[0],i}))),right:shuf(pairs.map((p,i)=>({t:p[1],i}))),sel:null,done:0,err:0,t0:Date.now()};
  show('play');
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="tab('jeux')">✕</button><b>🔗 Associe chaque mot</b><span class="pill" id="mt">0/5</span></div>
  <div class="match"><div class="col">${G.left.map(x=>`<button class="tile" data-k="L" data-i="${x.i}" onclick="pickT(this)">${x.t}</button>`).join('')}</div>
  <div class="col">${G.right.map(x=>`<button class="tile" data-k="R" data-i="${x.i}" onclick="pickT(this)" style="font-weight:500;font-size:13px">${x.t}</button>`).join('')}</div></div>`;
}
function pickT(b){
  if(!G.sel||G.sel.dataset.k===b.dataset.k){document.querySelectorAll('.tile.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');G.sel=b;return}
  const a=G.sel;G.sel=null;a.classList.remove('sel');
  if(a.dataset.i===b.dataset.i){a.classList.add('done');b.classList.add('done');G.done++;gain(10,b);$('mt').textContent=G.done+'/5';
    if(G.done===5){const s=Math.round((Date.now()-G.t0)/1000);if(!P.best.match||s<P.best.match)P.best.match=s;setTimeout(()=>end(5-Math.min(G.err,5),5,`en ${s} s · ${G.err} erreur(s)`),800)}}
  else{G.err++;[a,b].forEach(x=>{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad')})}
}

/* ----- DANS L'ORDRE ----- */
function pickOrdre(){if(C.ordre.length<3)return startOrdre();
  liste('🪜 Dans l\'ordre','Choisis une procédure et remets ses étapes dans le bon ordre.',C.ordre.map((o,i)=>[o.ic||'🪜',o.t,o.s.length+' étapes',`startOrdre(${i})`,P.ord[o.t]]),`<button class="btn ghost" onclick="startOrdre()">🎲 Une procédure au hasard</button>`)}

function ordA(b){

    if(G.k===G.o.s.length){P.best.ordre=P.best.ordre===null?G.err:Math.min(P.best.ordre,G.err);const st=G.err===0?3:G.err<=2?2:1;P.ord[G.o.t]=Math.max(P.ord[G.o.t]||0,st);setTimeout(()=>end(Math.max(0,G.o.s.length-G.err),G.o.s.length,G.err+' erreur(s)'),600)}}
  else{G.err++;$('oe').textContent=G.err+' erreur'+(G.err>1?'s':'');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','ko');setTimeout(()=>b.classList.remove('ko'),400)}
}

/* ----- DÉPANNAGE (si C.diag est défini) -----
   C.diag = [{id,t,ic,niv:1|2|3,bon:{lieu,qui,heure,prio:1|2|3,pb,contrainte},
             etapes:[{info?,fig?,q,o:[['choix',true|false,'résultat ou pourquoi c\'est faux'],…]}],fin:'rapport',retenir?}]
   Une seule bonne réponse par étape ; une mauvaise piste coûte des points mais on peut réessayer. */
/* C.diagTextes (facultatif) : adapte le jeu Dépannage à une autre matière (ex. « Problèmes pas à pas ») */
function DT(){return Object.assign({titre:'🔎 Dépannage',sous:'Tu reçois un bon de travail. Trouve la panne avec méthode : chaque fausse piste te coûte des étoiles.',entete:'📋 Nouveau bon de travail',carte:'BON DE TRAVAIL N°',prio:true,champs:[['lieu','📍 Lieu'],['qui','👤 Demandeur'],['heure','🕐 Appel'],['pb','⚠️ Symptôme'],['contrainte','⛓️ Contrainte']],go:'🧰 Commencer l\'intervention',fin:'Terminer l\'intervention',parfait:'Panne trouvée sans fausse piste !',ok:'Panne réparée !',rapport:'📝 Rapport d\'intervention',autre:'Autre intervention',piste:'fausse piste',jour:'Intervention du jour'},C.diagTextes||{})}
function listDiag(){liste(DT().titre,DT().sous,C.diag.map((d,i)=>[d.ic||'🔎',d.t,(NIV[d.niv]||'')+' · '+d.bon.lieu,`startDiag(${i})`,P.diag[d.id]]))}
function startDiag(i){const d=C.diag[i],b=d.bon;G={type:'diag',d,k:i,i:0,err:0};show('play');
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="listDiag()">✕</button><b>${DT().entete}</b><span style="width:24px"></span></div>
  <div class="bt"><div class="bth"><b>${DT().carte} ${2600+i*7}</b>${DT().prio?`<span class="prio p${b.prio||2}">${['','🚨 Urgent','Normal','Planifié'][b.prio||2]}</span>`:''}</div>
   ${DT().champs.map(([k,t])=>[t,b[k]]).filter(x=>x[1]).map(x=>`<div class="btl"><span>${x[0]}</span><p>${x[1]}</p></div>`).join('')}</div>
  <p class="mut" style="text-align:center">${d.etapes.length} étapes · ${NIV[d.niv]||''}</p>
  <button class="btn" onclick="diagQ()">${DT().go}</button>`}
function diagQ(){const d=G.d,e=d.etapes[G.i];
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="listDiag()">✕</button><div class="prog"><i style="width:${G.i/d.etapes.length*100}%"></i></div><span class="pill">${G.i+1}/${d.etapes.length}</span></div>
   <div class="card mini"><span class="mut">📋 ${d.t}</span><span style="font-size:14px;line-height:1.4">${d.bon.pb}</span></div>
   ${e.info?`<div class="msg inf">🔍 ${e.info}</div>`:''}${e.fig?figHTML(e.fig):''}
   <div class="qcard dq" id="qc"><div>${e.q}</div></div>
   <div style="display:flex;flex-direction:column;gap:10px">${shuf(e.o.map((o,i)=>({t:o[0],i}))).map(o=>`<button class="ans" data-i="${o.i}" onclick="diagA(this)">${o.t}</button>`).join('')}</div>
   <div class="ex" id="ex"></div>`;
  initFigs($('playBody'));$('playBody').querySelectorAll('.fig').forEach(playFig)}
function diagA(b){const e=G.d.etapes[G.i],o=e.o[+b.dataset.i];if(b.disabled)return;
  if(o[1]){document.querySelectorAll('#playBody .ans').forEach(x=>x.disabled=true);b.classList.add('ok');gain(G.ko?5:15,b);G.ko=0;
    $('ex').innerHTML='✅ '+o[2]+`<button class="btn" style="margin-top:12px" onclick="diagNext()">${G.i+1<G.d.etapes.length?'Étape suivante →':DT().fin}</button>`;$('ex').classList.add('on');$('ex').scrollIntoView({behavior:'smooth',block:'nearest'})}
  else{G.err++;G.ko=1;b.disabled=true;b.classList.add('ko');shake('qc');$('ex').innerHTML='❌ '+o[2]+'<div class="mut" style="margin-top:6px">Essaie une autre piste.</div>';$('ex').classList.add('on')}}
function diagNext(){G.i++;if(G.i<G.d.etapes.length)return diagQ();
  const d=G.d,st=G.err===0?3:G.err<=2?2:1;P.diag[d.id]=Math.max(P.diag[d.id]||0,st);P.parties++;save();badgeCheck();if(st>=2)confetti();
  pubInterstitiel(()=>{show('play');$('playBody').innerHTML=`<div class="big">${st===3?'🏆':st===2?'🔧':'💪'}</div><h1 style="text-align:center">${st===3?DT().parfait:DT().ok}</h1><div class="stars">${stars(st)}</div><p class="mut" style="text-align:center">${G.err} ${DT().piste}${G.err>1?'s':''}</p>
   <div class="sec"><h3>${DT().rapport}</h3><p>${d.fin}</p></div>${d.retenir?`<div class="box ret"><b>📌 À retenir</b>${d.retenir}</div>`:''}
   <button class="btn" onclick="listDiag()">${DT().autre}</button><button class="btn ghost" onclick="tab('jeux')">Retour aux jeux</button>${pubBanniere()}`;pubB()})}

/* ----- CÂBLAGE (si C.cablage est défini) -----
   C.cablage = [{id,t,ic,niv,d:'consigne',aide:'indice',fin:'explication',h:hauteur du plan (défaut 400),
     app:[{id,t:'Nom',ic:'💡',x,y,w,h,cote:'b'|'t',ty?,b:[['L','Phase'],['N','Neutre',x?,y?,dir?]]}],   bornes réparties sur le bord bas (b) ou haut (t), ou placées en x,y (dir 't','b' ou 'n') ; ty = hauteur du titre dans le cadre
     sol:[['P','app.borne','app.borne',…],…],   un « réseau » par ligne : toutes ses bornes doivent être reliées entre elles et à rien d'autre
         type : P phase · N neutre · T terre · X retour/navette/commande · B barrette (toute couleur)
     perm:[['app.b1','app.b2']],                  bornes interchangeables (toutes les permutations sont acceptées)
     lum:['app'],                                 appareils qui s'allument quand c'est juste (rot:true sur l'appareil = il tourne)
     coul:false}]                                 pour ne pas vérifier les couleurs */
const COUL={marron:['#8d5524','Marron'],noir:['#1a1a1a','Noir'],rouge:['#e53935','Rouge'],gris:['#9aa3b5','Gris'],orange:['#ff8f1f','Orange'],violet:['#9c4dcc','Violet'],bleu:['#1e88e5','Bleu'],vj:['url(#vj)','Vert/jaune']};
const REGLE={P:['marron','noir','rouge','gris'],N:['bleu'],T:['vj'],X:['marron','noir','rouge','gris','orange','violet'],B:null};
const TXTR={P:'Une phase se câble en marron, noir, rouge ou gris.',N:'Le neutre est toujours bleu.',T:'La terre est toujours vert/jaune.',X:'Un retour lampe, une navette ou un fil de commande : n\'importe quelle couleur sauf le bleu et le vert/jaune.'};
function listCab(){liste('🔧 Câblage','Choisis la couleur du fil, touche une borne puis une autre pour tirer le fil. Touche un fil pour l\'enlever.',C.cablage.map((c,i)=>[c.ic||'🔧',c.t,NIV[c.niv]||'',`startCab(${i})`,P.cab[c.id]]))}
function permsOf(a){if(a.length<2)return [a];return a.flatMap((x,i)=>permsOf(a.filter((_,j)=>j!==i)).map(p=>[x,...p]))}
function cabSols(ex){let maps=[{}];(ex.perm||[]).forEach(g=>{const ps=permsOf(g);maps=maps.flatMap(m=>ps.map(p=>{const n=Object.assign({},m);g.forEach((b,i)=>n[b]=p[i]);return n}))});
  return maps.map(m=>ex.sol.map(([ty,...bs])=>[ty,...bs.map(b=>m[b]||b)]))}
function cabPos(ex){const pos={};ex.app.forEach(a=>{const n=a.b.length;a.b.forEach((b,k)=>{const ex_=b[2]!=null;
  const d=ex_?(b[4]||'n'):(a.cote==='t'?'t':'b'),x=ex_?a.x+b[2]:a.x+(k+1)*a.w/(n+1),y=ex_?a.y+b[3]:(d==='t'?a.y:a.y+a.h);pos[a.id+'.'+b[0]]={x,y,l:b[1],a,d}})});return pos}
function startCab(i){const ex=C.cablage[i];G={type:'cab',ex,k:i,w:[],sel:null,col:'marron',err:0,aide:0,pos:cabPos(ex)};show('play');
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="listCab()">✕</button><b>${ex.ic||'🔧'} ${ex.t}</b><span class="pill" id="ce">0 essai</span></div>
   <div class="msg inf">${ex.d}</div>
   <div class="pal" id="pal"></div><div class="board" id="brd"></div><div id="cmsg"></div>
   <div class="btns" id="cbt"><button class="btn ghost" onclick="cabUndo()">↶ Annuler</button><button class="btn ghost" onclick="cabAide()">💡 Indice</button><button class="btn ghost" onclick="if(confirm('Tout effacer ?')){G.w=[];cabDraw()}">🗑️ Effacer</button><button class="btn" onclick="cabCheck()">✔ Vérifier</button></div>`;
  cabPal();cabDraw()}
function cabPal(){$('pal').innerHTML=Object.keys(COUL).map(c=>`<button class="${G.col===c?'on':''}" title="${COUL[c][1]}" style="background:${c==='vj'?'repeating-linear-gradient(45deg,#2e9d3a 0 6px,#f2d10f 6px 12px)':COUL[c][0]}" onclick="G.col='${c}';cabPal()"></button>`).join('')+`<div class="mut" style="width:100%;text-align:center;font-size:13px">Fil choisi : <b style="color:#fff">${COUL[G.col][1]}</b></div>`}
function cabDraw(){const ex=G.ex,H=ex.h||400,D={t:[0,-1],b:[0,1],n:[0,0]};
  const ws=G.w.map((w,j)=>{const a=G.pos[w.a],b=G.pos[w.b],da=D[a.d],db=D[b.d],L=Math.min(60,20+Math.hypot(a.x-b.x,a.y-b.y)/4);
    const p=`M${a.x},${a.y} C${a.x+da[0]*L},${a.y+da[1]*L} ${b.x+db[0]*L},${b.y+db[1]*L} ${b.x},${b.y}`;
    return `<path d="${p}" class="cw" stroke="${COUL[w.c][0]}"/><path d="${p}" class="hit" onclick="cabDel(${j})"/>`}).join('');
  const caps=ex.app.map(a=>{const lit=G.ok&&(ex.lum||[]).includes(a.id),ty=a.ty!=null?a.y+a.ty:a.cote==='t'?a.y+a.h-10:a.y+17,iy=a.ty!=null?a.y+a.ty+3:a.cote==='t'?a.y+a.h-8:a.y+24;
    return `<g class="cap ${lit?'lit':''}"><rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="10"/><text class="tt" x="${a.x+8}" y="${ty}">${a.t}</text>${a.ic?`<text class="ict ${lit&&a.rot?'spin':''}" x="${a.x+a.w-8}" y="${iy}" text-anchor="end">${a.ic}</text>`:''}</g>`}).join('');
  const bs=Object.entries(G.pos).map(([id,p])=>{const ly=p.d==='t'?p.y+22:p.d==='b'?p.y-13:p.y+24;
    return `<g class="cb ${G.sel===id?'sel':''}" onclick="cabTap('${id}')"><circle cx="${p.x}" cy="${p.y}" r="17" fill="transparent"/><circle class="vis" cx="${p.x}" cy="${p.y}" r="8.5"/><text class="lb" x="${p.x}" y="${ly}">${p.l}</text></g>`}).join('');
  $('brd').innerHTML=`<svg viewBox="0 0 360 ${H}" class="${G.ok?'okb':''}"><defs><pattern id="vj" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="10" fill="#2e9d3a"/><rect x="5" width="5" height="10" fill="#f2d10f"/></pattern></defs>${caps}${ws}${bs}</svg>`}
function cabTap(id){if(G.ok)return;if(!G.sel)G.sel=id;else if(G.sel===id)G.sel=null;else{const a=G.sel;G.sel=null;
  const j=G.w.findIndex(w=>(w.a===a&&w.b===id)||(w.a===id&&w.b===a));if(j>=0)G.w.splice(j,1);else G.w.push({a,b:id,c:G.col})}cabDraw()}
function cabDel(j){if(G.ok)return;G.w.splice(j,1);cabDraw()}
function cabUndo(){if(G.ok)return;G.w.pop();G.sel=null;cabDraw()}
function cabAide(){if(!G.aide){G.aide=1;G.err++;$('ce').textContent=G.err+' essai'+(G.err>1?'s':'')}$('cmsg').innerHTML=`<div class="msg inf">💡 ${G.ex.aide}</div>`}
function cabEval(sol,f){const er=[],netOf={},L=b=>`<b>${G.pos[b].a.t}</b> (${G.pos[b].l})`;
  sol.forEach((n,k)=>n.slice(1).forEach(b=>netOf[b]=k));
  const comp={};Object.keys(G.pos).forEach(b=>{const r=f(b);(comp[r]=comp[r]||[]).push(b)});
  Object.values(comp).forEach(bs=>{if(bs.length<2)return;const nets=[...new Set(bs.filter(b=>netOf[b]!==undefined).map(b=>netOf[b]))];
    if(nets.length>1){const ty=nets.map(k=>sol[k][0]),has=t=>ty.includes(t);
      er.push({g:0,m:has('P')&&has('N')?'💥 Court-circuit : une phase est reliée au neutre ! Le disjoncteur sauterait dès la mise sous tension.':has('T')&&(has('P')||has('X'))?'💥 Défaut à la terre : un conducteur actif touche la terre ! Le différentiel déclencherait.':'⚡ Ces bornes ne doivent pas être reliées entre elles : '+bs.filter(b=>netOf[b]!==undefined).slice(0,3).map(L).join(', ')+'.'})}
    const inut=bs.filter(b=>netOf[b]===undefined);if(inut.length)er.push({g:1,m:'🔌 Ce fil ne devrait pas arriver ici : '+inut.map(L).join(', ')+'.'})});
  sol.forEach(n=>{const bs=n.slice(1),r0=f(bs[0]),m=bs.find(b=>f(b)!==r0);if(m)er.push({g:2,m:'🔗 Liaison manquante : '+L(bs[0])+' doit être relié(e) à '+L(m)+'.'})});
  if(G.ex.coul!==false)G.w.forEach(w=>{const k=netOf[w.a]!==undefined?netOf[w.a]:netOf[w.b];if(k===undefined)return;const ty=sol[k][0],ok=REGLE[ty];
    if(ok&&!ok.includes(w.c))er.push({g:3,m:'🎨 Couleur : le fil entre '+L(w.a)+' et '+L(w.b)+' est '+COUL[w.c][1].toLowerCase()+'. '+TXTR[ty]})});
  return er.sort((a,b)=>a.g-b.g)}
function cabCheck(){if(G.ok)return;if(!G.w.length){$('cmsg').innerHTML='<div class="msg ko">Tire au moins un fil : touche une borne, puis une autre.</div>';return}
  const par={};Object.keys(G.pos).forEach(i=>par[i]=i);const f=i=>par[i]===i?i:(par[i]=f(par[i]));G.w.forEach(w=>{par[f(w.a)]=f(w.b)});
  let best=null;cabSols(G.ex).forEach(sol=>{const e=cabEval(sol,f);if(!best||e.length<best.length)best=e});
  if(best.length){G.err++;$('ce').textContent=G.err+' essai'+(G.err>1?'s':'');beep(0);$('brd').classList.remove('shake');void $('brd').offsetWidth;$('brd').classList.add('shake');
    $('cmsg').innerHTML=`<div class="msg ko"><b>${best.length} problème${best.length>1?'s':''} trouvé${best.length>1?'s':''}.</b><br>${best[0].m}</div>`;return}
  G.ok=1;const st=G.err===0?3:G.err<=2?2:1,id=G.ex.id;P.cab[id]=Math.max(P.cab[id]||0,st);P.parties++;cabDraw();confetti();gain(30,$('brd'));
  $('cmsg').innerHTML=`<div class="msg ok"><b>✅ Câblage correct ! ${stars(st)}</b><br>${G.ex.fin}</div>`;
  $('cbt').innerHTML=`<button class="btn ghost" onclick="startCab(${G.k})">🔁 Recommencer</button><button class="btn" onclick="listCab()">Autre câblage</button>`;
  $('cmsg').scrollIntoView({behavior:'smooth',block:'nearest'})}

/* ----- ATELIER DE CALCUL (si C.atelier est défini) -----
   C.atelier = [{t:'Thème',ic,d:'formule',gen:R=>({q:'énoncé',r:nombre,u:'unité',tol?:tolérance,ex:'correction'})}]
   R = {r(a,b): entier au hasard, pick(liste), f(x,déc): nombre écrit à la française} */
const R={r:rand,pick:a=>a[rand(0,a.length-1)],f:(x,d=2)=>(+(+x).toFixed(d)).toLocaleString('fr-FR',{maximumFractionDigits:d})};
function listAtelier(){liste('📐 Atelier de calcul','Des exercices générés à l\'infini, avec la correction détaillée.',[['🎲','Tout mélanger','10 exercices de tous les thèmes','startAt(-1)']].concat(C.atelier.map((a,i)=>[a.ic||'📐',a.t,a.d||'',`startAt(${i})`])))}
function startAt(i){G={type:'atel',th:i,i:0,score:0,n:10};show('play');atQ()}
function atQ(){const th=G.th<0?C.atelier[rand(0,C.atelier.length-1)]:C.atelier[G.th];G.x=th.gen(R);const x=G.x;
  $('playBody').innerHTML=head()+`<div class="card mini"><span class="mut">${th.ic||'📐'} ${th.t}${th.d?' · '+th.d:''}</span></div><div class="qcard at" id="qc"><div>${x.q}</div></div>
   <div class="atin"><input id="atv" inputmode="decimal" autocomplete="off" placeholder="Ta réponse" onkeydown="if(event.key==='Enter')atA()"><span>${x.u||''}</span></div>
   <button class="btn" id="atb" onclick="atA()">Valider</button><div class="ex" id="ex"></div>`;setTimeout(()=>{if($('atv'))$('atv').focus()},150)}
function atA(){const x=G.x,v=parseFloat(($('atv').value||'').replace(',','.').replace(/\s/g,''));if($('atb').disabled)return;if(isNaN(v)){shake('atv');return}
  $('atb').disabled=true;$('atv').disabled=true;const tol=x.tol!=null?x.tol:Math.max(Math.abs(x.r)*.02,.01),ok=Math.abs(v-x.r)<=tol;
  if(ok){G.score++;P.atel++;gain(10,$('atb'))}else shake('qc');
  $('ex').innerHTML=(ok?'✅ Juste ! ':'❌ La bonne réponse : <b>'+R.f(x.r,3)+' '+(x.u||'')+'</b>. ')+'<div style="margin-top:8px">'+x.ex+'</div><button class="btn" style="margin-top:12px" onclick="nextQ(atQ)">Continuer</button>';$('ex').classList.add('on')}

/* ----- CALCUL MENTAL (si C.calcul est défini) ----- */
/* C.calcul = [{op:'+',a:[min,max],b:[min,max]}, …]  op : + − × ÷ */
function calcQ1(g){
  let a=rand(...g.a),b=rand(...g.b),r,txt;
  if(g.op==='+'){r=a+b;txt=`${a} + ${b}`}
  else if(g.op==='−'){if(b>a)[a,b]=[b,a];r=a-b;txt=`${a} − ${b}`}
  else if(g.op==='×'){r=a*b;txt=`${a} × ${b}`}
  else{r=a;a=a*b;txt=`${a} ÷ ${b}`}
  const opts=new Set([r]),d=[1,-1,2,-2,10,-10].concat(g.op==='×'||g.op==='÷'?[b,-b]:[]);
  const nums=txt.match(/\d+/g).map(Number),ok=v=>v>=0&&!nums.includes(v);
  for(const x of shuf(d)){if(opts.size>=4)break;if(ok(r+x))opts.add(r+x)}
  let k=3;while(opts.size<4){if(ok(r+k))opts.add(r+k);k++}
  const ch=[...opts].map(String);
  return ['calc',txt+' = ?',ch,0,`${txt} = ${r}`];
}
function startCalc(){G={type:'calc',list:Array.from({length:10},()=>calcQ1(C.calcul[rand(0,C.calcul.length-1)])),i:0,score:0};G.n=10;show('play');quizQ()}

/* ----- EXAMEN BLANC (si C.examen est défini) -----
   C.examen = {titre, questions:60, seuil:42, minutes:60, modules?:['id',…]} (modules : ne tirer que ces modules)
   Questions tirées de tout le quiz, pas de correction pendant l'épreuve, verdict + corrections à la fin. */
function examPool(){return C.quiz.filter(q=>!C.examen.modules||C.examen.modules.includes(q[0]))}
function examN(){return Math.min(C.examen.questions,examPool().length)}
function examSeuil(){return Math.ceil(C.examen.seuil/C.examen.questions*examN())}
function startExam(){
  G={type:'exam',list:shuf(examPool()).slice(0,examN()),i:0,score:0,err:[],t0:Date.now()};G.n=G.list.length;show('play');examQ();
  const D=C.examen.minutes*60000*G.n/C.examen.questions;
  G.tm=setInterval(()=>{const r=D-(Date.now()-G.t0);if($('chr'))$('chr').textContent=Math.max(0,Math.ceil(r/60000))+' min';if(r<=0){clearInterval(G.tm);examEnd(true)}},1000);
}
function examQ(){
  const q=G.list[G.i];const order=shuf(q[2].map((t,i)=>({t,i})));
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="if(confirm('Abandonner l\\'examen ?'))tab('jeux')">✕</button><div class="prog"><i style="width:${G.i/G.n*100}%"></i></div><span class="pill">${G.i+1}/${G.n}</span><span class="pill" id="chr">⏱</span></div>
   <div class="qcard"><div>${q[1]}</div></div>
   <div style="display:flex;flex-direction:column;gap:10px">${order.map(o=>`<button class="ans" data-i="${o.i}" onclick="examA(this)">${o.t}</button>`).join('')}</div>`;
}
function examA(b){
  const q=G.list[G.i];if(+b.dataset.i===q[3])G.score++;else{G.err.push(q);addErr('q:'+q[1])}
  G.i++;if(G.i>=G.n){clearInterval(G.tm);examEnd(false)}else examQ();
}
function examEnd(temps){
  G.list.slice(G.i).forEach(q=>G.err.push(q));
  const ok=G.score>=examSeuil();if(G.score>(P.best.exam||0))P.best.exam=G.score;P.xp+=G.score*2;P.parties++;save();badgeCheck();
  if(ok)confetti();
  pubInterstitiel(()=>{show('play');
  $('playBody').innerHTML=`<div class="big">${ok?'🎓':'📚'}</div>
   <h1 style="text-align:center">${ok?'Admis !':'Pas encore…'}</h1>
   <p class="mut" style="text-align:center;font-size:16px">${temps?'⏰ Temps écoulé. ':''}<b>${G.score} / ${G.n}</b> — il fallait ${examSeuil()} bonnes réponses</p>
   ${G.err.length?`<h2>Tes erreurs</h2>`+G.err.map(q=>`<div class="sec"><p><b>${q[1]}</b></p><p style="color:var(--ok);margin-top:6px">✓ ${q[2][q[3]]}</p><p class="mut" style="margin-top:4px">${q[4]}</p></div>`).join(''):''}
   <button class="btn" onclick="startExam()">Repasser l'examen</button><button class="btn ghost" onclick="tab('cours')">Revoir les cours</button>${pubBanniere()}`;
  pubB();});
}

/* ----- série de jours & objectif du jour ----- */
function today(d=0){const t=new Date(Date.now()+d*864e5);return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate()}
function jour(x){if(P.jour!==today()){P.serie=P.jour===today(-1)?P.serie+1:1;P.jour=today();P.xpJour=0;if(P.serie>1)setTimeout(()=>toast('🔥 '+P.serie+' jours de suite !'),400)}
  const av=P.xpJour;P.xpJour+=x;if(av<OBJ&&P.xpJour>=OBJ){setTimeout(()=>{toast('🎯 Objectif du jour atteint !');confetti()},300)}}

/* ----- commun ----- */
function head(){return `<div class="top"><button class="back" onclick="tab('jeux')">✕</button><div class="prog"><i style="width:${G.i/G.n*100}%"></i></div><span class="pill">${G.score} ✓</span></div>`}
function nextQ(f){G.i++;if(G.i>=G.n){if(G.score>(P.best[G.type]||0))P.best[G.type]=G.score;end(G.score,G.n,G.score+' / '+G.n+' bonnes réponses')}else f()}
function end(sc,n,txt){P.parties++;save();badgeCheck();pubInterstitiel(()=>endScreen(sc,n,txt))}
function endScreen(sc,n,txt){
  const r=sc/n,st=r>=.9?3:r>=.6?2:r>0?1:0;if(st>=2)confetti();
  show('play');
  $('playBody').innerHTML=`<div style="height:30px"></div><div class="big">${st===3?'🏆':st===2?'🎉':'💪'}</div>
  <h1 style="text-align:center">${st===3?'Parfait !':st===2?'Bien joué !':'Continue comme ça !'}</h1>
  <div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><p class="mut" style="text-align:center;font-size:16px">${txt}</p>
  <div style="height:20px"></div><button class="btn" onclick="tab('jeux')">Autre jeu</button><button class="btn ghost" onclick="tab('cours')">Revoir les cours</button>${pubBanniere()}`;
  pubB();
}
function gain(x,el){P.xp+=x;jour(x);save();badgeCheck();const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='float';d.textContent='+'+x+' XP';d.style.left=(r.left+r.width/2-35)+'px';d.style.top=(r.top)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000);beep(1)}
function shake(id){const e=$(id);e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');beep(0)}
let AC;function beep(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.connect(g);g.connect(AC.destination);o.type='triangle';
 if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.08)}else{o.frequency.setValueAtTime(220,t);o.frequency.linearRampToValueAtTime(140,t+.25)}
 g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}catch(e){}}
function confetti(){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#ffc83d','#2ed47a','#3db5ff','#ff5470'];
 const ps=Array.from({length:120},()=>({x:c.width/2,y:c.height/3,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:rand(5,10),c:cols[rand(0,3)],r:0}));let f=0;
 (function l(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(l);else x.clearRect(0,0,c.width,c.height)})()}
/* démarrage */
document.title=C.app;$('sousTitre').textContent=C.sousTitre||'';
if(C.appareils||C.symboles){$('navLex').textContent='Wiki';$('lexH').textContent='📖 Wiki'}
theme();load();renderHome();
/* Appli Android (Capacitor) : le bouton retour ferme la fenêtre ouverte ou revient à l'accueil avant de quitter */
(function(){const A=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.App;if(!A)return;
  A.addListener('backButton',()=>{if($('modal').classList.contains('on'))return $('modal').classList.remove('on');
    if(!$('home').classList.contains('on'))return tab('home');A.exitApp()})})();
</script>
