<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Paie Pro</title>
<style>
:root{--bg:#10142a;--card:#1c2244;--card2:#252c58;--pri:#ffc83d;--pri2:#d99a00;--acc:#3db5ff;--ok:#2ed47a;--ko:#ff5470;--txt:#fff;--mut:#a9b0d6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px 16px 96px;min-height:100vh}
.screen{display:none;flex-direction:column;gap:14px;animation:fade .3s}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:26px}h2{font-size:21px}h3{font-size:17px}
.mut{color:var(--mut);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:rgba(255,255,255,.08);padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap}
.back{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:2px 8px 2px 0}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#1b1640;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center}
.hero .ic{font-size:54px;animation:zap 2.5s infinite}
@keyframes zap{0%,90%,100%{transform:none}93%{transform:rotate(-12deg) scale(1.1)}96%{transform:rotate(10deg)}}
.hero b{font-size:22px;display:block}
.bar{height:10px;background:rgba(0,0,0,.15);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#1b1640;border-radius:99px;transition:width .5s}
.card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.word{background:var(--card2);border-left:4px solid var(--acc)}
.row{display:flex;gap:12px;align-items:center;cursor:pointer;border:none;background:var(--card);color:#fff;border-radius:18px;padding:14px;text-align:left;width:100%;font-size:16px}
.row .ic{font-size:30px;width:48px;height:48px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .tx{flex:1}.row .tx b{display:block}.row .tx span{font-size:13px;color:var(--mut)}
.row .ok{color:var(--ok);font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{border:none;border-radius:20px;padding:18px 10px;color:#1b1640;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:6px}
.game .e{font-size:38px}.game small{font-weight:600;font-size:12px;opacity:.8}
.game:active,.btn:active,.ans:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn{border:none;border-radius:16px;padding:15px;font-size:17px;font-weight:800;color:#1b1640;background:var(--pri);box-shadow:0 5px 0 var(--pri2);cursor:pointer;width:100%}
.btn.ghost{background:var(--card2);color:#fff;box-shadow:none}
/* fiche */
.sec{background:var(--card);border-radius:18px;padding:16px}
.sec h3{margin-bottom:8px;color:var(--pri)}
.sec p,.sec li{line-height:1.55;font-size:15.5px}
.sec ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.key{background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.35);border-radius:16px;padding:14px}
.key h3{color:var(--pri);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:none;color:var(--acc);padding:8px 12px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer}
/* lexique */
.search{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--card2);background:var(--card);color:#fff;font-size:16px;outline:none}
.search:focus{border-color:var(--pri)}
.lex{background:var(--card);border-radius:16px;padding:14px;cursor:pointer}
.lex b{color:var(--pri)}.lex p{margin-top:6px;line-height:1.5;display:none;font-size:15px}
.lex.open p{display:block}
/* jeux */
.prog{flex:1;height:12px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qcard{background:#fff;color:#10142a;border-radius:22px;padding:24px 18px;text-align:center;font-size:21px;font-weight:800;line-height:1.35;min-height:130px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.shake{animation:shake .4s}
@keyframes shake{25%,75%{transform:translateX(-9px)}50%{transform:translateX(9px)}}
.ans{border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:700;color:#fff;background:var(--card);box-shadow:0 4px 0 #0a0d1d;cursor:pointer;text-align:left;width:100%}
.ans.ok{background:var(--ok);box-shadow:0 4px 0 #1a9a56}
.ans.ko{background:var(--ko);box-shadow:0 4px 0 #c23250}
.ans.dim{opacity:.4}
.ex{background:var(--card2);border-radius:16px;padding:14px;font-size:15px;line-height:1.5;display:none}
.ex.on{display:block;animation:fade .3s}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{border:none;border-radius:18px;padding:22px;font-size:22px;font-weight:900;color:#fff;cursor:pointer}
.timer{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--pri);width:100%}
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.tile{border:2px solid transparent;border-radius:14px;padding:12px 10px;background:var(--card);color:#fff;font-size:14px;font-weight:700;cursor:pointer;min-height:58px;text-align:left;transition:.2s}
.tile.sel{border-color:var(--pri);background:var(--card2)}
.tile.done{background:var(--ok);opacity:0;transform:scale(.9);pointer-events:none;transition:.5s .3s}
.tile.bad{animation:shake .4s;border-color:var(--ko)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{background:var(--ok);color:#10142a;border-radius:14px;padding:12px;font-weight:800;animation:fade .3s}
.step.empty{background:transparent;border:2px dashed var(--card2);color:var(--mut);font-weight:600}
.big{font-size:90px;text-align:center}
.stars{font-size:44px;text-align:center;color:var(--pri);letter-spacing:6px}
.float{position:fixed;font-weight:900;font-size:22px;color:var(--pri);pointer-events:none;animation:up 1s forwards;z-index:9}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0e20;border-top:1px solid var(--card2);display:flex;justify-content:center;z-index:5}
nav .in{display:flex;max-width:480px;width:100%}
nav button{flex:1;background:none;border:none;color:var(--mut);padding:10px 0 14px;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
.modal.on{display:flex}
.modal .in{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 16px 28px;display:flex;flex-direction:column;gap:10px;animation:fade .25s}
.pub{background:repeating-linear-gradient(45deg,var(--card),var(--card) 10px,var(--card2) 10px,var(--card2) 20px);border-radius:14px;min-height:60px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:1px}
.pub.full{position:fixed;inset:0;z-index:40;border-radius:0;flex-direction:column;gap:16px;font-size:14px}
/* fiches wiki */
.rbar{position:fixed;top:0;left:0;right:0;height:4px;z-index:6;background:transparent}
.rbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .1s}
.fhero{display:flex;gap:14px;align-items:center}
.fhero .fic{font-size:52px;width:76px;height:76px;border-radius:22px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.chapo{font-size:17px;line-height:1.6;border-left:4px solid var(--pri);padding:4px 0 4px 14px}
.toc{display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:16px;padding:12px}
.toc b{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.toc button{background:none;border:none;color:var(--acc);text-align:left;font-size:15px;font-weight:700;cursor:pointer;padding:4px 0}
.sh{display:flex;gap:10px;align-items:center;margin-bottom:10px}.sh h3{margin:0!important}
.num{width:30px;height:30px;border-radius:10px;background:var(--pri);color:#10142a;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec>p{line-height:1.65;font-size:15.5px;margin-bottom:10px}
.box{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.55}
.box>b{display:block;margin-bottom:4px}
.box ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.box.ex2{background:rgba(61,181,255,.12);border:1px solid rgba(61,181,255,.35)}
.box.att{background:rgba(255,84,112,.12);border:1px solid rgba(255,84,112,.4)}
.box.info{background:rgba(177,140,255,.13);border:1px solid rgba(177,140,255,.4)}
.box.ret{background:rgba(46,212,122,.12);border:1px solid rgba(46,212,122,.4);margin-top:0}
.mq{margin-top:12px;background:var(--card2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mq>b{font-size:13px;color:var(--pri)}.mq p{font-weight:700;line-height:1.45}
.mq .ans{padding:11px 14px;font-size:15px;box-shadow:0 3px 0 #0a0d1d}
.mq .ex{display:none}.mq .ex.on{display:block}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ok);color:#10142a;font-weight:900;padding:12px 18px;border-radius:99px;z-index:50;animation:toast 2.6s forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.day{display:flex;gap:12px;align-items:center}
.day .fl{font-size:34px}.day .fl.off{filter:grayscale(1);opacity:.5}
/* figures animées */
.fig{margin-top:12px;background:var(--card2);border-radius:14px;padding:14px 12px 12px;position:relative}
.fig .rej{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;z-index:2}
.fig .leg{text-align:center;color:var(--mut);font-size:13px;margin-top:8px}
.fig svg{display:block;width:100%;max-width:340px;margin:0 auto;height:auto}
.cyc{position:relative;width:100%;max-width:310px;aspect-ratio:1;margin:0 auto}
.cyc svg{position:absolute;inset:0;max-width:none}
.cyc .n{position:absolute;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--c,var(--acc));border-radius:12px;padding:6px 8px;font-size:12px;font-weight:700;text-align:center;width:max-content;max-width:42%;transition:.35s;line-height:1.3}
.cyc .n.on{background:var(--c,var(--acc));color:#10142a;transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 18px var(--c,var(--acc))}
.cyc .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:800;font-size:13px;color:var(--mut);max-width:34%}
.flx{display:flex;flex-direction:column;gap:4px}
.flx .b{background:var(--card);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px;opacity:0}
.flx .b b{color:var(--pri);white-space:nowrap}
.flx .b.fin{background:var(--pri);color:#10142a}.flx .b.fin b{color:#10142a}
.flx .a{text-align:center;color:var(--pri);opacity:0;font-size:15px;line-height:1.1;font-weight:900}
.go .flx .b,.go .flx .a{animation:fade .45s forwards}
.brs{display:flex;flex-direction:column;gap:10px}
.brs .r{font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.brs .t{height:14px;background:var(--card);border-radius:99px;overflow:hidden;margin-top:4px}
.brs .t i{display:block;height:100%;width:0;background:var(--c,var(--pri));border-radius:99px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.chf{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.chf div{background:var(--card);border-radius:12px;padding:12px 8px;text-align:center}
.chf b{display:block;font-size:24px;color:var(--pri)}.chf span{font-size:12px;color:var(--mut);line-height:1.3;display:block;margin-top:2px}
/* classes d'animation utilisables dans les SVG du contenu */
.flow{animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}
.glow{animation:glow 1.6s ease-in-out infinite}@keyframes glow{50%{opacity:.55}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.go .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}@keyframes pop{from{transform:scale(0);opacity:0}}
.go .draw{stroke-dasharray:600;animation:draw 1.4s ease-out backwards}@keyframes draw{from{stroke-dashoffset:600}}
.go .appear{animation:fade .5s backwards}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div class="app">

<section class="screen on" id="home">
  <div class="top"><h1 id="appName"></h1><span class="pill" id="xpP"></span></div>
  <div class="hero"><div class="ic" id="appIc"></div><div style="flex:1"><b>Ta progression</b><span id="progTx"></span><div class="bar"><i id="progBar"></i></div></div></div>
  <div class="card" id="dayCard"></div>
  <div class="card word"><span class="mut">💡 Mot du jour</span><h3 id="wotdM"></h3><p id="wotdD" style="line-height:1.5"></p></div>
  <h2>Continuer</h2>
  <div id="nextMod"></div>
  <h2>Défi rapide</h2>
  <button class="btn" onclick="startQuiz()">⚡ Quiz express (10 questions)</button>
</section>

<section class="screen" id="cours">
  <h1>📚 Cours</h1><p class="mut" id="sousTitre"></p>
  <div id="modList" style="display:flex;flex-direction:column;gap:10px"></div>
</section>

<section class="screen" id="fiche"><div id="ficheBody" style="display:flex;flex-direction:column;gap:14px"></div></section>

<section class="screen" id="jeux">
  <h1>🎮 Jeux</h1><p class="mut">Apprends en jouant. Chaque partie rapporte de l'XP.</p>
  <div class="grid">
    <button class="game" style="background:#ffc83d" onclick="startQuiz()"><span class="e">❓</span>Quiz<small>QCM + explications</small></button>
    <button class="game" style="background:#3db5ff" onclick="startVF()"><span class="e">⏱️</span>Vrai / Faux<small>Contre la montre</small></button>
    <button class="game" style="background:#2ed47a" onclick="startMatch()"><span class="e">🔗</span>Associer<small>Mot ↔ définition</small></button>
    <button class="game" style="background:#ff8fab" onclick="startOrdre()"><span class="e">🪜</span>Dans l'ordre<small>Les bonnes étapes</small></button>
    <button class="game" id="calcBtn" style="background:#b18cff;display:none" onclick="startCalc()"><span class="e">🧮</span>Calcul mental<small>Réponds vite</small></button>
  </div>
  <button class="btn" id="examBtn" style="display:none" onclick="startExam()"></button>
  <div class="card"><span class="mut">🏆 Meilleurs scores</span><div id="best" style="line-height:1.8"></div></div>
</section>

<section class="screen" id="lexique">
  <h1>📖 Lexique</h1>
  <input class="search" id="q" placeholder="Rechercher un mot-clé…" oninput="renderLex()">
  <div id="lexList" style="display:flex;flex-direction:column;gap:8px"></div>
</section>

<section class="screen" id="play"><div id="playBody" style="display:flex;flex-direction:column;gap:14px"></div></section>
</div>

<nav><div class="in">
  <button data-t="home" class="on" onclick="tab('home')"><span>🏠</span>Accueil</button>
  <button data-t="cours" onclick="tab('cours')"><span>📚</span>Cours</button>
  <button data-t="jeux" onclick="tab('jeux')"><span>🎮</span>Jeux</button>
  <button data-t="lexique" onclick="tab('lexique')"><span>📖</span>Lexique</button>
</div></nav>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div class="in" id="modalIn"></div></div>

<script>
/* =====================================================================
   CONTENU — c'est la seule partie à changer pour un autre métier
   ===================================================================== */
/* Paie Pro — contenu (titre pro Gestionnaire de paie)
   ⚠️ CHIFFRES 2026 : SMIC, plafond de la Sécurité sociale et taux sont à mettre à jour chaque 1er janvier.
   À faire relire par un formateur paie avant publication. */
const C={
 id:'paie',app:'Paie Pro',icon:'💶',
 sousTitre:'Le titre pro Gestionnaire de paie, en fiches courtes. Chiffres 2026.',
 theme:{pri:'#7ee081',pri2:'#3fa646',acc:'#5ad1ff'},
 pub:{actif:true,toutesLes:3},
 examen:{titre:'Test de connaissances paie',questions:30,seuil:21,minutes:30},
 modules:[
  {id:'bulletin',i:'🧾',t:'Le bulletin de paie',d:'Du brut au net à payer',
   s:[{h:'Les grandes étapes',l:['<b>Salaire brut</b> = salaire de base + heures supplémentaires + primes + avantages − absences.','− <b>cotisations salariales</b> → <b>net avant impôt</b>.','− <b>prélèvement à la source</b> (impôt sur le revenu) → <b>net à payer</b>.','Le bulletin affiche aussi le <b>montant net social</b> (sert au calcul des aides sociales).']},
      {h:'Ordres de grandeur',l:['Cotisations <b>salariales</b> : environ <b>22 %</b> du brut pour un non-cadre.','Cotisations <b>patronales</b> : environ <b>40 à 45 %</b> du brut (avant réductions).','Donc net avant impôt ≈ <b>78 %</b> du brut. Exemple : 2 000 € brut → environ 1 560 € net.']},
      {h:'Obligations',l:['Le bulletin est remis à chaque paie, sur papier ou en version électronique (sauf refus du salarié).','L\'employeur conserve un double <b>5 ans</b>. Le salarié le garde <b>sans limite de durée</b>.']}],
   k:['Salaire brut','Net à payer','Montant net social','Prélèvement à la source']},
  {id:'temps',i:'⏱️',t:'Salaire & temps de travail',d:'SMIC, taux horaire, heures supplémentaires',
   s:[{h:'Les chiffres de base (2026)',l:['Durée légale : <b>35 h par semaine</b>, soit <b>151,67 h par mois</b>.','<b>SMIC horaire brut : 12,02 €</b>.','<b>SMIC mensuel brut : 1 823,03 €</b> (35 h).','Taux horaire = salaire mensuel ÷ 151,67.']},
      {h:'Les heures supplémentaires',l:['Ce sont les heures faites <b>au-delà de 35 h</b> par semaine.','Majoration légale (sans accord) : <b>+25 %</b> de la 36e à la 43e heure, <b>+50 %</b> à partir de la 44e.','Un accord d\'entreprise peut fixer un taux différent, <b>au minimum 10 %</b>.','Exemple : taux horaire 15 €, 4 h sup à 25 % → 4 × 15 × 1,25 = <b>75 €</b>.']},
      {h:'Hiérarchie des règles',l:['Code du travail → <b>convention collective</b> de branche → accord d\'entreprise → contrat de travail.','La convention collective fixe souvent les salaires minimums, les primes et les préavis : toujours la vérifier.']}],
   k:['SMIC','Heures supplémentaires','Convention collective','Taux horaire']},
  {id:'cotis',i:'🏛️',t:'Les cotisations',d:'Plafond, CSG/CRDS, retraite, chômage',
   s:[{h:'Le plafond de la Sécurité sociale',l:['<b>PMSS 2026 : 4 005 €</b> par mois (PASS : 48 060 € par an).','Certaines cotisations ne s\'appliquent que jusqu\'au plafond (<b>tranche A / T1</b>), d\'autres sur tout le salaire (<b>déplafonnées</b>).']},
      {h:'CSG et CRDS',l:['Assiette : <b>98,25 %</b> du brut (abattement de 1,75 % pour frais professionnels).','<b>CSG déductible : 6,8 %</b> · <b>CSG non déductible : 2,4 %</b> · <b>CRDS : 0,5 %</b>.','La CSG non déductible et la CRDS sont soumises à l\'impôt sur le revenu.']},
      {h:'Les principales cotisations',l:['<b>Maladie, vieillesse, allocations familiales, accidents du travail</b> : URSSAF.','<b>Retraite complémentaire</b> : Agirc-Arrco, sur tranches T1 et T2.','<b>Assurance chômage</b> : uniquement patronale (plus de part salariale depuis 2018).','<b>Mutuelle</b> : obligatoire, l\'employeur paie <b>au moins 50 %</b>.']}],

const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const P={xp:0,read:new Set(),best:{quiz:0,vf:0,match:0,ordre:null,calc:0,exam:0},parties:0,fin:new Set(),mq:new Set(),serie:0,jour:'',xpJour:0};
let FX=[];const OBJ=50;
/* sauvegarde de la progression (une clé par app) */
const KEY='appmetier_'+(C.id||C.app);
function save(){try{localStorage.setItem(KEY,JSON.stringify({xp:P.xp,read:[...P.read],best:P.best,parties:P.parties,fin:[...P.fin],mq:[...P.mq],serie:P.serie,jour:P.jour,xpJour:P.xpJour}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){P.xp=d.xp||0;P.read=new Set(d.read||[]);Object.assign(P.best,d.best||{});P.parties=d.parties||0;P.fin=new Set(d.fin||[]);P.mq=new Set(d.mq||[]);P.serie=d.serie||0;P.jour=d.jour||'';P.xpJour=d.xpJour||0}}catch(e){}}
/* thème : couleurs propres à chaque app (facultatif) */
function theme(){const th=C.theme||{};Object.keys(th).forEach(k=>document.documentElement.style.setProperty('--'+k,th[k]))}
let G={};

function tab(t){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  show(t);
  if(t==='home')renderHome();if(t==='cours')renderMods();if(t==='lexique')renderLex();if(t==='jeux')renderBest();
}
function show(id){clearInterval(G.tm);FX.forEach(clearInterval);FX=[];if($('rb'))$('rb').style.width=0;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}

/* accueil */
function renderHome(){
  $('appName').textContent=C.app;$('appIc').textContent=C.icon;$('xpP').textContent='⚡ '+P.xp+' XP';
  const n=P.read.size,t=C.modules.length;$('progTx').textContent=`${n} / ${t} modules lus · Niveau ${Math.floor(P.xp/150)+1}`;$('progBar').style.width=(n/t*100)+'%';
  const w=C.lexique[new Date().getDate()%C.lexique.length];$('wotdM').textContent=w[0];$('wotdD').textContent=w[1];
  const m=C.modules.find(m=>!P.read.has(m.id))||C.modules[0];
  $('nextMod').innerHTML=modRow(m);
  const auj=P.jour===today(),xj=auj?P.xpJour:0,s=auj||P.jour===today(-1)?P.serie:0;
  $('dayCard').innerHTML=`<div class="day"><span class="fl ${auj?'':'off'}">🔥</span><div style="flex:1"><b>${s} jour${s>1?'s':''} de suite</b><div class="mut">${auj?'Bravo, tu as appris aujourd\'hui !':'Apprends aujourd\'hui pour garder ta série.'}</div></div></div>
   <div class="mut" style="display:flex;justify-content:space-between;margin-top:6px"><span>🎯 Objectif du jour</span><b style="color:#fff">${Math.min(xj,OBJ)} / ${OBJ} XP</b></div><div class="prog" style="flex:none"><i style="width:${Math.min(100,xj/OBJ*100)}%"></i></div>`;
}
function modRow(m){return `<button class="row" onclick="openFiche('${m.id}')"><span class="ic">${m.i}</span><span class="tx"><b>${m.t}</b><span>${m.d}</span></span>${P.read.has(m.id)?'<span class="ok">✓</span>':'<span class="mut">›</span>'}</button>`}
function renderMods(){$('modList').innerHTML=C.modules.map(modRow).join('')}

/* fiche */
function openFiche(id){
  const m=C.modules.find(x=>x.id===id),F=(C.fiches||{})[id]||{},k=C.modules.indexOf(m),nx=C.modules[k+1];
  P.read.add(id);save();
  const S=m.s.map((s,i)=>Object.assign({},s,(F.s||[])[i]||{}));
  const mots=(JSON.stringify(S)+(F.intro||'')).replace(/<[^>]+>/g,' ').split(/\s+/).length,min=Math.max(1,Math.round(mots/170));
  $('ficheBody').innerHTML=`<div class="rbar"><i id="rb"></i></div>
   <div class="top"><button class="back" onclick="tab('cours')">←</button><span class="pill">Module ${k+1} / ${C.modules.length}</span></div>
   <div class="fhero"><span class="fic">${m.i}</span><div><h1>${m.t}</h1><p class="mut">${m.d}</p><span class="mut">⏱ ${min} min de lecture · ${S.length} parties${P.fin.has(id)?' · ✅ lue':''}</span></div></div>
   ${F.intro?`<p class="chapo">${F.intro}</p>`:''}
   ${S.length>1?`<div class="toc"><b>Sommaire</b>${S.map((s,i)=>`<button onclick="$('s${i}').scrollIntoView({behavior:'smooth',block:'start'})">${i+1}. ${s.h}</button>`).join('')}</div>`:''}
   ${S.map((s,i)=>`<div class="sec" id="s${i}"><div class="sh"><span class="num">${i+1}</span><h3>${s.h}</h3></div>
     ${s.p?`<p>${s.p}</p>`:''}${s.l?`<ul>${s.l.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
     ${s.fig?figHTML(s.fig):''}
     ${s.ex?`<div class="box ex2"><b>💡 Exemple concret</b>${s.ex}</div>`:''}
     ${s.att?`<div class="box att"><b>⚠️ Attention</b>${s.att}</div>`:''}
     ${s.info?`<div class="box info"><b>🤓 Le savais-tu ?</b>${s.info}</div>`:''}
     ${s.q?mqHTML(s.q,id+':'+i):''}</div>`).join('')}
   ${F.retenir?`<div class="box ret"><b>📌 À retenir</b><ul>${F.retenir.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
   <div class="key"><h3>🔑 Mots-clés</h3><div class="chips">${m.k.map(k=>`<button class="chip" onclick="def('${k.replace(/'/g,"\\'")}')">${k}</button>`).join('')}</div></div>
   <div id="finF"></div>
   <button class="btn" onclick="startQuiz('${m.id}')">🎯 S'entraîner sur ce module</button>
   ${nx?`<button class="btn ghost" onclick="openFiche('${nx.id}')">Module suivant : ${nx.i} ${nx.t} →</button>`:`<button class="btn ghost" onclick="tab('cours')">🎉 Tous les modules vus — retour aux cours</button>`}`;
  show('fiche');
  document.querySelectorAll('#ficheBody .fig').forEach(f=>watch(f,()=>playFig(f)));
  watch($('finF'),()=>{if(!P.fin.has(id)){P.fin.add(id);gain(20,$('finF'));toast('📖 Fiche terminée ! +20 XP')}});
}
/* barre de lecture */
addEventListener('scroll',()=>{const r=$('rb');if(!r||!$('fiche').classList.contains('on'))return;const h=document.documentElement.scrollHeight-innerHeight;r.style.width=(h>0?Math.min(100,scrollY/h*100):100)+'%'},{passive:true});
function watch(el,f){if(!('IntersectionObserver' in window))return f();const o=new IntersectionObserver(e=>{if(e[0].isIntersecting){o.disconnect();f()}},{threshold:.35});o.observe(el)}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}

/* mini-question dans la fiche : [question,[bonne,faux,…],0,explication] */
function mqHTML(q,key){const o=shuf(q[1].map((t,i)=>({t,i})));
  return `<div class="mq" data-k="${key}"><b>✋ Vérifie que tu as compris</b><p>${q[0]}</p>${o.map(x=>`<button class="ans" data-i="${x.i}" onclick="mqA(this)">${x.t}</button>`).join('')}<div class="ex"></div></div>`}
function mqA(b){const box=b.closest('.mq'),k=box.dataset.k,[mid,si]=k.split(':'),m=C.modules.find(x=>x.id===mid);
  const s=Object.assign({},m.s[si],((C.fiches||{})[mid]||{s:[]}).s[si]||{}),q=s.q,bs=[...box.querySelectorAll('.ans')];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);
  const ok=+b.dataset.i===q[2];bs.forEach(x=>{if(+x.dataset.i===q[2])x.classList.add('ok');else if(x!==b)x.classList.add('dim')});
  if(ok){if(!P.mq.has(k)){P.mq.add(k);gain(5,b)}else beep(1)}else{b.classList.add('ko');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');beep(0)}
  const e=box.querySelector('.ex');e.innerHTML=(ok?'✅ ':'❌ ')+q[3];e.classList.add('on');}

/* ----- FIGURES ANIMÉES -----
   fig:{type:'cycle',etapes:['A','B',['C','#ff5470']],centre:'…'}   étapes en boucle
   fig:{type:'flux',etapes:['A',['B','valeur'],…],ops:['− 5','÷ 3']}  étapes qui apparaissent une à une
   fig:{type:'barres',items:[['Libellé',valeur,'unité','#couleur'],…]}  barres comparées
   fig:{type:'chiffres',items:[[valeur,'unité','légende'],…]}          chiffres clés qui défilent
   fig:{type:'svg',svg:'<svg…>'}  dessin libre (classes : flow, glow, spin, pop, draw, appear)
   + legende:'…' (facultatif) */
function figHTML(f){let h='';
  if(f.type==='cycle'){const n=f.etapes.length,T=n*1.6;
    h=`<div class="cyc" data-n="${n}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--card)" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="none" stroke="var(--pri)" stroke-width="1.2" stroke-dasharray="3 5" class="flow" opacity=".7"/><circle r="3" fill="var(--pri)"><animateMotion dur="${T}s" repeatCount="indefinite" path="M50,12 A38,38 0 1,1 49.99,12"/></circle></svg>
     ${f.etapes.map((e,i)=>{const [t,c]=Array.isArray(e)?e:[e],a=(-90+i*360/n)*Math.PI/180;return `<div class="n" style="left:${50+38*Math.cos(a)}%;top:${50+38*Math.sin(a)}%;${c?'--c:'+c:''}">${t}</div>`}).join('')}
     ${f.centre?`<div class="ctr">${f.centre}</div>`:''}</div>`}
  else if(f.type==='flux'){h=`<div class="flx">${f.etapes.map((e,i)=>{const [t,v]=Array.isArray(e)?e:[e];return (i?`<div class="a" style="animation-delay:${i*.7-.35}s">↓ ${(f.ops||[])[i-1]||''}</div>`:'')+`<div class="b ${i===f.etapes.length-1?'fin':''}" style="animation-delay:${i*.7}s"><span>${t}</span>${v?`<b>${v}</b>`:''}</div>`}).join('')}</div>`}
  else if(f.type==='barres'){const mx=Math.max(...f.items.map(x=>x[1]));h=`<div class="brs">${f.items.map(x=>`<div><div class="r"><span>${x[0]}</span><span><span class="cnt" data-v="${x[1]}">0</span>${x[2]?' '+x[2]:''}</span></div><div class="t"><i data-w="${Math.max(1.5,x[1]/mx*100)}" style="${x[3]?'--c:'+x[3]:''}"></i></div></div>`).join('')}</div>`}
  else if(f.type==='chiffres'){h=`<div class="chf">${f.items.map(x=>`<div><b><span class="cnt" data-v="${x[0]}">0</span>${x[1]?' '+x[1]:''}</b><span>${x[2]||''}</span></div>`).join('')}</div>`}
  else if(f.type==='svg')h=f.svg;
  return `<div class="fig" data-t="${f.type}"><button class="rej" onclick="playFig(this.parentNode)">↻ Rejouer</button>${h}${f.legende?`<div class="leg">${f.legende}</div>`:''}</div>`}
function playFig(f){
  f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  const t=f.dataset.t;
  if(t==='cycle'){const ns=[...f.querySelectorAll('.n')],n=ns.length;let i=0;const st=()=>{ns.forEach((x,j)=>x.classList.toggle('on',j===i%n));i++};
    FX.forEach(x=>{if(x.f===f)clearInterval(x)});st();const iv=setInterval(st,1600);iv.f=f;FX.push(iv);
    const an=f.querySelector('animateMotion');if(an&&an.beginElement)an.beginElement()}
  if(t==='barres')f.querySelectorAll('.t i').forEach(i=>{i.style.width=0;void i.offsetWidth;i.style.width=i.dataset.w+'%'});
  f.querySelectorAll('.cnt').forEach(countUp);
}
function countUp(el){const v=+el.dataset.v,d=(el.dataset.v.split('.')[1]||'').length,t0=performance.now(),D=1100;
  (function s(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=(v*e).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});if(p<1)requestAnimationFrame(s)})(t0)}
function def(k){const w=C.lexique.find(x=>x[0]===k);$('modalIn').innerHTML=`<span class="mut">📖 Lexique</span><h2>${k}</h2><p style="line-height:1.55">${w?w[1]:''}</p><button class="btn ghost" onclick="$('modal').classList.remove('on')">Fermer</button>`;$('modal').classList.add('on')}

/* lexique */
function renderLex(){
  const q=($('q').value||'').toLowerCase();
  $('lexList').innerHTML=C.lexique.filter(w=>(w[0]+w[1]).toLowerCase().includes(q)).sort((a,b)=>a[0].localeCompare(b[0])).map(w=>`<div class="lex" onclick="this.classList.toggle('open')"><b>${w[0]}</b><p>${w[1]}</p></div>`).join('')||'<p class="mut">Aucun résultat.</p>';
}
function renderBest(){const b=P.best;$('best').innerHTML=`❓ Quiz : ${b.quiz}/10<br>⏱️ Vrai/Faux : ${b.vf}/10<br>🔗 Associer : ${b.match?b.match+' s':'—'}<br>🪜 Dans l'ordre : ${b.ordre===null?'—':b.ordre+' erreur(s)'}`+(C.calcul?`<br>🧮 Calcul mental : ${b.calc}/10`:'')+(C.examen?`<br>📝 Examen blanc : ${b.exam?b.exam+' / '+examN():'—'}`:'')}

/* ----- QUIZ ----- */
function startQuiz(mod){
  let pool=C.quiz.filter(q=>!mod||q[0]===mod);
  G={type:'quiz',list:shuf(pool).slice(0,10),i:0,score:0};G.n=G.list.length;show('play');quizQ();
}
function quizQ(){
  const q=G.list[G.i];const order=shuf(q[2].map((t,i)=>({t,i})));
  $('playBody').innerHTML=head()+`<div class="qcard" id="qc">${q[1]}</div>
   <div style="display:flex;flex-direction:column;gap:10px">${order.map(o=>`<button class="ans" data-i="${o.i}" onclick="quizA(this)">${o.t}</button>`).join('')}</div>
   <div class="ex" id="ex"></div>`;
}
function quizA(b){
  const q=G.list[G.i],bs=[...document.querySelectorAll('.ans')];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);
  const ok=+b.dataset.i===q[3];
  bs.forEach(x=>{if(+x.dataset.i===q[3])x.classList.add('ok');else if(x!==b)x.classList.add('dim')});
  if(ok){G.score++;gain(10,b)}else{b.classList.add('ko');shake('qc')}
  $('ex').innerHTML=(ok?'✅ ':'❌ ')+q[4]+`<button class="btn" style="margin-top:12px" onclick="nextQ(quizQ)">Continuer</button>`;$('ex').classList.add('on');
}

/* ----- VRAI / FAUX ----- */
function startVF(){G={type:'vf',list:shuf(C.vf).slice(0,10),i:0,score:0};G.n=G.list.length;show('play');vfQ()}
function vfQ(){
  const q=G.list[G.i];
  $('playBody').innerHTML=head()+`<div class="timer"><i id="tb"></i></div><div class="qcard" id="qc">${q[0]}</div>
   <div class="vf"><button style="background:var(--ok)" onclick="vfA(true)">VRAI</button><button style="background:var(--ko)" onclick="vfA(false)">FAUX</button></div><div class="ex" id="ex"></div>`;
  const t0=Date.now(),D=8000;clearInterval(G.tm);
  G.tm=setInterval(()=>{const p=1-(Date.now()-t0)/D;$('tb').style.width=Math.max(0,p*100)+'%';if(p<=0)vfA(null)},50);
}
function vfA(v){
  clearInterval(G.tm);const q=G.list[G.i];const bs=document.querySelectorAll('.vf button');if(bs[0].disabled)return;bs.forEach(b=>b.disabled=true);
  const ok=v===q[1];if(ok){G.score++;gain(10,bs[v?0:1])}else shake('qc');
  $('ex').innerHTML=(ok?'✅ Bien vu ! ':v===null?'⏰ Trop lent ! ':'❌ ')+`C'est <b>${q[1]?'VRAI':'FAUX'}</b>. ${q[2]}<button class="btn" style="margin-top:12px" onclick="nextQ(vfQ)">Continuer</button>`;$('ex').classList.add('on');
}

/* ----- ASSOCIER ----- */
function startMatch(){
  const pairs=shuf(C.lexique).slice(0,5);G={type:'match',pairs,left:shuf(pairs.map((p,i)=>({t:p[0],i}))),right:shuf(pairs.map((p,i)=>({t:p[1],i}))),sel:null,done:0,err:0,t0:Date.now()};
  show('play');
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="tab('jeux')">✕</button><b>🔗 Associe chaque mot</b><span class="pill" id="mt">0/5</span></div>
  <div class="match"><div class="col">${G.left.map(x=>`<button class="tile" data-k="L" data-i="${x.i}" onclick="pickT(this)">${x.t}</button>`).join('')}</div>
  <div class="col">${G.right.map(x=>`<button class="tile" data-k="R" data-i="${x.i}" onclick="pickT(this)" style="font-weight:500;font-size:13px">${x.t}</button>`).join('')}</div></div>`;
}
function pickT(b){
  if(!G.sel||G.sel.dataset.k===b.dataset.k){document.querySelectorAll('.tile.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');G.sel=b;return}
  const a=G.sel;G.sel=null;a.classList.remove('sel');
  if(a.dataset.i===b.dataset.i){a.classList.add('done');b.classList.add('done');G.done++;gain(10,b);$('mt').textContent=G.done+'/5';
    if(G.done===5){const s=Math.round((Date.now()-G.t0)/1000);if(!P.best.match||s<P.best.match)P.best.match=s;setTimeout(()=>end(5-Math.min(G.err,5),5,`en ${s} s · ${G.err} erreur(s)`),800)}}
  else{G.err++;[a,b].forEach(x=>{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad')})}
}

/* ----- DANS L'ORDRE ----- */
function startOrdre(){
  const o=C.ordre[rand(0,C.ordre.length-1)];G={type:'ordre',o,k:0,err:0};show('play');
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="tab('jeux')">✕</button><b>🪜 Dans l'ordre</b><span class="pill" id="oe">0 erreur</span></div>
  <div class="card"><span class="mut">Remets les étapes dans le bon ordre</span><h3>${o.t}</h3></div>
  <div class="steps" id="st">${o.s.map((_,i)=>`<div class="step empty">${i+1}.</div>`).join('')}</div>
  <div style="display:flex;flex-direction:column;gap:8px" id="pool">${shuf(o.s.map((t,i)=>({t,i}))).map(x=>`<button class="ans" data-i="${x.i}" onclick="ordA(this)">${x.t}</button>`).join('')}</div>`;
}
function ordA(b){
  if(+b.dataset.i===G.k){const s=$('st').children[G.k];s.className='step';s.textContent=(G.k+1)+'. '+b.textContent;b.remove();gain(5,s);G.k++;
    if(G.k===G.o.s.length){P.best.ordre=P.best.ordre===null?G.err:Math.min(P.best.ordre,G.err);setTimeout(()=>end(Math.max(0,G.o.s.length-G.err),G.o.s.length,G.err+' erreur(s)'),600)}}
  else{G.err++;$('oe').textContent=G.err+' erreur'+(G.err>1?'s':'');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','ko');setTimeout(()=>b.classList.remove('ko'),400)}
}

/* ----- CALCUL MENTAL (si C.calcul est défini) ----- */
/* C.calcul = [{op:'+',a:[min,max],b:[min,max]}, …]  op : + − × ÷ */
function calcQ1(g){
  let a=rand(...g.a),b=rand(...g.b),r,txt;
  if(g.op==='+'){r=a+b;txt=`${a} + ${b}`}
  else if(g.op==='−'){if(b>a)[a,b]=[b,a];r=a-b;txt=`${a} − ${b}`}
  else if(g.op==='×'){r=a*b;txt=`${a} × ${b}`}
  else{r=a;a=a*b;txt=`${a} ÷ ${b}`}
  const opts=new Set([r]),d=[1,-1,2,-2,10,-10].concat(g.op==='×'||g.op==='÷'?[b,-b]:[]);
  const nums=txt.match(/\d+/g).map(Number),ok=v=>v>=0&&!nums.includes(v);
  for(const x of shuf(d)){if(opts.size>=4)break;if(ok(r+x))opts.add(r+x)}
  let k=3;while(opts.size<4){if(ok(r+k))opts.add(r+k);k++}
  const ch=[...opts].map(String);
  return ['calc',txt+' = ?',ch,0,`${txt} = ${r}`];
}
function startCalc(){G={type:'calc',list:Array.from({length:10},()=>calcQ1(C.calcul[rand(0,C.calcul.length-1)])),i:0,score:0};G.n=10;show('play');quizQ()}

/* ----- EXAMEN BLANC (si C.examen est défini) -----
   C.examen = {titre, questions:60, seuil:42, minutes:60}
   Questions tirées de tout le quiz, pas de correction pendant l'épreuve, verdict + corrections à la fin. */
function examN(){return Math.min(C.examen.questions,C.quiz.length)}
function examSeuil(){return Math.ceil(C.examen.seuil/C.examen.questions*examN())}
function startExam(){
  G={type:'exam',list:shuf(C.quiz).slice(0,examN()),i:0,score:0,err:[],t0:Date.now()};G.n=G.list.length;show('play');examQ();
  const D=C.examen.minutes*60000*G.n/C.examen.questions;
  G.tm=setInterval(()=>{const r=D-(Date.now()-G.t0);if($('chr'))$('chr').textContent=Math.max(0,Math.ceil(r/60000))+' min';if(r<=0){clearInterval(G.tm);examEnd(true)}},1000);
}
function examQ(){
  const q=G.list[G.i];const order=shuf(q[2].map((t,i)=>({t,i})));
  $('playBody').innerHTML=`<div class="top"><button class="back" onclick="if(confirm('Abandonner l\'examen ?'))tab('jeux')">✕</button><div class="prog"><i style="width:${G.i/G.n*100}%"></i></div><span class="pill">${G.i+1}/${G.n}</span><span class="pill" id="chr">⏱</span></div>
   <div class="qcard">${q[1]}</div>
   <div style="display:flex;flex-direction:column;gap:10px">${order.map(o=>`<button class="ans" data-i="${o.i}" onclick="examA(this)">${o.t}</button>`).join('')}</div>`;
}
function examA(b){
  const q=G.list[G.i];if(+b.dataset.i===q[3])G.score++;else G.err.push(q);
  G.i++;if(G.i>=G.n){clearInterval(G.tm);examEnd(false)}else examQ();
}
function examEnd(temps){
  G.list.slice(G.i).forEach(q=>G.err.push(q));
  const ok=G.score>=examSeuil();if(G.score>(P.best.exam||0))P.best.exam=G.score;P.xp+=G.score*2;P.parties++;save();
  if(ok)confetti();
  pubInterstitiel(()=>{show('play');
  $('playBody').innerHTML=`<div class="big">${ok?'🎓':'📚'}</div>
   <h1 style="text-align:center">${ok?'Admis !':'Pas encore…'}</h1>
   <p class="mut" style="text-align:center;font-size:16px">${temps?'⏰ Temps écoulé. ':''}<b>${G.score} / ${G.n}</b> — il fallait ${examSeuil()} bonnes réponses</p>
   ${G.err.length?`<h2>Tes erreurs</h2>`+G.err.map(q=>`<div class="sec"><p><b>${q[1]}</b></p><p style="color:var(--ok);margin-top:6px">✓ ${q[2][q[3]]}</p><p class="mut" style="margin-top:4px">${q[4]}</p></div>`).join(''):''}
   <button class="btn" onclick="startExam()">Repasser l'examen</button><button class="btn ghost" onclick="tab('cours')">Revoir les cours</button>${pubBanniere()}`;
  if(window.PUB&&window.PUB.banniere&&$('pubB'))window.PUB.banniere($('pubB'));});
}

/* ----- PUB -----
   Dans le navigateur on affiche un emplacement réservé.
   Dans l'appli Android (Capacitor + AdMob), définir window.PUB = {banniere(el), interstitiel(fin)}
   et ces fonctions seront appelées à la place. */
function pubBanniere(){if(!C.pub||!C.pub.actif)return '';return '<div class="pub" id="pubB">PUBLICITÉ</div>'}
function pubInterstitiel(suite){
  if(!C.pub||!C.pub.actif||P.parties%(C.pub.toutesLes||3)!==0)return suite();
  if(window.PUB&&window.PUB.interstitiel)return window.PUB.interstitiel(suite);
  const d=document.createElement('div');d.className='pub full';d.innerHTML='PUBLICITÉ<button class="btn" style="width:auto;padding:12px 26px">Continuer</button>';
  d.querySelector('button').onclick=()=>{d.remove();suite()};document.body.appendChild(d);
}

/* ----- série de jours & objectif du jour ----- */
function today(d=0){const t=new Date(Date.now()+d*864e5);return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate()}
function jour(x){if(P.jour!==today()){P.serie=P.jour===today(-1)?P.serie+1:1;P.jour=today();P.xpJour=0;if(P.serie>1)setTimeout(()=>toast('🔥 '+P.serie+' jours de suite !'),400)}
  const av=P.xpJour;P.xpJour+=x;if(av<OBJ&&P.xpJour>=OBJ){setTimeout(()=>{toast('🎯 Objectif du jour atteint !');confetti()},300)}}

/* ----- commun ----- */
function head(){return `<div class="top"><button class="back" onclick="tab('jeux')">✕</button><div class="prog"><i style="width:${G.i/G.n*100}%"></i></div><span class="pill">${G.score} ✓</span></div>`}
function nextQ(f){G.i++;if(G.i>=G.n){if(G.score>P.best[G.type])P.best[G.type]=G.score;end(G.score,G.n,G.score+' / '+G.n+' bonnes réponses')}else f()}
function end(sc,n,txt){P.parties++;save();pubInterstitiel(()=>endScreen(sc,n,txt))}
function endScreen(sc,n,txt){
  const r=sc/n,stars=r>=.9?3:r>=.6?2:r>0?1:0;if(stars>=2)confetti();
  show('play');
  $('playBody').innerHTML=`<div style="height:30px"></div><div class="big">${stars===3?'🏆':stars===2?'🎉':'💪'}</div>
  <h1 style="text-align:center">${stars===3?'Parfait !':stars===2?'Bien joué !':'Continue comme ça !'}</h1>
  <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p class="mut" style="text-align:center;font-size:16px">${txt}</p>
  <div style="height:20px"></div><button class="btn" onclick="tab('jeux')">Autre jeu</button><button class="btn ghost" onclick="tab('cours')">Revoir les cours</button>${pubBanniere()}`;
  if(window.PUB&&window.PUB.banniere&&$('pubB'))window.PUB.banniere($('pubB'));
}
function gain(x,el){P.xp+=x;jour(x);save();const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='float';d.textContent='+'+x+' XP';d.style.left=(r.left+r.width/2-35)+'px';d.style.top=(r.top)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000);beep(1)}
function shake(id){const e=$(id);e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');beep(0)}
let AC;function beep(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.connect(g);g.connect(AC.destination);o.type='triangle';
 if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+.08)}else{o.frequency.setValueAtTime(220,t);o.frequency.linearRampToValueAtTime(140,t+.25)}
 g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}catch(e){}}
function confetti(){const c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#ffc83d','#2ed47a','#3db5ff','#ff5470'];
 const ps=Array.from({length:120},()=>({x:c.width/2,y:c.height/3,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:rand(5,10),c:cols[rand(0,3)],r:0}));let f=0;
 (function l(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<110)requestAnimationFrame(l);else x.clearRect(0,0,c.width,c.height)})()}
/* démarrage */
document.title=C.app;$('sousTitre').textContent=C.sousTitre||'';
if(C.calcul)$('calcBtn').style.display='';
if(C.examen){$('examBtn').style.display='';$('examBtn').textContent='📝 '+(C.examen.titre||'Examen blanc')+' ('+examN()+' questions)'}
theme();load();renderHome();
</script>
