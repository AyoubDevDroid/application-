<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Maths 4e</title>
<style>
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));--bg:#10142a;--card:#1c2244;--card2:#252c58;--pri:#ffc83d;--pri2:#d99a00;--acc:#3db5ff;--ok:#2ed47a;--ko:#ff5470;--txt:#fff;--mut:#a9b0d6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:calc(16px + var(--sat)) 16px calc(96px + var(--sab));min-height:100vh}
.screen{display:none;flex-direction:column;gap:14px;animation:fade .3s}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:26px}h2{font-size:21px}h3{font-size:17px}
.mut{color:var(--mut);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:rgba(255,255,255,.08);padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px;white-space:nowrap}
button.pill{border:none;color:#fff;cursor:pointer}
.back{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:2px 8px 2px 0}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#1b1640;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center}
.hero .ic{font-size:54px;animation:zap 2.5s infinite}
@keyframes zap{0%,90%,100%{transform:none}93%{transform:rotate(-12deg) scale(1.1)}96%{transform:rotate(10deg)}}
.hero b{font-size:22px;display:block}
.bar{height:10px;background:rgba(0,0,0,.15);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#1b1640;border-radius:99px;transition:width .5s}
.card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.mini{padding:10px 14px;gap:2px}
.word{background:var(--card2);border-left:4px solid var(--acc)}
.row{display:flex;gap:12px;align-items:center;cursor:pointer;border:none;background:var(--card);color:#fff;border-radius:18px;padding:14px;text-align:left;width:100%;font-size:16px}
.row .ic{font-size:30px;width:48px;height:48px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .tx{flex:1;min-width:0}.row .tx b{display:block}.row .tx span{font-size:13px;color:var(--mut)}
.row .ok{color:var(--ok);font-weight:900}
.row .st{color:var(--pri);font-weight:900;letter-spacing:1px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{border:none;border-radius:20px;padding:18px 10px;color:#1b1640;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.game .e{font-size:38px}.game small{font-weight:600;font-size:12px;opacity:.8}
.game:active,.btn:active,.ans:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn{border:none;border-radius:16px;padding:15px;font-size:17px;font-weight:800;color:#1b1640;background:var(--pri);box-shadow:0 5px 0 var(--pri2);cursor:pointer;width:100%}
.btn.ghost{background:var(--card2);color:#fff;box-shadow:none}
.btn:disabled{opacity:.5}
/* fiche */
.sec{background:var(--card);border-radius:18px;padding:16px}
.sec h3{margin-bottom:8px;color:var(--pri)}
.sec p,.sec li{line-height:1.55;font-size:15.5px}
.sec ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.key{background:rgba(255,200,61,.12);border:1px solid rgba(255,200,61,.35);border-radius:16px;padding:14px}
.key h3{color:var(--pri);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:none;color:var(--acc);padding:8px 12px;border-radius:99px;font-weight:700;font-size:14px;cursor:pointer}
/* lexique */
.search{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--card2);background:var(--card);color:#fff;font-size:16px;outline:none}
.search:focus{border-color:var(--pri)}
.lex{background:var(--card);border-radius:16px;padding:14px;cursor:pointer}
.lex b{color:var(--pri)}.lex p{margin-top:6px;line-height:1.5;display:none;font-size:15px}
.lex.open p{display:block}
.seg{display:flex;gap:4px;background:var(--card);padding:5px;border-radius:14px}
.seg button{flex:1;border:none;background:none;color:var(--mut);font-weight:800;font-size:14px;padding:10px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--pri);color:#10142a}
/* jeux */
.prog{flex:1;height:12px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qcard{background:#fff;color:#10142a;border-radius:22px;padding:24px 18px;text-align:center;font-size:21px;font-weight:800;line-height:1.35;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.qcard.dq,.qcard.at{font-size:17.5px;min-height:90px;padding:18px 16px}
.qcard small{display:block;font-size:14px;color:#555c80;font-weight:700;margin-top:6px}
.shake{animation:shake .4s}
@keyframes shake{25%,75%{transform:translateX(-9px)}50%{transform:translateX(9px)}}
.ans{border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:700;color:#fff;background:var(--card);box-shadow:0 4px 0 #0a0d1d;cursor:pointer;text-align:left;width:100%;line-height:1.35}
.ans.ok{background:var(--ok);box-shadow:0 4px 0 #1a9a56;color:#10142a}
.ans.ko{background:var(--ko);box-shadow:0 4px 0 #c23250}
.ans.dim{opacity:.4}
.ex{background:var(--card2);border-radius:16px;padding:14px;font-size:15px;line-height:1.5;display:none}
.ex.on{display:block;animation:fade .3s}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{border:none;border-radius:18px;padding:22px;font-size:22px;font-weight:900;color:#fff;cursor:pointer}
.timer{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--pri);width:100%}
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.tile{border:2px solid transparent;border-radius:14px;padding:12px 10px;background:var(--card);color:#fff;font-size:14px;font-weight:700;cursor:pointer;min-height:58px;text-align:left;transition:.2s}
.tile.sel{border-color:var(--pri);background:var(--card2)}
.tile.done{background:var(--ok);opacity:0;transform:scale(.9);pointer-events:none;transition:.5s .3s}
.tile.bad{animation:shake .4s;border-color:var(--ko)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{background:var(--ok);color:#10142a;border-radius:14px;padding:12px;font-weight:800;animation:fade .3s}
.step.empty{background:transparent;border:2px dashed var(--card2);color:var(--mut);font-weight:600}
.big{font-size:90px;text-align:center}
.stars{font-size:44px;text-align:center;color:var(--pri);letter-spacing:6px}
.float{position:fixed;font-weight:900;font-size:22px;color:var(--pri);pointer-events:none;animation:up 1s forwards;z-index:9}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0e20;border-top:1px solid var(--card2);display:flex;justify-content:center;z-index:5;padding-bottom:var(--sab)}
nav .in{display:flex;max-width:480px;width:100%}
nav button{flex:1;background:none;border:none;color:var(--mut);padding:10px 0 14px;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:20}
.modal.on{display:flex}
.modal .in{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 16px calc(28px + var(--sab));display:flex;flex-direction:column;gap:10px;animation:fade .25s;max-height:88vh;overflow:auto}
.pub{background:repeating-linear-gradient(45deg,var(--card),var(--card) 10px,var(--card2) 10px,var(--card2) 20px);border-radius:14px;min-height:60px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;font-weight:700;letter-spacing:1px}
.pub.full{position:fixed;inset:0;z-index:40;border-radius:0;flex-direction:column;gap:16px;font-size:14px}
/* parcours par niveaux */
.nvh{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:0 2px}
.nvh b{font-size:19px}
/* fiches wiki */
.rbar{position:fixed;top:var(--sat);left:0;right:0;height:4px;z-index:6;background:transparent}
.rbar i{display:block;height:100%;width:0;background:var(--pri);transition:width .1s}
.fhero{display:flex;gap:14px;align-items:center}
.fhero .fic{font-size:52px;width:76px;height:76px;border-radius:22px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
.chapo{font-size:17px;line-height:1.6;border-left:4px solid var(--pri);padding:4px 0 4px 14px}
.toc{display:flex;flex-direction:column;gap:6px;background:var(--card);border-radius:16px;padding:12px}
.toc b{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.toc button{background:none;border:none;color:var(--acc);text-align:left;font-size:15px;font-weight:700;cursor:pointer;padding:4px 0}
.sh{display:flex;gap:10px;align-items:center;margin-bottom:10px}.sh h3{margin:0!important}
.num{width:30px;height:30px;border-radius:10px;background:var(--pri);color:#10142a;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec>p{line-height:1.65;font-size:15.5px;margin-bottom:10px}
.box{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.55}
.box>b{display:block;margin-bottom:4px}
.box ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.box.ex2{background:rgba(61,181,255,.12);border:1px solid rgba(61,181,255,.35)}
.box.att{background:rgba(255,84,112,.12);border:1px solid rgba(255,84,112,.4)}
.box.info{background:rgba(177,140,255,.13);border:1px solid rgba(177,140,255,.4)}
.box.ret{background:rgba(46,212,122,.12);border:1px solid rgba(46,212,122,.4);margin-top:0}
.mq{margin-top:12px;background:var(--card2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mq>b{font-size:13px;color:var(--pri)}.mq p{font-weight:700;line-height:1.45}
.mq .ans{padding:11px 14px;font-size:15px;box-shadow:0 3px 0 #0a0d1d}
.mq .ex{display:none}.mq .ex.on{display:block}
.toast{position:fixed;left:50%;top:calc(18px + var(--sat));transform:translateX(-50%);background:var(--ok);color:#10142a;font-weight:900;padding:12px 18px;border-radius:99px;z-index:50;animation:toast 2.6s forwards;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.day{display:flex;gap:12px;align-items:center}
.day .fl{font-size:34px}.day .fl.off{filter:grayscale(1);opacity:.5}
/* figures animées */
.fig{margin-top:12px;background:var(--card2);border-radius:14px;padding:14px 12px 12px;position:relative}
.fig .rej{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;z-index:2}
.fig .leg{text-align:center;color:var(--mut);font-size:13px;margin-top:8px}
.fig svg{display:block;width:100%;max-width:340px;margin:0 auto;height:auto}
.cyc{position:relative;width:100%;max-width:310px;aspect-ratio:1;margin:0 auto}
.cyc svg{position:absolute;inset:0;max-width:none}
.cyc .n{position:absolute;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--c,var(--acc));border-radius:12px;padding:6px 8px;font-size:12px;font-weight:700;text-align:center;width:max-content;max-width:42%;transition:.35s;line-height:1.3}
.cyc .n.on{background:var(--c,var(--acc));color:#10142a;transform:translate(-50%,-50%) scale(1.12);box-shadow:0 0 18px var(--c,var(--acc))}
.cyc .ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:800;font-size:13px;color:var(--mut);max-width:34%}
.flx{display:flex;flex-direction:column;gap:4px}
.flx .b{background:var(--card);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px;opacity:0}
.flx .b b{color:var(--pri);white-space:nowrap}
.flx .b.fin{background:var(--pri);color:#10142a}.flx .b.fin b{color:#10142a}
.flx .a{text-align:center;color:var(--pri);opacity:0;font-size:15px;line-height:1.1;font-weight:900}
.go .flx .b,.go .flx .a{animation:fade .45s forwards}
.brs{display:flex;flex-direction:column;gap:10px}
.brs .r{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.brs .t{height:14px;background:var(--card);border-radius:99px;overflow:hidden;margin-top:4px}
.brs .t i{display:block;height:100%;width:0;background:var(--c,var(--pri));border-radius:99px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.chf{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.chf div{background:var(--card);border-radius:12px;padding:12px 8px;text-align:center}
.chf b{display:block;font-size:24px;color:var(--pri)}.chf span{font-size:12px;color:var(--mut);line-height:1.3;display:block;margin-top:2px}
/* figures interactives (type inter) et pas à pas (type etapes) */
.itr .ibt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.itr .chip.act{background:var(--pri);color:#10142a}
.itr .imsg{text-align:center;font-weight:800;margin-top:8px;font-size:14.5px;min-height:20px}
.fig .lp{fill:var(--card);stroke:#fff;stroke-width:2;transition:.3s}
.fig .lp.on{fill:var(--pri);filter:drop-shadow(0 0 10px var(--pri))}
.fig .w{fill:none;stroke:#5a64a8;stroke-width:3;transition:stroke .3s}
.fig .w.on{stroke:var(--pri);stroke-dasharray:6 6;animation:flow 1s linear infinite}
.fig .w.ko{stroke:var(--ko);stroke-dasharray:6 6;animation:flow .6s linear infinite}
.fig .hide{display:none}
.etp .etx{margin-top:10px;text-align:center;line-height:1.5;font-size:14.5px}
.etn{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.etn span{display:flex;gap:5px}.etn i{width:8px;height:8px;border-radius:50%;background:var(--card)}.etn i.on{background:var(--pri)}
/* classes d'animation utilisables dans les SVG du contenu */
.flow{animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}
.glow{animation:glow 1.6s ease-in-out infinite}@keyframes glow{50%{opacity:.55}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.go .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}@keyframes pop{from{transform:scale(0);opacity:0}}
.go .draw{stroke-dasharray:600;animation:draw 1.4s ease-out backwards}@keyframes draw{from{stroke-dashoffset:600}}
.go .appear{animation:fade .5s backwards}
/* bon de travail (dépannage) */
.bt{background:var(--card);border:2px dashed var(--pri);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bth{display:flex;justify-content:space-between;align-items:center;gap:8px}.bth b{font-size:13px;letter-spacing:1px;color:var(--pri)}
.prio{font-size:12px;font-weight:900;padding:4px 10px;border-radius:99px;color:#10142a;white-space:nowrap}.prio.p1{background:var(--ko)}.prio.p2{background:var(--pri)}.prio.p3{background:var(--ok)}
.btl span{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.5px}.btl p{line-height:1.45;margin-top:2px;font-size:15px}
/* câblage */
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pal button{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.pal button.on{border-color:#fff;transform:scale(1.18)}
.board{background:var(--card);border-radius:18px;padding:4px;touch-action:manipulation}
.board svg{display:block;width:100%;height:auto;user-select:none}
.cap rect{fill:var(--card2);stroke:#46508f;stroke-width:2}
.cap .tt{fill:#fff;font:800 11.5px system-ui}.cap .ict{font-size:22px}
.cap.lit rect{stroke:var(--pri);stroke-width:3}.cap.lit .ict{filter:drop-shadow(0 0 8px #ffc83d)}
.cb{cursor:pointer}.cb .vis{fill:#d9dce8;stroke:#10142a;stroke-width:2}.cb.sel .vis{fill:var(--pri);stroke:#fff;stroke-width:3}
.cb .lb{fill:var(--mut);font:800 10.5px system-ui;text-anchor:middle;pointer-events:none}
.cw{fill:none;stroke-width:5;stroke-linecap:round;pointer-events:none}
.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.okb .cw{stroke-dasharray:9 5;animation:flow .8s linear infinite}
.msg{border-radius:14px;padding:12px 14px;line-height:1.5;font-size:15px}
.msg.ko{background:rgba(255,84,112,.15);border:1px solid rgba(255,84,112,.5)}
.msg.ok{background:rgba(46,212,122,.15);border:1px solid rgba(46,212,122,.5)}
.msg.inf{background:var(--card2)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns .btn{padding:12px;font-size:15px}
/* symboles */
.sym{width:100%;height:auto;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:block}
.sym .t{fill:currentColor;stroke:none;font:800 15px system-ui;text-anchor:middle}
.sym .f{fill:currentColor}
.sym.big{max-width:210px;margin:0 auto}
.ans.symb{display:flex;align-items:center;justify-content:center;min-height:92px;padding:10px}
.ans.symb svg{max-width:120px}
.symg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.symc{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.symc svg{max-width:110px;color:#fff}.symc b{font-size:14px}.symc span{font-size:12px;color:var(--mut);line-height:1.35}
/* atelier de calcul */
.atin{display:flex;gap:10px;align-items:center}
.atin input{flex:1;padding:16px;border-radius:16px;border:2px solid var(--card2);background:var(--card);color:#fff;font-size:22px;font-weight:800;outline:none;text-align:center;min-width:0}
.atin input:focus{border-color:var(--pri)}.atin span{font-weight:900;font-size:20px;color:var(--pri);min-width:36px}
/* badges & fiches appareils */
.bdg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bdg div{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:3px;opacity:.45;filter:grayscale(1)}
.bdg div.on{opacity:1;filter:none;box-shadow:inset 0 0 0 2px var(--pri)}
.bdg span{font-size:28px}.bdg b{font-size:12px}.bdg small{font-size:10.5px;color:var(--mut);line-height:1.3}
.appf h3{color:var(--pri);font-size:15px;margin-top:6px}.appf p{line-height:1.55;font-size:15px}
.appf .symc{background:var(--card2)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div class="app">

<section class="screen on" id="home">
  <div class="top"><h1 id="appName"></h1><button class="pill" id="xpP" onclick="profil()"></button></div>
  <div class="hero"><div class="ic" id="appIc"></div><div style="flex:1"><b id="gradeTx">Ta progression</b><span id="progTx"></span><div class="bar"><i id="progBar"></i></div></div></div>
  <div class="card" id="dayCard"></div>

C.modules.push({id:"relatifs",n:1,i:"✖️",t:"Multiplier et diviser des relatifs",d:"Règle des signes, produits de plusieurs facteurs, enchaînements",
 s:[{h:"La règle des signes",l:["Le produit de deux nombres de <b>même signe</b> est <b>positif</b> : (−3) × (−4) = 12.","Le produit de deux nombres de <b>signes contraires</b> est <b>négatif</b> : (−3) × 4 = −12.","On multiplie les distances à zéro, puis on place le signe."]},
    {h:"Plusieurs facteurs",l:["On compte les facteurs négatifs : <b>nombre pair</b> → produit positif ; <b>nombre impair</b> → produit négatif.","(−1) × (−2) × (−3) = −6 (trois facteurs négatifs).","Si un facteur est nul, le produit est nul."]},

 k:["Règle des signes","Produit","Quotient"]});
C.fiches.relatifs={
 intro:"Pourquoi « moins par moins donne plus » ? Ce n'est pas une règle magique à apprendre par cœur : on peut la démontrer avec la distributivité. Et une fois comprise, elle permet de calculer avec tous les nombres, positifs comme négatifs.",
 s:[
  {p:"Commençons par un seul facteur négatif : (−3) × 4 = (−3) + (−3) + (−3) + (−3) = <b>−12</b>. Multiplier par un positif, c'est répéter une addition. Le produit de deux nombres de signes contraires est donc <b>négatif</b>.",
   q:["(−5) × 6 = ?",["−30","30","−11","1"],0,"Signes contraires : négatif ; 5 × 6 = 30."]},
  {p:"Et (−3) × (−4) ? On sait que (−4) + 4 = 0. Donc (−3) × ((−4) + 4) = (−3) × 0 = 0. Par distributivité : (−3) × (−4) + (−3) × 4 = 0, soit (−3) × (−4) + (−12) = 0. Donc <b>(−3) × (−4) = 12</b>. Le produit de deux négatifs est positif !",
   fig:{type:"flux",legende:"Démontrer que (−3) × (−4) = 12",etapes:[["On part de","(−3) × ((−4) + 4) = (−3) × 0 = 0"],["Distributivité","(−3) × (−4) + (−3) × 4 = 0"],["On sait que","(−3) × 4 = −12"],["Donc","(−3) × (−4) − 12 = 0, soit (−3) × (−4) = 12"]]},
   q:["(−7) × (−8) = ?",["56","−56","−15","15"],0,"Même signe : positif."]},
  {p:"Avec <b>plusieurs facteurs</b>, on compte les facteurs négatifs. S'il y en a un nombre <b>pair</b>, le produit est positif ; un nombre <b>impair</b>, il est négatif. (−2) × 5 × (−1) × (−3) : trois négatifs → −30. La <b>division</b> suit exactement la même règle : (−42) ÷ 6 = −7.",
   fig:{type:"barres",legende:"Signe d'un produit selon le nombre de facteurs négatifs",items:[["0 négatif : +",1,"","#2ed47a"],["1 négatif : −",1,"","#ff5c7a"],["2 négatifs : +",1,"","#2ed47a"],["3 négatifs : −",1,"","#ff5c7a"]]},
   q:["Quel est le signe de (−1) × (−1) × (−1) × (−1) × (−1) ?",["Négatif","Positif","Nul","On ne peut pas savoir"],0,"Cinq facteurs négatifs : nombre impair."]},
  {p:"Dans un enchaînement, on garde les <b>priorités opératoires</b>. A = 5 − 2 × (−3) = 5 − (−6) = 5 + 6 = 11. B = (−12) ÷ (3 − 7) = (−12) ÷ (−4) = 3. On écrit les négatifs entre parenthèses pour éviter les confusions de signes.",
   att:"−3² et (−3)² sont différents : −3² = −(3 × 3) = −9 alors que (−3)² = (−3) × (−3) = 9.",
   q:["Combien vaut 4 − 3 × (−2) ?",["10","−2","2","−10"],0,"3 × (−2) = −6 d'abord, puis 4 − (−6) = 10."]}
 ],

C.fiches.fractions={
 intro:"Une recette demande 3/4 de litre de lait, mais tu ne fais que les 2/3 de la recette : combien de lait ? Et combien de verres de 1/8 de litre peut-on remplir avec 3/4 de litre ? Multiplier et diviser des fractions répond à ces questions en une ligne.",
 s:[
  {p:"<b>Simplifier</b> une fraction : diviser numérateur et dénominateur par un même nombre. 45/60 = 15/20 = 3/4. Un <b>nombre rationnel</b> est le quotient de deux entiers relatifs ; le signe peut se placer devant : −3/4 = (−3)/4 = 3/(−4).",

  {p:"<b>Produit</b> : on multiplie les numérateurs entre eux et les dénominateurs entre eux. Astuce : on <b>simplifie avant</b> de multiplier. 5/6 × 9/10 = (5 × 9)/(6 × 10) = (5 × 3 × 3)/(2 × 3 × 2 × 5) = 3/4. La <b>fraction d'une fraction</b> se calcule par un produit : les 2/3 de 3/4 de litre = 2/3 × 3/4 = 1/2 litre.",

   fig:{type:"flux",legende:"Calculer 5/6 ÷ 10/9",etapes:[["Inverse de 10/9","9/10"],["On multiplie","5/6 × 9/10"],["On simplifie","(5 × 9)/(6 × 10) = 45/60"],["Résultat","3/4"]]},
   q:["2/3 ÷ 4/9 = ?",["3/2","8/27","2/3","6/12"],0,"2/3 × 9/4 = 18/12 = 3/2."]}
 ],
 retenir:["a/b × c/d = ac/bd ; simplifier avant de multiplier.","« Fraction de » = multiplication.","Inverse de a/b : b/a ; 0 n'a pas d'inverse.","Diviser = multiplier par l'inverse."]
};

/* ---------- Puissances ---------- */
C.modules.push({id:"puissances",n:1,i:"⚡",t:"Les puissances",d:"Exposant entier naturel, règles de calcul, puissances de 10",

    {h:"Règles de calcul",l:["Même nombre : aⁿ × aᵐ = aⁿ⁺ᵐ. 2³ × 2⁴ = 2⁷.","Même exposant : aⁿ × bⁿ = (a × b)ⁿ. 2³ × 5³ = 10³.","Attention : 2³ + 2⁴ ne se simplifie pas en 2⁷ !"]},

C.fiches.puissances={
 intro:"Une légende raconte que l'inventeur des échecs demanda 1 grain de riz sur la 1re case, 2 sur la 2e, 4 sur la 3e… en doublant à chaque case. Sur la 64e case, il faudrait 2⁶³ grains : plus que toute la production mondiale de riz pendant des siècles ! Les puissances grandissent à une vitesse folle.",
 s:[
  {p:"Pour un entier n ≥ 1, <b>aⁿ</b> est le produit de n facteurs égaux à a. On lit « a puissance n » ; n est l'<b>exposant</b>. 3⁴ = 3 × 3 × 3 × 3 = 81. Avec un négatif, le signe dépend de la parité de l'exposant : (−3)⁴ = 81 mais (−3)³ = −27.",
   fig:{type:"barres",legende:"Les puissances de 2 doublent à chaque fois",items:[["2¹",2,"","#3db5ff"],["2²",4,"","#2ed47a"],["2³",8,"","#ffc83d"],["2⁴",16,"","#ff8a3d"],["2⁵",32,"","#ff5c7a"]]},
   q:["(−2)⁵ = ?",["−32","32","−10","10"],0,"Cinq facteurs négatifs : résultat négatif ; 2⁵ = 32."]},
  {p:"Pour <b>multiplier</b> deux puissances du <b>même nombre</b>, on <b>additionne</b> les exposants : a³ × a⁴ = (a × a × a) × (a × a × a × a) = a⁷. Pour deux puissances de <b>même exposant</b> : a³ × b³ = (a × b)³. Exemple : 4⁵ × 25⁵ = 100⁵.",
   fig:{type:"flux",legende:"Pourquoi 5² × 5³ = 5⁵",etapes:[["5²","5 × 5"],["5³","5 × 5 × 5"],["Produit","5 × 5 × 5 × 5 × 5"],["Bilan","5⁵ (2 + 3 = 5 facteurs)"]]},
   att:"On n'additionne les exposants que pour un PRODUIT de puissances du même nombre. 2³ + 2⁴ = 8 + 16 = 24, pas 2⁷ = 128.",

  {p:"<b>10ⁿ</b> s'écrit 1 suivi de n zéros. Les <b>préfixes</b> des unités sont des puissances de 10 : kilo (k) = 10³, méga (M) = 10⁶, giga (G) = 10⁹. Un disque de 2 To (téra = 10¹²) contient 2 × 10¹² octets.",

 ],

C.fiches.racine={
 intro:"Un carré a une aire de 36 m². Quelle est la longueur de son côté ? 6 m, car 6 × 6 = 36. Et si l'aire vaut 50 m² ? Aucun entier ne convient… Il faut un nouveau nombre : la racine carrée de 50.",
 s:[
  {p:"La <b>racine carrée</b> d'un nombre a positif, notée √a, est le nombre <b>positif</b> dont le carré est a. Géométriquement : c'est le <b>côté d'un carré d'aire a</b>. √81 = 9 ; √0 = 0 ; √1 = 1.",
   fig:{type:"svg",legende:"Un carré d'aire 50 m² a un côté de √50 m",svg:"<svg viewBox='0 0 240 120'><rect x='70' y='10' width='100' height='100' fill='#b18cff44' stroke='#fff' stroke-width='2'/><text x='120' y='65' fill='#fff' font-size='14' text-anchor='middle'>50 m²</text><text x='120' y='122' fill='var(--pri)' font-size='12' text-anchor='middle'>√50 ≈ 7,07 m</text></svg>"},

/* ---------- Calcul littéral ---------- */
C.modules.push({id:"litteral",n:1,i:"🔤",t:"Le calcul littéral",d:"Conventions, développer, factoriser, réduire, démontrer",

    {h:"Développer et factoriser",l:["Développer : k(a + b) = ka + kb. −3(2x − 5) = −6x + 15.","Factoriser : ka + kb = k(a + b). 12x + 18 = 6(2x + 3).","Attention aux signes devant une parenthèse : −(x − 4) = −x + 4."]},
    {h:"Démontrer",l:["Un nombre pair s'écrit 2n, un impair 2n + 1 (n entier).","La somme de deux impairs est paire : (2n + 1) + (2m + 1) = 2(n + m + 1).","Un exemple ne prouve pas une règle générale ; un contre-exemple suffit à la réfuter."]}],

C.fiches.litteral={
 intro:"« La somme de deux nombres impairs est toujours paire. » Tu peux vérifier sur 3 + 5, sur 11 + 7… mais comment être sûr que c'est vrai pour TOUS les nombres, même ceux qu'on n'a pas essayés ? Le calcul littéral permet de le démontrer en deux lignes.",

 intro:"« S'il pleut, le sol est mouillé. » Est-ce que « si le sol est mouillé, il pleut » ? Non : quelqu'un a peut-être arrosé ! La réciproque d'un énoncé vrai n'est pas toujours vraie. Pour Pythagore, par chance, elle l'est… et elle sert à prouver qu'un angle est droit.",
 s:[
  {p:"<b>Réciproque du théorème de Pythagore</b> : si dans un triangle ABC, BC² = AB² + AC² (avec [BC] le plus long côté), alors le triangle est <b>rectangle en A</b>. On calcule <b>séparément</b> les deux membres, puis on compare.",
   fig:{type:"flux",legende:"Le triangle 9 – 12 – 15 est-il rectangle ?",etapes:[["Plus long côté","15² = 225"],["Somme des deux autres carrés","9² + 12² = 81 + 144 = 225"],["Comparaison","225 = 225"],["Conclusion","D'après la réciproque de Pythagore, le triangle est rectangle"]]},
   q:["Un triangle a pour côtés 8 cm, 15 cm, 17 cm. Est-il rectangle ?",["Oui","Non","On ne peut pas savoir","Seulement s'il est isocèle"],0,"17² = 289 et 8² + 15² = 64 + 225 = 289."]},
  {p:"<b>Contraposée</b> : si BC² ≠ AB² + AC² (avec [BC] le plus long côté), alors le triangle n'est <b>pas</b> rectangle. Côtés 5, 6, 8 : 8² = 64 et 5² + 6² = 61. 64 ≠ 61 : le triangle n'est pas rectangle, même s'il en a l'air sur le dessin !",
   att:"La mesure sur un dessin ne prouve rien : un angle de 89° ressemble à un angle droit. Seul le calcul fait foi.",
   q:["Côtés 6 cm, 7 cm, 9 cm : le triangle est-il rectangle ?",["Non, car 81 ≠ 85","Oui","Oui car 6 + 7 > 9","On ne peut pas savoir"],0,"9² = 81 et 6² + 7² = 36 + 49 = 85 ≠ 81."]},
  {p:"<b>Logique</b> : pour un énoncé « si P alors Q », la <b>réciproque</b> est « si Q alors P » et la <b>contraposée</b> « si non Q alors non P ». La contraposée d'un énoncé vrai est toujours vraie ; la réciproque, pas forcément. Exemple : « si un nombre finit par 0, il est pair » est vrai, mais sa réciproque « si un nombre est pair, il finit par 0 » est fausse (12).",
   q:["Quelle est la contraposée de « Si un triangle est équilatéral, alors il est isocèle » ?",["Si un triangle n'est pas isocèle, alors il n'est pas équilatéral","Si un triangle est isocèle, alors il est équilatéral","Si un triangle n'est pas équilatéral, alors il n'est pas isocèle","Un triangle isocèle est rectangle"],0,"Si non Q alors non P."]}

C.modules.push({id:"statistiques",n:3,i:"📊",t:"Statistiques",d:"Moyenne pondérée, médiane, étendue, comparer des séries",
 s:[{h:"La moyenne pondérée",l:["Quand les valeurs ont des effectifs (ou des coefficients) : moyenne = (somme des valeur × effectif) ÷ effectif total.","Notes 12 (coef. 2) et 15 (coef. 1) : (12 × 2 + 15 × 1) ÷ 3 = 13."]},
    {h:"La médiane",l:["On <b>range</b> la série dans l'ordre croissant.","La médiane partage la série en deux groupes de même effectif : au moins la moitié des valeurs sont inférieures ou égales à elle, au moins la moitié supérieures ou égales.","Effectif impair : la valeur du milieu ; effectif pair : on prend en général la moyenne des deux valeurs du milieu."]},
    {h:"L'étendue",l:["Étendue = plus grande valeur − plus petite valeur.","Elle mesure la <b>dispersion</b> des valeurs."]},
    {h:"Interpréter",l:["Une valeur extrême fait beaucoup bouger la moyenne, très peu la médiane.","Deux séries de même moyenne peuvent être très différentes : on compare aussi médiane et étendue."]}],
 k:["Moyenne pondérée","Médiane","Étendue","Effectif"]});
C.fiches.statistiques={
 intro:"Dans une entreprise, 9 employés gagnent 2 000 € et le patron 50 000 €. Salaire moyen : 6 800 €… alors que personne sauf le patron ne gagne autant ! Le salaire médian, lui, vaut 2 000 €. Choisir le bon indicateur, c'est ne pas se faire manipuler par les chiffres.",
 s:[
  {p:"La <b>moyenne pondérée</b> tient compte des effectifs (ou coefficients). Au brevet blanc, Léo a 14 en maths (coef. 3), 11 en français (coef. 3) et 16 en sciences (coef. 2) : moyenne = (14 × 3 + 11 × 3 + 16 × 2) ÷ (3 + 3 + 2) = 107 ÷ 8 ≈ 13,4.",
   fig:{type:"flux",legende:"Pointures de 20 élèves : moyenne pondérée",etapes:[["Valeurs × effectifs","36 × 4 + 37 × 7 + 38 × 6 + 39 × 3"],["Somme","144 + 259 + 228 + 117 = 748"],["Effectif total","4 + 7 + 6 + 3 = 20"],["Moyenne","748 ÷ 20 = 37,4"]]},
   q:["Notes : 10 (coef. 1) et 16 (coef. 2). Moyenne ?",["14","13","26","12"],0,"(10 + 32) ÷ 3 = 14."]},
  {p:"La <b>médiane</b> partage la série <b>rangée</b> en deux groupes de même effectif. Série 3 ; 5 ; 8 ; 12 ; 20 (5 valeurs) : médiane 8. Série 3 ; 5 ; 8 ; 12 ; 20 ; 21 (6 valeurs) : entre 8 et 12, on prend en général (8 + 12) ÷ 2 = 10.",
   fig:{type:"svg",legende:"Série rangée de 7 valeurs : la médiane est la 4e",svg:"<svg viewBox='0 0 280 70'>"+[2,4,7,9,10,15,30].map((v,i)=>"<rect x='"+(10+i*38)+"' y='18' width='32' height='32' rx='6' fill='"+(i===3?"var(--pri)":"#ffffff22")+"'/><text x='"+(26+i*38)+"' y='39' fill='#fff' font-size='13' text-anchor='middle' font-weight='900'>"+v+"</text>").join("")+"<text x='140' y='66' fill='var(--pri)' font-size='11' text-anchor='middle'>3 valeurs de chaque côté</text></svg>"},
   att:"Il faut TOUJOURS ranger la série avant de chercher la médiane.",
   q:["Médiane de 14 ; 3 ; 9 ; 21 ; 6 ?",["9","21","10,6","6"],0,"Rangée : 3 ; 6 ; 9 ; 14 ; 21 → valeur du milieu 9."]},
  {p:"L'<b>étendue</b> mesure la dispersion : plus grande valeur − plus petite. Deux classes ont 12 de moyenne : la première a une étendue de 4 (notes entre 10 et 14), la seconde de 18 (notes entre 1 et 19). Elles sont très différentes ! Et une <b>valeur extrême</b> modifie beaucoup la moyenne mais presque pas la médiane.",
   fig:{type:"barres",legende:"Salaires de 10 personnes : 9 × 2 000 € et 1 × 50 000 €",items:[["Moyenne",6800,"€","#ff8a3d"],["Médiane",2000,"€","#2ed47a"]]},
   q:["Étendue de 12 ; 7 ; 19 ; 4 ; 15 ?",["15","19","4","11,4"],0,"19 − 4 = 15."]}
 ],
 retenir:["Moyenne pondérée = Σ(valeur × effectif) ÷ effectif total.","Médiane : ranger, puis prendre le milieu.","Étendue = max − min.","Valeur extrême : la moyenne bouge, la médiane presque pas."]
};

/* ---------- Probabilités ---------- */
C.modules.push({id:"probabilites",n:3,i:"🎲",t:"Probabilités",d:"Événements, contraire, réunion, intersection, deux épreuves",
 s:[{h:"Le langage des ensembles",l:["L'ensemble de toutes les issues est l'<b>univers</b>.","Un <b>événement</b> est une partie de l'univers. L'événement impossible est l'ensemble vide ∅.","A ∩ B (« A et B ») : les issues communes. A ∪ B (« A ou B ») : les issues de A ou de B (ou des deux)."]},
    {h:"L'événement contraire",l:["Le contraire de A, noté Ā (« non A »), contient toutes les issues qui ne sont pas dans A.","<b>P(Ā) = 1 − P(A)</b>."]},
    {h:"Deux épreuves",l:["On représente les issues par un <b>arbre</b> ou un <b>tableau</b> à double entrée.","Deux dés : 6 × 6 = 36 issues équiprobables.","Deux pièces : PP, PF, FP, FF."]},
    {h:"Fluctuation",l:["En répétant une expérience, les fréquences observées varient d'une série à l'autre : c'est la <b>fluctuation</b>.","On compare la distribution des fréquences à celle des probabilités."]}],
 k:["Événement","Événement contraire","Univers","Arbre de probabilités"]});
C.fiches.probabilites={
 intro:"Au jeu de l'oie, quelle somme sort le plus souvent avec deux dés ? Le 7 ! Il y a 6 façons de l'obtenir, contre une seule pour le 2 ou le 12. Pour le voir, il faut lister proprement toutes les issues : c'est là que les tableaux et les arbres deviennent indispensables.",
 s:[
  {p:"Avec un dé : l'univers est {1 ; 2 ; 3 ; 4 ; 5 ; 6}. Soit A = « obtenir un nombre pair » = {2 ; 4 ; 6} et B = « obtenir au moins 5 » = {5 ; 6}. Alors <b>A ∩ B</b> = {6} (pair ET au moins 5) et <b>A ∪ B</b> = {2 ; 4 ; 5 ; 6} (pair OU au moins 5).",
   fig:{type:"svg",legende:"A ∩ B : la zone commune ; A ∪ B : tout ce qui est coloré",svg:"<svg viewBox='0 0 260 120'><rect x='5' y='5' width='250' height='110' rx='10' fill='none' stroke='#fff'/><circle cx='100' cy='60' r='45' fill='#3db5ff55' stroke='#3db5ff' stroke-width='2'/><circle cx='160' cy='60' r='40' fill='#ff8a3d55' stroke='#ff8a3d' stroke-width='2'/><g fill='#fff' font-size='14' text-anchor='middle'><text x='80' y='55'>2</text><text x='90' y='80'>4</text><text x='130' y='65'>6</text><text x='180' y='65'>5</text><text x='30' y='30'>1</text><text x='230' y='100'>3</text></g><g font-size='12' font-weight='900'><text x='65' y='25' fill='#3db5ff'>A</text><text x='185' y='28' fill='#ff8a3d'>B</text></g></svg>"},
   q:["Avec un dé, A = {1 ; 2 ; 3} et B = {3 ; 4}. A ∩ B = ?",["{3}","{1 ; 2 ; 3 ; 4}","∅","{1 ; 2}"],0,"Seul 3 est dans les deux."]},
  {p:"L'<b>événement contraire</b> de A contient toutes les issues qui ne sont pas dans A : <b>P(Ā) = 1 − P(A)</b>. S'il y a 30 % de chances de pluie, il y a 70 % de chances qu'il ne pleuve pas. Avec un dé : P(« ne pas faire 6 ») = 1 − 1/6 = 5/6.",
   q:["P(A) = 0,35. P(Ā) = ?",["0,65","0,35","1,35","−0,35"],0,"1 − 0,35."]},
  {p:"Pour une <b>expérience à deux épreuves</b>, on liste les issues avec un <b>tableau</b> ou un <b>arbre</b>. Deux pièces : PP, PF, FP, FF (4 issues équiprobables), donc P(« une pile et une face ») = 2/4 = 1/2. Deux dés : 36 cases ; la somme 7 apparaît 6 fois, P(7) = 6/36 = 1/6.",
   fig:{type:"svg",legende:"Arbre de deux lancers de pièce",svg:"<svg viewBox='0 0 260 120'><g stroke='#fff' stroke-width='2'><path d='M20 60L90 30M20 60L90 90M110 30L180 15M110 30L180 45M110 90L180 75M110 90L180 105'/></g><g fill='#fff' font-size='13'><text x='93' y='35'>P</text><text x='93' y='95'>F</text><text x='184' y='19'>P → PP</text><text x='184' y='49'>F → PF</text><text x='184' y='79'>P → FP</text><text x='184' y='109'>F → FF</text></g><g fill='#ffc83d' font-size='10'><text x='45' y='38'>1/2</text><text x='45' y='88'>1/2</text></g></svg>"},
   q:["On lance deux dés. Probabilité d'obtenir un double (1-1, 2-2…) ?",["1/6","1/36","1/12","2/6"],0,"6 doubles sur 36 issues."]},
  {p:"Si on <b>répète</b> une expérience (par exemple 50 lancers de dé, réels ou simulés au tableur), les fréquences de chaque face <b>fluctuent</b> d'une série à l'autre et ne sont pas exactement égales à 1/6. On compare le diagramme des fréquences observées avec celui des probabilités.",
   q:["On lance 30 fois un dé équilibré. Combien de 6 obtient-on ?",["On ne peut pas le prévoir exactement (environ 5)","Exactement 5","Exactement 6","Jamais plus de 5"],0,"La fréquence fluctue autour de 1/6."]}
 ],
 retenir:["A ∩ B : A et B ; A ∪ B : A ou B ; ∅ : impossible.","P(Ā) = 1 − P(A).","Deux épreuves : arbre ou tableau pour lister les issues.","Les fréquences observées fluctuent."]
};

/* ---------- Proportionnalité ---------- */
C.modules.push({id:"proportionnalite",n:3,i:"💯",t:"Ratios, vitesses, pourcentages",d:"Grandeurs quotients, ratio, quatrième proportionnelle, coefficient multiplicateur",
 s:[{h:"Grandeurs quotients",l:["Une <b>grandeur quotient</b> est le quotient de deux grandeurs : vitesse (km/h), prix unitaire (€/kg), débit (L/min), densité de population (hab./km²).","v = d ÷ t ; d = v × t ; t = d ÷ v."]},
    {h:"Ratios",l:["Deux nombres sont dans le <b>ratio</b> 2 : 3 si a/2 = b/3.","Partager 50 € dans le ratio 2 : 3 : 5 parts au total, une part = 10 €, donc 20 € et 30 €."]},
    {h:"Quatrième proportionnelle",l:["Si a/b = c/x, alors x = b × c ÷ a.","5 kg coûtent 12 €, 8 kg coûtent 8 × 12 ÷ 5 = 19,20 €."]},
    {h:"Évolutions en pourcentage",l:["Augmenter de t % : multiplier par <b>1 + t/100</b>.","Diminuer de t % : multiplier par <b>1 − t/100</b>.","+20 % : × 1,2 ; −15 % : × 0,85."]}],
 k:["Grandeur quotient","Ratio","Quatrième proportionnelle","Coefficient multiplicateur"]});
C.fiches.proportionnalite={
 intro:"−30 % puis −20 % de plus en caisse : est-ce −50 % ? Non ! C'est −44 %. Les coefficients multiplicateurs évitent ce genre de piège. Vitesses, débits, ratios, pourcentages : en 4e, la proportionnalité devient un vrai outil de calcul.",
 s:[
  {p:"Une <b>grandeur quotient</b> est obtenue en divisant deux grandeurs. La <b>vitesse moyenne</b> v = d ÷ t : 150 km en 2 h → 75 km/h. Le <b>prix unitaire</b> : 3,60 € pour 1,5 kg → 2,40 €/kg. Le <b>débit</b> : 120 L en 8 min → 15 L/min.",
   fig:{type:"flux",legende:"Convertir une durée pour calculer une vitesse",etapes:[["Distance","45 km"],["Durée","1 h 30 min = 1,5 h"],["Vitesse","45 ÷ 1,5 = 30 km/h"]]},
   att:"1 h 30 min ne vaut pas 1,30 h mais 1,5 h ! Et 1 h 15 min = 1,25 h.",
   q:["Un cycliste parcourt 36 km en 1 h 30 min. Sa vitesse moyenne ?",["24 km/h","27,7 km/h","36 km/h","54 km/h"],0,"36 ÷ 1,5 = 24."]},
  {p:"Un <b>ratio</b> compare deux quantités. Une peinture rose : blanc et rouge dans le ratio 3 : 1, soit 3 parts de blanc pour 1 de rouge. Pour 2 L : 4 parts de 0,5 L, donc 1,5 L de blanc et 0,5 L de rouge. C'est aussi un <b>partage proportionnel</b>.",
   q:["Partager 60 € entre Ana et Ben dans le ratio 1 : 2. Ana reçoit…",["20 €","30 €","40 €","15 €"],0,"3 parts de 20 € : Ana 1 part, Ben 2 parts."]},
  {p:"La <b>quatrième proportionnelle</b> : si a/b = c/x, alors x = b × c ÷ a. Une voiture consomme 6 L pour 100 km ; pour 350 km : x = 350 × 6 ÷ 100 = 21 L.",
   q:["4 stylos coûtent 6 €. Combien coûtent 10 stylos ?",["15 €","24 €","12 €","2,40 €"],0,"10 × 6 ÷ 4 = 15."]},
  {p:"Le <b>coefficient multiplicateur</b> : augmenter de t %, c'est multiplier par (1 + t/100) ; diminuer de t %, c'est multiplier par (1 − t/100). Un jean à 60 € soldé à −25 % : 60 × 0,75 = 45 €. Deux baisses successives de 30 % puis 20 % : × 0,7 × 0,8 = × 0,56, soit −44 %.",
   fig:{type:"barres",legende:"Prix après −30 % puis −20 % (100 € au départ)",items:[["Départ",100,"€","#3db5ff"],["Après −30 %",70,"€","#ffc83d"],["Après −20 %",56,"€","#2ed47a"]]},
   q:["Un prix de 80 € augmente de 15 %. Nouveau prix ?",["92 €","95 €","68 €","81,15 €"],0,"80 × 1,15 = 92."]}
 ],
 retenir:["v = d ÷ t (durées en heures décimales).","Ratio a : b : on partage en a + b parts égales.","Quatrième proportionnelle : x = b × c ÷ a.","+t % : × (1 + t/100) ; −t % : × (1 − t/100)."]
};

/* ---------- Fonctions ---------- */
C.modules.push({id:"fonctions",n:3,i:"📈",t:"Programmes de calcul et dépendance",d:"Programme de calcul, remonter, formule, graphique",
 s:[{h:"Programme de calcul",l:["Une suite d'opérations appliquée à un nombre de départ.","Avec x : « × 3, puis + 5 » donne 3x + 5."]},
    {h:"Remonter un programme",l:["Pour retrouver le nombre de départ, on fait les opérations <b>inverses</b>, dans l'ordre <b>inverse</b>.","Résultat 20 avec « × 3 puis + 5 » : 20 − 5 = 15, 15 ÷ 3 = 5."]},
    {h:"Dépendance entre grandeurs",l:["Une formule exprime une grandeur en fonction d'une autre : prix = 2,5 × n + 4.","Un graphique la représente : on lit l'ordonnée correspondant à une abscisse."]}],
 k:["Programme de calcul","Formule","Graphique cartésien"]});
C.fiches.fonctions={
 intro:"« Pense à un nombre, multiplie-le par 2, ajoute 6, divise par 2, enlève le nombre de départ… tu trouves 3 ! » Ces tours de magie sont des programmes de calcul. Les écrire avec x permet de comprendre le truc… et d'en inventer.",
 s:[
  {p:"Un <b>programme de calcul</b> transforme un nombre de départ. Programme : « choisir un nombre ; ajouter 4 ; multiplier par 3 ». Pour 2 : (2 + 4) × 3 = 18. Pour x : <b>(x + 4) × 3 = 3x + 12</b>.",
   fig:{type:"flux",legende:"Appliquer le programme à x",etapes:[["Départ","x"],["Ajouter 4","x + 4"],["Multiplier par 3","3(x + 4)"],["Développer","3x + 12"]]},
   q:["Programme : « × 2, puis − 7 ». Résultat pour −3 ?",["−13","−1","13","1"],0,"−3 × 2 = −6 ; −6 − 7 = −13."]},
  {p:"Pour <b>remonter</b> un programme (retrouver le nombre de départ), on applique les opérations <b>inverses</b> dans l'ordre <b>inverse</b>. Programme « × 4 puis − 3 », résultat 25 : 25 + 3 = 28, puis 28 ÷ 4 = 7. On peut aussi résoudre l'équation 4x − 3 = 25.",
   q:["Programme « + 5 puis × 2 ». On obtient 30. Nombre de départ ?",["10","20","12,5","65"],0,"30 ÷ 2 = 15, puis 15 − 5 = 10."]},
  {p:"Une <b>formule</b> traduit la dépendance d'une grandeur en fonction d'une autre. Location de kayak : 4 € de caution + 2,50 € par heure : P = 2,5h + 4. On peut la représenter par un <b>tableau de valeurs</b> ou par un <b>graphique</b> (ici, des points alignés sur une droite qui ne passe pas par l'origine : ce n'est pas proportionnel).",
   fig:{type:"svg",legende:"Prix P (€) en fonction de la durée h (heures) : P = 2,5h + 4",svg:"<svg viewBox='0 0 240 130'><path d='M25 115H230M25 120V5' stroke='#fff' stroke-width='2'/><path d='M25 95L215 25' stroke='var(--pri)' stroke-width='3' class='draw'/>"+[0,1,2,3,4].map(i=>"<circle cx='"+(25+i*45)+"' cy='"+(95-i*16.6)+"' r='4' fill='#ffc83d'/>").join("")+"<g fill='#fff' font-size='9'><text x='12' y='98'>4</text><text x='66' y='126'>1</text><text x='111' y='126'>2</text><text x='156' y='126'>3</text><text x='201' y='126'>4</text><text x='30' y='12'>€</text></g></svg>"},
   q:["Avec P = 2,5h + 4, combien coûtent 3 heures ?",["11,50 €","7,50 €","19,50 €","13 €"],0,"2,5 × 3 + 4 = 11,5."]}
 ],
 retenir:["Programme de calcul ↔ expression littérale.","Remonter : opérations inverses, ordre inverse.","Formule → tableau → graphique.","Droite qui ne passe pas par l'origine : pas proportionnel."]
};

/* ---------- Programmation ---------- */
C.modules.push({id:"programmation",n:3,i:"🤖",t:"Conditions et variables",d:"Si… alors… sinon, variables, écrire et modifier un programme",
 s:[{h:"Les conditions",l:["Une <b>condition</b> est vraie ou fausse : « réponse &gt; 10 », « x = 0 ».","<b>si</b> condition <b>alors</b> … <b>sinon</b> … : le programme choisit un chemin."]},
    {h:"Les variables",l:["Une <b>variable</b> est une « boîte » nommée qui contient une valeur.","« mettre score à 0 », « ajouter 1 à score » : la valeur change pendant le programme."]},
    {h:"Écrire et modifier",l:["On décompose le problème en étapes.","On teste le programme sur des exemples dont on connaît la réponse."]}],
 k:["Variable","Instruction conditionnelle","Programme"]});
C.fiches.programmation={
 intro:"Un jeu vidéo doit sans arrêt décider : SI le joueur touche un ennemi, ALORS il perd une vie, SINON il continue. Et il doit retenir le score, le nombre de vies, le niveau… dans des variables. Conditions et variables sont les deux briques de base de tous les programmes.",
 s:[
  {p:"Une <b>instruction conditionnelle</b> « si … alors … sinon … » exécute un bloc ou l'autre selon qu'une condition est vraie ou fausse. Exemple : si note ≥ 10 alors dire « Admis » sinon dire « Refusé ».",
   fig:{type:"flux",legende:"Programme « Pair ou impair ? »",etapes:[["demander un nombre","réponse"],["si (réponse modulo 2) = 0","alors dire « pair »"],["sinon","dire « impair »"],["Test avec 7","7 modulo 2 = 1 → « impair »"]]},
   q:["« si x > 5 alors dire A sinon dire B ». Pour x = 5, le programme dit…",["B","A","A puis B","Rien"],0,"5 > 5 est faux : on exécute le sinon."]},
  {p:"Une <b>variable</b> est une case mémoire qui porte un nom et contient une valeur qui peut changer. On l'<b>initialise</b> (« mettre compteur à 0 »), puis on la <b>modifie</b> (« ajouter 1 à compteur »). Avec une boucle, une variable sert à compter ou à additionner.",
   fig:{type:"flux",legende:"Que contient total à la fin ?",etapes:[["mettre total à 0",""],["répéter 4 fois","ajouter 5 à total"],["Tours","5 → 10 → 15 → 20"],["Fin","total = 20"]]},
   q:["« mettre a à 3 ; mettre a à a × 2 ; ajouter 1 à a ». Valeur finale de a ?",["7","6","8","4"],0,"3 → 6 → 7."]},
  {p:"Pour <b>écrire</b> un programme, on décompose : quelles entrées ? quels calculs ? quelles conditions ? quelle sortie ? Puis on le <b>teste</b> sur des cas simples, y compris les cas limites (0, valeur égale au seuil…). Pour le <b>modifier</b>, on change un paramètre ou une condition et on observe l'effet.",
   q:["Un programme doit dire « gel » si la température est inférieure ou égale à 0. Quelle condition ?",["température ≤ 0","température < 0","température > 0","température = 0"],0,"« inférieure ou égale » : ≤ (0 compris)."]}
 ],
 retenir:["si … alors … sinon … : deux chemins selon une condition.","Variable : nom + valeur qui peut changer ; l'initialiser.","Tester les cas limites.","Décomposer : entrées, traitements, sorties."]
};

  fin:"L'écran est rectangulaire, donc le triangle largeur-hauteur-diagonale est rectangle. D'après le théorème de Pythagore : d² = 88² + 50² = 10 244, d ≈ 101,2 cm. En pouces : 101,2 ÷ 2,54 ≈ 39,8, soit environ 40 pouces. Le vendeur a raison.",retenir:"Diagonale d'un rectangle : Pythagore, en additionnant les carrés."},

 {id:"etagere",t:"L'étagère est-elle droite ?",ic:"📚",niv:1,bon:{lieu:"Pour vérifier qu'une étagère est perpendiculaire au mur, Sam mesure : 30 cm sur le mur, 40 cm sur l'étagère, et 49 cm entre les deux points.",pb:"L'étagère est-elle perpendiculaire au mur ?",qui:"Mur 30 cm · étagère 40 cm · distance entre les points 49 cm"},
  etapes:[
   {q:"Quel outil utiliser ?",o:[["La réciproque ou la contraposée de Pythagore",true,"On veut savoir si un angle est droit à partir de longueurs."],["Le théorème de Pythagore",false,"Le théorème suppose déjà le triangle rectangle."],["Le théorème de Thalès",false,"Pas de parallèles ici."]]},
   {q:"Calcule les deux membres :",o:[["49² = 2 401 et 30² + 40² = 2 500",true,"Le plus long côté est 49."],["49² = 98",false,"49² = 49 × 49 = 2 401."],["30 + 40 = 70 > 49",false,"On compare des carrés."]]},
   {q:"Conclusion ?",o:[["2 401 ≠ 2 500 : d'après la contraposée, l'étagère n'est pas perpendiculaire",true,"Pour un angle droit, il faudrait 50 cm."],["C'est presque égal, donc elle est droite",false,"En maths, « presque » ne suffit pas : l'égalité est fausse."],["D'après la réciproque, elle est droite",false,"La réciproque demande l'égalité."]]}],
  fin:"Le plus long côté mesure 49 cm : 49² = 2 401. Et 30² + 40² = 900 + 1 600 = 2 500. Comme 2 401 ≠ 2 500, d'après la contraposée du théorème de Pythagore, le triangle n'est pas rectangle : l'étagère n'est pas perpendiculaire au mur (il faudrait 50 cm).",retenir:"Égalité → réciproque (rectangle) ; inégalité → contraposée (pas rectangle)."},

 {id:"forfait",t:"Quel forfait de cinéma ?",ic:"🎬",niv:2,bon:{lieu:"Cinéma : tarif A, 9 € la séance ; tarif B, carte annuelle de 30 € puis 6 € la séance.",pb:"À partir de combien de séances le tarif B est-il plus avantageux ?",qui:"A : 9 € par séance · B : 30 € + 6 € par séance"},
  etapes:[
   {q:"Avec x séances, quels sont les prix ?",o:[["A : 9x ; B : 30 + 6x",true,"La carte est payée une seule fois."],["A : 9 + x ; B : 36x",false,"Le prix de A est 9 € multiplié par le nombre de séances."],["A : 9x ; B : 36x",false,"Les 30 € ne se multiplient pas par x."]]},
   {q:"Pour combien de séances les deux tarifs sont-ils égaux ?",o:[["9x = 30 + 6x, donc 3x = 30 et x = 10",true,"Pour 10 séances : 90 € dans les deux cas."],["x = 30 ÷ 9 ≈ 3,3",false,"Il faut résoudre 9x = 30 + 6x."],["x = 5",false,"9 × 5 = 45 et 30 + 30 = 60 : pas égaux."]]},
   {q:"Conclusion ?",o:[["B est plus avantageux à partir de 11 séances",true,"Pour 11 séances : A = 99 €, B = 96 €."],["B est toujours plus avantageux",false,"Pour 1 séance : A = 9 €, B = 36 €."],["A est toujours plus avantageux",false,"Pour 20 séances : A = 180 €, B = 150 €."]]}],
  fin:"Soit x le nombre de séances : A coûte 9x et B coûte 30 + 6x. 9x = 30 + 6x donne 3x = 30, x = 10 : les tarifs sont égaux pour 10 séances (90 €). Au-delà, B est moins cher : à partir de 11 séances, le tarif B est plus avantageux.",retenir:"Mettre en équation, résoudre, puis interpréter avec des exemples."},

 {id:"soldes",t:"Les soldes successives",ic:"🏷️",niv:2,bon:{lieu:"Une veste coûte 120 €. Elle est soldée à −30 %, puis on applique une remise supplémentaire de −20 % sur le prix soldé.",pb:"Quel est le prix final ? La remise totale est-elle de 50 % ?",qui:"Prix 120 € · −30 % puis −20 %"},
  etapes:[
   {q:"Coefficient multiplicateur de −30 % ?",o:[["0,7",true,"1 − 30/100 = 0,7."],["0,3",false,"0,3 correspond à garder 30 % du prix, pas à en enlever 30 %."],["1,3",false,"C'est une hausse de 30 %."]]},
   {q:"Prix final ?",o:[["120 × 0,7 × 0,8 = 67,20 €",true,"84 € après la 1re remise, puis 84 × 0,8 = 67,20 €."],["120 × 0,5 = 60 €",false,"Les pourcentages successifs ne s'additionnent pas."],["120 − 30 − 20 = 70 €",false,"−30 % n'est pas −30 €."]]},
   {q:"Remise totale ?",o:[["44 %, car 0,7 × 0,8 = 0,56",true,"On paie 56 % du prix : la remise est de 44 %."],["50 %",false,"La 2e remise s'applique à un prix déjà réduit."],["56 %",false,"56 % est ce qu'on paie, pas la remise."]]}],
  fin:"Coefficients : 0,7 puis 0,8. Prix final : 120 × 0,7 × 0,8 = 120 × 0,56 = 67,20 €. On paie 56 % du prix initial : la remise totale est de 44 %, et non de 50 %.",retenir:"Évolutions successives : on multiplie les coefficients."},

 {id:"pente",t:"Le toit de la cabane",ic:"🏠",niv:2,bon:{lieu:"Le toit d'une cabane est un triangle ABC. Les points I et J sont les milieux des chevrons [AB] et [AC]. La poutre horizontale [IJ] mesure 1,4 m.",pb:"Quelle est la largeur BC de la cabane ? La poutre est-elle parallèle au sol (BC) ?",qui:"I milieu de [AB] · J milieu de [AC] · IJ = 1,4 m"},
  etapes:[
   {q:"Quel théorème utiliser ?",o:[["La droite des milieux",true,"I et J sont les milieux de deux côtés du triangle."],["Pythagore",false,"Rien ne dit que le triangle est rectangle."],["La réciproque de Pythagore",false,"Pas de longueurs à comparer."]]},
   {q:"La poutre (IJ) est-elle parallèle à (BC) ?",o:[["Oui : la droite qui passe par les milieux de deux côtés est parallèle au 3e",true,"Théorème 1 de la droite des milieux."],["On ne peut pas savoir",false,"Le théorème 1 permet de conclure."],["Non",false,"Elle l'est toujours."]]},
   {q:"Largeur BC ?",o:[["2,8 m",true,"IJ = BC ÷ 2, donc BC = 2 × 1,4."],["0,7 m",false,"C'est IJ qui est la moitié de BC, pas l'inverse."],["1,4 m",false,"IJ = BC ÷ 2."]]}],
  fin:"Dans le triangle ABC, I et J sont les milieux de [AB] et [AC]. D'après les théorèmes de la droite des milieux, (IJ) // (BC) et IJ = BC ÷ 2. Donc la poutre est parallèle au sol et BC = 2 × 1,4 = 2,8 m.",retenir:"Deux milieux : parallèle au 3e côté et longueur moitié."},

 {id:"cornet",t:"Le cornet de glace",ic:"🍦",niv:2,bon:{lieu:"Un cornet de glace a la forme d'un cône de rayon 3 cm et de hauteur 12 cm. On le remplit à ras bord de glace. Un bac contient 2 L de glace.",pb:"Combien de cornets peut-on remplir avec un bac ?",qui:"Cône r = 3 cm, h = 12 cm · bac de 2 L"},
  etapes:[
   {q:"Volume d'un cornet ?",o:[["π × 3² × 12 ÷ 3 = 36π ≈ 113 cm³",true,"Volume du cône : aire de la base × hauteur ÷ 3."],["π × 3² × 12 ≈ 339 cm³",false,"C'est le volume du cylindre : il faut diviser par 3."],["3 × 12 ÷ 3 = 12 cm³",false,"L'aire de la base est π × r²."]]},
   {q:"2 L en cm³ ?",o:[["2 000 cm³",true,"1 L = 1 dm³ = 1 000 cm³."],["200 cm³",false,"1 L = 1 000 cm³."],["20 cm³",false,"1 L = 1 000 cm³."]]},
   {q:"Nombre de cornets ?",o:[["17 cornets pleins",true,"2 000 ÷ 113,1 ≈ 17,7 : 17 cornets pleins."],["18 cornets pleins",false,"Le 18e ne sera pas plein : 18 × 113,1 ≈ 2 036 cm³ > 2 000."],["5 cornets",false,"Vérifie le volume d'un cornet."]]}],
  fin:"V = π × 3² × 12 ÷ 3 = 36π ≈ 113,1 cm³. 2 L = 2 000 cm³. 2 000 ÷ 113,1 ≈ 17,7 : on remplit 17 cornets pleins.",retenir:"Cône : ÷ 3 ; 1 L = 1 000 cm³ ; arrondir en dessous pour des objets « pleins »."},

 {id:"notes",t:"Les deux classes",ic:"📊",niv:2,bon:{lieu:"Classe A, notes : 8 ; 9 ; 10 ; 11 ; 12 ; 12 ; 14. Classe B, notes : 2 ; 5 ; 11 ; 12 ; 15 ; 15 ; 16.",pb:"Compare les deux classes avec la moyenne, la médiane et l'étendue.",qui:"7 notes par classe, déjà rangées"},
  etapes:[
   {q:"Moyennes ?",o:[["A : 76 ÷ 7 ≈ 10,9 ; B : 76 ÷ 7 ≈ 10,9",true,"Les deux sommes valent 76 : même moyenne !"],["A : 11 ; B : 15",false,"Calcule les sommes : 76 pour les deux."],["A : 10 ; B : 12",false,"Ce sont des valeurs, pas les moyennes."]]},
   {q:"Médianes (4e valeur sur 7) ?",o:[["A : 11 ; B : 12",true,"La valeur du milieu de chaque série rangée."],["A : 10,9 ; B : 10,9",false,"Ce sont les moyennes."],["A : 12 ; B : 15",false,"Le milieu est la 4e valeur."]]},
   {q:"Étendues et conclusion ?",o:[["A : 6 ; B : 14. Même moyenne, mais B est bien plus dispersée",true,"14 − 8 = 6 et 16 − 2 = 14."],["A : 14 ; B : 16",false,"Étendue = max − min."],["Les classes sont identiques",false,"Seules les moyennes sont égales."]]}],
  fin:"Même moyenne (76 ÷ 7 ≈ 10,9). Médianes : 11 pour A, 12 pour B (la moitié de B a au moins 12). Étendues : 6 pour A, 14 pour B. La classe A est homogène ; la classe B est très dispersée, avec des élèves en grande difficulté et d'autres très à l'aise.",retenir:"La moyenne seule ne suffit pas : regarder médiane et étendue."},

 {id:"desdeux",t:"Le jeu des deux dés",ic:"🎲",niv:3,bon:{lieu:"Léa lance deux dés équilibrés et additionne les résultats. Elle gagne si la somme est 7, Tom gagne si la somme est 2 ou 12.",pb:"Le jeu est-il équitable ?",qui:"Deux dés à 6 faces · Léa : somme 7 · Tom : somme 2 ou 12"},
  etapes:[
   {q:"Combien d'issues équiprobables ?",o:[["36",true,"6 × 6 couples (dé 1 ; dé 2)."],["11",false,"Les 11 sommes (2 à 12) ne sont pas équiprobables."],["12",false,"On compte les couples : 6 × 6."]]},
   {q:"Probabilité que Léa gagne (somme 7) ?",o:[["6/36 = 1/6",true,"(1;6), (2;5), (3;4), (4;3), (5;2), (6;1)."],["1/11",false,"Les sommes ne sont pas équiprobables."],["1/36",false,"Il y a 6 couples qui font 7."]]},
   {q:"Probabilité que Tom gagne ? Conclusion ?",o:[["2/36 = 1/18 : le jeu n'est pas équitable, il avantage Léa",true,"Seulement (1;1) et (6;6)."],["2/11 : équitable",false,"Les sommes ne sont pas équiprobables."],["1/6 : équitable",false,"Seulement 2 couples sur 36."]]}],
  fin:"36 couples équiprobables. Somme 7 : 6 couples, P = 6/36 = 1/6. Somme 2 ou 12 : 2 couples, P = 2/36 = 1/18. Léa a 3 fois plus de chances de gagner : le jeu n'est pas équitable.",retenir:"Deux épreuves : lister les issues équiprobables (tableau 6 × 6)."},

 {id:"pyramide",t:"L'ombre de la pyramide (bonus Thalès)",ic:"🔻",niv:3,bon:{lieu:"À une heure donnée, un bâton vertical de 1,5 m a une ombre de 2 m. Au même instant, l'ombre d'un immeuble, mesurée depuis son pied, fait 36 m. Les rayons du soleil sont parallèles.",pb:"Quelle est la hauteur de l'immeuble ?",qui:"Bâton 1,5 m → ombre 2 m · ombre de l'immeuble 36 m"},
  etapes:[
   {q:"Pourquoi peut-on utiliser le théorème de Thalès ?",o:[["Les rayons du soleil sont parallèles : triangles emboîtés",true,"Les deux triangles « objet – ombre » sont proportionnels."],["Parce que l'immeuble est rectangle",false,"C'est le parallélisme des rayons qui compte."],["On ne peut pas",false,"On peut placer le bâton pour former des triangles emboîtés."]]},
   {q:"Quelle égalité ?",o:[["h / 1,5 = 36 / 2",true,"Hauteurs et ombres sont proportionnelles."],["h / 36 = 2 / 1,5",false,"Les rapports sont inversés."],["h = 36 − 2 + 1,5",false,"C'est une proportionnalité, pas une addition."]]},
   {q:"Hauteur de l'immeuble ?",o:[["27 m",true,"h = 1,5 × 36 ÷ 2 = 27."],["48 m",false,"h = 36 × 1,5 ÷ 2."],["35,5 m",false,"Ce n'est pas une addition."]]}],
  fin:"Les rayons étant parallèles, d'après le théorème de Thalès, les hauteurs sont proportionnelles aux ombres : h/1,5 = 36/2, donc h = 1,5 × 36 ÷ 2 = 27 m.",retenir:"Thalès : rapports égaux, puis produit en croix."},

 {id:"rampe",t:"La rampe du skatepark (bonus cosinus)",ic:"🛹",niv:3,bon:{lieu:"Une rampe de skate a une planche inclinée de 3,2 m. Elle fait un angle de 25° avec le sol.",pb:"Quelle longueur au sol la rampe occupe-t-elle ?",qui:"Planche 3,2 m (hypoténuse) · angle 25° avec le sol"},
  etapes:[
   {q:"Pour l'angle de 25°, la longueur au sol est…",o:[["Le côté adjacent",true,"C'est le côté de l'angle qui n'est pas l'hypoténuse."],["L'hypoténuse",false,"L'hypoténuse est la planche."],["Le côté opposé",false,"Le côté opposé est la hauteur."]]},
   {q:"Quelle formule ?",o:[["cos(25°) = L ÷ 3,2",true,"cos = adjacent ÷ hypoténuse."],["cos(25°) = 3,2 ÷ L",false,"L'hypoténuse est au dénominateur."],["L² = 3,2² + 25²",false,"25 est un angle, pas une longueur."]]},
   {q:"Longueur au sol ?",o:[["L = 3,2 × cos(25°) ≈ 2,90 m",true,"cos(25°) ≈ 0,906."],["L = 3,2 ÷ cos(25°) ≈ 3,53 m",false,"L'adjacent est plus court que l'hypoténuse."],["L ≈ 1,35 m",false,"C'est 3,2 × sin(25°), la hauteur."]]}],
  fin:"Le triangle sol-hauteur-planche est rectangle. Pour l'angle de 25°, la planche est l'hypoténuse et la longueur au sol L le côté adjacent : cos(25°) = L/3,2, donc L = 3,2 × cos(25°) ≈ 2,90 m.",retenir:"cos = adjacent ÷ hypoténuse ; l'adjacent est toujours plus court."}

const S4=n=>n<0?"("+F4(n)+")":F4(n), F4=n=>(Math.round(n*100)/100).toString().replace('.',',').replace('-','−');
C.atelier=[
 {t:"Multiplier des relatifs",ic:"✖️",d:"Règle des signes",gen:R=>{const a=R.r(-12,12)||-3,b=R.r(-12,12)||5;return {q:`Calcule : <b>${S4(a)} × ${S4(b)}</b>`,r:a*b,u:"",tol:0.01,ex:`${(a<0)===(b<0)?"Même signe : positif.":"Signes contraires : négatif."} ${Math.abs(a)} × ${Math.abs(b)} = ${Math.abs(a*b)}, donc <b>${F4(a*b)}</b>.`}}},
 {t:"Diviser des relatifs",ic:"➗",d:"Même règle des signes",gen:R=>{const q=R.r(-12,12)||-4,b=R.pick([-9,-6,-5,-4,-3,-2,2,3,4,5,6,9]),a=q*b;return {q:`Calcule : <b>${S4(a)} ÷ ${S4(b)}</b>`,r:q,u:"",tol:0.01,ex:`${(a<0)===(b<0)?"Même signe : positif.":"Signes contraires : négatif."} Résultat : <b>${F4(q)}</b>.`}}},
 {t:"Enchaîner avec des relatifs",ic:"🧮",d:"a + b × c",gen:R=>{const a=R.r(-10,10),b=R.r(-6,6)||2,c=R.r(-6,6)||-3;return {q:`Calcule : <b>${F4(a)} + ${S4(b)} × ${S4(c)}</b>`,r:a+b*c,u:"",tol:0.01,ex:`D'abord ${S4(b)} × ${S4(c)} = ${F4(b*c)}, puis ${F4(a)} + ${S4(b*c)} = <b>${F4(a+b*c)}</b>.`}}},

const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const P={xp:0,read:new Set(),best:{quiz:0,vf:0,match:0,ordre:null,calc:0,exam:0},parties:0,fin:new Set(),mq:new Set(),serie:0,jour:'',xpJour:0,err:[],diag:{},cab:{},tri:{},ord:{},atel:0,fix:0,badges:[]};
let FX=[];const OBJ=50;
/* sauvegarde de la progression (une clé par app) */
const KEY='appmetier_'+(C.id||C.app);
const LISTES=['err','badges'],OBJETS=['diag','cab','tri','ord'];
function save(){try{const d={xp:P.xp,read:[...P.read],best:P.best,parties:P.parties,fin:[...P.fin],mq:[...P.mq],serie:P.serie,jour:P.jour,xpJour:P.xpJour,atel:P.atel,fix:P.fix};LISTES.concat(OBJETS).forEach(k=>d[k]=P[k]);localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){P.xp=d.xp||0;P.read=new Set(d.read||[]);Object.assign(P.best,d.best||{});P.parties=d.parties||0;P.fin=new Set(d.fin||[]);P.mq=new Set(d.mq||[]);P.serie=d.serie||0;P.jour=d.jour||'';P.xpJour=d.xpJour||0;P.atel=d.atel||0;P.fix=d.fix||0;
  LISTES.forEach(k=>P[k]=Array.isArray(d[k])?d[k]:[]);OBJETS.forEach(k=>P[k]=d[k]&&typeof d[k]==='object'?d[k]:{})}}catch(e){}}
/* thème : couleurs propres à chaque app (facultatif) */
function theme(){const th=C.theme||{};Object.keys(th).forEach(k=>document.documentElement.style.setProperty('--'+k,th[k]))}
let G={};

function tab(t){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  show(t);
  if(t==='home')renderHome();if(t==='cours')renderMods();if(t==='lexique')renderLex();if(t==='jeux')renderJeux();
}
function show(id){clearInterval(G.tm);FX.forEach(clearInterval);FX=[];if($('rb'))$('rb').style.width=0;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}

/* ----- niveaux (XP) et grades -----
   C.grades (facultatif) = ['Apprenti','Compagnon',…] : nom affiché selon le niveau */
const SEUILS=[0,100,250,450,700,1000,1400,1900,2500,3200,4000,5000,6200,7600,9200,11000];
function grade(){let i=0;while(i<SEUILS.length-1&&P.xp>=SEUILS[i+1])i++;const g=C.grades||[];
  return {i,nom:'Niveau '+(i+1)+(g.length?' · '+g[Math.min(i,g.length-1)]:''),bas:SEUILS[i],haut:SEUILS[i+1]||null}}

/* accueil */
function renderHome(){
  const g=grade();
  $('appName').textContent=C.app;$('appIc').textContent=C.icon;$('xpP').textContent='⚡ '+P.xp+' XP · 🏅 '+P.badges.length;
  const n=P.fin.size,t=C.modules.length;$('gradeTx').textContent=g.nom;$('progTx').textContent=`${n} / ${t} fiches terminées`;$('progBar').style.width=(n/t*100)+'%';
  const w=C.lexique[new Date().getDate()%C.lexique.length];$('wotdM').textContent=w[0];$('wotdD').textContent=w[1];
  const m=C.modules.find(m=>!P.fin.has(m.id))||C.modules.find(m=>!P.read.has(m.id))||C.modules[0];
  $('nextMod').innerHTML=modRow(m);
  if(C.diag&&C.diag.length){const k=Math.floor(Date.now()/864e5)%C.diag.length,d=C.diag[k];
    $('homeDiag').innerHTML=`<h2 style="margin:4px 0 14px">${DT().jour}</h2><button class="row" onclick="startDiag(${k})"><span class="ic">${d.ic||'🔎'}</span><span class="tx"><b>${d.t}</b><span>${d.bon.lieu}</span></span>${P.diag[d.id]?`<span class="st">${stars(P.diag[d.id])}</span>`:'<span class="mut">›</span>'}</button>`}
  const auj=P.jour===today(),xj=auj?P.xpJour:0,s=auj||P.jour===today(-1)?P.serie:0;
  $('dayCard').innerHTML=`<div class="day"><span class="fl ${auj?'':'off'}">🔥</span><div style="flex:1"><b>${s} jour${s>1?'s':''} de suite</b><div class="mut">${auj?'Bravo, tu as appris aujourd\'hui !':'Apprends aujourd\'hui pour garder ta série.'}</div></div></div>
   <div class="mut" style="display:flex;justify-content:space-between;margin-top:6px"><span>🎯 Objectif du jour</span><b style="color:#fff">${Math.min(xj,OBJ)} / ${OBJ} XP</b></div><div class="prog" style="flex:none"><i style="width:${Math.min(100,xj/OBJ*100)}%"></i></div>`;
}
function modRow(m){return `<button class="row" onclick="openFiche('${m.id}')"><span class="ic">${m.i}</span><span class="tx"><b>${m.t}</b><span>${m.d}</span></span>${P.fin.has(m.id)?'<span class="ok">✓</span>':P.read.has(m.id)?'<span class="mut">…</span>':'<span class="mut">›</span>'}</button>`}
/* C.niveaux (facultatif) = [{t,d,ic}] et chaque module a n:1,2,3… → cours regroupés par niveau */
function renderMods(){
  if(!C.niveaux){$('modList').innerHTML=C.modules.map(modRow).join('');return}
  $('modList').innerHTML=C.niveaux.map((nv,k)=>{const ms=C.modules.filter(m=>(m.n||1)===k+1),lu=ms.filter(m=>P.fin.has(m.id)).length;
    return `<div class="nvh"><b>${nv.ic||''} ${nv.t}</b><span class="mut">${nv.d||''}</span><div class="prog" style="flex:none;height:8px"><i style="width:${ms.length?lu/ms.length*100:0}%"></i></div><span class="mut">${lu} / ${ms.length} fiches terminées</span></div>`+ms.map(modRow).join('')}).join('');
}

/* fiche */
function openFiche(id){
  const m=C.modules.find(x=>x.id===id),F=(C.fiches||{})[id]||{},k=C.modules.indexOf(m),nx=C.modules[k+1];
  P.read.add(id);save();
  const S=m.s.map((s,i)=>Object.assign({},s,(F.s||[])[i]||{}));
  const mots=(JSON.stringify(S)+(F.intro||'')).replace(/<[^>]+>/g,' ').split(/\s+/).length,min=Math.max(1,Math.round(mots/170));
  const nq=C.quiz.filter(q=>q[0]===id).length;
  $('ficheBody').innerHTML=`<div class="rbar"><i id="rb"></i></div>
   <div class="top"><button class="back" onclick="tab('cours')">←</button><span class="pill">Module ${k+1} / ${C.modules.length}</span></div>

function mqA(b){const box=b.closest('.mq'),k=box.dataset.q,[mid,si]=k.split(':'),m=C.modules.find(x=>x.id===mid);
  const s=Object.assign({},m.s[si],((C.fiches||{})[mid]||{s:[]}).s[si]||{}),q=s.q,bs=[...box.querySelectorAll('.ans')];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);

/* ----- FIGURES ANIMÉES -----
   fig:{type:'cycle',etapes:['A','B',['C','#ff5470']],centre:'…'}   étapes en boucle
   fig:{type:'flux',etapes:['A',['B','valeur'],…],ops:['− 5','÷ 3']}  étapes qui apparaissent une à une
   fig:{type:'barres',items:[['Libellé',valeur,'unité','#couleur'],…]}  barres comparées
   fig:{type:'chiffres',items:[[valeur,'unité','légende'],…]}          chiffres clés qui défilent
   fig:{type:'svg',svg:'<svg…>'}  dessin libre (classes : flow, glow, spin, pop, draw, appear)
   fig:{type:'inter',svg:'<svg…>',inters:[['a','Interrupteur 1',2],…],f:s=>['clé',…],msg:s=>'texte'}
       schéma interactif : chaque bouton fait tourner l'état s.a (0,1… nb positions).
       Dans le SVG : data-v="a:1" = visible seulement si s.a vaut 1 ; data-k="clé" = reçoit la classe "on"
       si f(s) renvoie cette clé (classes prêtes : lp = lampe, w = fil, w ko = fil en défaut).
   fig:{type:'etapes',vues:[{svg:'<svg…>',t:'texte'},…]}  pas à pas avec ◀ ▶
   + legende:'…' (facultatif) */
const FIGR=[];
function figHTML(f){let h='';
  if(f.type==='cycle'){const n=f.etapes.length,T=n*1.6;
    h=`<div class="cyc" data-n="${n}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--card)" stroke-width="3"/><circle cx="50" cy="50" r="38" fill="none" stroke="var(--pri)" stroke-width="1.2" stroke-dasharray="3 5" class="flow" opacity=".7"/><circle r="3" fill="var(--pri)"><animateMotion dur="${T}s" repeatCount="indefinite" path="M50,12 A38,38 0 1,1 49.99,12"/></circle></svg>
     ${f.etapes.map((e,i)=>{const [t,c]=Array.isArray(e)?e:[e],a=(-90+i*360/n)*Math.PI/180;return `<div class="n" style="left:${50+38*Math.cos(a)}%;top:${50+38*Math.sin(a)}%;${c?'--c:'+c:''}">${t}</div>`}).join('')}
     ${f.centre?`<div class="ctr">${f.centre}</div>`:''}</div>`}
  else if(f.type==='flux'){h=`<div class="flx">${f.etapes.map((e,i)=>{const [t,v]=Array.isArray(e)?e:[e];return (i?`<div class="a" style="animation-delay:${i*.7-.35}s">↓ ${(f.ops||[])[i-1]||''}</div>`:'')+`<div class="b ${i===f.etapes.length-1?'fin':''}" style="animation-delay:${i*.7}s"><span>${t}</span>${v?`<b>${v}</b>`:''}</div>`}).join('')}</div>`}
  else if(f.type==='barres'){const mx=Math.max(...f.items.map(x=>x[1]));h=`<div class="brs">${f.items.map(x=>`<div><div class="r"><span>${x[0]}</span><span style="white-space:nowrap"><span class="cnt" data-v="${x[1]}">0</span>${x[2]?' '+x[2]:''}</span></div><div class="t"><i data-w="${Math.max(1.5,x[1]/mx*100)}" style="${x[3]?'--c:'+x[3]:''}"></i></div></div>`).join('')}</div>`}
  else if(f.type==='chiffres'){h=`<div class="chf">${f.items.map(x=>`<div><b><span class="cnt" data-v="${x[0]}">0</span>${x[1]?' '+x[1]:''}</b><span>${x[2]||''}</span></div>`).join('')}</div>`}
  else if(f.type==='svg')h=f.svg;
  else if(f.type==='inter'){const r=FIGR.push(f)-1;h=`<div class="itr" data-r="${r}">${f.svg}<div class="ibt">${f.inters.map(([k,t])=>`<button class="chip" data-s="${k}" onclick="figSw(this)">${t}</button>`).join('')}</div><div class="imsg"></div></div>`}
  else if(f.type==='etapes'){const r=FIGR.push(f)-1;h=`<div class="etp" data-r="${r}" data-i="0"><div class="etv"></div><div class="etn"><button class="chip" onclick="figEt(this,-1)">◀</button><span></span><button class="chip" onclick="figEt(this,1)">▶</button></div></div>`}
  const inter=f.type==='inter'||f.type==='etapes';
  return `<div class="fig" data-t="${f.type}">${inter?'':'<button class="rej" onclick="playFig(this.parentNode)">↻ Rejouer</button>'}${h}${f.legende?`<div class="leg">${f.legende}</div>`:''}</div>`}
function initFigs(root){root.querySelectorAll('.itr').forEach(el=>{const f=FIGR[+el.dataset.r];el._s={};f.inters.forEach(([k])=>el._s[k]=0);figUpd(el)});root.querySelectorAll('.etp').forEach(el=>figEt(el.querySelector('.chip'),0))}
function figSw(b){const el=b.closest('.itr'),f=FIGR[+el.dataset.r],k=b.dataset.s,n=(f.inters.find(x=>x[0]===k)||[])[2]||2;el._s[k]=(el._s[k]+1)%n;figUpd(el);beep(1)}
function figUpd(el){const f=FIGR[+el.dataset.r],s=el._s,on=f.f(s)||[];
  el.querySelectorAll('[data-v]').forEach(x=>{const [k,v]=x.getAttribute('data-v').split(':');x.classList.toggle('hide',String(s[k])!==v)});
  el.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',on.includes(x.getAttribute('data-k'))));
  el.querySelectorAll('.ibt .chip').forEach(b=>b.classList.toggle('act',!!s[b.dataset.s]));
  el.querySelector('.imsg').innerHTML=f.msg?f.msg(s):''}
function figEt(b,d){const el=b.closest('.etp'),f=FIGR[+el.dataset.r];let i=Math.max(0,Math.min(f.vues.length-1,+el.dataset.i+d));el.dataset.i=i;const v=f.vues[i];
  el.querySelector('.etv').innerHTML=`<div class="go">${v.svg||''}</div><p class="etx"><b>${i+1}/${f.vues.length}</b> — ${v.t}</p>`;
  el.querySelector('.etn span').innerHTML=f.vues.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}
function playFig(f){
  f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  const t=f.dataset.t;
  if(t==='cycle'){const ns=[...f.querySelectorAll('.n')],n=ns.length;let i=0;const st=()=>{ns.forEach((x,j)=>x.classList.toggle('on',j===i%n));i++};
    FX.forEach(x=>{if(x.f===f)clearInterval(x)});st();const iv=setInterval(st,1600);iv.f=f;FX.push(iv);
    const an=f.querySelector('animateMotion');if(an&&an.beginElement)an.beginElement()}
  if(t==='barres')f.querySelectorAll('.t i').forEach(i=>{i.style.width=0;void i.offsetWidth;i.style.width=i.dataset.w+'%'});
  f.querySelectorAll('.cnt').forEach(countUp);
}
function countUp(el){const v=+el.dataset.v,d=(el.dataset.v.split('.')[1]||'').length,t0=performance.now(),D=1100;
  (function s(t){const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=(v*e).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});if(p<1)requestAnimationFrame(s)})(t0)}

function quizQ(){

  $('playBody').innerHTML=head()+`<div class="qcard" id="qc"><div>${q[1]}</div></div>

function quizA(b){
  const q=G.list[G.i],bs=[...document.querySelectorAll('#playBody .ans')];if(bs[0].disabled)return;bs.forEach(x=>x.disabled=true);
